    <style>
        :root {
            color-scheme: dark;
            --verde: #22c55e;
            --fundo: #0a0f0d;
            --vidro: rgba(15, 23, 20, 0.6);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html { background-color: #0a0f0d; overflow-x: hidden; }

        body {
            background-color: var(--fundo);
            color: var(--texto);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-entrada { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

        .fundo-degrade {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%);
            z-index: -2;
        }
        .grade-fundo {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
            mask-image: radial-gradient(circle at center, black 10%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%);
        }
        .particula {
            position: fixed; bottom: -10px; background-color: var(--verde);
            border-radius: 50%; box-shadow: 0 0 10px var(--verde);
            opacity: 0; animation: subir linear infinite; z-index: 5;
        }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        @keyframes subir {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; } 80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .container-principal {
            width: 100%; max-width: 800px;
            display: flex; flex-direction: column; gap: 15px;
            position: relative; z-index: 10;
            margin-top: 20px; padding-bottom: 120px;
        }

        /* CARTÃO DE PERFIL */
        .cartao-perfil {
            background: var(--vidro);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--borda); border-radius: 16px; padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; gap: 20px; position: relative;
        }
        .cartao-perfil::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--verde); border-radius: 16px 0 0 16px;
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            border: 2px solid var(--verde); background: #000;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: bold; color: var(--verde);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            background-size: cover; background-position: center; flex-shrink: 0;
        }
        .info-perfil { flex: 1; }
        .nome { font-family: 'Oswald', sans-serif; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .cargo { font-size: 13px; color: var(--verde); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
        .passaporte { font-size: 12px; color: var(--texto-mutado); }

        .progressao-container { margin-top: 15px; display: flex; flex-direction: column; gap: 6px; }
        .progressao-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .cargo-atual { color: #a1a1aa; }
        .cargo-proximo { color: var(--verde); }
        .progressao-barra-bg {
            width: 100%; height: 8px; background: rgba(0,0,0,0.6); border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05); overflow: hidden; position: relative;
        }
        .progressao-barra-fill {
            height: 100%; background: linear-gradient(90deg, #166534, var(--verde));
            width: 0%; border-radius: 10px; transition: width 1s ease;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        }
        .progressao-xp-texto { font-size: 10px; color: #9ca3af; text-align: right; }

        .btn-config {
            position: absolute; top: 15px; right: 15px;
            width: 35px; height: 35px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--borda); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--texto-mutado); font-size: 16px;
            cursor: pointer; z-index: 10; transition: 0.3s;
        }
        .btn-config:hover { color: var(--verde); border-color: var(--verde); transform: rotate(90deg); }

        .card-promocao {
            display: none; background: rgba(15, 23, 20, 0.9); border: 1px solid var(--verde);
            border-radius: 12px; padding: 20px; box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            position: relative; overflow: hidden; animation: pulsar-borda 2s infinite;
        }
        .card-promocao.ativo { display: block; }
        @keyframes pulsar-borda {
            0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); }
            50% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.6); }
        }
        .promocao-conteudo { display: flex; align-items: center; gap: 15px; }
        .promocao-icone { font-size: 40px; color: #eab308; filter: drop-shadow(0 0 10px rgba(234, 179, 8, 0.5)); }
        .promocao-textos h3 { font-family: 'Oswald', sans-serif; font-size: 18px; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .promocao-textos p { font-size: 12px; color: #9ca3af; line-height: 1.4; }
        .btn-ciente {
            margin-top: 15px; width: 100%; padding: 12px; background: var(--verde); color: #000;
            border: none; border-radius: 6px; font-family: 'Oswald', sans-serif; font-weight: 700;
            font-size: 14px; text-transform: uppercase; cursor: pointer; transition: 0.3s;
        }
        .btn-ciente:hover { background: #4ade80; transform: scale(1.02); }

        .grid-metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card-metrica {
            background: var(--vidro); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--borda); border-radius: 12px; padding: 15px; text-align: left; transition: 0.3s;
        }
        .metrica-topo {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--texto-mutado); display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 5px;
        }
        .metrica-topo i { font-size: 14px; }
        .metrica-valor { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
        .metrica-sub { font-size: 10px; color: rgba(255,255,255,0.3); }

                <i class="fas fa-bell icone-sino-titulo" id="notif-aviso" style="display: none;"></i>

            <script>
        let membroLogado = null;
        let todosMembros = [];

        // ===== SISTEMA DE ALERTA VERDE =====
        function customAlert(mensagem, tipo = 'sucesso') {
            const alerta = document.getElementById('alerta-site');
            const icone = document.getElementById('alerta-icone');
            const texto = document.getElementById('alerta-texto');
            texto.innerText = mensagem;
            if (tipo === 'erro') {
                alerta.classList.add('erro');
                icone.className = 'fas fa-times-circle';
            } else {
                alerta.classList.remove('erro');
                icone.className = 'fas fa-check-circle';
            }
            alerta.classList.add('ativo');
            setTimeout(() => alerta.classList.remove('ativo'), 3000);
        }

        // ===== NAVEGAÇÃO E MODAIS =====
        function mudarMenu(elementoClicado) {
            document.querySelectorAll('.item-menu').forEach(btn => btn.classList.remove('ativo'));
            elementoClicado.classList.add('ativo');
        }

        function abrirModalMembros() {
            document.getElementById('modal-membros').classList.add('ativo');
            document.body.style.overflow = 'hidden';
            
            // MÁGICA DA VELOCIDADE: Se já tem membros na memória, abre na hora!
            if (todosMembros.length > 0) {
                filtrarMembros(); 
            } else {
                document.getElementById('lista-membros-modal').innerHTML = '<p class="aviso-vazio">Buscando membros...</p>';
            }
            
            // Atualiza os dados no fundo (sem travar a tela)
            carregarMembrosRapido();
        }

        function fecharModalMembros() {
            document.getElementById('modal-membros').classList.remove('ativo');
            document.body.style.overflow = 'auto';
        }

        function abrirModalConfig() {
            document.getElementById('modal-config').classList.add('ativo');
            document.body.style.overflow = 'hidden';
        }
        function fecharModalConfig() {
            document.getElementById('modal-config').classList.remove('ativo');
            document.body.style.overflow = 'auto';
        }

        function abrirModalTicket() {
            customAlert("A tela de tickets será construída no próximo passo!");
        }

        // Fecha modais ao clicar fora
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('ativo');
                    document.body.style.overflow = 'auto';
                }
            });
        });

        // ===== INICIALIZAÇÃO DO DASHBOARD =====
        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';

            membroLogado = JSON.parse(logado);
            document.getElementById('nome-membro').innerText = membroLogado.nome;
            document.getElementById('cargo-membro').innerText = membroLogado.cargo;
            document.getElementById('passaporte-membro').innerText = membroLogado.passaporte;
            document.getElementById('avatar-inicial').innerText = membroLogado.nome.charAt(0).toUpperCase();

            // Puxa os dados
            const { data, error } = await sb.from('membros').select('xp_total, foto_url, advertencias').eq('passaporte', membroLogado.passaporte).single();
            if (data && !error) {
                atualizarInterfacePerfil(data);
                calcularProgressao(data.xp_total || 0, data.cargo);
            }

            carregarAvisos();
            verificarTicketRecente(membroLogado.passaporte);
            carregarPresencasEFaltas(membroLogado.passaporte);
            
            if (Notification.permission === 'granted') {
                document.getElementById('switch-notificacao').checked = true;
            }
        });

        // ===== FUNÇÕES DE DADOS =====
        function atualizarInterfacePerfil(data) {
            document.getElementById('kpi-advertencias').innerText = data.advertencias || 0;
            if (data.foto_url) {
                const avatar = document.getElementById('avatar-inicial');
                avatar.style.backgroundImage = `url('${data.foto_url}')`;
                avatar.innerText = ''; 
            }
        }

        async function carregarPresencasEFaltas(passaporte) {
            try {
                const { count: totalPresencas } = await sb.from('presencas').select('*', { count: 'exact', head: true }).eq('passaporte', passaporte).eq('status', 'presente');
                const { count: totalFaltas } = await sb.from('presencas').select('*', { count: 'exact', head: true }).eq('passaporte', passaporte).eq('status', 'falta');
                if (totalPresencas !== null) document.getElementById('kpi-presencas').innerText = totalPresencas;
                if (totalFaltas !== null) document.getElementById('kpi-faltas').innerText = totalFaltas;
            } catch (error) { console.error("Erro", error); }
        }

        async function carregarAvisos() {
            const container = document.getElementById('lista-avisos');
            const { data, error } = await sb.from('avisos').select('*').order('criado_em', { ascending: false }).limit(3);
            if (error || !data || data.length === 0) return;
            document.getElementById('notif-aviso').style.display = 'inline-block';
            let html = '';
            data.forEach(aviso => {
                const textoAviso = aviso.texto || 'Sem detalhes.';
                const autorAviso = aviso.autor || 'Liderança';
                let dataFormatada = 'Recentemente';
                if (aviso.criado_em) dataFormatada = new Date(aviso.criado_em).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
                html += `
                    <div class="aviso-item">
                        <div class="aviso-texto">${textoAviso}</div>
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; margin-top: 8px;">
                            <span style="font-size: 11px; color: var(--verde); font-weight: 600;"><i class="fas fa-user-shield"></i> ${autorAviso}</span>
                            <span style="font-size: 10px; color: rgba(255,255,255,0.2); font-weight: 600; text-transform: uppercase;">${dataFormatada}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function verificarTicketRecente(passaporte) {
            const { data, error } = await sb.from('tickets').select('*').eq('passaporte', passaporte).order('criado_em', { ascending: false }).limit(1).single();
            if (error || !data) return;
            const statusText = document.getElementById('status-ticket');
            const sino = document.getElementById('notif-ticket');
            if (data.status === 'em_andamento' && data.lider_assumiu) {
                statusText.innerText = "Líder assumiu o ticket!";
                statusText.style.color = "#eab308";
                sino.style.display = 'block';
            } else {
                statusText.innerText = "Ticket aberto (aguardando)";
                statusText.style.color = "var(--texto-mutado)";
                sino.style.display = 'none';
            }
        }

        // ===== SISTEMA DE MEMBROS INSTANTÂNEO =====
        async function carregarMembrosRapido() {
            const { data: membros, error } = await sb.from('membros').select('nome, cargo, passaporte, foto_url').order('nome');
            if (error || !membros) return;
            
            todosMembros = membros.map(m => ({ ...m, online: false }));
            filtrarMembros();

            const hoje = new Date().toISOString().split('T')[0];
            const { data: presencas } = await sb.from('presencas').select('passaporte').eq('data', hoje).eq('status', 'presente');
            if (presencas && presencas.length > 0) {
                const onlineHoje = presencas.map(p => String(p.passaporte));
                todosMembros = todosMembros.map(m => ({ ...m, online: onlineHoje.includes(String(m.passaporte)) }));
                filtrarMembros();
            }
        }

        function filtrarMembros() {
            const termo = document.getElementById('input-busca-membros').value.toLowerCase();
            const container = document.getElementById('lista-membros-modal');
            const filtrados = todosMembros.filter(m => m.nome.toLowerCase().includes(termo) || String(m.passaporte).includes(termo));
            const online = filtrados.filter(m => m.online);
            const offline = filtrados.filter(m => !m.online);
            let html = '';
            if (online.length > 0) {
                html += `<div class="categoria-membros"><i class="fas fa-circle" style="color: var(--verde); font-size: 8px;"></i> Em Serviço (${online.length})</div>`;
                online.forEach(m => { html += criarCardMembro(m, true); });
            }
            if (offline.length > 0) {
                html += `<div class="categoria-membros"><i class="fas fa-circle" style="color: #ef4444; font-size: 8px;"></i> Fora de Serviço (${offline.length})</div>`;
                offline.forEach(m => { html += criarCardMembro(m, false); });
            }
            if (html === '') html = '<p class="aviso-vazio">Nenhum membro encontrado.</p>';
            container.innerHTML = html;
        }

        function criarCardMembro(m, isOnline) {
            const inicial = m.nome.charAt(0).toUpperCase();
            const foto = m.foto_url ? m.foto_url : null;
            const avatarStyle = foto ? `background-image: url('${foto}'); background-size: cover; background-position: center;` : '';
            const statusClass = isOnline ? 'status-online' : 'status-offline';
            return `
                <div class="membro-card">
                    <div class="membro-info">
                        <div class="membro-avatar" style="${avatarStyle}">${foto ? '' : inicial}</div>
                        <div class="membro-dados"><h4>${m.nome}</h4><p>Passaporte: ${m.passaporte} • ${m.cargo}</p></div>
                    </div>
                    <div class="${statusClass}"></div>
                </div>
            `;
        }

        // ===== SISTEMA DE PROGRESSÃO DE CARREIRA =====
        const CARGOS_ESCALA = [
            { nome: 'Novato', xp_min: 0, xp_max: 500 },
            { nome: 'Executor', xp_min: 500, xp_max: 1500 },
            { nome: 'Raiz', xp_min: 1500, xp_max: 3000 },
            { nome: 'O Vigia', xp_min: 3000, xp_max: 5000 },
            { nome: 'Controle', xp_min: 5000, xp_max: 999999 }
        ];

        function calcularProgressao(xpTotal, nomeCargoAtual) {
            let nivelAtual = CARGOS_ESCALA.find(n => xpTotal >= n.xp_min && xpTotal < n.xp_max);
            
            if (xpTotal >= 5000 && (nomeCargoAtual === 'Mentor' || nomeCargoAtual === 'Controle')) {
                document.getElementById('label-cargo-atual').innerText = nomeCargoAtual;
                document.getElementById('label-cargo-proximo').innerText = 'MAX';
                document.getElementById('barra-progressao').style.width = '100%';
                document.getElementById('texto-progressao').innerText = xpTotal + ' XP (Máximo)';
                return;
            }
            if (!nivelAtual) nivelAtual = CARGOS_ESCALA[0];

            let proximoNivel = CARGOS_ESCALA.find(n => n.xp_min === nivelAtual.xp_max);
            if (!proximoNivel) {
                document.getElementById('label-cargo-atual').innerText = nivelAtual.nome;
                document.getElementById('label-cargo-proximo').innerText = 'MAX';
                document.getElementById('barra-progressao').style.width = '100%';
                document.getElementById('texto-progressao').innerText = xpTotal + ' XP';
                return;
            }

            document.getElementById('label-cargo-atual').innerText = nivelAtual.nome;
            document.getElementById('label-cargo-proximo').innerText = proximoNivel.nome;
            
            const xpNecessario = proximoNivel.xp_min - nivelAtual.xp_min;
            const xpAtualNoCargo = xpTotal - nivelAtual.xp_min;
            let porcentagem = (xpAtualNoCargo / xpNecessario) * 100;
            if (porcentagem > 100) porcentagem = 100;

            document.getElementById('barra-progressao').style.width = porcentagem + '%';
            document.getElementById('texto-progressao').innerText = `${xpTotal} / ${proximoNivel.xp_min} XP`;

            const avisoVisto = localStorage.getItem('promocao_vista_' + proximoNivel.nome);
            if (xpTotal >= proximoNivel.xp_min && !avisoVisto) {
                document.getElementById('card-promocao').classList.add('ativo');
                document.getElementById('cargo-promocao-texto').innerText = proximoNivel.nome;
            }
        }

        function confirmarPromocao() {
            const cargoProximo = document.getElementById('cargo-promocao-texto').innerText;
            localStorage.setItem('promocao_vista_' + cargoProximo, 'sim');
            document.getElementById('card-promocao').classList.remove('ativo');
            customAlert("Print registrado! Avise a liderança.", "sucesso");
        }

        // ===== FUNÇÕES DA ENGRENAGEM =====
        async function processarFoto(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const base64String = e.target.result;
                    const { error } = await sb.from('membros').update({ foto_url: base64String }).eq('passaporte', membroLogado.passaporte);
                    if (!error) {
                        customAlert("Foto atualizada com sucesso!");
                        const avatar = document.getElementById('avatar-inicial');
                        avatar.style.backgroundImage = `url('${base64String}')`;
                        avatar.innerText = '';
                    } else {
                        customAlert("Erro ao salvar foto.", "erro");
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        async function toggleNotificacoes(checkbox) {
            if (checkbox.checked) {
                const permissao = await Notification.requestPermission();
                if (permissao === 'granted') {
                    customAlert("Notificações ativadas!");
                    new Notification("Portal Itália", { body: "Você receberá alertas aqui.", icon: "https://cdn-icons-png.flaticon.com/512/281/281764.png" });
                } else {
                    customAlert("Permissão negada.", "erro");
                    checkbox.checked = false;
                }
            }
        }

        function toggleParticulas(checkbox) {
            document.querySelectorAll('.particula').forEach(p => p.style.display = checkbox.checked ? 'block' : 'none');
        }

        function togglePerformance(checkbox) {
            const elementosVidro = document.querySelectorAll('.cartao-perfil, .card-metrica, .card-acao, .painel-avisos, .menu-inferior, .modal-conteudo');
            if (checkbox.checked) {
                elementosVidro.forEach(el => {
                    el.style.backdropFilter = 'none'; el.style.webkitBackdropFilter = 'none'; el.style.backgroundColor = '#111613';
                });
                document.querySelectorAll('.particula').forEach(p => p.style.display = 'none');
                document.getElementById('switch-particulas').checked = false;
            } else {
                elementosVidro.forEach(el => {
                    el.style.backdropFilter = 'blur(20px)'; el.style.webkitBackdropFilter = 'blur(20px)'; el.style.backgroundColor = '';
                });
                document.querySelectorAll('.particula').forEach(p => p.style.display = 'block');
                document.getElementById('switch-particulas').checked = true;
            }
        }

        function sair() {
            sessionStorage.removeItem('membro_logado');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
