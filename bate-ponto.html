<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Meu Ponto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090d;--bg2:#0d0f14;--card:#12151b;--card2:#171a21;--border:rgba(255,255,255,.07);--text:#f5f5f5;--muted:#8b929f;--red:#e11d48;--red2:#fb365d;--green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6}
body{min-height:100vh;background:radial-gradient(circle at top right,rgba(225,29,72,.07),transparent 35%),var(--bg);color:var(--text);font-family:Inter,sans-serif;padding-bottom:90px}
button{font-family:inherit}
.topbar{height:72px;position:sticky;top:0;z-index:20;background:rgba(8,9,13,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px}
.avatar{width:40px;height:40px;border-radius:12px;background:#181b22;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800}
.topbar-info{display:flex;flex-direction:column;gap:2px}.topbar-nome{font-size:15px;font-weight:700}.topbar-detalhe{font-size:13px;color:var(--muted)}
.container{width:min(900px,calc(100% - 28px));margin:auto;padding:22px 18px 0}
.title{margin-bottom:25px}.title h1{font-size:27px;letter-spacing:-.8px;margin-bottom:6px}.title p{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px}.stat-label{color:var(--muted);font-size:11px;margin-bottom:9px}.stat-value{font-size:17px;font-weight:800}
.tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--border);padding:5px;border-radius:14px;margin:16px 0}
.tab{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--card2);color:#fff}
.clock-card{background:radial-gradient(circle at top right,rgba(225,29,72,.13),transparent 38%),var(--card);border:1px solid var(--border);border-radius:22px;padding:24px;text-align:center}
.clock-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.timer{font-size:clamp(42px,12vw,70px);font-weight:800;letter-spacing:-2px;margin:10px 0 18px;font-variant-numeric:tabular-nums}
.markers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.marker{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:11px 5px}.marker span{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.marker strong{display:block;font-size:11px}
.btn-principal{width:100%;border:0;border-radius:15px;padding:15px;color:#fff;background:var(--red);font-weight:800;font-size:13px;cursor:pointer}.btn-principal:disabled{opacity:.7}
.grupo-botoes{display:none;gap:10px;margin-top:10px}.btn-acao{flex:1;border:0;border-radius:15px;padding:14px;color:#fff;font-weight:800;font-size:13px;cursor:pointer}.btn-pausar{background:var(--yellow);color:#000}.btn-encerrar{background:var(--red)}
.equipe-card{display:none;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:17px;margin-top:12px}
.equipe-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.equipe-nome{font-size:15px;font-weight:800}.equipe-funcao,.equipe-area{font-size:11px;color:var(--muted);margin-top:4px}
.equipe-membros{border-top:1px solid var(--border);padding-top:12px}.membro{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}.membro:last-child{border:0}
.membro-nome{font-size:12px;font-weight:700}.membro-pass{font-size:10px;color:var(--muted);margin-top:3px}.membro-status{font-size:10px;font-weight:700;white-space:nowrap}
.erro-box{background:rgba(225,29,72,.12);border:1px solid var(--red);border-radius:14px;padding:16px;margin-bottom:20px;color:#ffb3b3;display:none}
.erro-titulo{font-weight:700;margin-bottom:8px;color:#ff8a8a}
.erro-detalhe{font-size:13px;line-height:1.5}
.sucesso-box{background:rgba(34,197,94,.12);border:1px solid var(--green);border-radius:14px;padding:16px;margin-bottom:20px;color:#bbf7d0;display:none}
#historico{display:none}.history-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;margin-bottom:10px}.history-card div{font-size:12px;color:var(--muted);margin-top:5px}.loading{color:var(--muted);text-align:center;padding:40px 20px}
.bottom-nav{position:fixed;z-index:30;left:12px;right:12px;bottom:12px;height:66px;border-radius:21px;background:rgba(18,21,27,.94);backdrop-filter:blur(16px);border:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);padding:5px}
.nav-item{border:0;background:transparent;color:var(--muted);border-radius:16px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;gap:4px}.nav-item i{font-size:16px}.nav-item.active{background:rgba(225,29,72,.1);color:var(--red2)}
</style>
</head>
<body>
  <header class="topbar">
<div class="avatar" id="avatar">?</div>
<div class="topbar-info">
<div class="topbar-nome" id="nomeUsuario">Carregando...</div>
<div class="topbar-detalhe" id="passaporteUsuario">Passaporte: -- • Ponto</div>
</div>
</header>

<main class="container">
<div id="caixaMensagem" class="erro-box"></div>

<section class="title">
<h1>Meu Ponto</h1>
<p>Controle sua jornada de trabalho.</p>
</section>

<section class="stats">
<div class="stat"><div class="stat-label">Meu Status</div><div class="stat-value" id="statusTexto">Offline</div></div>
<div class="stat"><div class="stat-label">Pausas</div><div class="stat-value" id="pausasTexto">0</div></div>
<div class="stat"><div class="stat-label">Entrada</div><div class="stat-value" id="entradaTexto">--:--</div></div>
<div class="stat"><div class="stat-label">Equipe</div><div class="stat-value" id="equipeTexto">--</div></div>
</section>
<div class="tabs">
<button class="tab active" onclick="mostrarAba('jornada',this)">Minha Jornada</button>
<button class="tab" onclick="mostrarAba('historico',this)">Meu Histórico</button>
</div>

<section id="jornada">
<div class="clock-card">
<div class="clock-label">Tempo em Serviço</div>
<div class="timer" id="timer">00:00:00</div>

<div class="markers">
<div class="marker"><span>ENTRADA</span><strong id="marcadorEntrada">--:--</strong></div>
<div class="marker"><span>ÚLTIMA PAUSA</span><strong id="marcadorPausa">--:--</strong></div>
<div class="marker"><span>SAÍDA</span><strong id="marcadorSaida">--:--</strong></div>
</div>

<button class="btn-principal" id="btnIniciar" onclick="iniciarJornada()"><i class="fa-solid fa-play"></i> Iniciar Jornada</button>

<div class="grupo-botoes" id="grupoBotoes">
<button class="btn-acao btn-pausar" id="btnPausar" onclick="pausarContinuar()"><i class="fa-solid fa-pause"></i> Pausar</button>
<button class="btn-acao btn-encerrar" onclick="encerrarJornada()"><i class="fa-solid fa-stop"></i> Encerrar</button>
</div>
</div>

<div class="equipe-card" id="equipeCard">
<div class="equipe-topo">
<div>
<div class="equipe-nome" id="equipeNome">--</div>
<div class="equipe-funcao" id="equipeFuncao">--</div>
<div class="equipe-area" id="equipeArea">--</div>
</div>
<i class="fa-solid fa-users" style="color:var(--blue)"></i>
</div>
<div class="equipe-membros" id="equipeMembros"><div class="loading" style="padding:15px">Carregando membros...</div></div>
</div>
</section>

<section id="historico"><div class="loading">Carregando histórico...</div></section>
</main>

<nav class="bottom-nav">
<a class="nav-item" href="painel.html"><i class="fa-solid fa-house"></i>Início</a>
<a class="nav-item active"><i class="fa-solid fa-clock"></i>Ponto</a>
<a class="nav-item" href="equipe.html"><i class="fa-solid fa-users"></i>Equipe</a>
<a class="nav-item" href="registros.html"><i class="fa-solid fa-folder-open"></i>Registros</a>
</nav>
<script>
const supabaseClient=window.supabase.createClient("https://vclwmikzmnuqfdxobtik.supabase.co","sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF");
const sessao=sessionStorage.getItem("italia_usuario");
if(!sessao){location.href="login.html";throw Error("Usuário não autenticado.");}
const usuario=JSON.parse(sessao);

const el={
nome:document.getElementById("nomeUsuario"),pass:document.getElementById("passaporteUsuario"),
avatar:document.getElementById("avatar"),status:document.getElementById("statusTexto"),
pausas:document.getElementById("pausasTexto"),entrada:document.getElementById("entradaTexto"),
equipe:document.getElementById("equipeTexto"),timer:document.getElementById("timer"),
marcEntrada:document.getElementById("marcadorEntrada"),marcPausa:document.getElementById("marcadorPausa"),
marcSaida:document.getElementById("marcadorSaida"),btnIniciar:document.getElementById("btnIniciar"),
grupo:document.getElementById("grupoBotoes"),btnPausar:document.getElementById("btnPausar"),
historico:document.getElementById("historico"),equipeCard:document.getElementById("equipeCard"),
equipeNome:document.getElementById("equipeNome"),equipeFuncao:document.getElementById("equipeFuncao"),
equipeArea:document.getElementById("equipeArea"),equipeMembros:document.getElementById("equipeMembros"),
caixaMensagem:document.getElementById("caixaMensagem")
};

let ponto=null,intervalo=null,pausado=false,inicio=null,pausaInicio=null,tempoPausa=0,pausas=0,equipeAtual=null;

el.nome.textContent=usuario.nome||"Usuário";
el.pass.textContent=`Passaporte: ${usuario.passaporte} • Ponto`;
el.avatar.textContent=(usuario.nome||"?")[0].toUpperCase();

function mostrarErro(titulo, mensagem, codigo=""){
    el.caixaMensagem.className="erro-box";
    el.caixaMensagem.style.display="block";
    el.caixaMensagem.innerHTML=`
        <div class="erro-titulo"><i class="fa-solid fa-triangle-exclamation"></i> ${titulo}</div>
        <div class="erro-detalhe">
            ${mensagem.replaceAll("\n","<br>")}
            ${codigo?`<br><br><strong>Código:</strong> ${codigo}`:""}
        </div>
    `;
    console.error(`[ERRO] ${titulo}: ${mensagem}`, codigo);
}

function mostrarSucesso(titulo, mensagem){
    el.caixaMensagem.className="sucesso-box";
    el.caixaMensagem.style.display="block";
    el.caixaMensagem.innerHTML=`
        <div class="erro-titulo" style="color:#86efac"><i class="fa-solid fa-check-circle"></i> ${titulo}</div>
        <div class="erro-detalhe">${mensagem.replaceAll("\n","<br>")}</div>
    `;
}

function limparMensagem(){
    el.caixaMensagem.style.display="none";
    el.caixaMensagem.innerHTML="";
}

function hora(d=new Date()){return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function tempo(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return[h,m,x].map(v=>String(v).padStart(2,"0")).join(":")}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function atualizarTimer(){if(!inicio||pausado)return;el.timer.textContent=tempo(Math.max(0,Math.floor((Date.now()-inicio)/1000)-tempoPausa))}
function mostrarAba(n,b){document.getElementById("jornada").style.display=n==="jornada"?"block":"none";el.historico.style.display=n==="historico"?"block":"none";document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(n==="historico")carregarHistorico()}

async function carregarJornadaAtiva(){
    try{
        const {data,error}=await supabaseClient.from("pontos")
            .select("*")
            .eq("passaporte",usuario.passaporte)
            .in("status",["ativo","pausado"])
            .order("entrada",{ascending:false})
            .limit(1);
        if(error) throw error;
        return data?.length?data[0]:null;
    }catch(e){
        console.warn("Não foi possível verificar jornada:",e);
        return null;
    }
}

async function aplicarEstadoJornada(registro){
    if(!registro) return;
    ponto=registro;
    inicio=new Date(registro.entrada).getTime();
    pausado=(registro.status==="pausado");
    pausas=registro.pausas||0;
    if(registro.pausa_inicio){
        const pi=new Date(registro.pausa_inicio);
        tempoPausa=registro.pausa_fim?Math.floor((new Date(registro.pausa_fim)-pi)/1000):0;
    }
    el.entrada.textContent=hora(new Date(registro.entrada));
    el.marcEntrada.textContent=hora(new Date(registro.entrada));
    el.pausas.textContent=pausas;
    if(registro.status==="ativo"){
        el.status.textContent="Ativo";el.status.style.color="var(--green)";
        el.btnPausar.innerHTML='<i class="fa-solid fa-pause"></i> Pausar';
    }else{
        el.status.textContent="Pausado";el.status.style.color="var(--yellow)";
        el.btnPausar.innerHTML='<i class="fa-solid fa-play"></i> Continuar';
    }
    el.btnIniciar.style.display="none";el.grupo.style.display="flex";
    if(registro.equipe_id) await carregarEquipe(registro.equipe_id);
    intervalo=setInterval(atualizarTimer,1000);atualizarTimer();
}

async function buscarEquipeDisponivel(){
    try{
        const {data:e,error:a}=await supabaseClient.from("equipes").select("*").eq("ativa",true);
        if(a) throw a;
        const {data:m,error:b}=await supabaseClient.from("equipe_membros").select("id,equipe_id").neq("status","fora");
        if(b) throw b;
        const c=e.map(x=>({...x,quantidade:(m||[]).filter(y=>y.equipe_id===x.id).length}))
        .sort((a,b)=>a.quantidade-b.quantidade).filter(x=>!x.limite||x.quantidade<x.limite);
        if(!c.length) throw new Error("Sem vagas em equipes.");
        return c[0];
    }catch(e){throw e}
}

async function carregarEquipe(id){
    try{
        const {data:e,error:a}=await supabaseClient.from("equipes").select("*").eq("id",id).single();
        if(a) throw a;
        el.equipe.textContent=e.nome;el.equipeNome.textContent=e.nome;
        el.equipeFuncao.textContent=e.funcao||"--";el.equipeArea.textContent=e.area||"--";
        el.equipeCard.style.display="block";
        const {data:m}=await supabaseClient.from("equipe_membros").select("nome,passaporte,status").eq("equipe_id",id).neq("status","fora");
        el.equipeMembros.innerHTML=m?.map(x=>`<div class="membro"><div><div class="membro-nome">${esc(x.nome)}</div><div class="membro-pass">${esc(x.passaporte)}</div></div></div>`).join("")||"<div class='loading'>Sem membros</div>";
    }catch(e){console.error(e)}
}

async function iniciarJornada(){
    limparMensagem();el.btnIniciar.disabled=true;el.btnIniciar.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Analisando...';
    try{
        const jaExiste=await carregarJornadaAtiva();
        if(jaExiste) throw new Error(`Jornada já ativa!\nEntrada: ${new Date(jaExiste.entrada).toLocaleString("pt-BR")}`);
        const eq=await buscarEquipeDisponivel(),agora=new Date().toISOString();
        const {data:pt}=await supabaseClient.from("pontos").insert({passaporte:usuario.passaporte,nome:usuario.nome,entrada:agora,status:"ativo",equipe_id:eq.id}).select().single();
        await supabaseClient.from("equipe_membros").insert({equipe_id:eq.id,passaporte:usuario.passaporte,nome:usuario.nome,status:"ativo"});
        ponto=pt;inicio=Date.now();el.btnIniciar.style.display="none";el.grupo.style.display="flex";
        el.entrada.textContent=hora();el.marcEntrada.textContent=hora();
        el.status.textContent="Ativo";el.status.style.color="var(--green)";
        await carregarEquipe(eq.id);intervalo=setInterval(atualizarTimer,1000);
        mostrarSucesso("Jornada Iniciada",`Equipe: ${eq.nome}`);
    }catch(e){mostrarErro("Erro",e.message);}
    el.btnIniciar.disabled=false;el.btnIniciar.innerHTML='<i class="fa-solid fa-play"></i> Iniciar Jornada';
}

async function pausarContinuar(){
    if(!ponto) return;
    const agora=new Date().toISOString();
    if(!pausado){
        await supabaseClient.from("pontos").update({pausa_inicio:agora,status:"pausado"}).eq("id",ponto.id);
        pausado=true;pausas++;el.status.textContent="Pausado";el.btnPausar.innerHTML='<i class="fa-solid fa-play"></i> Continuar';
        el.marcPausa.textContent=hora();mostrarSucesso("Pausado","");
    }else{
        await supabaseClient.from("pontos").update({pausa_fim:agora,status:"ativo"}).eq("id",ponto.id);
        pausado=false;el.status.textContent="Ativo";el.btnPausar.innerHTML='<i class="fa-solid fa-pause"></i> Pausar';
        mostrarSucesso("Retomado","");
    }
}

async function encerrarJornada(){
    if(!ponto||!confirm("Encerrar?")) return;
    const agora=new Date().toISOString();
    await supabaseClient.from("pontos").update({saida:agora,status:"encerrado"}).eq("id",ponto.id);
    el.marcSaida.textContent=hora();el.status.textContent="Offline";
    el.btnIniciar.style.display="block";el.grupo.style.display="none";
    clearInterval(intervalo);el.timer.textContent="00:00:00";
    el.equipeCard.style.display="none";ponto=null;
    mostrarSucesso("Encerrado",`${hora()}`);
}

async function carregarHistorico(){
    try{
        const {data}=await supabaseClient.from("pontos").select("entrada,saida,status").eq("passaporte",usuario.passaporte).order("entrada",{ascending:false});
        el.historico.innerHTML=data?.map(x=>`<div class="history-card"><strong>${x.status}</strong><div>${x.entrada?new Date(x.entrada).toLocaleString():""}</div></div>`).join("")||"<div class='loading'>Vazio</div>";
    }catch(e){el.historico.innerHTML="<div class='loading'>Erro</div>"}
}

document.addEventListener("DOMContentLoaded",async ()=>{
    const j=await carregarJornadaAtiva();if(j) aplicarEstadoJornada(j);
});
</script>
</body>
</html>
