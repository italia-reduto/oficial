<script>

const supabaseClient = window.supabase.createClient(
    "https://vclwmikzmnuqfdxobtik.supabase.co",
    "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF"
);

const usuarioRaw = sessionStorage.getItem("italia_usuario");

if(!usuarioRaw){
    window.location.href = "login.html";
}

let usuario = null;

try{
    usuario = JSON.parse(usuarioRaw);
}catch(e){
    console.error("Erro ao ler usuário:",e);
    sessionStorage.removeItem("italia_usuario");
    window.location.href = "login.html";
}

if(!usuario || !usuario.passaporte){
    sessionStorage.removeItem("italia_usuario");
    window.location.href = "login.html";
}

const passaporte = String(usuario.passaporte);
const nome = usuario.nome || "Usuário";

const STORAGE_PONTO = `italia_ponto_${passaporte}`;
const STORAGE_COOLDOWN = `italia_cooldown_${passaporte}`;

let ponto = null;
let intervalo = null;

const nomeUsuario = document.getElementById("nomeUsuario");
const timer = document.getElementById("timer");
const statusTexto = document.getElementById("statusTexto");
const statusBox = document.getElementById("status");

const btnIniciar = document.getElementById("btnIniciar");
const btnPausar = document.getElementById("btnPausar");
const btnRetomar = document.getElementById("btnRetomar");

const btnEncerrarAtivo =
    document.getElementById("btnEncerrarAtivo");

const btnEncerrarPausado =
    document.getElementById("btnEncerrarPausado");

const acoesAtivo =
    document.getElementById("acoesAtivo");

const acoesPausado =
    document.getElementById("acoesPausado");

const loading =
    document.getElementById("loading");

const cardEquipe =
    document.getElementById("cardEquipe");

const equipeNome =
    document.getElementById("equipeNome");

const equipeDetalhe =
    document.getElementById("equipeDetalhe");

nomeUsuario.textContent =
    `${nome} • Passaporte ${passaporte}`;


/* =========================================================
   UTILITÁRIOS
========================================================= */

function mostrarErro(titulo, erro){

    console.error(titulo, erro);

    const mensagem =
        erro?.message ||
        erro?.details ||
        erro?.hint ||
        String(erro);

    alert(`${titulo}\n\n${mensagem}`);
}


function setLoading(valor){

    loading.classList.toggle("mostrar", valor);

    btnIniciar.disabled = valor;
    btnPausar.disabled = valor;
    btnRetomar.disabled = valor;
    btnEncerrarAtivo.disabled = valor;
    btnEncerrarPausado.disabled = valor;
}


function salvarPontoLocal(){

    if(!ponto){
        localStorage.removeItem(STORAGE_PONTO);
        return;
    }

    localStorage.setItem(
        STORAGE_PONTO,
        JSON.stringify(ponto)
    );
}


function carregarPontoLocal(){

    const salvo =
        localStorage.getItem(STORAGE_PONTO);

    if(!salvo){
        return null;
    }

    try{
        return JSON.parse(salvo);
    }catch(e){
        console.error("Ponto local inválido:",e);

        localStorage.removeItem(STORAGE_PONTO);

        return null;
    }
}


function formatarTempo(segundos){

    segundos = Math.max(
        0,
        Math.floor(segundos || 0)
    );

    const horas =
        Math.floor(segundos / 3600);

    const minutos =
        Math.floor((segundos % 3600) / 60);

    const seg =
        segundos % 60;

    return [
        String(horas).padStart(2,"0"),
        String(minutos).padStart(2,"0"),
        String(seg).padStart(2,"0")
    ].join(":");
}


function diferencaSegundos(data){

    const inicio =
        new Date(data).getTime();

    if(!inicio){
        return 0;
    }

    return Math.max(
        0,
        Math.floor(
            (Date.now() - inicio) / 1000
        )
    );
}
  /* =========================================================
   INTERFACE
========================================================= */

function atualizarInterface(){

    if(!ponto){

        clearInterval(intervalo);

        timer.textContent = "00:00:00";

        statusBox.className = "status";
        statusTexto.textContent = "Ponto fechado";

        btnIniciar.style.display = "block";

        acoesAtivo.style.display = "none";
        acoesPausado.style.display = "none";

        cardEquipe.classList.remove("mostrar");

        return;
    }


    btnIniciar.style.display = "none";


    if(ponto.status === "pausado"){

        statusBox.className =
            "status pausado";

        statusTexto.textContent =
            "Jornada pausada";

        acoesAtivo.style.display =
            "none";

        acoesPausado.style.display =
            "grid";

    }else{

        statusBox.className =
            "status ativo";

        statusTexto.textContent =
            "Jornada ativa";

        acoesAtivo.style.display =
            "grid";

        acoesPausado.style.display =
            "none";
    }


    atualizarTimer();

    clearInterval(intervalo);

    intervalo = setInterval(
        atualizarTimer,
        1000
    );


    if(ponto.equipe_nome){

        cardEquipe.classList.add("mostrar");

        equipeNome.textContent =
            ponto.equipe_nome;

        equipeDetalhe.textContent =
            ponto.equipe_funcao ||
            ponto.equipe_area ||
            "Equipe ativa";

    }
}


function atualizarTimer(){

    if(!ponto){
        timer.textContent = "00:00:00";
        return;
    }


    let segundos = 0;


    if(ponto.status === "pausado"){

        segundos =
            Number(ponto.tempo_antes_pausa || 0);

    }else{

        segundos =
            Number(
                ponto.tempo_antes_pausa || 0
            );

        segundos +=
            diferencaSegundos(
                ponto.ultimo_inicio_ativo
            );
    }


    timer.textContent =
        formatarTempo(segundos);
}


/* =========================================================
   COOLDOWN
========================================================= */

function verificarCooldown(){

    const cooldown =
        Number(
            localStorage.getItem(
                STORAGE_COOLDOWN
            )
        );

    if(!cooldown){
        return false;
    }

    if(Date.now() >= cooldown){

        localStorage.removeItem(
            STORAGE_COOLDOWN
        );

        return false;
    }

    const restante =
        Math.ceil(
            (cooldown - Date.now()) / 1000
        );

    const minutos =
        Math.floor(restante / 60);

    const segundos =
        restante % 60;

    alert(
        `Você precisa aguardar ${minutos}:${String(segundos).padStart(2,"0")} antes de iniciar outro ponto.`
    );

    return true;
}


/* =========================================================
   BUSCAR EQUIPES
========================================================= */

async function buscarEquipeDisponivel(){

    const {
        data: equipes,
        error: erroEquipes
    } = await supabaseClient
        .from("equipes")
        .select(`
            id,
            nome,
            funcao,
            area,
            limite,
            ativa,
            tipo
        `)
        .eq("ativa",true);


    if(erroEquipes){

        throw new Error(
            `Erro ao buscar equipes: ${erroEquipes.message}`
        );
    }


    if(!equipes || equipes.length === 0){

        throw new Error(
            "Não existe nenhuma equipe ativa disponível."
        );
    }


    const resultado = [];


    for(const equipe of equipes){

        const {
            data: membros,
            error: erroMembros
        } = await supabaseClient
            .from("equipe_membros")
            .select(`
                id,
                passaporte,
                nome,
                status,
                cargo,
                posicao,
                atividade,
                veiculo
            `)
            .eq("equipe_id",equipe.id)
            .neq("status","fora");


        if(erroMembros){

            throw new Error(
                `Erro ao verificar membros da equipe "${equipe.nome}": ${erroMembros.message}`
            );
        }


        const ativos =
            membros || [];


        const quantidade =
            ativos.length;


        /*
          Se a equipe tiver limite definido,
          usamos esse limite.

          Para equipes sem limite:
          - Favela: sem limite geral
          - Segurança: sem limite geral
          - Farm: controlada pela atividade
          - Venda: máximo 4
        */

        let limite =
            Number(equipe.limite || 0);


        const tipo =
            String(
                equipe.tipo ||
                ""
            ).toLowerCase();


        const funcao =
            String(
                equipe.funcao ||
                ""
            ).toLowerCase();


        const nomeEquipe =
            String(
                equipe.nome ||
                ""
            ).toLowerCase();


        const ehFavela =
            tipo.includes("favela") ||
            nomeEquipe.includes("favela") ||
            funcao.includes("favela");


        const ehSeguranca =
            tipo.includes("segurança") ||
            tipo.includes("seguranca") ||
            nomeEquipe.includes("segurança") ||
            nomeEquipe.includes("seguranca");


        const ehVenda =
            tipo.includes("venda") ||
            nomeEquipe.includes("venda") ||
            funcao.includes("venda");


        if(ehVenda){

            limite = 4;

        }else if(ehFavela){

            limite = 0;

        }else if(ehSeguranca){

            limite = 0;

        }


        /*
          limite 0 = sem limite geral.
        */

        if(limite > 0 && quantidade >= limite){
            continue;
        }


        resultado.push({
            equipe,
            membros: ativos,
            quantidade
        });
    }


    if(resultado.length === 0){

        throw new Error(
            "Todas as equipes disponíveis estão lotadas no momento."
        );
    }


    /*
      Escolhe primeiro a equipe
      com menos integrantes.
    */

    resultado.sort(
        (a,b) =>
            a.quantidade -
            b.quantidade
    );


    return resultado[0];
      }
  /* =========================================================
   INSERIR MEMBRO NA EQUIPE
========================================================= */

async function inserirMembroEquipe(equipe){

    /*
      Verifica se o usuário já está
      nessa equipe com status ativo/pausado.
    */

    const {
        data: existente,
        error: erroBusca
    } = await supabaseClient
        .from("equipe_membros")
        .select("id,status")
        .eq("equipe_id",equipe.id)
        .eq("passaporte",passaporte)
        .neq("status","fora")
        .maybeSingle();


    if(erroBusca){

        throw new Error(
            `Erro ao verificar sua equipe: ${erroBusca.message}`
        );
    }


    if(existente){

        return existente;
    }


    const {
        data,
        error
    } = await supabaseClient
        .from("equipe_membros")
        .insert({
            equipe_id:equipe.id,
            passaporte:passaporte,
            nome:nome,
            status:"ativo",
            entrou_em:new Date().toISOString()
        })
        .select()
        .single();


    if(error){

        throw new Error(
            `Não foi possível entrar na equipe: ${error.message}`
        );
    }


    return data;
}


/* =========================================================
   INICIAR JORNADA
========================================================= */

async function iniciarJornada(){

    console.log("INICIAR CLICADO");

    if(verificarCooldown()){
        return;
    }


    if(ponto){

        alert(
            "Você já possui uma jornada aberta."
        );

        return;
    }


    setLoading(true);


    try{

        console.log("Buscando equipe disponível...");


        const escolha =
            await buscarEquipeDisponivel();


        const equipe =
            escolha.equipe;


        console.log(
            "Equipe escolhida:",
            equipe
        );


        /*
          Primeiro cria o registro do ponto.
        */

        const {
            data: novoPonto,
            error: erroPonto
        } = await supabaseClient
            .from("pontos")
            .insert({
                passaporte:passaporte,
                nome:nome,
                equipe_id:equipe.id,
                entrada:new Date().toISOString(),
                status:"ativo"
            })
            .select()
            .single();


        if(erroPonto){

            throw new Error(
                `Não foi possível criar o ponto: ${erroPonto.message}`
            );
        }


        console.log(
            "Ponto criado:",
            novoPonto
        );


        /*
          Depois coloca o usuário
          dentro da equipe.
        */

        try{

            await inserirMembroEquipe(
                equipe
            );

        }catch(erroEquipe){

            /*
              Se falhar ao entrar na equipe,
              tenta apagar o ponto recém-criado.
            */

            await supabaseClient
                .from("pontos")
                .delete()
                .eq("id",novoPonto.id);

            throw erroEquipe;
        }


        /*
          Salva o estado local.
        */

        ponto = {

            id:novoPonto.id,

            passaporte:passaporte,

            nome:nome,

            equipe_id:equipe.id,

            equipe_nome:equipe.nome,

            equipe_funcao:equipe.funcao,

            equipe_area:equipe.area,

            entrada:
                novoPonto.entrada ||
                new Date().toISOString(),

            status:"ativo",

            tempo_antes_pausa:0,

            ultimo_inicio_ativo:
                novoPonto.entrada ||
                new Date().toISOString()
        };


        salvarPontoLocal();


        console.log(
            "Jornada iniciada com sucesso."
        );


        /*
          Vai direto para a página
          da equipe.
        */

        window.location.href =
            "equipe.html";


    }catch(erro){

        mostrarErro(
            "Não foi possível iniciar o ponto.",
            erro
        );

        setLoading(false);
    }
}


/* =========================================================
   PAUSAR
========================================================= */

async function pausarJornada(){

    if(!ponto){
        return;
    }


    setLoading(true);


    try{

        const agora =
            new Date().toISOString();


        const segundosAtivos =
            diferencaSegundos(
                ponto.ultimo_inicio_ativo
            );


        ponto.tempo_antes_pausa =
            Number(
                ponto.tempo_antes_pausa || 0
            ) +
            segundosAtivos;


        ponto.status =
            "pausado";


        ponto.pausa_inicio =
            agora;


        ponto.ultimo_inicio_ativo =
            null;


        const {
            error
        } = await supabaseClient
            .from("pontos")
            .update({
                status:"pausado",
                pausa_inicio:agora
            })
            .eq("id",ponto.id);


        if(error){

            throw new Error(
                `Não foi possível pausar: ${error.message}`
            );
        }


        await supabaseClient
            .from("equipe_membros")
            .update({
                status:"pausado"
            })
            .eq("equipe_id",ponto.equipe_id)
            .eq("passaporte",passaporte)
            .neq("status","fora");


        salvarPontoLocal();

        atualizarInterface();


    }catch(erro){

        mostrarErro(
            "Erro ao pausar.",
            erro
        );

    }finally{

        setLoading(false);
    }
}

  /* =========================================================
   ENCERRAR
========================================================= */

async function encerrarJornada(){

    if(!ponto){
        return;
    }


    const confirmar =
        confirm(
            "Deseja realmente encerrar sua jornada?"
        );


    if(!confirmar){
        return;
    }


    setLoading(true);


    try{

        const agora =
            new Date().toISOString();


        let tempoFinal =
            Number(
                ponto.tempo_antes_pausa || 0
            );


        if(ponto.status === "ativo"){

            tempoFinal +=
                diferencaSegundos(
                    ponto.ultimo_inicio_ativo
                );
        }


        const {
            error:erroPonto
        } = await supabaseClient
            .from("pontos")
            .update({
                saida:agora,
                status:"encerrado"
            })
            .eq("id",ponto.id);


        if(erroPonto){

            throw new Error(
                `Não foi possível encerrar o ponto: ${erroPonto.message}`
            );
        }


        const {
            error:erroMembro
        } = await supabaseClient
            .from("equipe_membros")
            .update({
                status:"fora",
                saiu_em:agora
            })
            .eq("equipe_id",ponto.equipe_id)
            .eq("passaporte",passaporte)
            .neq("status","fora");


        if(erroMembro){

            console.warn(
                "Ponto encerrado, mas houve erro ao sair da equipe:",
                erroMembro
            );
        }


        /*
          Cooldown de 1 minuto.
        */

        localStorage.setItem(
            STORAGE_COOLDOWN,
            String(
                Date.now() +
                60000
            )
        );


        clearInterval(intervalo);

        ponto = null;

        localStorage.removeItem(
            STORAGE_PONTO
        );


        atualizarInterface();

        await carregarHistorico();


        alert(
            `Jornada encerrada com sucesso.\nTempo registrado: ${formatarTempo(tempoFinal)}`
        );


    }catch(erro){

        mostrarErro(
            "Erro ao encerrar a jornada.",
            erro
        );

    }finally{

        setLoading(false);
    }
}


/* =========================================================
   HISTÓRICO
========================================================= */

async function carregarHistorico(){

    const historico =
        document.getElementById("historico");


    const {
        data,
        error
    } = await supabaseClient
        .from("pontos")
        .select(`
            id,
            equipe_id,
            entrada,
            saida,
            status,
            criado_em,
            equipes (
                nome
            )
        `)
        .eq("passaporte",passaporte)
        .order("entrada",{ascending:false})
        .limit(5);


    if(error){

        console.error(
            "Erro histórico:",
            error
        );

        historico.innerHTML = `
            <div class="historico-vazio">
                Não foi possível carregar o histórico.
            </div>
        `;

        return;
    }


    if(!data || data.length === 0){

        historico.innerHTML = `
            <div class="historico-vazio">
                Nenhum registro encontrado.
            </div>
        `;

        return;
    }


    historico.innerHTML =
        data.map(item => {

            const entrada =
                item.entrada
                ? new Date(item.entrada)
                : null;

            const saida =
                item.saida
                ? new Date(item.saida)
                : null;


            const dataTexto =
                entrada
                ? entrada.toLocaleDateString(
                    "pt-BR"
                )
                : "—";


            const entradaTexto =
                entrada
                ? entrada.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )
                : "—";


            const saidaTexto =
                saida
                ? saida.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )
                : "Aberto";


            const equipe =
                item.equipes?.nome ||
                "Equipe";


            return `
                <div class="registro">

                    <div class="registro-esq">

                        <strong>
                            ${equipe}
                        </strong>

                        <span>
                            ${dataTexto}
                        </span>

                    </div>

                    <div class="registro-dir">

                        <strong>
                            ${entradaTexto}
                            →
                            ${saidaTexto}
                        </strong>

                        <span>
                            ${item.status || "—"}
                        </span>

                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   RESTAURAR PONTO
========================================================= */

async function restaurarPonto(){

    const local =
        carregarPontoLocal();


    if(local){

        ponto = local;

        atualizarInterface();

        return;
    }


    /*
      Caso o navegador tenha perdido
      o localStorage, procuramos uma
      jornada ainda aberta no banco.
    */

    const {
        data,
        error
    } = await supabaseClient
        .from("pontos")
        .select(`
            id,
            passaporte,
            nome,
            equipe_id,
            entrada,
            saida,
            status,
            pausa_inicio,
            pausa_fim,
            criado_em,
            equipes (
                nome,
                funcao,
                area
            )
        `)
        .eq("passaporte",passaporte)
        .in("status",["ativo","pausado"])
        .order("entrada",{ascending:false})
        .limit(1);


    if(error){

        console.error(
            "Erro ao restaurar ponto:",
            error
        );

        return;
    }


    if(!data || data.length === 0){
        return;
    }


    const registro =
        data[0];


    ponto = {

        id:registro.id,

        passaporte:registro.passaporte,

        nome:registro.nome,

        equipe_id:registro.equipe_id,

        equipe_nome:
            registro.equipes?.nome ||
            "",

        equipe_funcao:
            registro.equipes?.funcao ||
            "",

        equipe_area:
            registro.equipes?.area ||
            "",

        entrada:registro.entrada,

        status:registro.status,

        pausa_inicio:
            registro.pausa_inicio,

        tempo_antes_pausa:0,

        ultimo_inicio_ativo:
            registro.status === "ativo"
            ? registro.entrada
            : null
    };


    /*
      Para ponto pausado, não sabemos
      exatamente o acumulado só com os
      campos atuais. Mantemos a jornada
      restaurada sem inventar tempo.
    */

    if(registro.status === "pausado"){

        ponto.tempo_antes_pausa = 0;
    }


    salvarPontoLocal();

    atualizarInterface();
}
