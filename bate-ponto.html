.dot{

/* BOTÕES */

.acoes{

.btn{

.btn-iniciar,

<script>

const supabaseClient =

const usuarioRaw =
sessionStorage.getItem("italia_usuario");


if(!usuarioRaw){

}


let usuario;

try{

}catch(erro){

    window.location.href =

}


if(

){

    sessionStorage.removeItem(
        "italia_usuario"
    );

    window.location.href =
    "login.html";

    throw new Error(
        "Sessão inválida."
    );
}


const passaporte =
String(usuario.passaporte);

const nome =
usuario.nome || "Usuário";


const STORAGE =
`italia_ponto_${passaporte}`;

const COOLDOWN =
`italia_cooldown_${passaporte}`;


let ponto = null;
let intervalo = null;
let pausas = [];


/* ELEMENTOS */

const avatar =
document.getElementById("avatar");

const usuarioNome =
document.getElementById("usuarioNome");

const usuarioDados =
document.getElementById("usuarioDados");

const cronometro =
document.getElementById("cronometro");

const statusBox =

document.getElementById("statusTexto");

const btnIniciar =

document.getElementById("btnPausar");

const btnRetomar =
document.getElementById("btnRetomar");

const btnEncerrar =
document.getElementById("btnEncerrar");

const loading =

avatar.textContent =
nome.charAt(0).toUpperCase();

usuarioNome.textContent =
nome;

usuarioDados.textContent =
`Passaporte: ${passaporte} • Ponto`;
    function erroTexto(erro){

    return (
        erro?.message ||
        erro?.details ||
        erro?.hint ||
        String(erro)
    );
}


function mostrarErro(titulo,erro){

    console.error(
        titulo,
        erro
    );

    alert(
        `${titulo}\n\n${erroTexto(erro)}`
    );
}


function carregarLocal(){

    const salvo =
    localStorage.getItem(STORAGE);

    if(!salvo){
        return null;
    }

    try{

        return JSON.parse(salvo);

    }catch(erro){

        localStorage.removeItem(STORAGE);

        return null;
    }
}


function salvarLocal(){

    if(!ponto){

        localStorage.removeItem(
            STORAGE
        );

        return;
    }

    localStorage.setItem(
        STORAGE,
        JSON.stringify(ponto)
    );
}


function tempoEntre(data){

    if(!data){
        return 0;
    }

    const valor =
    new Date(data).getTime();

    if(!valor){
        return 0;
    }

    return Math.max(
        0,
        Math.floor(
            (Date.now() - valor) / 1000
        )
    );
}


function formatar(segundos){

    segundos =
    Math.max(
        0,
        Math.floor(segundos || 0)
    );

    const h =
    Math.floor(segundos / 3600);

    const m =
    Math.floor(
        (segundos % 3600) / 60
    );

    const s =
    segundos % 60;

    return (
        String(h).padStart(2,"0") +
        ":" +
        String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0")
    );
}


function tempoAtual(){

    if(!ponto){
        return 0;
    }

    let total =
    Number(
        ponto.tempo_acumulado || 0
    );


    if(
        ponto.status === "ativo" &&
        ponto.ultimo_inicio_ativo
    ){

        total +=
        tempoEntre(
            ponto.ultimo_inicio_ativo
        );
    }

    return total;
}


function atualizarTela(){

    clearInterval(intervalo);


    if(!ponto){

        cronometro.textContent =
        "00:00:00";

        statusBox.className =
        "status";

        statusTexto.textContent =
        "Ponto fechado";

        btnIniciar.style.display =
        "block";

        btnPausar.style.display =
        "none";

        btnRetomar.style.display =
        "none";

        btnEncerrar.style.display =
        "none";

        document.getElementById(
            "statusResumo"
        ).textContent =
        "Ponto fechado";

        document.getElementById(
            "jornadaResumo"
        ).textContent =
        "Ponto fechado";

        document.getElementById(
            "entradaResumo"
        ).textContent =
        "—";

        document.getElementById(
            "equipeResumo"
        ).textContent =
        "Nenhuma equipe";

        document.getElementById(
            "pausasResumo"
        ).textContent =
        "Nenhuma pausa";

        return;
    }


    if(ponto.status === "pausado"){

        statusBox.className =
        "status pausado";

        statusTexto.textContent =
        "Jornada pausada";

        btnIniciar.style.display =
        "none";

        btnPausar.style.display =
        "none";

        btnRetomar.style.display =
        "block";

        btnEncerrar.style.display =
        "block";

    }else{

        statusBox.className =
        "status ativo";

        statusTexto.textContent =
        "Jornada ativa";

        btnIniciar.style.display =
        "none";

        btnPausar.style.display =
        "block";

        btnRetomar.style.display =
        "none";

        btnEncerrar.style.display =
        "block";
    }


    cronometro.textContent =
    formatar(
        tempoAtual()
    );


    document.getElementById(
        "statusResumo"
    ).textContent =
    ponto.status === "pausado"
    ? "Jornada pausada"
    : "Jornada ativa";


    document.getElementById(
        "jornadaResumo"
    ).textContent =
    formatar(
        tempoAtual()
    );


    document.getElementById(
        "entradaResumo"
    ).textContent =
    ponto.entrada
    ? new Date(
        ponto.entrada
      ).toLocaleTimeString(
        "pt-BR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
      )
    : "—";


    document.getElementById(
        "equipeResumo"
    ).textContent =
    ponto.equipe_nome ||
    "Equipe";


    document.getElementById(
        "pausasResumo"
    ).textContent =
    pausas.length
    ? `${pausas.length} pausa(s)`
    : "Nenhuma pausa";


    intervalo =
    setInterval(
        atualizarCronometro,
        1000
    );
}


function atualizarCronometro(){

    if(!ponto){
        return;
    }

    cronometro.textContent =
    formatar(
        tempoAtual()
    );

    document.getElementById(
        "jornadaResumo"
    ).textContent =
    formatar(
        tempoAtual()
    );
}


/* EQUIPE DISPONÍVEL */

async function buscarEquipe(){

    const resposta =
    await supabaseClient
    .from("equipes")
    .select(
        "id,nome,funcao,area,limite,ativa,tipo"
    )
    .eq("ativa",true);


    if(resposta.error){

        throw new Error(
            `Erro ao buscar equipes: ${resposta.error.message}`
        );
    }


    const equipes =
    resposta.data || [];


    if(!equipes.length){

        throw new Error(
            "Nenhuma equipe ativa foi encontrada."
        );
    }


    const disponiveis = [];


    for(
        const equipe of equipes
    ){

        const membrosResposta =
        await supabaseClient
        .from("equipe_membros")
        .select(
            "id,passaporte,status"
        )
        .eq(
            "equipe_id",
            equipe.id
        )
        .neq(
            "status",
            "fora"
        );


        if(membrosResposta.error){

            throw new Error(
                `Erro ao verificar a equipe ${equipe.nome}: ${membrosResposta.error.message}`
            );
        }


        const membros =
        membrosResposta.data || [];


        let limite =
        Number(
            equipe.limite || 0
        );


        const tipo =
        String(
            equipe.tipo || ""
        ).toLowerCase();

        const nomeEquipe =
        String(
            equipe.nome || ""
        ).toLowerCase();

        const funcao =
        String(
            equipe.funcao || ""
        ).toLowerCase();


        const venda =
        tipo.includes("venda") ||
        nomeEquipe.includes("venda") ||
        funcao.includes("venda");


        const favela =
        tipo.includes("favela") ||
        nomeEquipe.includes("favela") ||
        funcao.includes("favela");


        const seguranca =
        tipo.includes("segurança") ||
        tipo.includes("seguranca") ||
        nomeEquipe.includes("segurança") ||
        nomeEquipe.includes("seguranca");


        if(venda){
            limite = 4;
        }


        if(
            limite > 0 &&
            membros.length >= limite
        ){
            continue;
        }


        disponiveis.push({
            equipe:equipe,
            quantidade:membros.length
        });
    }


    if(!disponiveis.length){

        throw new Error(
            "Todas as equipes disponíveis estão lotadas."
        );
    }


    disponiveis.sort(
        (a,b) =>
        a.quantidade -
        b.quantidade
    );


    return disponiveis[0].equipe;
    }
    /* INICIAR */

async function iniciarJornada(){

    console.log(
        "Botão INICIAR pressionado."
    );


    if(ponto){

        alert(
            "Você já possui uma jornada aberta."
        );

        return;
    }


    const cooldown =
    Number(
        localStorage.getItem(
            COOLDOWN
        )
    );


    if(
        cooldown &&
        Date.now() < cooldown
    ){

        const segundos =
        Math.ceil(
            (cooldown - Date.now()) /
            1000
        );

        alert(
            `Aguarde ${segundos} segundos para iniciar novamente.`
        );

        return;
    }


    loading.classList.add(
        "mostrar"
    );

    btnIniciar.disabled =
    true;


    try{

        const equipe =
        await buscarEquipe();


        const entrada =
        new Date().toISOString();


        const pontoResposta =
        await supabaseClient
        .from("pontos")
        .insert({
            passaporte:passaporte,
            nome:nome,
            equipe_id:equipe.id,
            entrada:entrada,
            status:"ativo"
        })
        .select()
        .limit(1);


        if(pontoResposta.error){

            throw new Error(
                `Erro ao criar ponto: ${pontoResposta.error.message}`
            );
        }


        const novoPonto =
        pontoResposta.data?.[0];


        if(!novoPonto){

            throw new Error(
                "O ponto foi enviado, mas o Supabase não retornou o registro criado."
            );
        }


        const membroResposta =
        await supabaseClient
        .from("equipe_membros")
        .insert({
            equipe_id:equipe.id,
            passaporte:passaporte,
            nome:nome,
            status:"ativo",
            entrou_em:entrada
        })
        .select()
        .limit(1);


        if(membroResposta.error){

            await supabaseClient
            .from("pontos")
            .delete()
            .eq(
                "id",
                novoPonto.id
            );


            throw new Error(
                `Erro ao entrar na equipe: ${membroResposta.error.message}`
            );
        }


        ponto = {

            id:novoPonto.id,

            passaporte:passaporte,

            nome:nome,

            equipe_id:equipe.id,

            equipe_nome:equipe.nome,

            equipe_funcao:equipe.funcao,

            equipe_area:equipe.area,

            entrada:entrada,

            status:"ativo",

            tempo_acumulado:0,

            ultimo_inicio_ativo:entrada
        };


        pausas = [];


        salvarLocal();

        atualizarTela();


        /*
          Depois que o banco confirma tudo,
          abre a página completa da equipe.
        */

        window.location.href =
        "equipe.html";


    }catch(erro){

        mostrarErro(
            "Erro ao iniciar o ponto.",
            erro
        );

        loading.classList.remove(
            "mostrar"
        );

        btnIniciar.disabled =
        false;
    }
}


/* PAUSAR */

async function pausarJornada(){

    if(!ponto){
        return;
    }


    loading.classList.add(
        "mostrar"
    );


    try{

        const agora =
        new Date().toISOString();


        const acumulado =
        tempoAtual();


        const resposta =
        await supabaseClient
        .from("pontos")
        .update({
            status:"pausado",
            pausa_inicio:agora
        })
        .eq(
            "id",
            ponto.id
        );


        if(resposta.error){

            throw new Error(
                `Erro ao pausar: ${resposta.error.message}`
            );
        }


        pausas.push({
            inicio:agora,
            fim:null
        });


        ponto.status =
        "pausado";

        ponto.tempo_acumulado =
        acumulado;

        ponto.ultimo_inicio_ativo =
        null;


        await supabaseClient
        .from("equipe_membros")
        .update({
            status:"pausado"
        })
        .eq(
            "equipe_id",
            ponto.equipe_id
        )
        .eq(
            "passaporte",
            passaporte
        )
        .neq(
            "status",
            "fora"
        );


        salvarLocal();

        atualizarTela();

        carregarModais();


    }catch(erro){

        mostrarErro(
            "Erro ao pausar.",
            erro
        );

    }finally{

        loading.classList.remove(
            "mostrar"
        );
    }
}


/* RETOMAR */

async function retomarJornada(){

    if(!ponto){
        return;
    }


    loading.classList.add(
        "mostrar"
    );


    try{

        const agora =
        new Date().toISOString();


        const resposta =
        await supabaseClient
        .from("pontos")
        .update({
            status:"ativo",
            pausa_fim:agora
        })
        .eq(
            "id",
            ponto.id
        );


        if(resposta.error){

            throw new Error(
                `Erro ao retomar: ${resposta.error.message}`
            );
        }


        if(
            pausas.length &&
            !pausas[pausas.length-1].fim
        ){

            pausas[
                pausas.length-1
            ].fim = agora;
        }


        ponto.status =
        "ativo";

        ponto.ultimo_inicio_ativo =
        agora;


        await supabaseClient
        .from("equipe_membros")
        .update({
            status:"ativo"
        })
        .eq(
            "equipe_id",
            ponto.equipe_id
        )
        .eq(
            "passaporte",
            passaporte
        )
        .neq(
            "status",
            "fora"
        );


        salvarLocal();

        atualizarTela();

        carregarModais();


    }catch(erro){

        mostrarErro(
            "Erro ao retomar.",
            erro
        );

    }finally{

        loading.classList.remove(
            "mostrar"
        );
    }
    }
    /* ENCERRAR */

async function encerrarJornada(){

    if(!ponto){
        return;
    }


    if(
        !confirm(
            "Deseja realmente encerrar sua jornada?"
        )
    ){
        return;
    }


    loading.classList.add(
        "mostrar"
    );


    try{

        const agora =
        new Date().toISOString();


        const tempoFinal =
        tempoAtual();


        const resposta =
        await supabaseClient
        .from("pontos")
        .update({
            saida:agora,
            status:"encerrado"
        })
        .eq(
            "id",
            ponto.id
        );


        if(resposta.error){

            throw new Error(
                `Erro ao encerrar o ponto: ${resposta.error.message}`
            );
        }


        const membroResposta =
        await supabaseClient
        .from("equipe_membros")
        .update({
            status:"fora",
            saiu_em:agora
        })
        .eq(
            "equipe_id",
            ponto.equipe_id
        )
        .eq(
            "passaporte",
            passaporte
        )
        .neq(
            "status",
            "fora"
        );


        if(membroResposta.error){

            console.warn(
                "Ponto encerrado, mas não foi possível atualizar a saída da equipe:",
                membroResposta.error
            );
        }


        localStorage.setItem(
            COOLDOWN,
            String(
                Date.now() + 60000
            )
        );


        ponto = null;

        pausas = [];


        salvarLocal();

        atualizarTela();

        carregarModais();


        alert(
            `Jornada encerrada.\nTempo registrado: ${formatar(tempoFinal)}`
        );


    }catch(erro){

        mostrarErro(
            "Erro ao encerrar.",
            erro
        );

    }finally{

        loading.classList.remove(
            "mostrar"
        );
    }
}

function carregarModais(){

    const status =
    document.getElementById(
        "conteudoStatus"
    );

    const entrada =
    document.getElementById(
        "conteudoEntrada"
    );

    const jornada =
    document.getElementById(
        "conteudoJornada"
    );

    const equipe =
    document.getElementById(
        "conteudoEquipe"
    );

    const pausasBox =
    document.getElementById(
        "conteudoPausas"
    );


    if(!ponto){

        status.innerHTML =
        `<div class="vazio">
            Nenhuma jornada aberta.
        </div>`;

        entrada.innerHTML =
        `<div class="vazio">
            Nenhum horário de entrada.
        </div>`;

        jornada.innerHTML =
        `<div class="vazio">
            Sua jornada está fechada.
        </div>`;

        equipe.innerHTML =
        `<div class="vazio">
            Você não está em uma equipe.
        </div>`;

        pausasBox.innerHTML =
        `<div class="vazio">
            Nenhuma pausa registrada.
        </div>`;

        return;
    }


    status.innerHTML = `
        <div class="linha">
            <span>Status</span>
            <strong>
                ${
                    ponto.status === "pausado"
                    ? "Pausado"
                    : "Ativo"
                }
            </strong>
        </div>
    `;


    entrada.innerHTML = `
        <div class="linha">
            <span>Entrada</span>
            <strong>
                ${
                    new Date(
                        ponto.entrada
                    ).toLocaleString(
                        "pt-BR"
                    )
                }
            </strong>
        </div>
    `;


    jornada.innerHTML = `
        <div class="linha">
            <span>Tempo</span>
            <strong>
                ${formatar(tempoAtual())}
            </strong>
        </div>

        <div class="linha">
            <span>Status</span>
            <strong>
                ${
                    ponto.status === "pausado"
                    ? "Pausada"
                    : "Em andamento"
                }
            </strong>
        </div>
    `;


    equipe.innerHTML = `
        <div class="linha">
            <span>Equipe</span>
            <strong>
                ${ponto.equipe_nome || "—"}
            </strong>
        </div>

        <div class="linha">
            <span>Função</span>
            <strong>
                ${ponto.equipe_funcao || "—"}
            </strong>
        </div>

        <div class="linha">
            <span>Área</span>
            <strong>
                ${ponto.equipe_area || "—"}
            </strong>
        </div>
    `;


    if(!pausas.length){

        pausasBox.innerHTML =
        `<div class="vazio">
            Nenhuma pausa registrada.
        </div>`;

    }else{

        pausasBox.innerHTML =
        pausas.map(
            (pausa,index) => {

                return `
                    <div class="linha">
                        <span>
                            Pausa ${index + 1}
                        </span>

                        <strong>
                            ${new Date(
                                pausa.inicio
                            ).toLocaleTimeString(
                                "pt-BR",
                                {
                                    hour:"2-digit",
                                    minute:"2-digit"
                                }
                            )}

                            ${
                                pausa.fim
                                ? " → " +
                                  new Date(
                                      pausa.fim
                                  ).toLocaleTimeString(
                                      "pt-BR",
                                      {
                                          hour:"2-digit",
                                          minute:"2-digit"
                                      }
                                  )
                                : " → em andamento"
                            }
                        </strong>
                    </div>
                `;
            }
        ).join("");
    }
}


/* HISTÓRICO */

async function abrirHistorico(){

    const conteudo =
    document.getElementById(
        "conteudoHistorico"
    );


    abrirModal(
        "modalHistorico"
    );


    conteudo.innerHTML =
    `<div class="vazio">
        Carregando histórico...
    </div>`;


    const resposta =
    await supabaseClient
    .from("pontos")
    .select(`
        id,
        entrada,
        saida,
        status,
        equipes (
            nome
        )
    `)
    .eq(
        "passaporte",
        passaporte
    )
    .order(
        "entrada",
        {
            ascending:false
        }
    )
    .limit(20);


    if(resposta.error){

        conteudo.innerHTML =
        `<div class="vazio">
            Não foi possível carregar o histórico.
        </div>`;

        console.error(
            resposta.error
        );

        return;
    }


    const registros =
    resposta.data || [];


    if(!registros.length){

        conteudo.innerHTML =
        `<div class="vazio">
            Nenhum registro encontrado.
        </div>`;

        return;
    }


    conteudo.innerHTML =
    registros.map(
        registro => {

            const entrada =
            registro.entrada
            ? new Date(
                registro.entrada
              ).toLocaleString(
                "pt-BR"
              )
            : "—";


            const saida =
            registro.saida
            ? new Date(
                registro.saida
              ).toLocaleString(
                "pt-BR"
              )
            : "Em aberto";


            return `
                <div class="linha">

                    <span>
                        ${registro.equipes?.nome || "Equipe"}
                        <br>
                        ${entrada}
                    </span>

                    <strong>
                        ${saida}
                    </strong>

                </div>
            `;
        }
    ).join("");
}

/* INICIALIZAÇÃO */

async function iniciarPagina(){

    ponto =
    carregarLocal();


    atualizarTela();

    carregarModais();


    /*
      Se não houver ponto salvo localmente,
      procura no banco uma jornada aberta.
    */

    if(!ponto){

        const resposta =
        await supabaseClient
        .from("pontos")
        .select(`
            id,
            passaporte,
            nome,
            equipe_id,
            entrada,
            saida,
            status,
            pausa_inicio,
            pausa_fim,
            equipes (
                nome,
                funcao,
                area
            )
        `)
        .eq(
            "passaporte",
            passaporte
        )
        .in(
            "status",
            [
                "ativo",
                "pausado"
            ]
        )
        .order(
            "entrada",
            {
                ascending:false
            }
        )
        .limit(1);


        if(
            !resposta.error &&
            resposta.data?.length
        ){

            const registro =
            resposta.data[0];


            ponto = {

                id:registro.id,

                passaporte:
                registro.passaporte,

                nome:
                registro.nome,

                equipe_id:
                registro.equipe_id,

                equipe_nome:
                registro.equipes?.nome || "",

                equipe_funcao:
                registro.equipes?.funcao || "",

                equipe_area:
                registro.equipes?.area || "",

                entrada:
                registro.entrada,

                status:
                registro.status,

                tempo_acumulado:0,

                ultimo_inicio_ativo:
                registro.status === "ativo"
                ? registro.entrada
                : null
            };


            salvarLocal();

            atualizarTela();

            carregarModais();
        }
    }
}
