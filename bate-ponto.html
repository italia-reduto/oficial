/* LOADING */

    position:fixed;

    background:#08090d;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .25s ease,visibility .25s ease;
}

    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

    display:flex;

/* =========================================================

/* =========================================================

/* =========================================================

let loading;

/* =========================================================

/* =========================================================
   SUPABASE
   ========================================================= */

function iniciarSupabase() {

    if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
    ) {
        console.error(

/* =========================================================
   LOADING
   ========================================================= */

function esconderLoading() {

    if (!loading) {

    }

    loading.classList.add("oculto");

/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(
    mensagem,
    tipo = "normal"
) {

    const antiga =
        document.querySelector(
            ".mensagem-temporaria"
        );

    if (antiga) {
        antiga.remove();
    }

    const elemento =
        document.createElement("div");

    elemento.className =
        "mensagem-temporaria " + tipo;

    elemento.textContent =
        mensagem;

    document.body.appendChild(
        elemento
    );

    setTimeout(() => {

        elemento.classList.add(
            "sumindo"
        );

        setTimeout(() => {

            if (elemento.parentNode) {
                elemento.remove();
            }

        }, 300);

    }, 2600);
}


/* =========================================================
   FORMATAÇÃO
   ========================================================= */

function formatarHora(data) {

    if (!data) {
        return "--:--";
    }

    const objeto =
        new Date(data);

    if (
        Number.isNaN(
            objeto.getTime()
        )
    ) {
        return "--:--";
    }

    return objeto.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function formatarData(data) {

    if (!data) {
        return "--/--/----";
    }

    const objeto =
        new Date(data);

    if (
        Number.isNaN(
            objeto.getTime()
        )
    ) {
        return "--/--/----";
    }

    return objeto.toLocaleDateString(
        "pt-BR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   DURAÇÃO
   ========================================================= */

function formatarDuracao(ms) {

    if (
        !ms ||
        ms < 0 ||
        Number.isNaN(ms)
    ) {
        ms = 0;
    }

    let segundos =
        Math.floor(ms / 1000);

    const horas =
        Math.floor(segundos / 3600);

    segundos %= 3600;

    const minutos =
        Math.floor(segundos / 60);

    segundos %= 60;

    return (
        String(horas).padStart(2, "0") +
        ":" +
        String(minutos).padStart(2, "0") +
        ":" +
        String(segundos).padStart(2, "0")
    );
}

/* =========================================================
   CALCULAR TEMPO DA JORNADA
   ========================================================= */

function calcularTempoJornada(registro) {

    if (
        !registro ||
        !registro.entrada
    ) {
        return 0;
    }

    const entrada =
        new Date(registro.entrada);

    let fim =
        registro.saida
            ? new Date(registro.saida)
            : new Date();

    let total =
        fim.getTime() -
        entrada.getTime();

    /*
     * Desconta a pausa registrada.
     */

    if (registro.pausa_inicio) {

        const inicioPausa =
            new Date(
                registro.pausa_inicio
            );

        let fimPausa = null;

        if (registro.pausa_fim) {

            fimPausa =
                new Date(
                    registro.pausa_fim
                );

        } else if (
            registro.status === "pausado"
        ) {

            fimPausa =
                new Date();

        }

        if (fimPausa) {

            const pausa =
                fimPausa.getTime() -
                inicioPausa.getTime();

            if (pausa > 0) {
                total -= pausa;
            }
        }
    }

    if (total < 0) {
        total = 0;
    }

    return total;
}


/* =========================================================
   ATUALIZAR STATUS
   ========================================================= */

function atualizarStatus() {

    if (
        !statusBadge ||
        !statusTexto
    ) {
        return;
    }

    statusBadge.classList.remove(
        "ativo",
        "pausado",
        "encerrado",
        "inativo"
    );

    if (!estado.registro) {

        statusBadge.classList.add(
            "inativo"
        );

        statusTexto.textContent =
            "Fora de jornada";

        return;
    }

    if (
        estado.registro.status === "ativo"
    ) {

        statusBadge.classList.add(
            "ativo"
        );

        statusTexto.textContent =
            "Jornada ativa";

        return;
    }

    if (
        estado.registro.status === "pausado"
    ) {

        statusBadge.classList.add(
            "pausado"
        );

        statusTexto.textContent =
            "Jornada pausada";

        return;
    }

    statusBadge.classList.add(
        "encerrado"
    );

    statusTexto.textContent =
        "Jornada encerrada";
}

   ========================================================= */

function atualizarInformacoes() {

    if (!estado.registro) {

        if (tempoJornada) {
            tempoJornada.textContent =
                "00:00:00";
        }

        if (entradaInfo) {
            entradaInfo.textContent =
                "--:--";
        }

        if (pausaInfo) {
            pausaInfo.textContent =
                "Sem pausa";
        }

        return;
    }

    if (tempoJornada) {

        tempoJornada.textContent =
            formatarDuracao(
                calcularTempoJornada(
                    estado.registro
                )
            );
    }

    if (entradaInfo) {

        entradaInfo.textContent =
            formatarHora(
                estado.registro.entrada
            );
    }

    if (pausaInfo) {

        if (
            estado.registro.pausa_inicio &&
            estado.registro.pausa_fim
        ) {

            pausaInfo.textContent =
                formatarHora(
                    estado.registro.pausa_inicio
                ) +
                " - " +
                formatarHora(
                    estado.registro.pausa_fim
                );

        } else if (
            estado.registro.pausa_inicio
        ) {

            pausaInfo.textContent =
                formatarHora(
                    estado.registro.pausa_inicio
                ) +
                " - em pausa";

        } else {

            pausaInfo.textContent =
                "Sem pausa";
        }
    }
}


/* =========================================================
   BOTÕES
   ========================================================= */

function atualizarBotoes() {

    if (
        !btnIniciar ||
        !btnPausa ||
        !btnEncerrar
    ) {
        return;
    }

    if (!estado.registro) {

        btnIniciar.style.display =
            "flex";

        btnPausa.style.display =
            "none";

        btnEncerrar.style.display =
            "none";

        btnIniciar.disabled = false;

        btnIniciar.textContent =
            "Iniciar Jornada";

        return;
    }

    btnIniciar.style.display =
        "none";

    btnPausa.style.display =
        "flex";

    btnEncerrar.style.display =
        "flex";

    btnPausa.disabled = false;
    btnEncerrar.disabled = false;

    if (
        estado.registro.status ===
        "pausado"
    ) {

        btnPausa.textContent =
            "▶ Retomar Jornada";

    } else {

        btnPausa.textContent =
            "Ⅱ Pausar Jornada";
    }
}


/* =========================================================
   ATUALIZAR TELA
   ========================================================= */

function atualizarTela() {

    atualizarStatus();
    atualizarInformacoes();
    atualizarBotoes();

    if (estado.registro) {
        iniciarCronometro();
    } else {
        pararCronometro();
    }
}


/* =========================================================
   CRONÔMETRO
   ========================================================= */

function iniciarCronometro() {

    pararCronometro();

    estado.intervalo =
        setInterval(() => {

            atualizarInformacoes();

        }, 1000);
}


function pararCronometro() {

    if (estado.intervalo) {

        clearInterval(
            estado.intervalo
        );

        estado.intervalo = null;
    }
}


/* =========================================================
   BUSCAR JORNADA ATUAL
   ========================================================= */

async function carregarJornadaAtual() {

    if (!clienteSupabase) {
        return;
    }

    try {

        const resultado =
            await clienteSupabase
                .from("pontos")
                .select("*")
                .eq(
                    "passaporte",
                    PASSAPORTE
                )
                .in(
                    "status",
                    ["ativo", "pausado"]
                )
                .is(
                    "saida",
                    null
                )
                .order(
                    "criado_em",
                    {
                        ascending: false
                    }
                )
                .limit(1);

        if (resultado.error) {

            console.error(
                "Erro ao buscar jornada:",
                resultado.error
            );

            estado.registro = null;

            atualizarTela();

            return;
        }

        if (
            resultado.data &&
            resultado.data.length > 0
        ) {

            estado.registro =
                resultado.data[0];

        } else {

            estado.registro = null;
        }

        atualizarTela();

    } catch (erro) {

        console.error(
            "Erro ao carregar jornada:",
            erro
        );

        estado.registro = null;

        atualizarTela();
    }
    }
    <script>
/* =========================================================
   INICIAR JORNADA
   ========================================================= */

async function iniciarJornada() {

    if (estado.carregandoAcao) {
        return;
    }

    if (!clienteSupabase) {

        mostrarMensagem(
            "Sistema indisponível no momento.",
            "erro"
        );

        return;
    }

    estado.carregandoAcao = true;

    btnIniciar.disabled = true;

    btnIniciar.textContent =
        "Iniciando...";

    try {

        const agora =
            new Date().toISOString();

        const registro =
        {
            passaporte: PASSAPORTE,
            entrada: agora,
            pausa_inicio: null,
            pausa_fim: null,
            saida: null,
            status: "ativo"
        };

        const resultado =
            await clienteSupabase
                .from("pontos")
                .insert([registro])
                .select()
                .single();

        if (resultado.error) {

            console.error(
                "Erro ao iniciar:",
                resultado.error
            );

            mostrarMensagem(
                "Não foi possível iniciar a jornada.",
                "erro"
            );

            btnIniciar.disabled = false;

            btnIniciar.textContent =
                "Iniciar Jornada";

            return;
        }

        estado.registro =
            resultado.data;

        atualizarTela();

        mostrarMensagem(
            "Jornada iniciada com sucesso!",
            "sucesso"
        );

        /*
         * REDIRECIONAMENTO
         */

        setTimeout(() => {

            window.location.href =
                "equipe.html";

        }, 600);

    } catch (erro) {

        console.error(
            "Erro inesperado:",
            erro
        );

        mostrarMensagem(
            "Erro de conexão com o sistema.",
            "erro"
        );

        btnIniciar.disabled = false;

        btnIniciar.textContent =
            "Iniciar Jornada";

    } finally {

        estado.carregandoAcao = false;
    }
}


/* =========================================================
   PAUSAR / RETOMAR
   ========================================================= */

async function pausarOuRetomar() {

    if (
        estado.carregandoAcao ||
        !estado.registro
    ) {
        return;
    }

    estado.carregandoAcao = true;

    btnPausa.disabled = true;

    btnPausa.textContent =
        "Processando...";

    try {

        const agora =
            new Date().toISOString();

        let atualizacao;

        if (
            estado.registro.status ===
            "ativo"
        ) {

            atualizacao = {
                status: "pausado",
                pausa_inicio: agora
            };

        } else if (
            estado.registro.status ===
            "pausado"
        ) {

            atualizacao = {
                status: "ativo",
                pausa_fim: agora
            };

        } else {

            mostrarMensagem(
                "Essa jornada já foi encerrada.",
                "erro"
            );

            return;
        }

        const resultado =
            await clienteSupabase
                .from("pontos")
                .update(atualizacao)
                .eq(
                    "id",
                    estado.registro.id
                )
                .select()
                .single();

        if (resultado.error) {

            console.error(
                "Erro ao atualizar:",
                resultado.error
            );

            mostrarMensagem(
                "Não foi possível atualizar a jornada.",
                "erro"
            );

            return;
        }

        estado.registro =
            resultado.data;

        atualizarTela();

        if (
            estado.registro.status ===
            "pausado"
        ) {

            mostrarMensagem(
                "Jornada pausada.",
                "sucesso"
            );

        } else {

            mostrarMensagem(
                "Jornada retomada.",
                "sucesso"
            );
        }

    } catch (erro) {

        console.error(
            "Erro:",
            erro
        );

        mostrarMensagem(
            "Erro de conexão.",
            "erro"
        );

    } finally {

        estado.carregandoAcao = false;

        atualizarBotoes();
    }
}


/* =========================================================
   ENCERRAR JORNADA
   ========================================================= */

async function encerrarJornada() {

    if (
        estado.carregandoAcao ||
        !estado.registro
    ) {
        return;
    }

    const confirmar =
        window.confirm(
            "Deseja realmente encerrar sua jornada?"
        );

    if (!confirmar) {
        return;
    }

    estado.carregandoAcao = true;

    btnEncerrar.disabled = true;

    btnEncerrar.textContent =
        "Encerrando...";

    try {

        const agora =
            new Date().toISOString();

        const atualizacao = {
            saida: agora,
            status: "encerrado"
        };

        if (
            estado.registro.status ===
            "pausado" &&
            estado.registro.pausa_inicio &&
            !estado.registro.pausa_fim
        ) {

            atualizacao.pausa_fim =
                agora;
        }

        const resultado =
            await clienteSupabase
                .from("pontos")
                .update(atualizacao)
                .eq(
                    "id",
                    estado.registro.id
                )
                .select()
                .single();

        if (resultado.error) {

            console.error(
                "Erro ao encerrar:",
                resultado.error
            );

            mostrarMensagem(
                "Não foi possível encerrar a jornada.",
                "erro"
            );

            return;
        }

        estado.registro = null;

        pararCronometro();

        atualizarTela();

        mostrarMensagem(
            "Jornada encerrada com sucesso!",
            "sucesso"
        );

        carregarHistorico();

    } catch (erro) {

        console.error(
            "Erro:",
            erro
        );

        mostrarMensagem(
            "Erro de conexão.",
            "erro"
        );

    } finally {

        estado.carregandoAcao = false;

        atualizarBotoes();
    }
}


/* =========================================================
   HISTÓRICO
   ========================================================= */

async function carregarHistorico() {

    if (
        !historicoLista ||
        !clienteSupabase
    ) {
        return;
    }

    historicoLista.innerHTML =
        `<div class="historico-carregando">
            Carregando histórico...
        </div>`;

    try {

        const resultado =
            await clienteSupabase
                .from("pontos")
                .select("*")
                .eq(
                    "passaporte",
                    PASSAPORTE
                )
                .order(
                    "criado_em",
                    {
                        ascending: false
                    }
                )
                .limit(20);

        if (resultado.error) {

            console.error(
                "Erro no histórico:",
                resultado.error
            );

            historicoLista.innerHTML =
                `<div class="historico-vazio">
                    Não foi possível carregar o histórico.
                </div>`;

            return;
        }

        const registros =
            resultado.data || [];

        if (!registros.length) {

            historicoLista.innerHTML =
                `<div class="historico-vazio">
                    Nenhuma jornada registrada.
                </div>`;

            return;
        }

        historicoLista.innerHTML = "";

        registros.forEach(
            registro => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "historico-item";

                let status =
                    "Encerrado";

                if (
                    registro.status ===
                    "ativo"
                ) {
                    status = "Ativo";
                }

                if (
                    registro.status ===
                    "pausado"
                ) {
                    status = "Pausado";
                }

                const data =
                    formatarData(
                        registro.entrada ||
                        registro.criado_em
                    );

                const entrada =
                    formatarHora(
                        registro.entrada
                    );

                const saida =
                    formatarHora(
                        registro.saida
                    );

                const duracao =
                    registro.saida
                        ? formatarDuracao(
                            calcularTempoJornada(
                                registro
                            )
                        )
                        : "Em andamento";

                item.innerHTML = `
                    <div class="historico-topo">
                        <strong>
                            ${escaparHTML(data)}
                        </strong>

                        <span class="historico-status ${escaparHTML(registro.status || "")}">
                            ${escaparHTML(status)}
                        </span>
                    </div>

                    <div class="historico-horarios">

                        <div>
                            <small>Entrada</small>
                            <span>
                                ${escaparHTML(entrada)}
                            </span>
                        </div>

                        <div>
                            <small>Saída</small>
                            <span>
                                ${escaparHTML(saida)}
                            </span>
                        </div>

                        <div>
                            <small>Duração</small>
                            <span>
                                ${escaparHTML(duracao)}
                            </span>
                        </div>

                    </div>
                `;

                historicoLista.appendChild(
                    item
                );
            }
        );

    } catch (erro) {

        console.error(
            "Erro no histórico:",
            erro
        );

        historicoLista.innerHTML =
            `<div class="historico-vazio">
                Erro ao carregar histórico.
            </div>`;
    }
        }
    <script>
/* =========================================================
   ABAS
   ========================================================= */

function abrirJornada() {

    tabJornada.classList.add(
        "ativa"
    );

    tabHistorico.classList.remove(
        "ativa"
    );

    secaoJornada.style.display =
        "block";

    secaoHistorico.style.display =
        "none";
}


function abrirHistorico() {

    tabHistorico.classList.add(
        "ativa"
    );

    tabJornada.classList.remove(
        "ativa"
    );

    secaoHistorico.style.display =
        "block";

    secaoJornada.style.display =
        "none";

    carregarHistorico();
}


/* =========================================================
   EVENTOS
   ========================================================= */

function configurarEventos() {

    btnIniciar.addEventListener(
        "click",
        iniciarJornada
    );

    btnPausa.addEventListener(
        "click",
        pausarOuRetomar
    );

    btnEncerrar.addEventListener(
        "click",
        encerrarJornada
    );

    tabJornada.addEventListener(
        "click",
        abrirJornada
    );

    tabHistorico.addEventListener(
        "click",
        abrirHistorico
    );
}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function inicializar() {

    if (estado.inicializado) {
        return;
    }

    estado.inicializado = true;

    pegarElementos();

    /*
     * Mostra os dados básicos imediatamente.
     */

    nomeUsuario.textContent =
        NOME_USUARIO;

    passaporteUsuario.textContent =
        "Passaporte " + PASSAPORTE;

    /*
     * Se o Supabase não carregar,
     * não deixa a tela presa.
     */

    const supabaseOK =
        iniciarSupabase();

    if (!supabaseOK) {

        esconderLoading();

        mostrarMensagem(
            "Não foi possível conectar ao sistema.",
            "erro"
        );

        return;
    }

    configurarEventos();

    /*
     * A página não fica presa no loading
     * esperando indefinidamente o Supabase.
     */

    const carregamento =
        Promise.all([
            carregarJornadaAtual(),
            carregarHistorico()
        ]);

    const limite =
        new Promise(resolve => {

            setTimeout(
                resolve,
                3000
            );

        });

    await Promise.race([
        carregamento,
        limite
    ]);

    abrirJornada();

    atualizarTela();

    esconderLoading();
}


/* =========================================================
   DOM READY
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        inicializar,
        {
            once: true
        }
    );

} else {

    inicializar();
}


/* =========================================================
   GARANTIA EXTRA
   ========================================================= */

window.addEventListener(
    "load",
    () => {

        if (
            !estado.inicializado
        ) {
            inicializar();
        }
    },
    {
        once: true
    }
);


/* =========================================================
   LIMPEZA
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        pararCronometro();

    }
);
</script>
