/* LOADING */

#loading{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#08090d;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .25s ease,visibility .25s ease;
}

#loading.oculto{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.loading-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}

.loading-spinner{
    width:38px;
    height:38px;
    border:3px solid #292b32;
    border-top-color:#e21b23;
    border-radius:50%;
    animation:girar .8s linear infinite;
}

.loading-text{
    color:#888b94;
    font-size:13px;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

/* HEADER */

.topo{
    position:sticky;

/* MAIN */

.container{

/* USUÁRIO */

.usuario-card{

}

.usuario-avatar{

    border:1px solid #2b2d35;

.usuario-info{

.usuario-nome{

.usuario-passaporte{

.status-topo{

.status-label{

}

}

.status-badge::before{
    content:"";

    height:7px;

    background:#6b6e77;
}

.status-badge.ativo{
    color:#6ee7a0;
}

.status-badge.ativo::before{
    background:#38d978;
}

.status-badge.pausado{
    color:#f3c76d;
}

.status-badge.pausado::before{
    background:#e9ae3b;

.status-badge.encerrado{

/* =========================================================
   MENSAGEM
   ========================================================= */

function mensagem(texto, tipo) {

    const antiga =
        document.querySelector(
            ".mensagem-temporaria"
        );

    if (antiga) {
        antiga.remove();
    }

    const elemento =
        document.createElement("div");

    elemento.className =
        "mensagem-temporaria " +
        (tipo || "");

    elemento.textContent =
        texto;

    document.body.appendChild(
        elemento
    );

    setTimeout(() => {

        if (elemento.parentNode) {
            elemento.remove();
        }

    }, 2800);
}


/* =========================================================
   DATA / HORA
   ========================================================= */

function hora(valor) {

    if (!valor) {
        return "--:--";
    }

    const data =
        new Date(valor);

    if (
        Number.isNaN(
            data.getTime()
        )
    ) {
        return "--:--";
    }

    return data.toLocaleTimeString(
        "pt-BR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function dataFormatada(valor) {

    if (!valor) {
        return "--/--/----";
    }

    const data =
        new Date(valor);

    if (
        Number.isNaN(
            data.getTime()
        )
    ) {
        return "--/--/----";
    }

    return data.toLocaleDateString(
        "pt-BR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );
}


/* =========================================================
   DURAÇÃO
   ========================================================= */

function duracaoFormatada(ms) {

    if (
        !ms ||
        ms < 0 ||
        Number.isNaN(ms)
    ) {
        ms = 0;
    }

    let segundos =
        Math.floor(ms / 1000);

    const horas =
        Math.floor(
            segundos / 3600
        );

    segundos =
        segundos % 3600;

    const minutos =
        Math.floor(
            segundos / 60
        );

    segundos =
        segundos % 60;

    return (
        String(horas).padStart(2,"0") +
        ":" +
        String(minutos).padStart(2,"0") +
        ":" +
        String(segundos).padStart(2,"0")
    );
}
    <script>
/* =========================================================
   CALCULAR JORNADA
   ========================================================= */

function calcularJornada(registro) {

    if (
        !registro ||
        !registro.entrada
    ) {
        return 0;
    }

    const entrada =
        new Date(
            registro.entrada
        );

    const fim =
        registro.saida
            ? new Date(
                registro.saida
            )
            : new Date();

    let total =
        fim.getTime() -
        entrada.getTime();

    /*
     * Desconta a pausa.
     */

    if (registro.pausa_inicio) {

        const inicioPausa =
            new Date(
                registro.pausa_inicio
            );

        let fimPausa = null;

        if (registro.pausa_fim) {

            fimPausa =
                new Date(
                    registro.pausa_fim
                );

        } else if (
            registro.status === "pausado"
        ) {

            fimPausa =
                new Date();
        }

        if (fimPausa) {

            const tempoPausa =
                fimPausa.getTime() -
                inicioPausa.getTime();

            if (tempoPausa > 0) {
                total -= tempoPausa;
            }
        }
    }

    return Math.max(
        0,
        total
    );
}


/* =========================================================
   ATUALIZAR STATUS
   ========================================================= */

function atualizarStatus() {

    statusBadge.classList.remove(
        "ativo",
        "pausado",
        "inativo"
    );

    if (!registroAtual) {

        statusBadge.classList.add(
            "inativo"
        );

        statusTexto.textContent =
            "Fora de jornada";

        return;
    }

    if (
        registroAtual.status ===
        "ativo"
    ) {

        statusBadge.classList.add(
            "ativo"
        );

        statusTexto.textContent =
            "Jornada ativa";

        return;
    }

    if (
        registroAtual.status ===
        "pausado"
    ) {

        statusBadge.classList.add(
            "pausado"
        );

        statusTexto.textContent =
            "Jornada pausada";

        return;
    }

    statusTexto.textContent =
        "Fora de jornada";
}


/* =========================================================
   ATUALIZAR INFORMAÇÕES
   ========================================================= */

function atualizarInformacoes() {

    if (!registroAtual) {

        tempoJornada.textContent =
            "00:00:00";

        entradaInfo.textContent =
            "--:--";

        pausaInfo.textContent =
            "Sem pausa";

        return;
    }

    tempoJornada.textContent =
        duracaoFormatada(
            calcularJornada(
                registroAtual
            )
        );

    entradaInfo.textContent =
        hora(
            registroAtual.entrada
        );

    if (
        registroAtual.pausa_inicio &&
        registroAtual.pausa_fim
    ) {

        pausaInfo.textContent =
            hora(
                registroAtual.pausa_inicio
            ) +
            " - " +
            hora(
                registroAtual.pausa_fim
            );

    } else if (
        registroAtual.pausa_inicio
    ) {

        pausaInfo.textContent =
            hora(
                registroAtual.pausa_inicio
            ) +
            " - em pausa";

    } else {

        pausaInfo.textContent =
            "Sem pausa";
    }
}


/* =========================================================
   ATUALIZAR BOTÕES
   ========================================================= */

function atualizarBotoes() {

    if (!registroAtual) {

        btnIniciar.style.display =
            "flex";

        btnPausa.style.display =
            "none";

        btnEncerrar.style.display =
            "none";

        btnIniciar.disabled =
            false;

        btnIniciar.textContent =
            "Iniciar Jornada";

        return;
    }

    btnIniciar.style.display =
        "none";

    btnPausa.style.display =
        "flex";

    btnEncerrar.style.display =
        "flex";

    btnPausa.disabled =
        false;

    btnEncerrar.disabled =
        false;

    if (
        registroAtual.status ===
        "pausado"
    ) {

        btnPausa.textContent =
            "▶ Retomar Jornada";

    } else {

        btnPausa.textContent =
            "Ⅱ Pausar Jornada";
    }
}


/* =========================================================
   ATUALIZAR TELA
   ========================================================= */

function atualizarTela() {

    atualizarStatus();

    atualizarInformacoes();

    atualizarBotoes();

    if (registroAtual) {

        iniciarCronometro();

    } else {

        pararCronometro();
    }
}


/* =========================================================
   CRONÔMETRO
   ========================================================= */

function iniciarCronometro() {

    pararCronometro();

    intervaloCronometro =
        setInterval(
            atualizarInformacoes,
            1000
        );
}


function pararCronometro() {

    if (
        intervaloCronometro
    ) {

        clearInterval(
            intervaloCronometro
        );

        intervaloCronometro =
            null;
    }
}


/* =========================================================
   CARREGAR JORNADA
   ========================================================= */

async function carregarJornada() {

    try {

        const resposta =
            await clienteSupabase
                .from("pontos")
                .select("*")
                .eq(
                    "passaporte",
                    PASSAPORTE
                )
                .in(
                    "status",
                    [
                        "ativo",
                        "pausado"
                    ]
                )
                .is(
                    "saida",
                    null
                )
                .order(
                    "criado_em",
                    {
                        ascending:false
                    }
                )
                .limit(1);

        if (resposta.error) {

            console.error(
                resposta.error
            );

            return;
        }

        if (
            resposta.data &&
            resposta.data.length
        ) {

            registroAtual =
                resposta.data[0];

        } else {

            registroAtual =
                null;
        }

        atualizarTela();

    } catch (erro) {

        console.error(
            erro
        );
    }
    }
    <script>
/* =========================================================
   INICIAR JORNADA
   ========================================================= */

async function iniciarJornada() {

    if (processando) {
        return;
    }

    if (!clienteSupabase) {

        mensagem(
            "Sistema ainda não conectado.",
            "erro"
        );

        return;
    }

    processando = true;

    btnIniciar.disabled =
        true;

    btnIniciar.textContent =
        "Iniciando...";

    try {

        const agora =
            new Date().toISOString();

        const novoPonto = {

            passaporte:
                PASSAPORTE,

            entrada:
                agora,

            pausa_inicio:
                null,

            pausa_fim:
                null,

            saida:
                null,

            status:
                "ativo"
        };

        const resposta =
            await clienteSupabase
                .from("pontos")
                .insert(
                    [novoPonto]
                )
                .select()
                .single();

        if (resposta.error) {

            console.error(
                "SUPABASE:",
                resposta.error
            );

            mensagem(
                "Erro ao iniciar o ponto.",
                "erro"
            );

            btnIniciar.disabled =
                false;

            btnIniciar.textContent =
                "Iniciar Jornada";

            return;
        }

        registroAtual =
            resposta.data;

        atualizarTela();

        mensagem(
            "Jornada iniciada!",
            "sucesso"
        );

        /*
         * REDIRECIONA PARA EQUIPE
         */

        setTimeout(
            function(){

                window.location.href =
                    "equipe.html";

            },
            500
        );

    } catch (erro) {

        console.error(
            erro
        );

        mensagem(
            "Erro de conexão.",
            "erro"
        );

        btnIniciar.disabled =
            false;

        btnIniciar.textContent =
            "Iniciar Jornada";

    } finally {

        processando =
            false;
    }
}


/* =========================================================
   PAUSAR / RETOMAR
   ========================================================= */

async function pausarOuRetomar() {

    if (
        processando ||
        !registroAtual
    ) {
        return;
    }

    processando = true;

    btnPausa.disabled =
        true;

    btnPausa.textContent =
        "Processando...";

    try {

        const agora =
            new Date().toISOString();

        let alteracao = null;

        if (
            registroAtual.status ===
            "ativo"
        ) {

            alteracao = {

                status:
                    "pausado",

                pausa_inicio:
                    agora
            };

        } else if (
            registroAtual.status ===
            "pausado"
        ) {

            alteracao = {

                status:
                    "ativo",

                pausa_fim:
                    agora
            };

        } else {

            mensagem(
                "Essa jornada já foi encerrada.",
                "erro"
            );

            return;
        }

        const resposta =
            await clienteSupabase
                .from("pontos")
                .update(
                    alteracao
                )
                .eq(
                    "id",
                    registroAtual.id
                )
                .select()
                .single();

        if (resposta.error) {

            console.error(
                resposta.error
            );

            mensagem(
                "Não foi possível atualizar.",
                "erro"
            );

            return;
        }

        registroAtual =
            resposta.data;

        atualizarTela();

        mensagem(
            registroAtual.status ===
            "pausado"
                ? "Jornada pausada."
                : "Jornada retomada.",
            "sucesso"
        );

    } catch (erro) {

        console.error(
            erro
        );

        mensagem(
            "Erro de conexão.",
            "erro"
        );

    } finally {

        processando =
            false;

        atualizarBotoes();
    }
}


/* =========================================================
   ENCERRAR
   ========================================================= */

async function encerrarJornada() {

    if (
        processando ||
        !registroAtual
    ) {
        return;
    }

    const confirmar =
        window.confirm(
            "Deseja realmente encerrar sua jornada?"
        );

    if (!confirmar) {
        return;
    }

    processando = true;

    btnEncerrar.disabled =
        true;

    btnEncerrar.textContent =
        "Encerrando...";

    try {

        const agora =
            new Date().toISOString();

        const alteracao = {

            saida:
                agora,

            status:
                "encerrado"
        };

        if (
            registroAtual.status ===
            "pausado" &&
            registroAtual.pausa_inicio &&
            !registroAtual.pausa_fim
        ) {

            alteracao.pausa_fim =
                agora;
        }

        const resposta =
            await clienteSupabase
                .from("pontos")
                .update(
                    alteracao
                )
                .eq(
                    "id",
                    registroAtual.id
                )
                .select()
                .single();

        if (resposta.error) {

            console.error(
                resposta.error
            );

            mensagem(
                "Não foi possível encerrar.",
                "erro"
            );

            return;
        }

        registroAtual =
            null;

        pararCronometro();

        atualizarTela();

        mensagem(
            "Jornada encerrada.",
            "sucesso"
        );

        carregarHistorico();

    } catch (erro) {

        console.error(
            erro
        );

        mensagem(
            "Erro de conexão.",
            "erro"
        );

    } finally {

        processando =
            false;

        atualizarBotoes();
    }
}


/* =========================================================
   HISTÓRICO
   ========================================================= */

async function carregarHistorico() {

    if (!historicoLista) {
        return;
    }

    try {

        const resposta =
            await clienteSupabase
                .from("pontos")
                .select("*")
                .eq(
                    "passaporte",
                    PASSAPORTE
                )
                .order(
                    "criado_em",
                    {
                        ascending:false
                    }
                )
                .limit(20);

        if (resposta.error) {

            console.error(
                resposta.error
            );

            historicoLista.innerHTML =
                `<div class="historico-vazio">
                    Não foi possível carregar o histórico.
                </div>`;

            return;
        }

        const registros =
            resposta.data || [];

        if (!registros.length) {

            historicoLista.innerHTML =
                `<div class="historico-vazio">
                    Nenhuma jornada registrada.
                </div>`;

            return;
        }

        historicoLista.innerHTML =
            "";

        registros.forEach(
            function(registro){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "historico-item";

                let status =
                    "Encerrado";

                if (
                    registro.status ===
                    "ativo"
                ) {
                    status =
                        "Ativo";
                }

                if (
                    registro.status ===
                    "pausado"
                ) {
                    status =
                        "Pausado";
                }

                const duracao =
                    registro.saida
                        ? duracaoFormatada(
                            calcularJornada(
                                registro
                            )
                        )
                        : "Em andamento";

                item.innerHTML = `

                    <div class="historico-topo">

                        <strong>
                            ${dataFormatada(
                                registro.entrada ||
                                registro.criado_em
                            )}
                        </strong>

                        <span class="historico-status ${registro.status || ""}">
                            ${status}
                        </span>

                    </div>

                    <div class="historico-horarios">

                        <div>
                            <small>Entrada</small>
                            <span>
                                ${hora(
                                    registro.entrada
                                )}
                            </span>
                        </div>

                        <div>
                            <small>Saída</small>
                            <span>
                                ${hora(
                                    registro.saida
                                )}
                            </span>
                        </div>

                        <div>
                            <small>Duração</small>
                            <span>
                                ${duracao}
                            </span>
                        </div>

                    </div>
                `;

                historicoLista.appendChild(
                    item
                );
            }
        );

    } catch (erro) {

        console.error(
            erro
        );

        historicoLista.innerHTML =
            `<div class="historico-vazio">
                Erro ao carregar histórico.
            </div>`;
    }
    }
    <script>
/* =========================================================
   ABAS
   ========================================================= */

tabJornada.addEventListener(
    "click",
    function(){

        tabJornada.classList.add(
            "ativa"
        );

        tabHistorico.classList.remove(
            "ativa"
        );

        secaoJornada.classList.remove(
            "secao-escondida"
        );

        secaoHistorico.classList.add(
            "secao-escondida"
        );
    }
);


tabHistorico.addEventListener(
    "click",
    function(){

        tabHistorico.classList.add(
            "ativa"
        );

        tabJornada.classList.remove(
            "ativa"
        );

        secaoHistorico.classList.remove(
            "secao-escondida"
        );

        secaoJornada.classList.add(
            "secao-escondida"
        );

        carregarHistorico();
    }
);


/* =========================================================
   BOTÕES
   ========================================================= */

btnIniciar.addEventListener(
    "click",
    iniciarJornada
);

btnPausa.addEventListener(
    "click",
    pausarOuRetomar
);

btnEncerrar.addEventListener(
    "click",
    encerrarJornada
);


/* =========================================================
   INICIAR SUPABASE
   ========================================================= */

function iniciarSistema() {

    /*
     * A página já está visível.
     * Se o CDN não carregar, nada fica
     * cobrindo a tela.
     */

    if (
        !window.supabase ||
        typeof window.supabase.createClient !==
        "function"
    ) {

        console.error(
            "Supabase JS não carregou."
        );

        mensagem(
            "Biblioteca do sistema não carregou.",
            "erro"
        );

        return;
    }

    try {

        clienteSupabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );

        carregarJornada();

        carregarHistorico();

    } catch (erro) {

        console.error(
            "Erro ao iniciar Supabase:",
            erro
        );

        mensagem(
            "Erro ao conectar ao sistema.",
            "erro"
        );
    }
}


/* =========================================================
   EXECUTAR
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        iniciarSistema,
        {
            once:true
        }
    );

} else {

    iniciarSistema();
}


/* =========================================================
   SE A PÁGINA VOLTAR DO CACHE
   ========================================================= */

window.addEventListener(
    "pageshow",
    function(){

        if (
            clienteSupabase &&
            !registroAtual
        ) {
            carregarJornada();
        }
    }
);


/* =========================================================
   LIMPAR CRONÔMETRO
   ========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        pararCronometro();

    }
);

</script>
