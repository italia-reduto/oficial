<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090d">
    <title>Meu Ponto · Organização Itália</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #08090d;
            --bg2: #0d0f14;
            --card: #12151b;
            --card2: #171a21;
            --border: rgba(255,255,255,.07);
            --text: #f5f5f5;
            --muted: #8b929f;
            --muted2: #5d6470;
            --red: #e11d48;
            --red2: #fb365d;
            --green: #22c55e;
            --yellow: #f59e0b;
            --blue: #3b82f6;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top right, rgba(225,29,72,.07), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            padding-bottom: 90px;
        }

        button {
            font-family: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: rgba(8,9,13,.88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(225,29,72,.12);
            color: var(--red2);
            border: 1px solid rgba(225,29,72,.18);
        }

        .brand-text strong {
            display: block;
            font-size: 14px;
            font-weight: 800;
        }

        .brand-text span {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .notification {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .container {
            width: min(900px, calc(100% - 28px));
            margin: 0 auto;
            padding-top: 22px;
        }

        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 15px;
            background: linear-gradient(145deg, #242832, #111319);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
        }

        .profile h2 {
            font-size: 15px;
            font-weight: 800;
        }

        .profile p {
            color: var(--muted);
            font-size: 11px;
            margin-top: 4px;
        }

        .back-btn {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            width: 42px;
            height: 42px;
            border-radius: 13px;
            cursor: pointer;
        }

        .title {
            margin: 25px 0 16px;
        }

        .title h1 {
            font-size: 27px;
            letter-spacing: -.8px;
        }

        .title p {
            margin-top: 6px;
            color: var(--muted);
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 15px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 9px;
        }

        .stat-value {
            font-size: 17px;
            font-weight: 800;
        }

        .status-active {
            color: var(--green);
        }

        .status-paused {
            color: var(--yellow);
        }

        .tabs {
            display: flex;
            gap: 6px;
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 14px;
            margin: 16px 0;
        }

        .tab {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 11px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .tab.active {
            background: var(--card2);
            color: #fff;
        }

        .clock-card {
            background:
                radial-gradient(circle at top right, rgba(225,29,72,.13), transparent 38%),
                var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            margin-bottom: 14px;
        }

        .clock-label {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .timer {
            font-size: clamp(42px, 12vw, 70px);
            font-weight: 800;
            letter-spacing: -2px;
            margin: 10px 0 18px;
            font-variant-numeric: tabular-nums;
        }

        .markers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }

        .marker {
            background: rgba(255,255,255,.025);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 11px 5px;
        }

        .marker span {
            display: block;
            color: var(--muted);
            font-size: 9px;
            margin-bottom: 5px;
        }

        .marker strong {
            display: block;
            font-size: 11px;
        }

        .main-btn {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 15px;
            color: white;
            background: var(--red);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: .2s;
        }

        .main-btn:hover {
            background: var(--red2);
        }

        .main-btn.pause {
            background: var(--yellow);
            color: #17120a;
        }

        .main-btn.resume {
            background: var(--green);
            color: #06130a;
        }

        .secondary-btn {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--card2);
            color: white;
            border-radius: 15px;
            padding: 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            margin-top: 9px;
        }

        .team-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            margin-top: 14px;
        }

        .team-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .team-title {
            display: flex;
            gap: 11px;
            align-items: center;
        }

        .team-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: rgba(59,130,246,.12);
            color: #60a5fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team-title h3 {
            font-size: 14px;
        }

        .team-title p {
            font-size: 10px;
            color: var(--muted);
            margin-top: 4px;
        }

        .team-badge {
            border-radius: 999px;
            padding: 6px 9px;
            background: rgba(34,197,94,.1);
            color: var(--green);
            font-size: 9px;
            font-weight: 800;
            white-space: nowrap;
        }

        .team-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .team-info-box {
            background: rgba(255,255,255,.025);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
        }

        .team-info-box span {
            display: block;
            color: var(--muted2);
            font-size: 9px;
            margin-bottom: 4px;
        }

        .team-info-box strong {
            font-size: 11px;
        }

        .members-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 14px 0 9px;
        }

        .members-title strong {
            font-size: 12px;
        }

        .members-title span {
            color: var(--muted);
            font-size: 10px;
        }

        .member {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 0;
            border-top: 1px solid var(--border);
        }

        .member-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: #1c2028;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
        }

        .member-name {
            font-size: 11px;
            font-weight: 700;
        }

        .member-pass {
            font-size: 9px;
            color: var(--muted);
            margin-top: 3px;
        }

        .member-status {
            font-size: 9px;
            font-weight: 700;
        }

        .empty-team {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            padding: 18px 0 8px;
        }

        .history {
            display: none;
        }

        .history.active {
            display: block;
        }

        .journey.active {
            display: block;
        }

        .journey.hidden {
            display: none;
        }

        .history-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 15px;
            margin-bottom: 9px;
        }

        .history-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .history-date {
            font-size: 12px;
            font-weight: 800;
        }

        .history-status {
            color: var(--green);
            font-size: 9px;
            font-weight: 800;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .history-grid div {
            background: rgba(255,255,255,.025);
            border-radius: 10px;
            padding: 9px;
        }

        .history-grid span {
            display: block;
            color: var(--muted2);
            font-size: 8px;
            margin-bottom: 4px;
        }

        .history-grid strong {
            font-size: 10px;
        }

        .loading {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            padding: 20px;
        }

        .error {
            background: rgba(225,29,72,.08);
            border: 1px solid rgba(225,29,72,.2);
            color: #ff718e;
            border-radius: 14px;
            padding: 12px;
            font-size: 11px;
            margin-bottom: 12px;
            display: none;
        }

        .cooldown {
            color: var(--yellow);
            text-align: center;
            font-size: 10px;
            margin-top: 9px;
            display: none;
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(8px);
        }

        .modal-bg.show {
            display: flex;
        }

        .modal {
            width: min(390px, 100%);
            background: #111318;
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 22px;
        }

        .modal h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .modal p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 18px;
        }

        .modal-actions button {
            padding: 13px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-actions .danger {
            background: var(--red);
            border-color: var(--red);
        }

        .bottom-nav {
            position: fixed;
            z-index: 30;
            left: 12px;
            right: 12px;
            bottom: 12px;
            height: 66px;
            border-radius: 21px;
            background: rgba(18,21,27,.94);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 5px;
        }

        .nav-item {
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 16px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-item i {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            background: rgba(225,29,72,.1);
            color: var(--red2);
        }

        @media (min-width: 700px) {
            .stats {
                grid-template-columns: repeat(4, 1fr);
            }

            .bottom-nav {
                width: 520px;
                left: 50%;
                right: auto;
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-flag"></i>
        </div>

        <div class="brand-text">
            <strong>ORGANIZAÇÃO ITÁLIA</strong>
            <span>Sistema de Controle</span>
        </div>
    </div>

    <button class="notification" onclick="mostrarAviso()">
        <i class="fa-regular fa-bell"></i>
    </button>
</header>

<main class="container">

    <div id="erro" class="error"></div>

    <section class="profile">
        <div class="profile-left">
            <div class="avatar" id="avatar">F</div>

            <div>
                <h2 id="nomeUsuario">Falcão</h2>
                <p>Passaporte: <span id="passaporteUsuario">17274</span> · Ponto</p>
            </div>
        </div>

        <button class="back-btn" onclick="location.href='painel.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </section>

    <section class="title">
        <h1>Meu Ponto</h1>
        <p>Controle sua jornada e acompanhe sua equipe.</p>
    </section>

    <section class="stats">

        <div class="stat">
            <div class="stat-label">Meu Status</div>
            <div class="stat-value" id="statusTexto">Offline</div>
        </div>

        <div class="stat">
            <div class="stat-label">Pausas</div>
            <div class="stat-value" id="pausasTexto">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Entrada</div>
            <div class="stat-value" id="entradaTexto">--:--</div>
        </div>

        <div class="stat">
            <div class="stat-label">Equipe</div>
            <div class="stat-value" id="equipeTexto">--</div>
        </div>

    </section>

    <div class="tabs">

        <button class="tab active" id="tabJornada">
            Minha Jornada
        </button>

        <button class="tab" id="tabHistorico">
            Meu Histórico
        </button>

    </div>

    <section id="jornada" class="journey active">

        <div class="clock-card">

            <div class="clock-label">Tempo em serviço</div>

            <div class="timer" id="timer">
                00:00:00
            </div>

            <div class="markers">

                <div class="marker">
                    <span>ENTRADA</span>
                    <strong id="marcadorEntrada">--:--</strong>
                </div>

                <div class="marker">
                    <span>ÚLTIMA PAUSA</span>
                    <strong id="marcadorPausa">--:--</strong>
                </div>

                <div class="marker">
                    <span>SAÍDA</span>
                    <strong id="marcadorSaida">--:--</strong>
                </div>

            </div>

            <button class="main-btn" id="btnPrincipal">
                <i class="fa-solid fa-play"></i>
                Iniciar Jornada
            </button>

            <button class="secondary-btn" id="btnEncerrar" style="display:none;">
                <i class="fa-solid fa-stop"></i>
                Encerrar Jornada
            </button>

        </div>

        <div id="teamArea"></div>

    </section>

    <section id="historico" class="history">
        <div id="historicoLista">
            <div class="loading">
                Carregando histórico...
            </div>
        </div>
    </section>

</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='painel.html'">
        <i class="fa-solid fa-house"></i>
        Início
    </button>
    <button class="nav-item active">
        <i class="fa-solid fa-clock"></i>
        Ponto
    </button>
    <button class="nav-item" onclick="location.href='registros.html'">
        <i class="fa-solid fa-folder-open"></i>
