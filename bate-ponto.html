<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ponto | Itália</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#000;
    --card:#0c1017;
    --inner:#111722;
    --line:#1e2636;
    --azul:#3b82f6;
    --amarelo:#f59e0b;
    --verde:#22c55e;
    --vermelho:#ef4444;
    --txt:#f1f5f9;
    --mut:#8b95a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{
    background:linear-gradient(to bottom,#000000 0%,#000000 35%,#1e3a5f 75%,#0f172a 100%);
    min-height:100%;
  }
  body{
    font-family:'Inter',sans-serif;color:var(--txt);
    background:transparent;
    min-height:100vh;
    padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px));
    max-width:560px;margin:0 auto;
  }
  a{text-decoration:none;color:inherit}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:24px 20px;text-align:center;margin-top:40px;
  }
  .card h1{font-size:26px;font-weight:800;margin-bottom:8px}
  .card p{font-size:14px;color:var(--mut);margin-bottom:24px;line-height:1.5}

  .relogio{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;margin:16px 0}
  .data{font-size:15px;color:var(--mut);margin-bottom:24px}

  .btn{
    width:100%;border:0;border-radius:14px;
    font-family:'Inter',sans-serif;font-size:16px;font-weight:700;
    padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    transition:transform .1s,filter .1s;
  }
  .btn:active{transform:scale(.98)}
  .btn.entrada{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;margin-bottom:12px}
  .btn.pausa{background:var(--amarelo);color:#111;margin-bottom:12px}
  .btn.saida{background:var(--vermelho);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  .status{
    display:inline-flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;margin-bottom:20px;
  }
  .status.fora{background:rgba(239,68,68,.1);color:var(--vermelho);border:1px solid rgba(239,68,68,.3)}
  .status.dentro{background:rgba(34,197,94,.1);color:var(--verde);border:1px solid rgba(34,197,94,.3)}
  .status.pausa{background:rgba(245,158,11,.1);color:var(--amarelo);border:1px solid rgba(245,158,11,.3)}
  .status i{font-size:10px}

  .info{
    background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px;text-align:left;
  }
  .info-linha{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
  .info-linha span:first-child{color:var(--mut)}

  .historico{margin-top:24px;text-align:left}
  .historico h3{font-size:16px;font-weight:700;margin-bottom:12px}
  .item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-radius:10px;background:var(--inner);border:1px solid var(--line);margin-bottom:8px;font-size:13px;
  }
  .item .tipo{font-weight:600}
  .item .entrada{color:var(--verde)}
  .item .saida{color:var(--vermelho)}
  .item .pausa{color:var(--amarelo)}

  .nav{
    position:fixed;left:0;right:0;bottom:0;
    background:#07090d;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:10;
  }
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mut);padding:6px 0}
  .nav a i{font-size:19px}
  .nav a.ativo{color:var(--azul)}

  .passaporte{
    background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .passaporte span{font-size:14px;color:var(--mut)}
  .passaporte strong{font-size:16px;font-weight:700;color:var(--azul)}

  @media (min-width:900px){
    body{padding:40px 24px 100px}
    .card{max-width:480px;margin:60px auto 0;padding:32px 28px}
    .relogio{font-size:64px}
    .nav{
      left:50%;right:auto;width:min(520px,calc(100% - 48px));transform:translateX(-50%);
      bottom:20px;border:1px solid var(--line);border-radius:20px;padding:10px 8px;
    }
  }
</style>
</head>
<body>
    <div class="card">
  <h1>Controle de Ponto</h1>
  <p>Itália · Reduto</p>

  <div class="passaporte">
    <span>Passaporte</span>
    <strong id="passaporte-valor">—</strong>
  </div>

  <div id="status" class="status fora">
    <i class="fa-solid fa-circle"></i>
    <span>Fora de serviço</span>
  </div>

  <div class="relogio" id="relogio">00:00:00</div>
  <div class="data" id="data"></div>

  <button class="btn entrada" id="btnEntrada" onclick="registrarEntrada()">
    <i class="fa-solid fa-right-to-bracket"></i> Bater Entrada
  </button>
  <button class="btn pausa" id="btnPausa" onclick="registrarPausa()" disabled>
    <i class="fa-solid fa-pause"></i> Pausar
  </button>
  <button class="btn saida" id="btnSaida" onclick="registrarSaida()" disabled>
    <i class="fa-solid fa-right-from-bracket"></i> Bater Saída
  </button>

  <div class="info">
    <div class="info-linha">
      <span>Entrada</span>
      <span id="info-entrada">—</span>
    </div>
    <div class="info-linha">
      <span>Tempo em serviço</span>
      <span id="info-tempo">—</span>
    </div>
    <div class="info-linha">
      <span>Próxima saída</span>
      <span>—</span>
    </div>
  </div>

  <div class="historico">
    <h3>Últimos registros</h3>
    <div id="lista-historico">
      <p style="color:var(--mut);font-size:14px;text-align:center;padding:10px">Nenhum registro hoje</p>
    </div>
  </div>
</div>

<nav class="nav">
  <a href="painel.html"><i class="fa-solid fa-house"></i><span>Painel</span></a>
  <a href="bate-ponto.html" class="ativo"><i class="fa-solid fa-clock"></i><span>Ponto</span></a>
  <a href="equipe.html"><i class="fa-solid fa-users"></i><span>Equipe</span></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://vclwmikzmnuqfdxobtik.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let passaporte = null;
let pontoAtivo = null;
let intervaloRelogio = null;
let intervaloTempo = null;
    /* ---------- SESSÃO ---------- */
function achar(o, d){
  if(!o || typeof o !== 'object' || d > 3) return null;
  if(o.passaporte !== undefined && o.passaporte !== null && String(o.passaporte).trim() !== '') return o;
  for(const k in o){
    const r = achar(o[k], d + 1);
    if(r) return r;
  }
  return null;
}
function extrair(chave, valor){
  if(/^sb-/.test(chave)) return null;
  try{
    const o = JSON.parse(valor);
    if(o && typeof o === 'object'){
      const f = achar(o, 0);
      if(f) return f;
    } else if(/passaporte/i.test(chave) && typeof valor === 'string' && valor.trim()){
      return { passaporte: valor.trim() };
    }
  }catch(e){
    if(/passaporte/i.test(chave) && valor.trim() && valor.length < 40){
      return { passaporte: valor.trim() };
    }
  }
  return null;
}
function lerSessao(){
  const lojas = [window.localStorage, window.sessionStorage];
  for(const loja of lojas){
    try{
      for(let i = 0; i < loja.length; i++){
        const k = loja.key(i);
        const v = loja.getItem(k);
        if(!v) continue;
        const s = extrair(k, v);
        if(s) return s;
      }
    }catch(e){}
  }
  return null;
}

/* ---------- UTILITÁRIOS ---------- */
function dois(n){ return String(n).padStart(2, '0'); }
function formatarHora(d = new Date()){ return dois(d.getHours()) + ':' + dois(d.getMinutes()) + ':' + dois(d.getSeconds()); }
function formatarData(d = new Date()){ return dois(d.getDate()) + '/' + dois(d.getMonth() + 1) + '/' + d.getFullYear(); }
function formatarDuracao(ms){
  if(!ms) return '00:00:00';
  const s = Math.floor(ms / 1000);
  return dois(Math.floor(s / 3600)) + ':' + dois(Math.floor((s % 3600) / 60)) + ':' + dois(s % 60);
}
function msEmServico(){
  if(!pontoAtivo || !pontoAtivo.entrada) return 0;
  let ms = Date.now() - new Date(pontoAtivo.entrada).getTime();
  if(pontoAtivo.pausa_inicio && !pontoAtivo.pausa_fim){
    ms -= Date.now() - new Date(pontoAtivo.pausa_inicio).getTime();
  }
  return Math.max(ms, 0);
}

/* ---------- RELÓGIO ---------- */
function atualizarRelogio(){
  document.getElementById('relogio').textContent = formatarHora();
  document.getElementById('data').textContent = formatarData();
}

/* ---------- ATUALIZAR TELA ---------- */
function atualizarTela(){
  const statusEl = document.getElementById('status');
  const btnEntrada = document.getElementById('btnEntrada');
  const btnPausa = document.getElementById('btnPausa');
  const btnSaida = document.getElementById('btnSaida');
  const infoEntrada = document.getElementById('info-entrada');
  const infoTempo = document.getElementById('info-tempo');

  if(!pontoAtivo){
    statusEl.className = 'status fora';
    statusEl.innerHTML = '<i class="fa-solid fa-circle"></i><span>Fora de serviço</span>';
    btnEntrada.disabled = false;
    btnPausa.disabled = true;
    btnSaida.disabled = true;
    infoEntrada.textContent = '—';
    infoTempo.textContent = '—';
  }else if(pontoAtivo.pausa_inicio && !pontoAtivo.pausa_fim){
    statusEl.className = 'status pausa';
    statusEl.innerHTML = '<i class="fa-solid fa-circle"></i><span>Em pausa</span>';
    btnEntrada.disabled = true;
    btnPausa.innerHTML = '<i class="fa-solid fa-play"></i> Retomar';
    btnPausa.disabled = false;
    btnSaida.disabled = true;
    infoEntrada.textContent = new Date(pontoAtivo.entrada).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    infoTempo.textContent = formatarDuracao(msEmServico());
  }else{
    statusEl.className = 'status dentro';
    statusEl.innerHTML = '<i class="fa-solid fa-circle"></i><span>Em serviço</span>';
    btnEntrada.disabled = true;
    btnPausa.innerHTML = '<i class="fa-solid fa-pause"></i> Pausar';
    btnPausa.disabled = false;
    btnSaida.disabled = false;
    infoEntrada.textContent = new Date(pontoAtivo.entrada).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    infoTempo.textContent = formatarDuracao(msEmServico());
  }
}

/* ---------- HISTÓRICO ---------- */
async function carregarHistorico(){
  const hoje = new Date().toISOString().split('T')[0];
  const { data, error } = await sb.from('pontos').select('*')
    .eq('passaporte', passaporte)
    .gte('criado_em', hoje)
    .order('criado_em', { ascending: false })
    .limit(10);

  const lista = document.getElementById('lista-historico');
  if(error || !data || !data.length){
    lista.innerHTML = '<p style="color:var(--mut);font-size:14px;text-align:center;padding:10px">Nenhum registro hoje</p>';
    return;
  }

  lista.innerHTML = data.map(item => {
    const hora = new Date(item.criado_em).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    let tipo = '', classe = '';
    if(item.saida){ tipo = 'Saída'; classe = 'saida'; }
    else if(item.pausa_inicio && !item.pausa_fim){ tipo = 'Pausa'; classe = 'pausa'; }
    else if(item.pausa_fim){ tipo = 'Retorno'; classe = 'entrada'; }
    else{ tipo = 'Entrada'; classe = 'entrada'; }
    return `<div class="item"><span class="tipo ${classe}">${tipo}</span><span>${hora}</span></div>`;
  }).join('');
}

/* ---------- AÇÕES ---------- */
async function registrarEntrada(){
  const nome = prompt('Digite seu nome:');
  if(!nome) return;

  const { data, error } = await sb.from('pontos').insert([{
    passaporte: passaporte,
    nome: nome,
    entrada: new Date().toISOString()
  }]).select();

  if(error){ alert('Erro: ' + error.message); return; }
  pontoAtivo = data[0];
  atualizarTela();
  carregarHistorico();
}

async function registrarPausa(){
  if(!pontoAtivo) return;
  const agora = new Date().toISOString();
  const ehPausando = !pontoAtivo.pausa_inicio;

  const { error } = await sb.from('pontos').update(
    ehPausando ? { pausa_inicio: agora } : { pausa_fim: agora }
  ).eq('id', pontoAtivo.id).select();

  if(error){ alert('Erro: ' + error.message); return; }
  pontoAtivo.pausa_inicio = ehPausando ? agora : (pontoAtivo.pausa_inicio || null);
  pontoAtivo.pausa_fim = ehPausando ? null : agora;
  atualizarTela();
  carregarHistorico();
}

async function registrarSaida(){
  if(!pontoAtivo) return;
  if(!confirm('Confirma bater a saída?')) return;

  const { error } = await sb.from('pontos').update({
    saida: new Date().toISOString()
  }).eq('id', pontoAtivo.id);

  if(error){ alert('Erro: ' + error.message); return; }
  pontoAtivo = null;
  atualizarTela();
  carregarHistorico();
}

/* ---------- INICIALIZAR ---------- */
async function verificarPontoAtivo(){
  const { data, error } = await sb.from('pontos').select('*')
    .eq('passaporte', passaporte)
    .is('saida', null)
    .order('criado_em', { ascending: false })
    .limit(1);

  if(!error && data && data.length) pontoAtivo = data[0];
  atualizarTela();
  carregarHistorico();
}

async function iniciar(){
  const sessao = lerSessao();
  if(!sessao || !sessao.passaporte){
    window.location.replace('login.html');
    return;
  }
  passaporte = sessao.passaporte;
  document.getElementById('passaporte-valor').textContent = passaporte;

  atualizarRelogio();
  intervaloRelogio = setInterval(atualizarRelogio, 1000);
  intervaloTempo = setInterval(atualizarTela, 1000);

  verificarPontoAtivo();
}

iniciar();
</script>
</body>
</html>
