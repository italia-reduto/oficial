<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>ITÁLIA · PONTO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        *:focus, *:focus-visible {
            outline: none !important;
            box-shadow: none !important;
        }
        html, body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        .fundo-pagina {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #000000 0%, #0f172a 50%, #1e293b 100%);
            z-index: -3;
        }
        .fundo-imagem {
            position: fixed; inset: 0;
            background: url("https://wallpapers.com/images/featured/fundo-de-fivem-zt0lohk29h4faehq.jpg") center/cover no-repeat;
            opacity: 0.08; z-index: -1;
        }
        .fundo-degrade {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 60%, rgba(0,0,0,1) 100%);
            z-index: 0;
        }

        .conteudo { position: relative; z-index: 1; padding: 24px; }
        
        .cabecalho {
            display: flex; align-items: flex-start; justify-content: space-between;
            margin-bottom: 28px;
        }
        .titulo-secao {
            margin-bottom: 4px;
        }
        .titulo-secao h1 {
            font-size: 22px; font-weight: 700; color: #fff;
        }
        .titulo-secao p {
            font-size: 13px; color: #94a3b8; margin-bottom: 16px;
        }
        .linha-dado {
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
        }
        .linha-dado i {
            color: #60a5fa; font-size: 16px; width: 20px; text-align: center;
        }
        .linha-dado .rotulo {
            font-size: 14px; color: #94a3b8;
        }
        .linha-dado .valor {
            font-size: 16px; font-weight: 600; color: #fff;
        }
        .botao-sair {
            display: flex; align-items: center; gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5; padding: 10px 14px; border-radius: 10px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.25s ease; white-space: nowrap; user-select: none;
        }
        .botao-sair:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            transform: translateY(-1px);
        }

        .grade-cards {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 14px; margin-bottom: 24px;
        }
        .card {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(96, 165, 250, 0.12);
            border-radius: 14px; padding: 18px 16px;
            backdrop-filter: blur(8px);
        }
        .card-titulo {
            font-size: 13px; color: #94a3b8; font-weight: 500;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
        }
        .card-titulo i { font-size: 14px; color: #60a5fa; }
        .card-valor { 
            font-size: 20px; font-weight: 700; color: #ffffff;
        }

        .card-abas {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(96, 165, 250, 0.12);
            border-radius: 14px; padding: 18px;
            backdrop-filter: blur(8px);
        }
        .navegacao-abas {
            display: flex; gap: 10px; margin-bottom: 20px;
        }
        .aba {
            flex: 1; text-align: center; padding: 10px 0;
            font-size: 15px; font-weight: 500; color: #94a3b8;
            cursor: pointer; border-radius: 10px; transition: all 0.25s ease;
            user-select: none;
        }
        .aba.ativa {
            color: #fff; background: rgba(96, 165, 250, 0.15);
            font-weight: 600;
        }
        .conteudo-aba {
            display: none; min-height: 220px;
        }
        .conteudo-aba.visivel { display: block; }

        .cronometro-bloco { text-align: center; padding: 20px 10px; }
        .tempo-central {
            font-size: 48px; font-weight: 700; color: #fff;
            margin-bottom: 8px; letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }
        .tempo-central .milessimos {
            font-size: 28px; color: #94a3b8;
        }
        .legenda-tempo { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .botoes-cronometro { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 0 auto; }
        .botao-acao {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: all 0.3s ease; color: #fff;
            user-select: none;
        }
        .botao-acao.iniciar { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .botao-acao.pausar { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .botao-acao.retomar { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .botao-acao.encerrar { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .botao-acao:hover { transform: translateY(-2px); }

        .item-historico {
            padding: 14px 0; border-bottom: 1px solid rgba(96,165,250,0.08);
        }
        .item-historico:last-child { border-bottom: none; padding-bottom: 0; }
        .item-cabecalho {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
        }
        .item-data { font-size: 15px; font-weight: 600; color: #fff; }
        .item-duracao { font-size: 15px; font-weight: 700; color: #60a5fa; }
        .item-detalhe { font-size: 13px; color: #94a3b8; line-height: 1.5; }
        .vazio { text-align: center; padding: 40px 20px; color: #64748b; font-size: 14px; }

        .fundo-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
            z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 24px;
        }
        .fundo-modal.aberto { opacity: 1; visibility: visible; }
        .caixa-modal {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid rgba(96,165,250,0.2); border-radius: 18px;
            padding: 32px 28px; max-width: 360px; width: 100%; text-align: center;
            transform: translateY(10px); transition: transform 0.3s ease;
        }
        .fundo-modal.aberto .caixa-modal { transform: translateY(0); }
        .icone-modal {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(239,68,68,0.15); display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .icone-modal i { font-size: 24px; color: #f87171; }
        .titulo-modal { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #fff; }
        .texto-modal { font-size: 15px; color: #94a3b8; margin-bottom: 28px; line-height: 1.5; }
        .botoes-modal { display: flex; gap: 12px; }
        .botao-cancelar {
            flex: 1; padding: 14px; border: 1px solid rgba(96,165,250,0.2);
            background: transparent; color: #94a3b8; border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.25s ease; user-select: none;
        }
        .botao-cancelar:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .botao-confirmar {
            flex: 1; padding: 14px; border: none;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff; border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease; user-select: none;
        }
        .botao-confirmar:hover { transform: translateY(-1px); }

        .barra-menu {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #000; display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid rgba(96,165,250,0.15); z-index: 100;
        }
        .menu-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: #94a3b8; text-decoration: none; font-size: 11px;
            cursor: pointer; transition: color 0.2s ease; user-select: none;
        }
        .menu-item.ativo { color: #60a5fa; }
        .menu-item i { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="fundo-pagina"></div>
    <div class="fundo-imagem"></div>
    <div class="fundo-degrade"></div>

    <div class="conteudo">
        <div class="cabecalho">
            <div>
                <div class="titulo-secao">
                    <h1>Controle de Ponto</h1>
                    <p>Acompanhe sua jornada e seu histórico</p>
                </div>
                <div class="linha-dado">
                    <i class="fas fa-user"></i>
                    <span class="rotulo">Nome:</span>
                    <span class="valor" id="exibeNome">—</span>
                </div>
                <div class="linha-dado">
                    <i class="fas fa-id-card"></i>
                    <span class="rotulo">Passaporte:</span>
                    <span class="valor" id="exibePassaporte">—</span>
                </div>
            </div>
            <button class="botao-sair" id="botaoSair">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>

        <div class="grade-cards">
            <div class="card">
                <p class="card-titulo">Meu Status <i class="fas fa-clock"></i></p>
                <p class="card-valor" id="exibeSituacao">Fora de Serviço</p>
            </div>
            <div class="card">
                <p class="card-titulo">Hoje <i class="fas fa-calendar-day"></i></p>
                <p class="card-valor" id="exibeHoje">0m</p>
            </div>
            <div class="card">
                <p class="card-titulo">Pausas <i class="fas fa-coffee"></i></p>
                <p class="card-valor" id="exibePausas">0</p>
            </div>
            <div class="card">
                <p class="card-titulo">Semana <i class="fas fa-calendar-week"></i></p>
                <p class="card-valor" id="exibeSemana">0m</p>
            </div>
        </div>

        <div class="card-abas">
            <div class="navegacao-abas">
                <div class="aba ativa" data-aba="meu-ponto">Meu Ponto</div>
                <div class="aba" data-aba="historico">Histórico</div>
            </div>

            <div class="conteudo-aba visivel" id="conteudo-meu-ponto">
                <div class="cronometro-bloco">
                    <div class="tempo-central">
                        <span id="tempoPrincipal">00:00:00</span>
                        <span class="milessimos" id="tempoMilesimos">.00</span>
                    </div>
                    <p class="legenda-tempo">Tempo de jornada</p>
                    <div class="botoes-cronometro" id="areaBotoes">
                        <button class="botao-acao iniciar" id="btnIniciar">
                            <i class="fas fa-play"></i> Iniciar Jornada
                        </button>
                    </div>
                </div>
            </div>

            <div class="conteudo-aba" id="conteudo-historico">
                <div id="listaHistorico"></div>
            </div>
        </div>
    </div>

    <div class="fundo-modal" id="modalSair">
        <div class="caixa-modal">
            <div class="icone-modal"><i class="fas fa-question-circle"></i></div>
            <h3 class="titulo-modal">Sair da conta?</h3>
            <p class="texto-modal">Tem certeza que deseja encerrar sua sessão?</p>
            <div class="botoes-modal">
                <button class="botao-cancelar" id="botaoCancelar">Cancelar</button>
                <button class="botao-confirmar" id="botaoConfirmarSaida">Sair</button>
            </div>
        </div>
    </div>

    <nav class="barra-menu">
        <a href="painel.html" class="menu-item"><i class="fas fa-home"></i><span>Painel</span></a>
        <a href="bate-ponto.html" class="menu-item ativo"><i class="fas fa-clock"></i><span>Ponto</span></a>
        <a href="equipe.html" class="menu-item"><i class="fas fa-clipboard-list"></i><span>Equipe</span></a>
        <a href="tickets.html" class="menu-item"><i class="fas fa-file-alt"></i><span>Tickets</span></a>
        <a href="#" class="menu-item"><i class="fas fa-ellipsis-h"></i><span>Mais</span></a>
    </nav>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const exibeNome = document.getElementById('exibeNome');
        const exibePassaporte = document.getElementById('exibePassaporte');
        const exibeSituacao = document.getElementById('exibeSituacao');
        const exibeHoje = document.getElementById('exibeHoje');
        const exibePausas = document.getElementById('exibePausas');
        const tempoPrincipal = document.getElementById('tempoPrincipal');
        const tempoMilesimos = document.getElementById('tempoMilesimos');
        const areaBotoes = document.getElementById('areaBotoes');
        const listaHistorico = document.getElementById('listaHistorico');
        const modalSair = document.getElementById('modalSair');

        function formatarTempoComMilesimos(segundosTotais) {
            const h = Math.floor(segundosTotais / 3600);
            const m = Math.floor((segundosTotais % 3600) / 60);
            const s = Math.floor(segundosTotais % 60);
            const ms = Math.floor((segundosTotais % 1) * 100);
            return {
                principal: `${h}`.padStart(2,'0') + ':' + `${m}`.padStart(2,'0') + ':' + `${s}`.padStart(2,'0'),
                milesimos: '.' + `${ms}`.padStart(2,'0')
            };
        }

        function formatarDuracao(segundos) {
            const h = Math.floor(segundos / 3600);
            const m = Math.floor((segundos % 3600) / 60);
            const s = Math.floor(segundos % 60);
            if (h > 0) {
                return `${h}h${m.toString().padStart(2,'0')}m${s.toString().padStart(2,'0')}s`;
            } else if (m > 0) {
                return `${m}m${s.toString().padStart(2,'0')}s`;
            } else {
                return `${s}s`;
            }
        }

        let estado = {
            emJornada: false,
            inicioJornada: null,
            inicioPausa: null,
            tempoPausadoTotal: 0,
            totalPausas: 0,
            historico: []
        };

        function salvarEstado() {
            localStorage.setItem('ponto_estado', JSON.stringify({
                emJornada: estado.emJornada,
                inicioJornada: estado.inicioJornada?.toISOString() || null,
                inicioPausa: estado.inicioPausa?.toISOString() || null,
                tempoPausadoTotal: estado.tempoPausadoTotal,
                totalPausas: estado.totalPausas,
                historico: estado.historico
            }));
        }

        function carregarEstado() {
            const salvo = localStorage.getItem('ponto_estado');
            if (salvo) {
                const s = JSON.parse(salvo);
                estado.emJornada = s.emJornada;
                estado.inicioJornada = s.inicioJornada ? new Date(s.inicioJornada) : null;
                estado.inicioPausa = s.inicioPausa ? new Date(s.inicioPausa) : null;
                estado.tempoPausadoTotal = s.tempoPausadoTotal || 0;
                estado.totalPausas = s.totalPausas || 0;
                estado.historico = s.historico || [];
            }
        }

        function tempoAtualDecimais() {
            if (!estado.emJornada || !estado.inicioJornada) return 0;
            let decorrido = (Date.now() - estado.inicioJornada.getTime()) / 1000;
            if (estado.inicioPausa) {
                decorrido -= (Date.now() - estado.inicioPausa.getTime()) / 1000;
            } else {
                decorrido -= estado.tempoPausadoTotal;
            }
            return Math.max(0, decorrido);
        }

        function iniciarJornada() {
            estado.emJornada = true;
            estado.inicioJornada = new Date();
            estado.tempoPausadoTotal = 0;
            estado.totalPausas = 0;
            estado.inicioPausa = null;
            salvarEstado();
            atualizarInterface();
        }

        function pausarJornada() {
            estado.inicioPausa = new Date();
            estado.totalPausas++;
            salvarEstado();
            atualizarInterface();
        }

        function retomarJornada() {
            if (estado.inicioPausa) {
                estado.tempoPausadoTotal += (Date.now() - estado.inicioPausa.getTime()) / 1000;
                estado.inicioPausa = null;
            }
            salvarEstado();
            atualizarInterface();
        }

        function encerrarJornada() {
            const duracao = tempoAtualDecimais();
            if (duracao > 0) {
                estado.historico.unshift({
                    data: new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' }).toUpperCase(),
                    dataSimples: new Date().toLocaleDateString('pt-BR'),
                    entrada: estado.inicioJornada.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    saida: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                    duracao: duracao,
                    pausas: estado.totalPausas
                });
            }
            estado.emJornada = false;
            estado.inicioJornada = null;
            estado.inicioPausa = null;
            estado.tempoPausadoTotal = 0;
            salvarEstado();
            atualizarInterface();
            renderizarHistorico();
        }

        function atualizarInterface() {
            if (!estado.emJornada) {
                areaBotoes.innerHTML = `<button class="botao-acao iniciar" id="btnIniciar"><i class="fas fa-play"></i> Iniciar Jornada</button>`;
                exibeSituacao.textContent = 'Fora de Serviço';
                tempoPrincipal.textContent = '00:00:00';
                tempoMilesimos.textContent = '.00';
                exibeHoje.textContent = '0m';
                document.getElementById('btnIniciar').addEventListener('click', iniciarJornada);
            } else if (!estado.inicioPausa) {
                areaBotoes.innerHTML = `
                    <button class="botao-acao pausar" id="btnPausar"><i class="fas fa-pause"></i> Pausar</button>
                    <button class="botao-acao encerrar" id="btnEncerrar"><i class="fas fa-stop"></i> Encerrar</button>
                `;
                exibeSituacao.textContent = 'Em Jornada';
                document.getElementById('btnPausar').addEventListener('click', pausarJornada);
                document.getElementById('btnEncerrar').addEventListener('click', encerrarJornada);
            } else {
                areaBotoes.innerHTML = `
                    <button class="botao-acao retomar" id="btnRetomar"><i class="fas fa-play"></i> Retomar</button>
                    <button class="botao-acao encerrar" id="btnEncerrar"><i class="fas fa-stop"></i> Encerrar</button>
                `;
                exibeSituacao.textContent = 'Em Pausa';
                document.getElementById('btnRetomar').addEventListener('click', retomarJornada);
                document.getElementById('btnEncerrar').addEventListener('click', encerrarJornada);
            }
            exibePausas.textContent = estado.totalPausas;
        }

        function renderizarHistorico() {
            if (estado.historico.length === 0) {
                listaHistorico.innerHTML = `<div class="vazio">Nenhum registro de jornada ainda</div>`;
                return;
            }
            listaHistorico.innerHTML = estado.historico.map(item => `
                <div class="item-historico">
                    <div class="item-cabecalho">
                        <span class="item-data">${item.data}</span>
                        <span class="item-duracao">${formatarDuracao(item.duracao)}</span>
                    </div>
                    <div class="item-detalhe">
                        Entrada: ${item.entrada} · Saída: ${item.saida} · Pausas: ${item.pausas}
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.aba').forEach(aba => {
            aba.addEventListener('click', () => {
                document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
                document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('visivel'));
                aba.classList.add('ativa');
                document.getElementById(`conteudo-${aba.dataset.aba}`).classList.add('visivel');
                if (aba.dataset.aba === 'historico') renderizarHistorico();
            });
        });

        document.getElementById('botaoSair').addEventListener('click', () => {
            modalSair.classList.add('aberto');
        });
        document.getElementById('botaoCancelar').addEventListener('click', () => {
            modalSair.classList.remove('aberto');
        });
        document.getElementById('botaoConfirmarSaida').addEventListener('click', () => {
            window.location.href = 'painel.html';
        });

        async function carregarDadosUsuario() {
            const passaporteSalvo = localStorage.getItem('passaporte');
            if (!passaporteSalvo) {
                exibeNome.textContent = 'Não identificado';
                exibePassaporte.textContent = '—';
                return;
            }
            const { data, error } = await sb
                .from('membros')
                .select('nome, passaporte')
                .eq('passaporte', passaporteSalvo)
                .single();
            if (data && !error) {
                exibeNome.textContent = data.nome;
                exibePassaporte.textContent = data.passaporte;
            } else {
                exibeNome.textContent = 'Membro';
                exibePassaporte.textContent = passaporteSalvo;
            }
        }

        setInterval(() => {
            if (estado.emJornada && !estado.inicioPausa) {
                const decorrido = tempoAtualDecimais();
                const tempoFormatado = formatarTempoComMilesimos(decorrido);
                tempoPrincipal.textContent = tempoFormatado.principal;
                tempoMilesimos.textContent = tempoFormatado.milesimos;
                exibeHoje.textContent = formatarDuracao(decorrido);
            }
        }, 50);

        carregarEstado();
        atualizarInterface();
        renderizarHistorico();
        carregarDadosUsuario();
    </script>
</body>
</html>
