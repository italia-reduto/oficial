<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f0d">
    <title>Itália 2.0 | Comunicados</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e; --fundo: #050806; --painel: #0d1410; --borda: #1a2b22;
            --texto: #f3f4f6; --texto-mutado: #9ca3af; --azul: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 90px; }

        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.05) 0%, transparent 40%); z-index: -1; }
        
        .container { width: 100%; max-width: 650px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* HEADER DO USUÁRIO */
        .header-user { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        
        /* ÍCONE DE USUÁRIO */
        .user-avatar { width: 45px; height: 45px; border-radius: 10px; background: rgba(34, 197, 94, 0.1); border: 1px solid var(--borda); display: flex; align-items: center; justify-content: center; color: var(--verde); font-size: 20px; }
        
        .user-texto h4 { font-size: 15px; color: #fff; margin-bottom: 2px; }
        .user-texto p { font-size: 11px; color: var(--texto-mutado); text-transform: uppercase; }
        .btn-sair { background: transparent; border: 1px solid var(--borda); color: var(--texto-mutado); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-sair:hover { color: #ef4444; border-color: #ef4444; }

        /* CABEÇALHO DE COMUNICADOS */
        .secao-comunicados { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; }
        .secao-titulo h1 { font-family: 'Oswald'; font-size: 22px; color: #fff; margin-bottom: 5px; }
        .secao-titulo p { font-size: 13px; color: var(--texto-mutado); margin-bottom: 20px; }
        
        /* ABAS */
        .abas { display: flex; gap: 5px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 8px; }
        .aba-btn { flex: 1; padding: 10px; background: transparent; border: none; border-radius: 6px; color: var(--texto-mutado); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .aba-btn.ativo { background: #16241c; color: #fff; border: 1px solid var(--borda); }

        /* CARDS DE AVISO */
        .card-aviso { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; position: relative; }
        
        .card-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .tags-container { display: flex; gap: 8px; width: 100%; justify-content: space-between; }
        
        /* TAGS COM VISUAL CORPORATIVO */
        .tag { padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        
        /* ESTILO PADRÃO DAS TAGS (VERDE ITÁLIA) */
.tag-importante, .tag-alerta, .tag-efetivo { 
    background: rgba(34, 197, 94, 0.1); 
    color: #4ade80; 
    border: 1px solid rgba(34, 197, 94, 0.3); 
    display: inline-flex; 
    align-items: center; 
    gap: 5px; 
    font-weight: 600;
}

/* ESTILO DA TAG URGENTE (VERMELHO) */
.tag-urgente { 
    background: rgba(239, 68, 68, 0.1); 
    color: #f87171; 
    border: 1px solid rgba(239, 68, 68, 0.3); 
    font-weight: 600;
}
        
        .tag-efetivo { background: transparent; color: var(--texto-mutado); border: 1px solid var(--borda); display: flex; align-items: center; gap: 5px; font-weight: 500; }

        .aviso-titulo { font-size: 16px; font-weight: 600; color: var(--azul); margin-bottom: 10px; }
        
        .aviso-conteudo { font-size: 13px; color: #d1d5db; line-height: 1.6; white-space: pre-wrap; margin-bottom: 20px; }
        .aviso-conteudo b { color: #fff; }

        .card-rodape { border-top: 1px solid var(--borda); padding-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .autor-data { font-size: 11px; color: var(--texto-mutado); line-height: 1.4; }
        .btn-marcar-lido { background: transparent; border: 1px solid var(--verde); color: var(--verde); padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-marcar-lido:hover { background: var(--verde); color: #000; }
        .status-lido { font-size: 11px; color: var(--texto-mutado); display: flex; align-items: center; gap: 5px; }

        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 40px 20px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; color: var(--texto-mutado); }
        .empty-state i { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }

        /* MENU INFERIOR */
        .menu-inferior { position: fixed; bottom: 20px; left: 5%; right: 5%; margin: 0 auto; max-width: 400px; background: rgba(5, 8, 6, 0.95); border: 1px solid var(--borda); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 10px 15px; z-index: 9999; }
        .item-menu { display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: var(--texto-mutado); font-size: 10px; font-weight: 500; padding: 5px 10px; border-radius: 10px; border: 1px solid transparent; transition: 0.3s; }
        .item-menu i { font-size: 18px; }
        .item-menu.ativo { color: var(--verde); background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body>
    <div class="fundo-degrade"></div>

    <div class="container">
        
        <!-- HEADER DO USUÁRIO -->
        <div class="header-user">
            <div class="user-info">
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-texto">
                    <h4 id="nome-user">Carregando...</h4>
                    <p id="cargo-user">---</p>
                </div>
            </div>
            <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i></button>
        </div>

        <!-- SEÇÃO DE COMUNICADOS -->
        <div class="secao-comunicados">
            <div class="secao-titulo">
                <h1>Comunicados</h1>
                <p>Avisos da organização e mensagens enviadas pela liderança.</p>
            </div>
            
            <!-- ABAS DE NAVEGAÇÃO -->
            <div class="abas">
                <button class="aba-btn ativo" id="aba-todos" onclick="mudarAba('todos', this)">Todos</button>
                <button class="aba-btn" id="aba-nao-lidos" onclick="mudarAba('nao_lidos', this)">Não Lidos</button>
                <button class="aba-btn" id="aba-urgentes" onclick="mudarAba('urgente', this)">Urgentes</button>
            </div>
        </div>

        <!-- LISTA DE AVISOS -->
        <div id="lista-avisos" style="display: flex; flex-direction: column; gap: 15px;">
            <p style="text-align: center; color: var(--texto-mutado); font-size: 13px; margin-top: 20px;">
                <i class="fas fa-spinner fa-spin"></i> Buscando comunicados no banco...
            </p>
        </div>

    </div>

    <!-- MENU INFERIOR -->
    <nav class="menu-inferior">
        <a href="dashboard.html" class="item-menu"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="bateponto.html" class="item-menu"><i class="fas fa-clock"></i><span>Ponto</span></a>
        <a href="atendimento.html" class="item-menu"><i class="fas fa-headset"></i><span>Suporte</span></a>
        <a href="mais.html" class="item-menu ativo"><i class="fas fa-bars"></i><span>Mais</span></a>
    </nav>

    <script>
        let todosAvisos = [];
        let abaAtual = 'todos';

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        function formatarData(dataStr) {
            if (!dataStr) return 'Recentemente';
            const d = new Date(dataStr);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';

            const membro = JSON.parse(logado);
            document.getElementById('nome-user').innerText = membro.nome;
            document.getElementById('cargo-user').innerText = membro.cargo;

            carregarAvisos();
        });

        async function carregarAvisos() {
            const container = document.getElementById('lista-avisos');
            
            try {
                const { data, error } = await sb.from('avisos')
                    .select('*')
                    .eq('ativo', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                todosAvisos = data || [];
                renderizarAvisos();

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-state" style="border-color: #ef4444; color: #ef4444;"><i class="fas fa-exclamation-triangle"></i><br>Erro ao carregar os comunicados.</div>';
            }
        }

        function mudarAba(aba, btnElement) {
            abaAtual = aba;
            document.querySelectorAll('.aba-btn').forEach(btn => btn.classList.remove('ativo'));
            btnElement.classList.add('ativo');
            renderizarAvisos();
        }

        function renderizarAvisos() {
            const container = document.getElementById('lista-avisos');
            let avisosLidos = JSON.parse(localStorage.getItem('avisos_lidos') || '[]');

            let avisosFiltrados = todosAvisos;

            if (abaAtual === 'nao_lidos') {
                avisosFiltrados = todosAvisos.filter(a => !avisosLidos.includes(a.id));
            } else if (abaAtual === 'urgente') {
                avisosFiltrados = todosAvisos.filter(a => a.tipo === 'urgente');
            }

            if (avisosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>Quartel General em silêncio.</h3>
                        <p>Nenhum comunicado novo no momento.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            avisosFiltrados.forEach(aviso => {
                const isLido = avisosLidos.includes(aviso.id);
                
                // Lógica de Cores: Verde para avisos gerais, Vermelho para urgente, Dourado para alerta.
let tagTipo = '<span class="tag tag-importante">AVISO</span>';
if (aviso.tipo === 'urgente') {
    tagTipo = '<span class="tag tag-urgente">URGENTE</span>';
} else if (aviso.tipo === 'alerta') {
    tagTipo = '<span class="tag tag-alerta">ALERTA</span>';
}

                html += `
                    <div class="card-aviso">
                        <div class="card-topo">
                            <div class="tags-container">
                                <div>${tagTipo}</div>
                                <div><span class="tag tag-efetivo"><i class="fas fa-users"></i> Todo o efetivo</span></div>
                            </div>
                        </div>

                        <h2 class="aviso-titulo">${escapeHTML(aviso.titulo)}</h2>
                        <div class="aviso-conteudo">${escapeHTML(aviso.conteudo)}</div>

                        <div class="card-rodape">
                            <div class="autor-data">
                                <i class="fas fa-user-shield"></i> ${escapeHTML(aviso.autor_nome || 'Liderança')} <br>
                                ${formatarData(aviso.created_at)}
                            </div>
                            
                            ${!isLido ? 
                                `<button class="btn-marcar-lido" onclick="marcarLido('${aviso.id}', this)"><i class="fas fa-check"></i> Marcar lido</button>` 
                                : 
                                `<div class="status-lido"><i class="fas fa-check-double" style="color: var(--verde);"></i> Lido</div>`
                            }
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function marcarLido(id, elemento) {
            let avisosLidos = JSON.parse(localStorage.getItem('avisos_lidos') || '[]');
            
            if (!avisosLidos.includes(id)) {
                avisosLidos.push(id);
                localStorage.setItem('avisos_lidos', JSON.stringify(avisosLidos));
            }

            elemento.outerHTML = `<div class="status-lido"><i class="fas fa-check-double" style="color: var(--verde);"></i> Lido</div>`;
            
            if (abaAtual === 'nao_lidos') {
                setTimeout(() => { renderizarAvisos(); }, 500);
            }
        }

        function sair() {
            sessionStorage.removeItem('membro_logado');
            window.location.href = 'login.html';
        }
    </script>
</body>
    </html>
