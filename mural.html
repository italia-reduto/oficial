<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f0d">
    <title>Itália 2.0 | Central de Comando</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e; --fundo: #0a0f0d; --vidro: rgba(15, 23, 20, 0.6); --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6; --texto-mutado: #9ca3af; --vermelho: #ef4444; --azul: #3b82f6; --amarelo: #eab308;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; }
        
        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 10; margin-top: 10px; }

        .titulo-pagina { font-family: 'Oswald', sans-serif; font-size: 28px; color: #fff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid var(--borda); padding-bottom: 15px; width: 100%; text-align: center; text-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
        
        .lista-opcoes { display: flex; flex-direction: column; gap: 10px; }
        .opcao-card { background: var(--vidro); backdrop-filter: blur(20px); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .opcao-card:hover { background: rgba(34, 197, 94, 0.05); border-color: var(--verde); transform: translateX(5px); }
        
        .opcao-info { display: flex; align-items: center; gap: 15px; }
        .opcao-icone { width: 40px; height: 40px; border-radius: 10px; background: rgba(34, 197, 94, 0.1); display: flex; align-items: center; justify-content: center; color: var(--verde); font-size: 18px; }
        .opcao-texto h3 { font-family: 'Oswald'; font-size: 16px; color: #fff; margin-bottom: 2px; font-weight: 500; }
        .opcao-texto p { font-size: 11px; color: var(--texto-mutado); }
        
        .seta { color: var(--texto-mutado); font-size: 14px; }

        /* ESTILOS ESPECÍFICOS */
        .opcao-destaque .opcao-icone { background: rgba(234, 179, 8, 0.1); color: var(--amarelo); }
        .opcao-destaque:hover { border-color: var(--amarelo); }
        
        .opcao-suporte .opcao-icone { background: rgba(59, 130, 246, 0.1); color: var(--azul); }
        .opcao-suporte:hover { border-color: var(--azul); }

        .opcao-sair { border-color: rgba(239, 68, 68, 0.3); margin-top: 15px; }
        .opcao-sair .opcao-icone { background: rgba(239, 68, 68, 0.1); color: var(--vermelho); }
        .opcao-sair .opcao-texto h3 { color: var(--vermelho); }
        .opcao-sair:hover { background: rgba(239, 68, 68, 0.05); border-color: var(--vermelho); }

        /* MENU INFERIOR */
        .menu-inferior { position: fixed; bottom: 20px; left: 5%; right: 5%; margin: 0 auto; max-width: 400px; background: rgba(10, 15, 13, 0.95); backdrop-filter: blur(25px); border: 1px solid var(--borda); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 10px 15px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .item-menu { display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: var(--texto-mutado); font-size: 10px; font-weight: 500; padding: 5px 10px; border-radius: 10px; border: 1px solid transparent; transition: 0.3s; }
        .item-menu i { font-size: 18px; }
        .item-menu.ativo { color: var(--verde); background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); }
    </style>
        </head>
        <body>
    <div class="fundo-degrade"></div>

    <div class="container">
        
        <!-- HEADER DO USUÁRIO -->
        <div class="header-user">
            <div class="user-info">
                <!-- ÍCONE DE USUÁRIO AQUI -->
                <div class="user-avatar"><i class="fas fa-user"></i></div>
                <div class="user-texto">
                    <h4 id="nome-user">Carregando...</h4>
                    <p id="cargo-user">---</p>
                </div>
            </div>
            <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i></button>
        </div>

        <!-- SEÇÃO DE COMUNICADOS -->
        <div class="secao-comunicados">
            <div class="secao-titulo">
                <h1>Comunicados</h1>
                <p>Avisos da organização e mensagens enviadas pela liderança.</p>
            </div>
            
            <!-- ABAS DE NAVEGAÇÃO -->
            <div class="abas">
                <button class="aba-btn ativo" id="aba-todos" onclick="mudarAba('todos', this)">Todos</button>
                <button class="aba-btn" id="aba-nao-lidos" onclick="mudarAba('nao_lidos', this)">Não Lidos</button>
                <button class="aba-btn" id="aba-urgentes" onclick="mudarAba('urgente', this)">Urgentes</button>
            </div>
        </div>

        <!-- LISTA DE AVISOS -->
        <div id="lista-avisos" style="display: flex; flex-direction: column; gap: 15px;">
            <p style="text-align: center; color: var(--texto-mutado); font-size: 13px; margin-top: 20px;">
                <i class="fas fa-spinner fa-spin"></i> Buscando comunicados no banco...
            </p>
        </div>

    </div>

    <!-- MENU INFERIOR -->
    <nav class="menu-inferior">
        <a href="dashboard.html" class="item-menu"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="bateponto.html" class="item-menu"><i class="fas fa-clock"></i><span>Ponto</span></a>
        <a href="atendimento.html" class="item-menu"><i class="fas fa-headset"></i><span>Suporte</span></a>
        <a href="mais.html" class="item-menu ativo"><i class="fas fa-bars"></i><span>Mais</span></a>
    </nav>
        <script>
        let todosAvisos = [];
        let abaAtual = 'todos';

        // Função para evitar quebra de layout
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        // Formatar data para o padrão brasileiro
        function formatarData(dataStr) {
            if (!dataStr) return 'Recentemente';
            const d = new Date(dataStr);
            return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        // ==========================================
        // 1. INICIALIZAÇÃO
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';

            const membro = JSON.parse(logado);
            
            // Preenche o cabeçalho
            document.getElementById('nome-user').innerText = membro.nome;
            document.getElementById('cargo-user').innerText = membro.cargo;

            carregarAvisos();
        });

        // ==========================================
        // 2. BUSCAR AVISOS NO BANCO
        // ==========================================
        async function carregarAvisos() {
            const container = document.getElementById('lista-avisos');
            
            try {
                // Puxa apenas os avisos ATIVOS
                const { data, error } = await sb.from('avisos')
                    .select('*')
                    .eq('ativo', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                todosAvisos = data || [];
                
                renderizarAvisos();

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="empty-state" style="border-color: #ef4444; color: #ef4444;"><i class="fas fa-exclamation-triangle"></i><br>Erro ao carregar os comunicados.</div>';
            }
        }

        // ==========================================
        // 3. LÓGICA DAS ABAS (FILTROS)
        // ==========================================
        function mudarAba(aba, btnElement) {
            abaAtual = aba;
            
            // Atualiza a cor dos botões
            document.querySelectorAll('.aba-btn').forEach(btn => btn.classList.remove('ativo'));
            btnElement.classList.add('ativo');

            renderizarAvisos();
        }

        // ==========================================
        // 4. RENDERIZAR OS CARDS NA TELA
        // ==========================================
        function renderizarAvisos() {
            const container = document.getElementById('lista-avisos');
            
            // Pega quais avisos o jogador já leu
            let avisosLidos = JSON.parse(localStorage.getItem('avisos_lidos') || '[]');

            // Aplica o filtro da aba selecionada
            let avisosFiltrados = todosAvisos;

            if (abaAtual === 'nao_lidos') {
                avisosFiltrados = todosAvisos.filter(a => !avisosLidos.includes(a.id));
            } else if (abaAtual === 'urgente') {
                avisosFiltrados = todosAvisos.filter(a => a.tipo === 'urgente');
            }

            // Tela vazia (Quartel General em silêncio)
            if (avisosFiltrados.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>Quartel General em silêncio.</h3>
                        <p>Nenhum comunicado novo no momento.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            avisosFiltrados.forEach(aviso => {
                const isLido = avisosLidos.includes(aviso.id);
                
                // Define a Tag colorida (Sóbria)
                let tagTipo = '<span class="tag tag-importante">IMPORTANTE</span>';
                if (aviso.tipo === 'urgente') {
                    tagTipo = '<span class="tag tag-urgente">URGENTE</span>';
                } else if (aviso.tipo === 'alerta') {
                    tagTipo = '<span class="tag tag-alerta">ALERTA</span>';
                }

                html += `
                    <div class="card-aviso">
                        <!-- TOPO: Tags Separadas (Esquerda e Direita) -->
                        <div class="card-topo">
                            <div class="tags-container">
                                <div>${tagTipo}</div>
                                <div><span class="tag tag-efetivo"><i class="fas fa-users"></i> Todo o efetivo</span></div>
                            </div>
                        </div>

                        <!-- TÍTULO E CONTEÚDO -->
                        <h2 class="aviso-titulo">${escapeHTML(aviso.titulo)}</h2>
                        <div class="aviso-conteudo">${escapeHTML(aviso.conteudo)}</div>

                        <!-- RODAPÉ -->
                        <div class="card-rodape">
                            <div class="autor-data">
                                <i class="fas fa-user-shield"></i> ${escapeHTML(aviso.autor_nome || 'Liderança')} <br>
                                ${formatarData(aviso.created_at)}
                            </div>
                            
                            ${!isLido ? 
                                `<button class="btn-marcar-lido" onclick="marcarLido('${aviso.id}', this)"><i class="fas fa-check"></i> Marcar lido</button>` 
                                : 
                                `<div class="status-lido"><i class="fas fa-check-double" style="color: var(--verde);"></i> Lido</div>`
                            }
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 5. MARCAR COMO LIDO
        // ==========================================
        function marcarLido(id, elemento) {
            let avisosLidos = JSON.parse(localStorage.getItem('avisos_lidos') || '[]');
            
            if (!avisosLidos.includes(id)) {
                avisosLidos.push(id);
                localStorage.setItem('avisos_lidos', JSON.stringify(avisosLidos));
            }

            // Muda o botão na hora para "Lido"
            elemento.outerHTML = `<div class="status-lido"><i class="fas fa-check-double" style="color: var(--verde);"></i> Lido</div>`;
            
            // Se a aba atual for "Não Lidos", recarrega para o aviso sumir
            if (abaAtual === 'nao_lidos') {
                setTimeout(() => { renderizarAvisos(); }, 500);
            }
        }

        // ==========================================
        // 6. LOGOUT
        // ==========================================
        function sair() {
            sessionStorage.removeItem('membro_logado');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
