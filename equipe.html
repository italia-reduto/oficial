<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">

<title>Minha Equipe · Organização Itália</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    min-height:100%;
}

body{
    background:#08090d;
    color:#f5f5f5;
    font-family:Inter,Arial,sans-serif;
    padding-bottom:92px;
}

button, a{
    -webkit-tap-highlight-color:transparent;
}

button{
    font-family:inherit;
}

a{
    color:inherit;
    text-decoration:none;
}

/* HEADER */
.header{
    width:100%;
    padding:22px 18px 18px;
    border-bottom:1px solid rgba(255,255,255,.06);
    background: linear-gradient(180deg, rgba(18,18,24,.98), rgba(8,9,13,.98));
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.brand-icon{
    width:43px;
    height:43px;
    flex:none;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#b31324;
    color:#fff;
    font-size:19px;
    box-shadow:0 8px 22px rgba(179,19,36,.18);
}

.brand-info{
    min-width:0;
}

.brand-title{
    font-size:14px;
    font-weight:800;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brand-subtitle{
    margin-top:4px;
    font-size:11px;
    color:#8e919b;
}

.logout{
    border:1px solid rgba(255,255,255,.08);
    background:#111219;
    color:#d9d9dd;
    height:38px;
    padding:0 13px;
    border-radius:11px;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.logout i{
    font-size:12px;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:620px;
    margin:0 auto;
    padding:20px 16px 25px;
}

.page-heading{
    margin-bottom:18px;
}

.page-heading h1{
    font-size:22px;
    line-height:1.2;
    font-weight:800;
}

.page-heading p{
    margin-top:7px;
    color:#888b95;
    font-size:12px;
    line-height:1.5;
}

/* STATUS */
.status-card{
    width:100%;
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:17px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.status-icon{
    width:39px;
    height:39px;
    flex:none;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(179,19,36,.12);
    color:#e3263d;
    font-size:15px;
}

.status-info{
    min-width:0;
}

.status-label{
    font-size:10px;
    color:#858791;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:700;
}

.status-value{
    margin-top:4px;
    font-size:13px;
    font-weight:700;
}

/* ESTADO VAZIO */
.empty{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
}

.empty-icon{
    width:56px;
    height:56px;
    margin:0 auto 15px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#171820;
    color:#777b87;
    font-size:22px;
}

.empty h2{
    font-size:17px;
    font-weight:800;
}

.empty p{
    max-width:390px;
    margin:8px auto 18px;
    color:#888b95;
    font-size:12px;
    line-height:1.6;
}

.primary-btn{
    border:0;
    background:#b31324;
    color:#fff;
    min-height:44px;
    padding:0 18px;
    border-radius:12px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(179,19,36,.18);
}

.primary-btn:active{
    transform:scale(.98);
}
    /* CARD DA EQUIPE */
.team-card{
    border:1px solid rgba(255,255,255,.07);
    background: linear-gradient(145deg, #15161d 0%, #101116 55%, #0e0f14 100%);
    border-radius:19px;
    overflow:hidden;
    margin-bottom:14px;
}

.team-top{
    padding:19px 17px 17px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.team-label{
    color:#898c96;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
}

.team-name{
    margin-top:7px;
    font-size:22px;
    font-weight:800;
    line-height:1.2;
}

.team-type{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:6px 9px;
    border-radius:8px;
    background:rgba(179,19,36,.12);
    color:#e32940;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.team-type i{
    font-size:9px;
}

.team-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.team-stat{
    min-width:0;
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.team-stat:nth-child(odd){
    border-right:1px solid rgba(255,255,255,.05);
}

.team-stat:nth-last-child(-n+2){
    border-bottom:0;
}

.team-stat-label{
    color:#777a84;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:700;
}

.team-stat-value{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
    color:#ececef;
    word-break:break-word;
}

/* SEÇÕES */
.section{
    margin-top:14px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
    padding:0 2px;
}

.section-title h2{
    font-size:13px;
    font-weight:800;
}

.section-title span{
    color:#70737e;
    font-size:10px;
}

/* CARD DE INFORMAÇÕES */
.info-card{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:17px;
    overflow:hidden;
}

.info-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
    padding:13px 15px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.info-row:last-child{
    border-bottom:0;
}

.info-left{
    min-width:0;
}

.info-label{
    color:#777a84;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:700;
}

.info-value{
    margin-top:4px;
    font-size:12px;
    color:#ececef;
    font-weight:700;
    word-break:break-word;
    text-align:right;
}

/* RESPONSÁVEL */
.responsible-card{
    border:1px solid rgba(179,19,36,.20);
    background: linear-gradient(135deg, rgba(179,19,36,.10), rgba(16,17,22,.98));
    border-radius:17px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.responsible-icon{
    width:42px;
    height:42px;
    flex:none;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(179,19,36,.15);
    color:#e3263d;
}

.responsible-info{
    min-width:0;
}

.responsible-label{
    color:#888b95;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:700;
}

.responsible-name{
    margin-top:4px;
    font-size:13px;
    font-weight:800;
}

.responsible-cargo{
    margin-top:3px;
    color:#9a9da6;
    font-size:10px;
}

/* MEMBROS */
.members-card{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:17px;
    overflow:hidden;
}

.member{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px 14px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.member:last-child{
    border-bottom:0;
}

.member-avatar{
    width:37px;
    height:37px;
    flex:none;
    border-radius:11px;
    background:#191a21;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#b7bac3;
    font-size:13px;
}

.member-main{
    min-width:0;
    flex:1;
}

.member-name{
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.member-meta{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:4px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:4px 6px;
    border-radius:6px;
    background:#191a21;
    color:#8e919b;
    font-size:8px;
    font-weight:700;
}

.member-side{
    flex:none;
    text-align:right;
}

.member-status{
    color:#8e919b;
    font-size:8px;
    font-weight:700;
}

.member-status.ativo{
    color:#dce0e7;
}

/* LOADING E ERRO */
.loading{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:18px;
    padding:25px 18px;
    text-align:center;
    color:#858892;
    font-size:12px;
}

.loading i{
    margin-right:7px;
}

.error-card{
    display:none;
    border:1px solid rgba(179,19,36,.25);
    background:rgba(179,19,36,.07);
    border-radius:16px;
    padding:14px;
    margin-bottom:14px;
    color:#e8a5ad;
    font-size:11px;
    line-height:1.5;
}

/* NAVEGAÇÃO INFERIOR */
.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    background:rgba(10,11,15,.97);
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(12px);
}

.nav-inner{
    width:100%;
    max-width:620px;
    height:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#666974;
    font-size:9px;
    font-weight:700;
}

.nav-item i{
    font-size:17px;
}

.nav-item.active{
    color:#e3263d;
}

@media(max-width:380px){
    .container{padding-left:12px;padding-right:12px;}
    .header{padding-left:14px;padding-right:14px;}
    .team-name{font-size:20px;}
    .logout{padding:0 10px;}
    .logout span{display:none;}
}
</style>
</head>
<body>
    <header class="header">
    <div class="header-top">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="brand-info">
                <div class="brand-title" id="usuarioNome">Organização Itália</div>
                <div class="brand-subtitle" id="usuarioPassaporte">Passaporte — </div>
            </div>
        </div>
        <button class="logout" id="btnSair" type="button">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Sair</span>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-heading">
        <h1>Minha Equipe</h1>
        <p>Detalhes da sua escala, função e membros.</p>
    </div>

    <div class="status-card">
        <div class="status-icon">
            <i class="fa-solid fa-users-viewfinder"></i>
        </div>
        <div class="status-info">
            <div class="status-label">Situação atual</div>
            <div class="status-value" id="statusEscala">Carregando...</div>
        </div>
    </div>

    <div class="error-card" id="erroCard"></div>
    <div id="conteudo"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando dados...</div></div>
</main>

<nav class="bottom-nav">
    <div class="nav-inner">
        <a class="nav-item" href="painel.html"><i class="fa-solid fa-house"></i><span>Início</span></a>
        <a class="nav-item" href="bate-ponto.html"><i class="fa-solid fa-clock"></i><span>Ponto</span></a>
        <a class="nav-item active" href="equipe.html"><i class="fa-solid fa-users"></i><span>Equipe</span></a>
        <a class="nav-item" href="registros.html"><i class="fa-solid fa-clipboard-list"></i><span>Registros</span></a>
    </div>
</nav>
<script>
const supabase = window.supabase.createClient(
    "https://vclwmikzmnuqfdxobtik.supabase.co",
    "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF"
);

let usuario = null;
const conteudo = document.getElementById("conteudo");
const statusEscala = document.getElementById("statusEscala");
const erroCard = document.getElementById("erroCard");
const btnSair = document.getElementById("btnSair");
const usuarioNome = document.getElementById("usuarioNome");
const usuarioPassaporte = document.getElementById("usuarioPassaporte");

function escaparHTML(txt){
    if(!txt) return "";
    return String(txt).replace(/[&<>"']/g, m => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
    }[m]));
}

function mostrarErro(m){erroCard.style.display="block"; erroCard.textContent=m;}
function esconderErro(){erroCard.style.display="none";}

function carregarUsuario(){
    const s = sessionStorage.getItem("italia_usuario");
    if(!s) return redireciona();
    try{usuario = JSON.parse(s);}catch{return redireciona();}
    if(!usuario?.passaporte) return redireciona();
    usuarioNome.textContent = usuario.nome || "Membro";
    usuarioPassaporte.textContent = "Passaporte " + usuario.passaporte;
    return true;
}

function redireciona(){sessionStorage.removeItem("italia_usuario"); window.location.href="login.html";}
btnSair.addEventListener("click", redireciona);

async function obterPontoAtual(passaporte){
    const {data,error} = await supabase.from("pontos")
        .select("id, entrada, status, equipe_id")
        .eq("passaporte", String(passaporte))
        .in("status", ["ativo","pausado"])
        .order("entrada",{ascending:false}).limit(1);
    if(error) throw error;
    return data?.[0] || null;
}

async function obterEquipe(id){
    if(!id) return null;
    const {data,error} = await supabase.from("equipes").select("*").eq("id",id).limit(1);
    if(error) throw error;
    return data?.[0] || null;
}

async function obterMembrosEquipe(id){
    if(!id) return [];
    const {data,error} = await supabase.from("equipe_membros").select("*, Membros(Nome,Cargo)")
        .eq("equipe_id",id).neq("status","fora");
    if(error) throw error;
    return data || [];
}

function formatarLimite(equipe){
    if(!equipe?.limite_max || equipe.limite_max === 9999) return "Sem limite";
    return `${equipe.limite_min || 1} a ${equipe.limite_max}`;
}

function renderizarVazia(){
    conteudo.innerHTML = `
        <div class="empty">
            <div class="empty-icon"><i class="fas fa-users-slash"></i></div>
            <h2>Não vinculado a nenhuma equipe</h2>
            <p>Inicie sua jornada no sistema de ponto para ser alocado automaticamente conforme sua função.</p>
            <a href="bate-ponto.html"><button class="primary-btn">Ir para o Ponto</button></a>
        </div>`;
    statusEscala.textContent = "Fora da escala";
    statusEscala.style.color = "#ef4444";
}
    async function renderizar(){
    esconderErro();
    conteudo.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando estrutura...</div>`;

    try{
        const ponto = await obterPontoAtual(usuario.passaporte);
        if(!ponto) return renderizarVazia();

        statusEscala.textContent = "Ponto Ativo · Integrado";
        statusEscala.style.color = "#22c55e";

        const equipe = await obterEquipe(ponto.equipe_id);
        const membros = await obterMembrosEquipe(ponto.equipe_id);

        if(!equipe) return renderizarVazia();

        const ehSeguranca = /segurança/i.test(equipe.nome);
        const ehFarm = /farm/i.test(equipe.nome);
        const qtdMembros = membros.length;
        const limite = equipe.limite_max || 4;
        const limiteTexto = ehSeguranca ? "Sem Limite" : `Máx: ${limite}`;

        conteudo.innerHTML = `
            <div class="team-card">
                <div class="team-top">
                    <p class="team-label">EQUIPE</p>
                    <h2 class="team-name">${escaparHTML(equipe.nome)}</h2>
                    <div class="team-type"><i class="fas fa-briefcase"></i> ${escaparHTML(equipe.funcao || "Sem função")}</div>
                </div>
                <div class="team-grid">
                    <div class="team-stat"><p class="team-stat-label">Membros</p><p class="team-stat-value">${qtdMembros} / ${limiteTexto}</p></div>
                    <div class="team-stat"><p class="team-stat-label">Tipo</p><p class="team-stat-value">${ehFarm ? "Fazenda" : ehSeguranca ? "Defesa" : "Vendas"}</p></div>
                    <div class="team-stat"><p class="team-stat-label">Veículo</p><p class="team-stat-value">${ehFarm ? "Carro / Moto" : "—"}</p></div>
                    <div class="team-stat"><p class="team-stat-label">Posições</p><p class="team-stat-value">P1 · P2 · P3 · P4</p></div>
                </div>
            </div>

            <div class="section"><div class="section-title"><h2>Informações da Função</h2></div>
                <div class="info-card">
                    <div class="info-row"><div class="info-left"><p class="info-label">Nome</p></div><p class="info-value">${escaparHTML(equipe.nome)}</p></div>
                    <div class="info-row"><div class="info-left"><p class="info-label">Atividade</p></div><p class="info-value">${escaparHTML(equipe.funcao)}</p></div>
                    <div class="info-row"><div class="info-left"><p class="info-label">Regra</p></div><p class="info-value">${formatarLimite(equipe)}</p></div>
                    <div class="info-row"><div class="info-left"><p class="info-label">Status</p></div><p class="info-value" style="color:#22c55e">ATIVA</p></div>
                </div>
            </div>

            <div class="section"><div class="section-title"><h2>Membros da Equipe</h2><span>${qtdMembros}</span></div>
                <div class="members-card">
                    ${membros.map(m => `
                        <div class="member">
                            <div class="member-avatar"><i class="fas fa-user-shield"></i></div>
                            <div class="member-main">
                                <div class="member-name">${escaparHTML(m.Membros?.Nome || m.nome || `Passaporte ${m.passaporte || "—"}`)}</div>
                                <div class="member-meta">
                                    <span class="badge">${escaparHTML(m.Membros?.Cargo || "Membro")}</span>
                                    <span class="badge">P${m.posicao || "—"}</span>
                                </div>
                            </div>
                            <span class="member-status ativo">🟢 Ativo</span>
                        </div>
                    `).join("")}
                </div>
            </div>
        `;
    } catch(e){
        console.error(e);
        mostrarErro("Falha ao carregar: " + e.message);
    }
}

document.addEventListener("DOMContentLoaded", () => {
    if(carregarUsuario()) renderizar();
});
</script>
</body>
</html>
