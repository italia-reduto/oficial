<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Equipe | Itália</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#000;
    --card:#0c1017;
    --inner:#111722;
    --line:#1e2636;
    --azul:#3b82f6;
    --amarelo:#f59e0b;
    --verde:#22c55e;
    --vermelho:#ef4444;
    --txt:#f1f5f9;
    --mut:#8b95a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    background: linear-gradient(to bottom, #000000 0%, #000000 35%, #1e3a5f 75%, #0f172a 100%);
    min-height: 100vh;
  }
  body{
    font-family: 'Inter',sans-serif;color:var(--txt);
    padding:18px 14px calc(96px + env(safe-area-inset-bottom,0px));
    max-width:560px;margin:0 auto;
  }
  a{text-decoration:none;color:inherit}
  .layout{display:block}
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,#0d1b36 0%,#0b1220 45%,#0a0d13 100%);
    border:1px solid #1b2a47;border-radius:24px;padding:20px 16px 14px;
  }
  .hero::after{
    content:"";position:absolute;top:-70px;right:-70px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(59,130,246,.18),rgba(59,130,246,.12) 70%);
    pointer-events:none;
  }
  .hero-topo{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
  .escala{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--azul)}
  .nome-equipe{font-size:34px;font-weight:700;line-height:1.05;margin-top:8px;word-break:break-word}
  .sub{font-size:14px;color:var(--mut);margin-top:8px}
  .selo{
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
    font-size:11px;font-weight:700;letter-spacing:.08em;
    padding:8px 12px;border-radius:999px;
    color:var(--verde);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);
  }
  .selo.pausa{color:var(--amarelo);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35)}
  .selo.espera{color:var(--vermelho);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.35)}
  .corpo{position:relative;z-index:1;margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .bloco{background:var(--inner);border:1px solid var(--line);border-radius:16px;padding:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rotulo{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .rotulo i{color:var(--azul);font-size:12px}
  .valor{font-size:16px;font-weight:600;line-height:1.3}
  .valor.grande{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .local{display:flex;align-items:center;gap:14px}
  .local .ic{
    width:44px;height:44px;border-radius:12px 0 0 12px;
    display:flex;justify-content:center;
    background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.24);color:var(--azul);font-size:18px;
  }
  .integrantes{margin-top:24px}
  .integ-titulo{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .integ-lista{display:flex;flex-direction:column;gap:8px}
  .integ-item{display:flex;align-items:center;gap:12px;background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .integ-foto{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .integ-info{flex:1}
  .integ-nome{font-weight:600;font-size:14px}
  .integ-passaporte{font-size:11px;color:var(--mut)}
  .aviso{
    position:fixed;top:16px;left:16px;right:16px;max-width:520px;margin:0 auto;
    padding:14px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:9999;display:none;
  }
  .aviso.sucesso{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
  .aviso.erro{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
  .btn{
    display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font-weight:600;font-size:15px;
    background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;cursor:pointer;font-family:inherit;
  }
  .btn.secundario{background:var(--inner);color:var(--txt);border:1px solid var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;text-align:center}
  .estado .ic{width:64px;height:64px;border-radius:50%;background:rgba(59,130,246,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .estado .ic i{font-size:28px;color:var(--azul)}
  .estado h2{font-size:20px;margin-bottom:8px}
  .estado p{font-size:14px;color:var(--mut);margin-bottom:24px}
  .rodape{
    position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:100;
  }
  .rodape nav{display:flex;justify-content:space-around;max-width:520px;margin:0 auto}
  .rodape a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
  .rodape a.ativo{color:var(--azul)}
  .rodape a i{font-size:20px}
  .modal-fundo{
    position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(4px);z-index:998;display:flex;align-items:center;justify-content:center;padding:20px;display:none;
  }
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto}
  .modal h3{font-size:18px;margin-bottom:12px}
  .modal p{font-size:14px;color:var(--mut);margin-bottom:20px;line-height:1.5}
  .modal-botoes{display:flex;gap:10px;margin-top:20px}
  .modal-botoes .btn{flex:1}
  .equipe-card{background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .2s}
  .equipe-card:hover{border-color:var(--azul);background:rgba(59,130,246,.05)}
  .equipe-nome{font-weight:600;font-size:16px;margin-bottom:4px}
  .equipe-vagas{font-size:13px;color:var(--mut)}
  .cronometro{font-size:12px;color:var(--amarelo);margin-top:8px;font-weight:500}
</style>
</head>
<body>

<div id="aviso" class="aviso"></div>
<div id="app"></div>

<footer class="rodape">
  <nav>
    <a href="index.html"><i class="fa-solid fa-house"></i> Painel</a>
    <a href="bate-ponto.html"><i class="fa-solid fa-clock"></i> Ponto</a>
    <a href="equipe.html" class="ativo"><i class="fa-solid fa-users"></i> Equipe</a>
  </nav>
</footer>

<div id="modalConfirma" class="modal-fundo">
  <div class="modal">
    <h3>Trocar de Equipe</h3>
    <p>Atenção: ao trocar de equipe, sua jornada será encerrada. Você precisará aguardar <strong>1 minuto</strong> antes de iniciar uma nova jornada em outra equipe. Esta ação não pode ser desfeita.</p>
    <div id="cronContador" class="cronometro" style="display:none;">Aguarde: <span id="contador">60</span>s</div>
    <div class="modal-botoes">
      <button class="btn secundario" onclick="fecharModal('modalConfirma')">Cancelar</button>
      <button class="btn" id="btnConfirmarTroca" onclick="abrirEquipesDisponiveis()">Continuar</button>
    </div>
  </div>
</div>

<div id="modalEquipes" class="modal-fundo">
  <div class="modal">
    <h3>Equipes Disponíveis</h3>
    <p class="rotulo">Selecione uma equipe com vagas disponíveis:</p>
    <div id="listaEquipes"></div>
    <div class="modal-botoes">
      <button class="btn secundario" onclick="fecharModal('modalEquipes')">Voltar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById('app');
let sessao = JSON.parse(localStorage.getItem('sessao') || '{}');
let estado = 'carregando';
let assinatura = null;
let ponto = null;
let trocando = false;
let membrosSincronizados = null;
let cronId = null;
let tempoRestante = 0;

const INTERVALO_ATUALIZACAO = 30000;
  function aviso(msg, tipo){
  const el = document.getElementById('aviso');
  if(!el) return;
  el.textContent = msg;
  el.className = 'aviso ' + (tipo === 'sucesso' ? 'sucesso' : 'erro');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function lerSessao(){
  const s = localStorage.getItem('sessao');
  return s ? JSON.parse(s) : {};
}

function salvarSessao(dados){
  localStorage.setItem('sessao', JSON.stringify(dados));
  sessao = dados;
}

function formatarDuracao(segundos){
  if(!segundos) return '00:00';
  const h = Math.floor(segundos / 3600);
  const m = Math.floor((segundos % 3600) / 60);
  const s = Math.floor(segundos % 60);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function tempoEmServico(){
  if(!ponto || !ponto.entrada) return 0;
  if(ponto.status === 'saida') return 0;
  if(ponto.status === 'espera' && ponto.pausa_inicio){
    const entrada = new Date(ponto.entrada).getTime();
    const pausa = new Date(ponto.pausa_inicio).getTime();
    return Math.floor((pausa - entrada) / 1000);
  }
  const agora = Date.now();
  const entrada = new Date(ponto.entrada).getTime();
  return Math.floor((agora - entrada) / 1000);
}

function tempoRestanteEspera(){
  if(!ponto || ponto.status !== 'espera' || !ponto.pausa_inicio) return 0;
  const agora = Date.now();
  const inicio = new Date(ponto.pausa_inicio).getTime();
  const duracao = 60000;
  const fim = inicio + duracao;
  return fim > agora ? Math.ceil((fim - agora) / 1000) : 0;
}

function emPausa(){
  return ponto && ponto.status === 'espera';
}

function horaDe(d){
  if(!d) return '--:--';
  const dt = new Date(d);
  return dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

function grupoDe(eq){
  if(!eq) return {grupo:'', k:0, nome:''};
  const n = (eq.nome_equipe || eq.nome || '').toUpperCase();
  if(n.includes('VENDAS P1')) return {grupo:'vendas', k:1, nome:'Vendas P1'};
  if(n.includes('VENDAS P2')) return {grupo:'vendas', k:2, nome:'Vendas P2'};
  const rotaMatch = n.match(/ROTA\s*(\d+)/);
  if(rotaMatch) return {grupo:'rota', k:parseInt(rotaMatch[1]), nome:n};
  return {grupo:'outro', k:0, nome:n};
}

function telaSemServico(){
  estado = 'sem'; assinatura = null;
  app.innerHTML = `<div class="card"><div class="estado"><div class="ic"><i class="fa-solid fa-circle-info"></i></div><h2>Nenhum serviço ativo</h2><p>Inicie sua jornada no controle de ponto para ser alocado em uma equipe.</p></div><a href="bate-ponto.html" class="btn"><i class="fa-solid fa-clock"></i> Ir ao Controle de Ponto</a></div>`;
}

function telaErro(msg){
  estado = 'erro'; assinatura = null;
  app.innerHTML = `<div class="card"><div class="estado"><div class="ic"><i class="fa-solid fa-triangle-exclamation"></i></div><h2>Atenção</h2><p>${msg}</p><a href="bate-ponto.html" class="btn"><i class="fa-solid fa-clock"></i> Ir ao Controle de Ponto</a></div></div>`;
}

async function telaEquipe(eq, integrantes){
  estado = 'equipe';
  const grupo = grupoDe(eq);
  const idx = integrantes.findIndex(i => i.eu);
  const n = integrantes.length;
  const lim = eq.limite_vagas;
  const vagas = lim != null ? `${n} de ${lim}` : `${n} ocupada${n !== 1 ? 's' : ''}`;
  const nomeGrande = (eq.nome_equipe || eq.nome || 'EQUIPE').toUpperCase();
  const escala = eq.nome ? `ESCALA ATUAL · ${eq.nome}` : 'ESCALA ATUAL';
  const restante = tempoRestanteEspera();
  const selo = emPausa() 
    ? `<div class="selo pausa"><i class="fa-solid fa-circle-pause"></i> EM PAUSA</div>` 
    : restante > 0 
      ? `<div class="selo espera" id="esperaInfo"><i class="fa-solid fa-clock"></i> Próxima troca em ${restante}s</div>` 
      : '';
  const desde = (ponto && ponto.entrada && horaDe(ponto.entrada) !== '--:--') ? ` · desde ${horaDe(ponto.entrada)}` : '';
  const icone = grupo.grupo === 'rota' 
    ? `R${grupo.k}` 
    : grupo.grupo === 'vendas' 
      ? `V${grupo.k}` 
      : '<i class="fa-solid fa-user"></i>';
  const me = integrantes[idx];
  
  app.innerHTML = `
    <div class="layout">
      <div class="hero">
        <div class="hero-topo">
          <div>
            <div class="escala">${escala}</div>
            <h1 class="nome-equipe">${nomeGrande}</h1>
            <div class="sub">Veja sua função e integrantes da equipe</div>
          </div>
          ${selo}
        </div>
        <div class="corpo">
          <div class="local">
            <div class="ic"><i class="fa-solid fa-location-dot"></i></div>
            <div>
              <div class="rotulo">ÁREA / MISSÃO</div>
              <div class="valor">${eq.funcao || 'Não definida'}</div>
            </div>
          </div>
          <div class="grid2">
            <div class="bloco">
              <div class="rotulo"><i class="fa-solid fa-flag"></i> MINHA POSIÇÃO</div>
              <div class="valor">${me?.nome || '—'}</div>
            </div>
            <div class="bloco">
              <div class="rotulo"><i class="fa-solid fa-briefcase"></i> FUNÇÃO</div>
              <div class="valor">${eq.funcao || 'Não definida'}</div>
            </div>
          </div>
          <div class="grid2">
            <div class="bloco">
              <div class="rotulo"><i class="fa-solid fa-right-to-bracket"></i> MINHA ENTRADA</div>
              <div class="valor">${horaDe(ponto?.entrada)}${desde}</div>
            </div>
            <div class="bloco">
              <div class="rotulo"><i class="fa-solid fa-stopwatch"></i> EM SERVIÇO HÁ</div>
              <div class="valor" id="tempo">—</div>
            </div>
          </div>
          <div class="grid2">
            <div class="bloco">
              <div class="rotulo"><i class="fa-solid fa-user-group"></i> LIMITE DE VAGAS</div>
              <div class="valor">${vagas}</div>
            </div>
            <div class="bloco">
              <div class="rotulo"><i class="fa-solid fa-car"></i> VEÍCULO</div>
              <div class="valor">N/A</div>
            </div>
          </div>
        </div>
        <button class="btn" id="btnTrocar" onclick="abrirModal('modalConfirma')" ${restante > 0 ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>
          <i class="fa-solid fa-shuffle"></i> Trocar de Equipe
        </button>
      </div>
      
      <div class="integrantes">
        <div class="integ-titulo"><i class="fa-solid fa-users"></i> Integrantes (${n})</div>
        <div class="integ-lista">
          ${integrantes.map((it, i) => `
            <div class="integ-item">
              <div class="integ-foto">${it.eu ? icone : i+1}</div>
              <div class="integ-info">
                <div class="integ-nome">${it.eu ? 'Você' : it.nome}</div>
                <div class="integ-passaporte">Passaporte: ${it.passaporte}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
  }
  function abrirModal(id){
  document.getElementById(id).style.display = 'flex';
}

function fecharModal(id){
  document.getElementById(id).style.display = 'none';
  if(id === 'modalEquipes'){
    document.getElementById('listaEquipes').innerHTML = '';
  }
}

async function buscarPontoAtivo(passaporte){
  if(!passaporte) return null;
  const {data, error} = await sb.from('pontos').select('*,equipe:equipe_id(*)').eq('passaporte', passaporte).order('entrada', {asc:false}).limit(1);
  if(error) return null;
  const ultimo = data?.[0];
  if(ultimo && ultimo.status !== 'saida') return ultimo;
  return null;
}

async function carregarIntegrantes(equipe_id){
  if(!equipe_id) return [];
  const {data:eq} = await sb.from('equipes').select('membros,limite_vagas,nome_equipe,funcao,nome').eq('id', equipe_id).single();
  if(!eq || !eq.membros) return [];
  const todos = eq.membros.map(p => String(p));
  const {data:usuarios} = await sb.from('usuarios').select('passaporte,nome').in('passaporte', todos);
  const mapa = new Map((usuarios || []).map(u => [String(u.passaporte), u.nome]));
  const meupassaporte = String(sessao.passaporte || '');
  return todos.map(p => ({
    passaporte: p,
    nome: mapa.get(p) || p,
    eu: meupassaporte && p === meupassaporte
  })).sort((a, b) => {
    if(a.eu) return -1;
    if(b.eu) return 1;
    return a.nome.localeCompare(b.nome);
  });
}

async function sincronizarMembros(equipe_id, novo_passaporte){
  if(!equipe_id) return;
  const passaporte = novo_passaporte || String(sessao.passaporte || '');
  if(!passaporte) return;
  const {data:eq} = await sb.from('equipes').select('membros').eq('id', equipe_id).single();
  if(!eq) return;
  const atuais = (eq.membros || []).map(p => String(p));
  if(!atuais.includes(passaporte)){
    atuais.push(passaporte);
    await sb.from('equipes').update({membros: atuais}).eq('id', equipe_id);
  }
  membrosSincronizados = String(equipe_id);
}

async function salvarEquipeNoPonto(ponto_id, equipe_id){
  await sb.from('pontos').update({equipe_id: equipe_id}).eq('id', ponto_id);
}

async function abrirEquipesDisponiveis(){
  fecharModal('modalConfirma');
  abrirModal('modalEquipes');
  
  const {data:todas, error:e1} = await sb.from('equipes').select('*').eq('ativa', true);
  if(e1 || !todas) {
    document.getElementById('listaEquipes').innerHTML = '<p style="color:var(--vermelho);text-align:center;padding:20px">Erro ao carregar equipes.</p>';
    return;
  }
  
  const {data:ativos, error:e2} = await sb.from('pontos').select('equipe_id,status').neq('status','saida');
  if(e2) {
    document.getElementById('listaEquipes').innerHTML = '<p style="color:var(--vermelho);text-align:center;padding:20px">Erro ao verificar vagas.</p>';
    return;
  }
  
  const ocupadas = new Set(ativos.filter(p => p.equipe_id).map(p => String(p.equipe_id)));
  const meuId = ponto?.equipe_id ? String(ponto.equipe_id) : null;
  
  const disponiveis = todas.filter(eq => {
    const eqId = String(eq.id);
    if(eqId === meuId) return false;
    const limite = eq.limite_vagas || 999;
    const membros = eq.membros || [];
    return membros.length < limite;
  });
  
  const container = document.getElementById('listaEquipes');
  if(disponiveis.length === 0){
    container.innerHTML = '<p style="color:var(--mut);text-align:center;padding:20px">No momento não há equipes com vagas disponíveis.</p>';
    return;
  }
  
  container.innerHTML = disponiveis.map(eq => {
    const vagasDisponiveis = (eq.limite_vagas || 999) - (eq.membros?.length || 0);
    const nome = (eq.nome_equipe || eq.nome || 'Equipe sem nome').toUpperCase();
    return `
      <div class="equipe-card" onclick="confirmarTroca('${eq.id}')">
        <div class="equipe-nome">${nome}</div>
        <div class="equipe-vagas">${vagasDisponiveis} vaga${vagasDisponiveis !== 1 ? 's' : ''} disponível${vagasDisponiveis !== 1 ? 'e' : ''}</div>
      </div>
    `;
  }).join('');
}

async function confirmarTroca(novaEquipeId){
  if(!ponto) return;
  
  trocando = true;
  
  await sb.from('pontos').update({equipe_id: novaEquipeId}).eq('id', ponto.id);
  
  const {data:eq} = await sb.from('equipes').select('membros').eq('id', novaEquipeId).single();
  const membros = eq?.membros || [];
  const meuPassaporte = String(sessao.passaporte || '');
  if(meuPassaporte && !membros.map(p => String(p)).includes(meuPassaporte)){
    membros.push(meuPassaporte);
    await sb.from('equipes').update({membros: membros}).eq('id', novaEquipeId);
  }
  
  aviso('Equipe alterada com sucesso! Aguarde 1 minuto para iniciar nova jornada.', 'sucesso');
  fecharModal('modalEquipes');
  
  tempoRestante = 60;
  const btn = document.getElementById('btnTrocar');
  if(btn) btn.disabled = true;
  
  if(cronId) clearInterval(cronId);
  cronId = setInterval(() => {
    tempoRestante--;
    const span = document.getElementById('contador');
    if(span) span.textContent = tempoRestante;
    
    if(tempoRestante <= 0){
      clearInterval(cronId);
      if(btn) btn.disabled = false;
      aviso('Pode iniciar nova jornada agora!', 'sucesso');
      atualizar();
    }
  }, 1000);
  
  trocando = false;
  atualizar();
    }
  async function carregarEDesenhar(forcar=false){
  if(!ponto?.equipe_id) { telaSemServico(); return; }
  const { data, error } = await sb.from('equipes').select('*').eq('id', ponto.equipe_id).limit(1);
  if(error || !data || !data.length){ telaErro('Equipe não encontrada.'); return; }
  const eq = data[0];
  const meupassaporte = String(sessao.passaporte || '');
  const integrantes = await carregarIntegrantes(eq.id);
  const temEu = meupassaporte && integrantes.some(i => i.eu);
  if(!temEu && membrosSincronizados !== String(eq.id) && meupassaporte){
    await sincronizarMembros(eq.id, meupassaporte);
    integrantes.push({ passaporte: meupassaporte, nome: sessao.nome || meupassaporte, eu: true });
    membrosSincronizados = String(eq.id);
  }
  const assinaturaNova = JSON.stringify([eq, integrantes, ponto.entrada, ponto.pausa_inicio, ponto.pausa_fim, ponto.status]);
  if(forcar || assinaturaNova !== assinatura || estado !== 'equipe'){
    assinatura = assinaturaNova;
    telaEquipe(eq, integrantes);
  }
}

async function atualizar(){
  if(trocando || estado === 'carregando') return;
  try{
    const p = await buscarPontoAtivo(sessao.passaporte);
    if(!p){ 
      ponto = null; 
      if(estado !== 'sem') telaSemServico(); 
      return; 
    }
    ponto = p;
    if(!ponto.equipe_id){
      telaSemServico();
      return;
    }
    await carregarEDesenhar(false);
  }catch(e){
    console.error(e);
    telaErro('Falha ao carregar os dados.');
  }
}

setInterval(() => {
  const el = document.getElementById('tempo');
  if(el && estado === 'equipe') el.textContent = formatarDuracao(tempoEmServico());
}, 1000);

setInterval(atualizar, INTERVALO_ATUALIZACAO);

async function iniciar(){
  sessao = lerSessao();
  if(!sessao) sessao = {};
  sessao.passaporte = String(sessao?.passaporte || '');
  estado = 'carregando';
  try{
    if(!sessao.passaporte){
      telaSemServico();
      estado = 'sem';
      return;
    }
    ponto = await buscarPontoAtivo(sessao.passaporte);
    if(!ponto){ telaSemServico(); return; }
    if(!ponto.equipe_id){ telaSemServico(); return; }
    await carregarEDesenhar(true);
  }catch(e){
    console.error(e);
    telaErro('Falha ao consultar os dados.');
  }
}

iniciar();
</script>
