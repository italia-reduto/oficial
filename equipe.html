<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
    "https://vclwmikzmnuqfdxobtik.supabase.co",
    "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF"
);


/* ==========================================
   USUÁRIO
========================================== */

let usuario = null;
let equipeAtual = null;
let pontoAtual = null;
let membrosEquipe = [];


/* ==========================================
   HIERARQUIA ADMINISTRATIVA
========================================== */

const prioridadeCargos = {
    "mentor": 6,
    "controle": 5,
    "o vigia": 4,
    "raíz": 3,
    "raiz": 3,
    "executor": 2,
    "novato": 1
};


/* ==========================================
   ELEMENTOS
========================================== */

const conteudo = document.getElementById("conteudo");
const statusEscala = document.getElementById("statusEscala");
const erroCard = document.getElementById("erroCard");
const usuarioNome = document.getElementById("usuarioNome");
const usuarioPassaporte = document.getElementById("usuarioPassaporte");
const btnSair = document.getElementById("btnSair");


/* ==========================================
   FUNÇÕES BÁSICAS
========================================== */

function escaparHTML(valor){

    if(valor === null || valor === undefined){
        return "";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function mostrarErro(mensagem){

    erroCard.textContent = mensagem;
    erroCard.style.display = "block";
}


function esconderErro(){

    erroCard.textContent = "";
    erroCard.style.display = "none";
}


function normalizar(valor){

    return String(valor || "")
        .trim()
        .toLowerCase();
}


function formatarData(data){

    if(!data){
        return "—";
    }

    const d = new Date(data);

    if(Number.isNaN(d.getTime())){
        return "—";
    }

    return d.toLocaleString("pt-BR",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}


function obterPrioridade(cargo){

    return prioridadeCargos[normalizar(cargo)] || 0;
}


function nomeCargo(valor){

    if(!valor){
        return "Não informado";
    }

    return valor;
}


/* ==========================================
   SESSÃO
========================================== */

function carregarUsuario(){

    const salvo = sessionStorage.getItem("italia_usuario");

    if(!salvo){
        window.location.href = "login.html";
        return false;
    }

    try{

        usuario = JSON.parse(salvo);

    }catch(e){

        sessionStorage.removeItem("italia_usuario");
        window.location.href = "login.html";
        return false;
    }


    if(!usuario || !usuario.passaporte){

        sessionStorage.removeItem("italia_usuario");
        window.location.href = "login.html";
        return false;
    }


    usuarioNome.textContent =
        usuario.nome || "Usuário";

    usuarioPassaporte.textContent =
        "Passaporte " + usuario.passaporte;

    return true;
}


/* ==========================================
   SAIR
========================================== */

btnSair.addEventListener("click",function(){

    sessionStorage.removeItem("italia_usuario");

    window.location.href = "login.html";

});


/* ==========================================
   PONTO ATUAL
========================================== */

async function buscarPontoAtual(){

    const { data, error } = await supabaseClient
        .from("pontos")
        .select("*")
        .eq("passaporte",String(usuario.passaporte))
        .in("status",["ativo","pausado"])
        .order("entrada",{ascending:false})
        .limit(1);

    if(error){
        throw error;
    }

    if(!data || !data.length){
        pontoAtual = null;
        return null;
    }

    pontoAtual = data[0];

    return pontoAtual;
}


/* ==========================================
   EQUIPE
========================================== */

async function buscarEquipe(equipeId){

    if(!equipeId){
        return null;
    }

    const { data, error } = await supabaseClient
        .from("equipes")
        .select("*")
        .eq("id",equipeId)
        .limit(1);

    if(error){
        throw error;
    }

    if(!data || !data.length){
        return null;
    }

    equipeAtual = data[0];

    return equipeAtual;
}


/* ==========================================
   MEMBROS DA EQUIPE
========================================== */

async function buscarMembrosEquipe(equipeId){

    if(!equipeId){
        return [];
    }

    const { data, error } = await supabaseClient
        .from("equipe_membros")
        .select("*")
        .eq("equipe_id",equipeId)
        .neq("status","fora")
        .order("entrou_em",{ascending:true});

    if(error){
        throw error;
    }

    membrosEquipe = data || [];

    return membrosEquipe;
}


/* ==========================================
   CARGOS ADMINISTRATIVOS
========================================== */

async function buscarCargosAdministrativos(membros){

    if(!membros || !membros.length){
        return membros || [];
    }


    const passaportes = membros
        .map(m => m.passaporte)
        .filter(Boolean)
        .map(String);


    if(!passaportes.length){
        return membros;
    }


    const { data, error } = await supabaseClient
        .from("Membros")
        .select("Passaporte,Nome,Cargo")
        .in("Passaporte",passaportes);


    if(error){

        console.warn(
            "Não foi possível carregar os cargos administrativos:",
            error
        );

        return membros;
    }


    const mapa = {};

    (data || []).forEach(membro => {

        mapa[String(membro.Passaporte)] = {
            nome:membro.Nome,
            cargo:membro.Cargo
        };

    });


    return membros.map(membro => {

        const cadastro =
            mapa[String(membro.passaporte)] || null;

        return {
            ...membro,
            cargoAdministrativo:
                cadastro ? cadastro.cargo : null
        };

    });

}
    /* ==========================================
   RESPONSÁVEL DA EQUIPE
========================================== */

function encontrarResponsavel(membros){

    if(!membros || !membros.length){
        return null;
    }

    const ordenados = [...membros].sort((a,b)=>{

        const prioridadeA =
            obterPrioridade(a.cargoAdministrativo);

        const prioridadeB =
            obterPrioridade(b.cargoAdministrativo);

        if(prioridadeA !== prioridadeB){
            return prioridadeB - prioridadeA;
        }

        const entradaA =
            new Date(a.entrou_em || 0).getTime();

        const entradaB =
            new Date(b.entrou_em || 0).getTime();

        return entradaA - entradaB;
    });

    return ordenados[0] || null;
}


/* ==========================================
   REGRAS DA EQUIPE
========================================== */

function obterRegraEquipe(equipe){

    if(!equipe){
        return {
            limite:null,
            textoLimite:"—"
        };
    }

    const tipo = normalizar(equipe.tipo);

    if(tipo === "favela"){

        return {
            limite:null,
            textoLimite:"Sem limite geral"
        };

    }

    if(tipo === "farm"){

        return {
            limite:8,
            textoLimite:"Até 4 por atividade"
        };

    }

    if(tipo === "venda"){

        return {
            limite:4,
            textoLimite:"Máximo de 4 membros"
        };

    }

    if(tipo === "segurança"){

        return {
            limite:null,
            textoLimite:"Sem limite"
        };

    }

    if(equipe.limite !== null &&
       equipe.limite !== undefined){

        return {
            limite:Number(equipe.limite),
            textoLimite:"Máximo de " + equipe.limite
        };

    }

    return {
        limite:null,
        textoLimite:"Não definido"
    };
}


/* ==========================================
   STATUS DA EQUIPE
========================================== */

function obterStatusEquipe(){

    if(!equipeAtual){
        return "Não encontrada";
    }

    if(equipeAtual.ativa === false){
        return "Inativa";
    }

    return "Ativa";
}


/* ==========================================
   TIPO DA EQUIPE
========================================== */

function obterTipoEquipe(){

    if(!equipeAtual || !equipeAtual.tipo){
        return "Não informado";
    }

    return equipeAtual.tipo;
}


/* ==========================================
   DADOS DO USUÁRIO NA EQUIPE
========================================== */

function encontrarMeuMembro(){

    if(!usuario || !membrosEquipe.length){
        return null;
    }

    return membrosEquipe.find(m =>
        String(m.passaporte) === String(usuario.passaporte)
    ) || null;
}


/* ==========================================
   CONTAGEM
========================================== */

function obterContagemEquipe(){

    return membrosEquipe.filter(m =>
        normalizar(m.status) !== "fora"
    ).length;
}


/* ==========================================
   TEXTO DE LIMITE
========================================== */

function textoContagemEquipe(){

    const regra = obterRegraEquipe(equipeAtual);
    const quantidade = obterContagemEquipe();

    if(regra.limite === null){
        return `${quantidade} membro${quantidade === 1 ? "" : "s"}`;
    }

    return `${quantidade}/${regra.limite} membros`;
}


/* ==========================================
   RENDERIZAÇÃO — SEM EQUIPE
========================================== */

    conteudo.innerHTML = `

            </div>

            <h2>Você não está em uma equipe</h2>

            <p>
                Para participar de uma equipe, abra seu ponto
                e aguarde a integração com uma equipe disponível.
            </p>

            <button
                class="primary-btn"
                type="button"
                onclick="window.location.href='bate-ponto.html'">

                <i class="fa-solid fa-clock"></i>

}

/* ==========================================
   RENDERIZAR MEMBROS
========================================== */

function renderizarMembros(){

    if(!membrosEquipe.length){
        return "";
    }


    return membrosEquipe.map(membro => {

        const nome =
            membro.nome ||
            "Membro";

        const cargo =
            membro.cargoAdministrativo ||
            "Cargo não informado";

        const posicao =
            membro.posicao ||
            "";

        const atividade =
            membro.atividade ||
            "";

        const status =
            normalizar(membro.status);


        let badges = "";

        if(posicao){

            badges += `
                <span class="badge">
                    ${escaparHTML(posicao)}
                </span>
            `;

        }

        if(atividade){

            badges += `
                <span class="badge">
                    ${escaparHTML(atividade)}
                </span>
            `;

        }


        return `

            <div class="member">

                <div class="member-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>


                <div class="member-main">

                    <div class="member-name">
                        ${escaparHTML(nome)}
                    </div>

                    <div class="member-meta">

                        <span class="badge">
                            ${escaparHTML(cargo)}
                        </span>

                        ${badges}

                    </div>

                </div>


                <div class="member-side">

                    <div class="member-status ${
                        status === "ativo"
                            ? "ativo"
                            : ""
                    }">

                        ${
                            status === "pausado"
                                ? "Pausado"
                                : "Ativo"
                        }

                    </div>

                </div>

            </div>

        `;

    }).join("");

    }
    /* ==========================================
   CARREGAMENTO PRINCIPAL
========================================== */

async function carregarDados(){

    esconderErro();

    try{

        statusEscala.textContent =
            "Verificando ponto...";


        /* ------------------------------
           1. BUSCA PONTO
        ------------------------------ */

        const ponto =
            await buscarPontoAtual();


        if(!ponto){

            renderizarSemEquipe();
            return;

        }


        /* ------------------------------
           2. VERIFICA EQUIPE
        ------------------------------ */

        if(!ponto.equipe_id){

            statusEscala.textContent =
                ponto.status === "pausado"
                    ? "Ponto pausado"
                    : "Ponto ativo";

            conteudo.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        <i class="fa-solid fa-hourglass-half"></i>
                    </div>

                    <h2>Equipe ainda não definida</h2>

                    <p>
                        Seu ponto está ${
                            ponto.status === "pausado"
                                ? "pausado"
                                : "ativo"
                        },
                        mas nenhuma equipe foi vinculada a ele.
                    </p>

                    <button
                        class="primary-btn"
                        type="button"
                        onclick="window.location.href='bate-ponto.html'">

                        <i class="fa-solid fa-clock"></i>
                        Ver meu ponto

                    </button>

                </div>

            `;

            return;
        }


        /* ------------------------------
           3. BUSCA EQUIPE
        ------------------------------ */

        await buscarEquipe(ponto.equipe_id);


        if(!equipeAtual){

            throw new Error(
                "A equipe vinculada ao ponto não foi encontrada."
            );

        }


        /* ------------------------------
           4. BUSCA MEMBROS
        ------------------------------ */

        await buscarMembrosEquipe(
            ponto.equipe_id
        );


        /* ------------------------------
           5. BUSCA CARGOS
        ------------------------------ */

        membrosEquipe =
            await buscarCargosAdministrativos(
                membrosEquipe
            );


        /* ------------------------------
           6. MOSTRA TUDO
        ------------------------------ */

        renderizarEquipe();


    }catch(error){

        console.error(
            "Erro ao carregar equipe:",
            error
        );


        statusEscala.textContent =
            "Erro ao carregar";


        conteudo.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>

                <h2>Não foi possível carregar</h2>

                <p>
                    Ocorreu um problema ao buscar
                    os dados da sua equipe.
                </p>

                <button
                    class="primary-btn"
                    type="button"
                    onclick="carregarDados()">

                    <i class="fa-solid fa-rotate-right"></i>
                    Tentar novamente

                </button>

            </div>

        `;


        mostrarErro(
            error?.message ||
            "Erro desconhecido ao carregar a equipe."
        );

    }

}


/* ==========================================
   INICIALIZAÇÃO
========================================== */

async function iniciar(){

    const usuarioValido =
        carregarUsuario();


    if(!usuarioValido){
        return;
    }


    await carregarDados();

}


iniciar();

</script>
