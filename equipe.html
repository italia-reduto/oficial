<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>ITÁLIA · EQUIPE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; outline: none !important;
        }
        *:focus, *:focus-visible { outline: none !important; box-shadow: none !important; }
        
        html, body {
            min-height: 100vh; font-family: 'Inter', sans-serif; color: #fff;
            padding-bottom: 90px; overflow-x: hidden;
        }

        /* Fundos */
        .fundo-pagina {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e293b 100%);
            z-index: -3;
        }
        .fundo-imagem {
            position: fixed; inset: 0;
            background: url("https://wallpapers.com/images/featured/fundo-de-fivem-zt0lohk29h4faehq.jpg") center/cover no-repeat;
            opacity: 0.06; z-index: -1;
        }
        .fundo-degrade {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 0;
        }

        /* Conteúdo centralizado */
        .conteudo { 
            position: relative; z-index: 1; 
            padding: 24px 20px;
            max-width: 560px; margin: 0 auto; width: 100%;
        }

        /* Tela sem jornada */
        .aviso-bloqueio {
            text-align: center; padding: 80px 24px; max-width: 420px; margin: 0 auto;
        }
        .icone-bloqueio {
            width: 72px; height: 72px; border-radius: 50%;
            background: rgba(59, 130, 246, 0.12);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }
        .icone-bloqueio i { font-size: 32px; color: #3b82f6; }
        .aviso-titulo { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        .aviso-texto { font-size: 15px; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
        .btn-ponto {
            padding: 15px 32px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 10px;
            text-decoration: none; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
            transition: all 0.3s ease;
        }
        .btn-ponto:active { transform: scale(0.97); }

        /* Cabeçalho da equipe */
        .cabecalho-equipe { margin-bottom: 20px; }
        .etiqueta-escala {
            font-size: 13px; color: #60a5fa; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .nome-equipe {
            font-size: 36px; font-weight: 800; letter-spacing: -1px;
            line-height: 1.1; margin-bottom: 6px;
        }
        .subtitulo-equipe { font-size: 14px; color: #94a3b8; }

        /* Caixa principal com todos os dados */
        .caixa-dados {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 20px; padding: 24px 20px;
            backdrop-filter: blur(10px); margin-bottom: 20px;
        }

        /* Área/Missão — destaque */
        .bloco-missao { margin-bottom: 22px; }
        .rotulo {
            font-size: 12px; color: #64748b; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px;
        }
        .rotulo i { color: #3b82f6; font-size: 16px; }
        .valor { font-size: 18px; font-weight: 700; line-height: 1.4; }

        /* Grade de informações */
        .grade {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
            margin-bottom: 16px;
        }
        .bloco .rotulo { margin-bottom: 4px; }
        .bloco .valor { font-size: 16px; }
        .bloco-largo { grid-column: 1 / -1; }

        /* Botão Trocar Equipe */
        .btn-trocar {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000; font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
            transition: all 0.3s ease; margin-top: 4px;
        }
        .btn-trocar:active { transform: scale(0.97); }

        /* Barra de navegação */
        .barra-menu {
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid rgba(59, 130, 246, 0.12); z-index: 100;
        }
        .item-menu {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: #64748b; text-decoration: none; font-size: 11px;
            cursor: pointer; transition: color 0.25s ease;
        }
        .item-menu.ativo { color: #3b82f6; }
        .item-menu i { font-size: 20px; margin-bottom: 2px; }

        .tela-conteudo { display: none; }
        .tela-conteudo.visivel { display: block; }
    </style>
</head>
<body>

    <div class="fundo-pagina"></div>
    <div class="fundo-imagem"></div>
    <div class="fundo-degrade"></div>

    <!-- Sem jornada -->
    <div class="conteudo" id="telaBloqueio">
        <div class="aviso-bloqueio">
            <div class="icone-bloqueio"><i class="fas fa-lock"></i></div>
            <h2 class="aviso-titulo">Acesso Restrito</h2>
            <p class="aviso-texto">Inicie sua jornada no controle de ponto para ver as informações da sua equipe.</p>
            <a href="ponto.html" class="btn-ponto"><i class="fas fa-clock"></i> Ir ao Controle de Ponto</a>
        </div>
    </div>

    <!-- Com jornada — visual novo -->
    <div class="conteudo tela-conteudo" id="telaEquipe">
        <div class="cabecalho-equipe">
            <p class="etiqueta-escala" id="etiquetaEscala">Escala atual · —</p>
            <h1 class="nome-equipe" id="nomeEquipe">—</h1>
            <p class="subtitulo-equipe">Veja sua alocação atual</p>
        </div>

        <div class="caixa-dados">
            <!-- Missão / Área -->
            <div class="bloco-missao">
                <p class="rotulo"><i class="fas fa-location-dot"></i> Missão / Área</p>
                <p class="valor" id="areaAtuacao">—</p>
            </div>

            <!-- Grade: Posição | Função -->
            <div class="grade">
                <div class="bloco">
                    <p class="rotulo">Posição</p>
                    <p class="valor" id="minhaPosicao">—</p>
                </div>
                <div class="bloco">
                    <p class="rotulo">Função</p>
                    <p class="valor" id="funcao">Membro</p>
                </div>
                <div class="bloco">
                    <p class="rotulo">Veículo</p>
                    <p class="valor" id="veiculo">N/A</p>
                </div>
                <div class="bloco">
                    <p class="rotulo">Turno</p>
                    <p class="valor">—</p>
                </div>
                <div class="bloco bloco-largo">
                    <p class="rotulo"><i class="fas fa-users"></i> Integrantes</p>
                    <p class="valor" id="integrantes">—</p>
                </div>
            </div>
        </div>

        <button class="btn-trocar" id="btnTrocarEquipe">
            <i class="fas fa-exchange-alt"></i> Trocar de Equipe
        </button>
    </div>

    <!-- Navegação -->
    <nav class="barra-menu">
        <a href="painel.html" class="item-menu"><i class="fas fa-home"></i> Painel</a>
        <a href="ponto.html" class="item-menu"><i class="fas fa-clock"></i> Ponto</a>
        <a href="equipe.html" class="item-menu ativo"><i class="fas fa-users"></i> Equipe</a>
        <a href="tickets.html" class="item-menu"><i class="fas fa-file-alt"></i> Tickets</a>
        <a href="#" class="item-menu"><i class="fas fa-ellipsis-h"></i> Mais</a>
    </nav>

    <script>
        let passaporteUsuario = localStorage.getItem('passaporte');
        let pontoAtivo = false;
        let equipeAtual = null;

        async function verificarJornada() {
            if (!passaporteUsuario) {
                window.location.href = 'login.html';
                return;
            }

            // Busca último registro de ponto ativo
            const { data: ponto, error } = await sb
                .from('pontos')
                .select('*, equipes(*)')
                .eq('passaporte', passaporteUsuario)
                .is('saida', null)
                .order('entrada', { ascending: false })
                .limit(1)
                .single();

            if (error || !ponto) {
                document.getElementById('telaBloqueio').style.display = 'block';
                return;
            }

            pontoAtivo = true;
            equipeAtual = ponto.equipes;
            montarTela(ponto);
        }

        function montarTela(ponto) {
            document.getElementById('telaBloqueio').style.display = 'none';
            document.getElementById('telaEquipe').classList.add('visivel');

            const eq = ponto.equipes;
            if (!eq) {
                document.getElementById('nomeEquipe').textContent = 'Não alocado';
                document.getElementById('areaAtuacao').textContent = 'Sem equipe';
                return;
            }

            // Extrai posição do nome da equipe
            let posicao = 'Piloto';
            const nomeEq = eq.nome?.toUpperCase() || '';
            if (nomeEq.includes('P1')) posicao = 'P1';
            else if (nomeEq.includes('P2')) posicao = 'P2';
            else if (nomeEq.includes('P3')) posicao = 'P3';
            else if (nomeEq.includes('P4')) posicao = 'P4';
            else if (nomeEq.includes('APOIO 1')) posicao = 'Apoio 1';
            else if (nomeEq.includes('APOIO 2')) posicao = 'Apoio 2';
            else if (nomeEq.includes('ROTA')) posicao = 'Piloto';

            // Etiqueta: "Escala atual · P2"
            document.getElementById('etiquetaEscala').textContent = `Escala atual · ${posicao}`;
            document.getElementById('nomeEquipe').textContent = eq.nome || '—';

            // Área de atuação
            let area = '—';
            if (nomeEq.includes('ROTA 1') || nomeEq.includes('ROTA 2')) area = 'Farm de Lockpick';
            else if (nomeEq.includes('ROTA 3') || nomeEq.includes('ROTA 4')) area = 'Farm de Flipper';
            else if (nomeEq.includes('VENDAS P1')) area = 'Vendas de Lockpick';
            else if (nomeEq.includes('VENDAS P2')) area = 'Vendas de Flipper';
            else if (nomeEq.includes('APOIO 1') || nomeEq.includes('APOIO 2')) area = 'Segurança / Apoio';
            document.getElementById('areaAtuacao').textContent = area;

            // Posição e demais
            document.getElementById('minhaPosicao').textContent = posicao;
            document.getElementById('integrantes').textContent = ponto.nome || passaporteUsuario;
        }

        // Botão Trocar Equipe — preparado
        document.getElementById('btnTrocarEquipe').addEventListener('click', () => {
            alert('Sistema de troca de equipe em desenvolvimento!\nEm breve você poderá escolher outra equipe com vagas.');
        });

        verificarJornada();
    </script>
</body>
</html>
