        <script>
        // ========== CONFIGURAÇÃO DAS EQUIPES ==========
        const regrasEquipes = {
            'ROTA 1': { area: 'Farm de Lockpick', tipo: 'rota', veiculo: 'Veículo de serviço' },
            'ROTA 2': { area: 'Farm de Lockpick', tipo: 'rota', veiculo: 'Veículo de serviço' },
            'ROTA 3': { area: 'Farm de Flipper', tipo: 'rota', veiculo: 'Veículo de serviço' },
            'ROTA 4': { area: 'Farm de Flipper', tipo: 'rota', veiculo: 'Veículo de serviço' },
            'P1': { area: 'Vendas de Lockpick', tipo: 'venda', posicao: 'P1', veiculo: 'N/A' },
            'P2': { area: 'Vendas de Flipper', tipo: 'venda', posicao: 'P2', veiculo: 'N/A' },
            'APOIO 1': { area: 'Segurança - Auxiliar', tipo: 'apoio', posicao: 'Apoio 1 (P1 — Favela)', veiculo: 'N/A' },
            'APOIO 2': { area: 'Segurança - Auxiliar', tipo: 'apoio', posicao: 'Apoio 2 (P2 — Favela)', veiculo: 'N/A' }
        };

        // ========== FORMATAR DATA ==========
        function formatarData(data) {
            if (!data) return "—";
            const d = new Date(data);
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const ano = d.getFullYear();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${ano} · ${h}:${m}`;
        }

        // ========== DEFINIR POSIÇÃO POR ORDEM DE ENTRADA ==========
        function definirPosicao(ordem, tipo) {
            if (tipo !== 'rota') return null; // só aplica em rotas
            if (ordem === 1) return 'Piloto';
            return `Assento ${ordem}`;
        }
        
        // ========== CARREGAR TUDO ==========
        async function carregarDados() {
            const passaporte = localStorage.getItem('passaporte');
            
            if (!passaporte) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                // 1. Buscar dados do membro logado
                const { data: membro, error: erroMembro } = await sb
                    .from('membros')
                    .select('nome, passaporte, cargo, equipe_id, id')
                    .eq('passaporte', passaporte)
                    .single();
                
                if (erroMembro) throw erroMembro;
                
                // 2. Verificar se tem jornada ativa
                const { data: meuPonto } = await sb
                    .from('pontos')
                    .select('*')
                    .eq('passaporte', passaporte)
                    .is('saida', null)
                    .order('entrada', { ascending: false })
                    .limit(1)
                    .maybeSingle();

                const temJornadaAtiva = !!meuPonto;

                if (!temJornadaAtiva) {
                    document.getElementById('areaConteudo').innerHTML = `
                        <div class="sem-acesso">
                            <i class="fas fa-info-circle"></i>
                            <p>Você ainda não está em serviço.<br>Inicie a jornada pelo Ponto.</p>
                            <a href="bate-ponto.html" class="botao-ir">Ir para o Ponto</a>
                        </div>
                    `;
                    return;
                }

                if (!membro.equipe_id) {
                    document.getElementById('areaConteudo').innerHTML = `
                        <div class="sem-acesso">
                            <i class="fas fa-users-slash"></i>
                            <p>Jornada ativa, mas sem equipe alocada.</p>
                            <a href="bate-ponto.html" class="botao-ir">Ir para o Ponto</a>
                        </div>
                    `;
                    return;
                }

                // 3. Buscar dados da equipe
                const { data: equipe, error: erroEquipe } = await sb
                    .from('equipes')
                    .select('*')
                    .eq('id', membro.equipe_id)
                    .single();
                
                if (erroEquipe) throw erroEquipe;

                // 4. Buscar TODOS os membros da equipe que estão em serviço
                const { data: todosPontos, error: erroPontos } = await sb
                    .from('pontos')
                    .select('passaporte, entrada')
                    .eq('equipe_id', membro.equipe_id)
                    .is('saida', null)
                    .order('entrada', { ascending: true }); // do PRIMEIRO ao ÚLTIMO a entrar

                if (erroPontos) throw erroPontos;

                // 5. Descobrir a posição (ordem) do usuário logado
                let minhaOrdem = null;
                if (todosPontos) {
                    for (let i = 0; i < todosPontos.length; i++) {
                        if (todosPontos[i].passaporte === passaporte) {
                            minhaOrdem = i + 1; // 1º = índice 0 → ordem 1
                            break;
                        }
                    }
                }

                // 6. Aplicar regras
                const regra = regrasEquipes[equipe.nome] || {};
                const areaAtuacao = regra.area || equipe.area || 'A definir';
                const veiculo = regra.veiculo || '—';
                
                let posicao = regra.posicao;
                if (!posicao && regra.tipo === 'rota' && minhaOrdem) {
                    posicao = definirPosicao(minhaOrdem, 'rota');
                }
                if (!posicao) posicao = '—';

                // 7. Mostrar tudo
                document.getElementById('areaConteudo').innerHTML = `
                    <div class="card-membro">
                        <div class="icone-perfil">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <div class="info-membro">
                            <h2 class="nome-membro">${membro.nome}</h2>
                            <p class="passaporte-membro">Passaporte · ${membro.passaporte}</p>
                        </div>
                        <div class="status-badge status-ativo">Em Serviço</div>
                    </div>
                    
                    <div class="card-equipe">
                        <p class="etiqueta">Escala Ativa</p>
                        <h3 class="nome-equipe">${equipe.nome}</h3>
                        <p class="desc-equipe">${areaAtuacao}</p>
                        
                        <div class="grade-dados coluna-1">
                            <div class="bloco-dado coluna-1">
                                <p class="rotulo"><i class="fas fa-map-marker-alt"></i> Área de Atuação</p>
                                <p class="valor">${areaAtuacao}</p>
                            </div>
                        </div>
                        
                        <div class="grade-dados">
                            <div class="bloco-dado">
                                <p class="rotulo"><i class="fas fa-user-tag"></i> Minha Posição</p>
                                <p class="valor">${posicao}</p>
                            </div>
                            <div class="bloco-dado">
                                <p class="rotulo"><i class="fas fa-briefcase"></i> Função</p>
                                <p class="valor">${membro.cargo}</p>
                            </div>
                            <div class="bloco-dado">
                                <p class="rotulo"><i class="fas fa-car"></i> Veículo</p>
                                <p class="valor">${veiculo}</p>
                            </div>
                            <div class="bloco-dado">
                                <p class="rotulo"><i class="fas fa-clock"></i> Entrada</p>
                                <p class="valor">${formatarData(meuPonto.entrada)}</p>
                            </div>
                        </div>
                    </div>
                `;
                
            } catch (erro) {
                console.error('Erro:', erro);
                document.getElementById('areaConteudo').innerHTML = `
                    <div class="sem-acesso">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Não foi possível carregar as informações.</p>
                        <a href="bate-ponto.html" class="botao-ir">Ir para o Ponto</a>
                    </div>
                `;
            }
        }
        
        carregarDados();
    </script>
