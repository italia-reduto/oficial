<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">

<title>Minha Equipe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    min-height:100%;
}

body{
    background:#08090d;
    color:#f5f5f5;
    font-family:Inter,Arial,sans-serif;
    padding-bottom:92px;
}

button, a{
    -webkit-tap-highlight-color:transparent;
}

button{
    font-family:inherit;
}

a{
    color:inherit;
    text-decoration:none;
}

/* HEADER */
.header{
    width:100%;
    padding:22px 18px 18px;
    border-bottom:1px solid rgba(255,255,255,.06);
    background: linear-gradient(180deg, rgba(18,18,24,.98), rgba(8,9,13,.98));
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.brand-icon{
    width:43px;
    height:43px;
    flex:none;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#b31324;
    color:#fff;
    font-size:19px;
    box-shadow:0 8px 22px rgba(179,19,36,.18);
}

.brand-info{
    min-width:0;
}

.brand-title{
    font-size:14px;
    font-weight:800;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brand-subtitle{
    margin-top:4px;
    font-size:11px;
    color:#8e919b;
}

.logout{
    border:1px solid rgba(255,255,255,.08);
    background:#111219;
    color:#d9d9dd;
    height:38px;
    padding:0 13px;
    border-radius:11px;
    display:flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.logout i{
    font-size:12px;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:620px;
    margin:0 auto;
    padding:20px 16px 25px;
}

.page-heading{
    margin-bottom:18px;
}

.page-heading h1{
    font-size:22px;
    line-height:1.2;
    font-weight:800;
}

.page-heading p{
    margin-top:7px;
    color:#888b95;
    font-size:12px;
    line-height:1.5;
}

/* STATUS */
.status-card{
    width:100%;
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:17px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.status-icon{
    width:39px;
    height:39px;
    flex:none;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(179,19,36,.12);
    color:#e3263d;
    font-size:15px;
}

.status-info{
    min-width:0;
}

.status-label{
    font-size:10px;
    color:#858791;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:700;
}

.status-value{
    margin-top:4px;
    font-size:13px;
    font-weight:700;
}

/* ESTADO VAZIO */
.empty{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
}

.empty-icon{
    width:56px;
    height:56px;
    margin:0 auto 15px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#171820;
    color:#777b87;
    font-size:22px;
}

.empty h2{
    font-size:17px;
    font-weight:800;
}

.empty p{
    max-width:390px;
    margin:8px auto 18px;
    color:#888b95;
    font-size:12px;
    line-height:1.6;
}

.primary-btn{
    border:0;
    background:#b31324;
    color:#fff;
    min-height:44px;
    padding:0 18px;
    border-radius:12px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(179,19,36,.18);
}

.primary-btn:active{
    transform:scale(.98);
}
      /* CARD DA EQUIPE */
.team-card{
    border:1px solid rgba(255,255,255,.07);
    background: linear-gradient(145deg, #15161d 0%, #101116 55%, #0e0f14 100%);
    border-radius:19px;
    overflow:hidden;
    margin-bottom:14px;
}

.team-top{
    padding:19px 17px 17px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.team-label{
    color:#898c96;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:700;
}

.team-name{
    margin-top:7px;
    font-size:22px;
    font-weight:800;
    line-height:1.2;
}

.team-type{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:6px 9px;
    border-radius:8px;
    background:rgba(179,19,36,.12);
    color:#e32940;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.team-type i{
    font-size:9px;
}

.team-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.team-stat{
    min-width:0;
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.team-stat:nth-child(odd){
    border-right:1px solid rgba(255,255,255,.05);
}

.team-stat:nth-last-child(-n+2){
    border-bottom:0;
}

.team-stat-label{
    color:#777a84;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:700;
}

.team-stat-value{
    margin-top:5px;
    font-size:12px;
    font-weight:700;
    color:#ececef;
    word-break:break-word;
}

/* SEÇÕES */
.section{
    margin-top:14px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:9px;
    padding:0 2px;
}

.section-title h2{
    font-size:13px;
    font-weight:800;
}

.section-title span{
    color:#70737e;
    font-size:10px;
}

/* CARD DE INFORMAÇÕES */
.info-card{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:17px;
    overflow:hidden;
}

.info-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:15px;
    padding:13px 15px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.info-row:last-child{
    border-bottom:0;
}

.info-left{
    min-width:0;
}

.info-label{
    color:#777a84;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.7px;
    font-weight:700;
}

.info-value{
    margin-top:4px;
    font-size:12px;
    color:#ececef;
    font-weight:700;
    word-break:break-word;
    text-align:right;
}

/* RESPONSÁVEL */
.responsible-card{
    border:1px solid rgba(179,19,36,.20);
    background: linear-gradient(135deg, rgba(179,19,36,.10), rgba(16,17,22,.98));
    border-radius:17px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.responsible-icon{
    width:42px;
    height:42px;
    flex:none;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(179,19,36,.15);
    color:#e3263d;
}

.responsible-info{
    min-width:0;
}

.responsible-label{
    color:#888b95;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.8px;
    font-weight:700;
}

.responsible-name{
    margin-top:4px;
    font-size:13px;
    font-weight:800;
}

.responsible-cargo{
    margin-top:3px;
    color:#9a9da6;
    font-size:10px;
}

/* MEMBROS */
.members-card{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:17px;
    overflow:hidden;
}

.member{
    display:flex;
    align-items:center;
    gap:11px;
    padding:13px 14px;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.member:last-child{
    border-bottom:0;
}

.member-avatar{
    width:37px;
    height:37px;
    flex:none;
    border-radius:11px;
    background:#191a21;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#b7bac3;
    font-size:13px;
}

.member-main{
    min-width:0;
    flex:1;
}

.member-name{
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.member-meta{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:4px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:4px 6px;
    border-radius:6px;
    background:#191a21;
    color:#8e919b;
    font-size:8px;
    font-weight:700;
}

.member-side{
    flex:none;
    text-align:right;
}

.member-status{
    color:#8e919b;
    font-size:8px;
    font-weight:700;
}

.member-status.ativo{
    color:#dce0e7;
}

/* LOADING E ERRO */
.loading{
    border:1px solid rgba(255,255,255,.07);
    background:#101116;
    border-radius:18px;
    padding:25px 18px;
    text-align:center;
    color:#858892;
    font-size:12px;
}

.loading i{
    margin-right:7px;
}

.error-card{
    display:none;
    border:1px solid rgba(179,19,36,.25);
    background:rgba(179,19,36,.07);
    border-radius:16px;
    padding:14px;
    margin-bottom:14px;
    color:#e8a5ad;
    font-size:11px;
    line-height:1.5;
}

/* NAVEGAÇÃO INFERIOR */
.bottom-nav{
    position:fixed;
    z-index:50;
    left:0;
    right:0;
    bottom:0;
    height:76px;
    background:rgba(10,11,15,.97);
    border-top:1px solid rgba(255,255,255,.07);
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(12px);
}

.nav-inner{
    width:100%;
    max-width:620px;
    height:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    color:#666974;
    font-size:9px;
    font-weight:700;
}

.nav-item i{
    font-size:17px;
}

.nav-item.active{
    color:#e3263d;
}

@media(max-width:380px){
    .container{padding-left:12px;padding-right:12px;}
    .header{padding-left:14px;padding-right:14px;}
    .team-name{font-size:20px;}
    .logout{padding:0 10px;}
    .logout span{display:none;}
}
</style>
</head>
<body>
      <header class="header">
    <div class="header-top">

                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="brand-info">

</header>

<main class="container">

<nav class="bottom-nav">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
    "https://vclwmikzmnuqfdxobtik.supabase.co",
    "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF"
);

let usuario = null;
let equipeAtual = null;
let pontoAtual = null;
let membrosEquipe = [];

const prioridadeCargos = {
    "mentor": 6,
    "controle": 5,
    "o vigia": 4,
    "raíz": 3,
    "raiz": 3,
    "executor": 2,
    "novato": 1
};

const conteudo = document.getElementById("conteudo");
const statusEscala = document.getElementById("statusEscala");
const erroCard = document.getElementById("erroCard");
const usuarioNome = document.getElementById("usuarioNome");
const usuarioPassaporte = document.getElementById("usuarioPassaporte");
const btnSair = document.getElementById("btnSair");

function escaparHTML(valor){
    if(valor === null || valor === undefined) return "";
    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function mostrarErro(mensagem){
    erroCard.textContent = mensagem;
    erroCard.style.display = "block";
}

function esconderErro(){
    erroCard.textContent = "";
    erroCard.style.display = "none";
}

function normalizar(valor){
    return String(valor || "").trim().toLowerCase();
}

function formatarData(data){
    if(!data) return "—";
    const d = new Date(data);
    if(Number.isNaN(d.getTime())) return "—";
    return d.toLocaleString("pt-BR",{
        day:"2-digit", month:"2-digit", year:"numeric",
        hour:"2-digit", minute:"2-digit"
    });
}

function obterPrioridade(cargo){
    return prioridadeCargos[normalizar(cargo)] || 0;
}

function nomeCargo(valor){
    if(!valor) return "Não informado";
    return valor;
}

function carregarUsuario(){
    const salvo = sessionStorage.getItem("italia_usuario");
    if(!salvo){
        window.location.href = "login.html";
        return false;
    }
    try{
        usuario = JSON.parse(salvo);
    }catch(e){
        sessionStorage.removeItem("italia_usuario");
        window.location.href = "login.html";
        return false;
    }
    if(!usuario || !usuario.passaporte){
        sessionStorage.removeItem("italia_usuario");
        window.location.href = "login.html";
        return false;
    }
    usuarioNome.textContent = usuario.nome || "Usuário";
    usuarioPassaporte.textContent = "Passaporte " + usuario.passaporte;
    return true;
}

btnSair.addEventListener("click",function(){
    sessionStorage.removeItem("italia_usuario");
    window.location.href = "login.html";
});
      async function buscarPontoAtual(){
    const { data, error } = await supabaseClient
        .from("pontos")
        .select("*")
        .eq("passaporte",String(usuario.passaporte))
        .in("status",["ativo","pausado"])
        .order("entrada",{ascending:false})
        .limit(1);

    if(error) throw error;
    if(!data || !data.length){
        pontoAtual = null;
        return null;
    }
    pontoAtual = data[0];
    return pontoAtual;
}

async function buscarEquipe(equipeId){
    if(!equipeId) return null;
    const { data, error } = await supabaseClient
        .from("equipes")
        .select("*")
        .eq("id",equipeId)
        .limit(1);

    if(error) throw error;
    if(!data || !data.length) return null;
    equipeAtual = data[0];
    return equipeAtual;
}

async function buscarMembrosEquipe(equipeId){
    if(!equipeId) return [];
    const { data, error } = await supabaseClient
        .from("equipe_membros")
        .select("*")
        .eq("equipe_id",equipeId)
        .neq("status","fora")
        .order("entrou_em",{ascending:true});

    if(error) throw error;
    membrosEquipe = data || [];
    return membrosEquipe;
}

async function buscarCargosAdministrativos(membros){
    if(!membros || !membros.length) return membros;
    const passaportes = membros.map(m => m.passaporte).filter(Boolean).map(String);
    if(!passaportes.length) return membros;

    const { data, error } = await supabaseClient
        .from("Membros")
        .select("Passaporte,Nome,Cargo")
        .in("Passaporte",passaportes);

    if(error){
        console.warn("Erro cargos:", error);
        return membros;
    }

    const mapa = {};
    (data || []).forEach(m => mapa[String(m.Passaporte)] = {nome:m.Nome, cargo:m.Cargo});
    
    return membros.map(membro => ({
        ...membro,
        cargoAdministrativo: mapa[String(membro.passaporte)]?.cargo || null
    }));
}

function encontrarResponsavel(membros){
    if(!membros || !membros.length) return null;
    const ordenados = [...membros].sort((a,b)=>{
        const pA = obterPrioridade(a.cargoAdministrativo);
        const pB = obterPrioridade(b.cargoAdministrativo);
        if(pA !== pB) return pB - pA;
        return new Date(a.entrou_em || 0) - new Date(b.entrou_em || 0);
    });
    return ordenados[0];
}

async function renderizarTela(){
    esconderErro();
    conteudo.innerHTML = `<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</div>`;

    try{
        const ponto = await buscarPontoAtual();
        statusEscala.textContent = ponto ? "Ponto ativo" : "Sem ponto ativo";
        statusEscala.style.color = ponto ? "#22c55e" : "#e3263d";

        if(!ponto || !ponto.equipe_id){
            conteudo.innerHTML = `
                <div class="empty">
                    <div class="empty-icon"><i class="fa-solid fa-users-slash"></i></div>
                    <h2>Sem equipe vinculada</h2>
                    <p>Inicie sua jornada para ser alocado.</p>
                    <a href="bate-ponto.html"><button class="primary-btn">Ir para o Ponto</button></a>
                </div>
            `;
            return;
        }

        const [equipe, membros] = await Promise.all([
            buscarEquipe(ponto.equipe_id),
            buscarMembrosEquipe(ponto.equipe_id)
        ]);

        const membrosComCargos = await buscarCargosAdministrativos(membros);
        const responsavel = encontrarResponsavel(membrosComCargos);

        conteudo.innerHTML = `
            <div class="team-card">
                <div class="team-top">
                    <p class="team-label">Equipe Atual</p>
                    <h2 class="team-name">${escaparHTML(equipe?.nome || "DESCONHECIDA")}</h2>
                    <div class="team-type"><i class="fas fa-layer-group"></i> ${escaparHTML(equipe?.funcao || "NÃO INFORMADO")}</div>
                </div>
                <div class="team-grid">
                    <div class="team-stat"><p class="team-stat-label">Membros</p><p class="team-stat-value">${membrosComCargos.length}/4</p></div>
                    <div class="team-stat"><p class="team-stat-label">Regra</p><p class="team-stat-value">Máximo 4</p></div>
                    <div class="team-stat"><p class="team-stat-label">Status</p><p class="team-stat-value">${equipe?.ativa ? "Ativa" : "Inativa"}</p></div>
                    <div class="team-stat"><p class="team-stat-label">Área</p><p class="team-stat-value">${escaparHTML(equipe?.area || "Farm")}</p></div>
                </div>
            </div>

            <div class="section-title"><h2>Minha Participação</h2></div>
            <div class="info-card">
                <div class="info-row"><div class="info-left"><p class="info-label">Cargo</p></div><p class="info-value">${nomeCargo(usuario.cargo)}</p></div>
                <div class="info-row"><div class="info-left"><p class="info-label">Posição</p></div><p class="info-value">Não definida</p></div>
                <div class="info-row"><div class="info-left"><p class="info-label">Entrada</p></div><p class="info-value">${formatarData(ponto.entrada)}</p></div>
                <div class="info-row"><div class="info-left"><p class="info-label">Status</p></div><p class="info-value" style="color:#22c55e">Ativo</p></div>
            </div>

            <div class="section-title" style="margin-top:20px;"><h2>Responsável</h2></div>
            <div class="responsible-card">
                <div class="responsible-icon"><i class="fas fa-crown"></i></div>
                <div class="responsible-info">
                    <p class="responsible-label">ATUAL</p>
                    <p class="responsible-name">${escaparHTML(responsavel?.nome || responsavel?.passaporte || "—")}</p>
                    <p class="responsible-cargo">${nomeCargo(responsavel?.cargoAdministrativo)}</p>
                </div>
            </div>

            <div class="section-title" style="margin-top:20px;"><h2>Membros</h2><span>${membrosComCargos.length}</span></div>
            <div class="members-card">
                ${membrosComCargos.map(m => `
                    <div class="member">
                        <div class="member-avatar"><i class="fas fa-user"></i></div>
                        <div class="member-main">
                            <div class="member-name">${escaparHTML(m.nome || `PASS ${m.passaporte}`)}</div>
                            <div class="member-meta"><span class="badge">${nomeCargo(m.cargoAdministrativo)}</span></div>
                        </div>
                        <span class="member-status ativo">Ativo</span>
                    </div>
                `).join("")}
            </div>
        `;

    } catch(e){
        console.error(e);
        mostrarErro("Erro: " + e.message);
    }
}

document.addEventListener("DOMContentLoaded",()=>{
    if(carregarUsuario()) renderizarTela();
});

</script>
</body>
</html>
