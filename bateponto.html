<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itália 2.0 | Ponto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <style>
        :root { --verde: #22c55e; --fundo: #0a0f0d; --vidro: rgba(15, 23, 20, 0.6); --borda: rgba(34, 197, 94, 0.2); --texto: #f3f4f6; --texto-mutado: #9ca3af; --amarelo: #eab308; --vermelho: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px; position: relative; }
        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; z-index: 10; padding-bottom: 100px; }
        
        .topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .titulo { font-family: 'Oswald'; font-size: 24px; color: #fff; }
        .subtitulo { font-size: 12px; color: var(--texto-mutado); margin-top: 4px; }
        .btn-sair { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--vermelho); padding: 8px 15px; border-radius: 8px; font-family: 'Oswald'; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .info-usuario { display: flex; gap: 20px; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .info-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--texto-mutado); }
        .info-item strong { color: #fff; }
        .info-item i { color: var(--verde); }

        .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .card-stat { background: var(--vidro); border: 1px solid var(--borda); border-radius: 12px; padding: 15px; }
        .stat-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--texto-mutado); margin-bottom: 8px; font-weight: 500; text-transform: uppercase; }
        .stat-header i { color: var(--verde); font-size: 14px; }
        .stat-valor { font-family: 'Oswald'; font-size: 22px; color: #fff; }

        .painel-principal { background: var(--vidro); border: 1px solid var(--borda); border-radius: 16px; padding: 20px; text-align: center; }
        .abas-internas { display: flex; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 4px; margin-bottom: 25px; }
        .aba-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--texto-mutado); font-family: 'Inter'; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: 0.3s; }
        .aba-btn.ativo { background: rgba(34, 197, 94, 0.15); color: var(--verde); border: 1px solid rgba(34, 197, 94, 0.3); }
        
        .cronometro-display { font-family: 'Oswald'; font-size: 56px; color: #fff; line-height: 1; margin-bottom: 10px; }
        .cronometro-label { font-size: 13px; color: var(--texto-mutado); margin-bottom: 25px; }

        .btn-iniciar { width: 100%; background: var(--verde); color: #000; border: none; padding: 16px; border-radius: 8px; font-family: 'Oswald'; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-iniciar:hover { background: #4ade80; transform: translateY(-2px); }

        #tela-ativo { display: none; flex-direction: column; text-align: center; }
        .tag-ponto { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; margin: 0 auto 20px auto; }
        .tag-ponto .dot { width: 8px; height: 8px; background: var(--verde); border-radius: 50%; box-shadow: 0 0 8px var(--verde); }
        .tag-ponto.pausado .dot { background: var(--amarelo); box-shadow: 0 0 8px var(--amarelo); }

        .botoes-acao { display: flex; gap: 10px; margin-top: 20px; }
        .btn-acao { flex: 1; padding: 12px; border-radius: 8px; font-family: 'Oswald'; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; background: transparent; }
        .btn-pausar { border: 1px solid var(--amarelo); color: var(--amarelo); }
        .btn-retomar { border: 1px solid var(--verde); color: var(--verde); display: none; }
        .btn-encerrar { border: 1px solid var(--vermelho); color: var(--vermelho); }

        .alerta-custom { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 13, 0.95); border: 1px solid var(--verde); border-radius: 12px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; z-index: 9999; min-width: 280px; transition: top 0.4s; }
        .alerta-custom.ativo { top: 20px; }
        .alerta-custom i { font-size: 24px; color: var(--verde); }
        .alerta-custom p { font-size: 13px; color: #fff; }
        .alerta-custom.erro { border-color: var(--vermelho); } .alerta-custom.erro i { color: var(--vermelho); }

        .menu-inferior { position: fixed; bottom: 20px; left: 5%; right: 5%; margin: 0 auto; max-width: 400px; background: rgba(10, 15, 13, 0.95); border: 1px solid var(--borda); border-radius: 25px; display: flex; justify-content: space-around; padding: 10px 20px; z-index: 9999; }
        .item-menu { display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: var(--texto-mutado); font-size: 10px; }
        .item-menu i { font-size: 18px; }
        .item-menu.ativo { color: var(--verde); }
    </style>
</head>
<body>
    <div class="fundo-degrade"></div>

    <div class="container">
        <div class="topo">
            <div>
                <h1 class="titulo">Controle de Ponto</h1>
                <p class="subtitulo">Acompanhe sua jornada e seu histórico</p>
            </div>
            <button class="btn-sair" onclick="sair()"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </div>

        <div class="info-usuario">
            <div class="info-item"><i class="fas fa-user"></i> Nome: <strong id="user-nome">...</strong></div>
            <div class="info-item"><i class="fas fa-id-card"></i> Passaporte: <strong id="user-pass">...</strong></div>
        </div>

        <div class="grid-stats">
            <div class="card-stat">
                <div class="stat-header">Meu Status <i class="fas fa-clock"></i></div>
                <div class="stat-valor" id="stat-status">Fora</div>
            </div>
            <div class="card-stat">
                <div class="stat-header">Hoje <i class="fas fa-calendar-day"></i></div>
                <div class="stat-valor" id="stat-hoje">0m</div>
            </div>
            <div class="card-stat">
                <div class="stat-header">Pausas <i class="fas fa-mug-hot"></i></div>
                <div class="stat-valor" id="stat-pausas">0</div>
            </div>
            <div class="card-stat">
                <div class="stat-header">Semana <i class="fas fa-calendar-week"></i></div>
                <div class="stat-valor" id="stat-semana">0m</div>
            </div>
        </div>

        <div class="painel-principal">
            <div class="abas-internas">
                <button class="aba-btn ativo">Meu Ponto</button>
                <button class="aba-btn" onclick="window.location.href='historico.html'">Histórico</button>
            </div>

            <!-- TELA INICIAL -->
            <div id="tela-inicial">
                <div class="cronometro-display">00:00:00</div>
                <p class="cronometro-label">Tempo de jornada</p>
                <button class="btn-iniciar" onclick="iniciarJornada()"><i class="fas fa-play"></i> Iniciar Jornada</button>
            </div>

            <!-- TELA ATIVA -->
            <div id="tela-ativo">
                <div class="tag-ponto" id="tag-status"><div class="dot"></div> <span id="txt-tag">Em Serviço</span></div>
                <div class="cronometro-display" id="cronometro-display">00:00:00</div>
                <p class="cronometro-label">Tempo de jornada</p>
                
                <div class="botoes-acao">
                    <button class="btn-acao btn-pausar" id="btn-pausar" onclick="pausarTurno()"><i class="fas fa-pause"></i> Pausar</button>
                    <button class="btn-acao btn-retomar" id="btn-retomar" onclick="retomarTurno()"><i class="fas fa-play"></i> Retomar</button>
                    <button class="btn-acao btn-encerrar" onclick="solicitarEncerramento()"><i class="fas fa-stop"></i> Encerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="alerta-custom" id="alerta-site"><i class="fas fa-check-circle" id="alerta-icone"></i><p id="alerta-texto">Mensagem</p></div>
    
    <nav class="menu-inferior">
        <a href="dashboard.html" class="item-menu"><i class="fas fa-home"></i><span>Painel</span></a>
        <a href="bateponto.html" class="item-menu ativo"><i class="fas fa-clock"></i><span>Ponto</span></a>
        <a href="equipe.html" class="item-menu"><i class="fas fa-users"></i><span>Equipe</span></a>
        <a href="atendimento.html" class="item-menu"><i class="fas fa-headset"></i><span>Tickets</span></a>
        <a href="mais.html" class="item-menu"><i class="fas fa-bars"></i><span>Mais</span></a>
    </nav>
        <script>
        let membroLogado = null;
        let pontoAtual = null;
        let intervaloCronometro = null;
        let intervaloStats = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';
            membroLogado = JSON.parse(logado);
            
            document.getElementById('user-nome').innerText = membroLogado.nome;
            document.getElementById('user-pass').innerText = membroLogado.passaporte;

            verificarPonto();
            carregarEstatisticas();
            
            // Atualiza as estatísticas a cada 1 minuto (para o tempo de "Hoje" ir subindo)
            intervaloStats = setInterval(carregarEstatisticas, 60000);
        });

        async function verificarPonto() {
            const { data } = await sb.from('pontos').select('*').eq('passaporte', membroLogado.passaporte).in('status', ['aberto', 'pausado']).maybeSingle();

            if (data) {
                pontoAtual = data;
                document.getElementById('tela-inicial').style.display = 'none';
                document.getElementById('tela-ativo').style.display = 'flex';
                document.getElementById('stat-status').innerText = data.status === 'pausado' ? 'Pausado' : 'Em Serviço';

                if (data.status === 'pausado') {
                    document.getElementById('tag-status').classList.add('pausado');
                    document.getElementById('txt-tag').innerText = 'Pausado';
                    document.getElementById('btn-pausar').style.display = 'none';
                    document.getElementById('btn-retomar').style.display = 'flex';
                    iniciarCronometroPausa(data.pausa_inicio);
                } else {
                    document.getElementById('tag-status').classList.remove('pausado');
                    document.getElementById('txt-tag').innerText = 'Em Serviço';
                    document.getElementById('btn-pausar').style.display = 'flex';
                    document.getElementById('btn-retomar').style.display = 'none';
                    iniciarCronometro(data.entrada);
                }
            } else {
                document.getElementById('tela-inicial').style.display = 'block';
                document.getElementById('tela-ativo').style.display = 'none';
                document.getElementById('stat-status').innerText = 'Fora';
            }
        }

        async function iniciarJornada() {
            try {
                const { data: equipes, error: eqError } = await sb.from('equipes').select('*').eq('ativa', true);
                if (eqError || !equipes || equipes.length === 0) {
                    return customAlert("Nenhuma equipe ativa encontrada. Contate a liderança.", "erro");
                }

                const equipeSorteada = equipes[Math.floor(Math.random() * equipes.length)];

                const { error } = await sb.from('pontos').insert([{ 
                    passaporte: membroLogado.passaporte, 
                    nome: membroLogado.nome, 
                    entrada: new Date().toISOString(), 
                    status: 'aberto', 
                    equipe_id: equipeSorteada.id, 
                    posicao: equipeSorteada.nome,
                    troca_equipe_em: new Date().toISOString(),
                    pausa_qtd: 0,
                    pausa_acumulada_seg: 0
                }]);
                
                if (error) throw error;
                
                customAlert(`Sorteio concluído: Você foi para ${equipeSorteada.nome}!`);
                verificarPonto();
                carregarEstatisticas();
            } catch (err) { 
                console.error(err);
                customAlert("Erro ao iniciar jornada.", "erro"); 
            }
        }

        function iniciarCronometro(entrada) {
            if (intervaloCronometro) clearInterval(intervaloCronometro);
            const display = document.getElementById('cronometro-display');
            const dataEntrada = new Date(entrada);

            intervaloCronometro = setInterval(() => {
                const dif = new Date() - dataEntrada;
                if (dif < 0) return;
                const h = Math.floor(dif / 3600000);
                const m = Math.floor((dif / 60000) % 60);
                const s = Math.floor((dif / 1000) % 60);
                display.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        function iniciarCronometroPausa(pausaInicio) {
            if (intervaloCronometro) clearInterval(intervaloCronometro);
            const display = document.getElementById('cronometro-display');
            const dataPausa = new Date(pausaInicio);

            intervaloCronometro = setInterval(() => {
                const dif = new Date() - dataPausa;
                if (dif < 0) return;
                const h = Math.floor(dif / 3600000);
                const m = Math.floor((dif / 60000) % 60);
                const s = Math.floor((dif / 1000) % 60);
                display.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }, 1000);
        }

        async function pausarTurno() {
            if(!confirm("Deseja pausar o turno?")) return;
            await sb.from('pontos').update({ 
                status: 'pausado', 
                pausa_inicio: new Date().toISOString(),
                pausa_qtd: (pontoAtual.pausa_qtd || 0) + 1
            }).eq('id', pontoAtual.id);
            verificarPonto();
            carregarEstatisticas();
        }

        async function retomarTurno() {
            if(!confirm("Deseja retomar o turno?")) return;
            const agora = new Date();
            const segPausados = Math.floor((agora - new Date(pontoAtual.pausa_inicio)) / 1000);
            
            await sb.from('pontos').update({ 
                status: 'aberto', 
                pausa_fim: agora.toISOString(),
                pausa_acumulada_seg: (pontoAtual.pausa_acumulada_seg || 0) + segPausados
            }).eq('id', pontoAtual.id);
            verificarPonto();
            carregarEstatisticas();
        }

        async function solicitarEncerramento() {
            if(!confirm("Deseja encerrar o seu turno agora?")) return;
            const saida = new Date();
            await sb.from('pontos').update({ status: 'fechado', saida: saida.toISOString() }).eq('id', pontoAtual.id);
            
            await sb.from('presencas').upsert([{ 
                passaporte: membroLogado.passaporte, 
                status: 'presente', 
                data: saida.toISOString().split('T')[0], 
                marcado_por_nome: 'Sistema', 
                marcado_em: saida.toISOString() 
            }], { onConflict: 'data,passaporte' });

            customAlert("Turno encerrado! +1 Presença registrada.");
            setTimeout(() => { verificarPonto(); carregarEstatisticas(); }, 1500);
        }

        async function carregarEstatisticas() {
            const hojeStr = new Date().toISOString().split('T')[0];
            const inicioSemana = new Date();
            inicioSemana.setDate(inicioSemana.getDate() - inicioSemana.getDay()); // Pega o Domingo como início da semana
            const inicioSemanaStr = inicioSemana.toISOString().split('T')[0];

            // Busca pontos de Hoje e da Semana
            const { data: pontosHoje } = await sb.from('pontos').select('*').eq('passaporte', membroLogado.passaporte).gte('entrada', hojeStr + 'T00:00:00Z');
            const { data: pontosSemana } = await sb.from('pontos').select('*').eq('passaporte', membroLogado.passaporte).gte('entrada', inicioSemanaStr + 'T00:00:00Z');
            
            let minutosHoje = 0;
            let pausasHoje = 0;
            
            if (pontosHoje) {
                pontosHoje.forEach(p => {
                    // Calcula o tempo total (se estiver aberto, conta até agora)
                    let fim = p.saida ? new Date(p.saida) : new Date();
                    let inicio = new Date(p.entrada);
                    let difMin = (fim - inicio) / 60000;
                    
                    // Subtrai o tempo pausado
                    if(p.pausa_acumulada_seg) difMin -= (p.pausa_acumulada_seg / 60);
                    
                    minutosHoje += Math.max(0, difMin);
                    pausasHoje += (p.pausa_qtd || 0);
                });
            }

            let minutosSemana = 0;
            if (pontosSemana) {
                pontosSemana.forEach(p => {
                    let fim = p.saida ? new Date(p.saida) : new Date();
                    let inicio = new Date(p.entrada);
                    let difMin = (fim - inicio) / 60000;
                    if(p.pausa_acumulada_seg) difMin -= (p.pausa_acumulada_seg / 60);
                    minutosSemana += Math.max(0, difMin);
                });
            }

            // Função para formatar minutos em "Xh YY" ou "YYm"
            const formatarTempo = (mins) => {
                mins = Math.floor(mins);
                if (mins < 60) return `${mins}m`;
                const h = Math.floor(mins / 60);
                const m = mins % 60;
                return `${h}h${String(m).padStart(2, '0')}`;
            };

            document.getElementById('stat-hoje').innerText = formatarTempo(minutosHoje);
            document.getElementById('stat-semana').innerText = formatarTempo(minutosSemana);
            document.getElementById('stat-pausas').innerText = pausasHoje;
        }

        function customAlert(msg, tipo='sucesso') {
            const a = document.getElementById('alerta-site'); const t = document.getElementById('alerta-texto'); const i = document.getElementById('alerta-icone');
            t.innerText = msg; 
            i.className = tipo === 'erro' ? 'fas fa-times-circle' : 'fas fa-check-circle';
            a.style.borderColor = tipo === 'erro' ? 'var(--vermelho)' : 'var(--verde)';
            i.style.color = tipo === 'erro' ? 'var(--vermelho)' : 'var(--verde)';
            a.classList.add('ativo'); 
            setTimeout(() => a.classList.remove('ativo'), 3000);
        }

        function sair() { sessionStorage.removeItem('membro_logado'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
