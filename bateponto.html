    <style>
        :root {
            --verde: #22c55e;
            --fundo: #0a0f0d;
            --vidro: rgba(15, 23, 20, 0.6);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
            --amarelo: #eab308;
            --vermelho: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html { background-color: #0a0f0d; overflow-x: hidden; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        .grade-fundo { position: fixed; inset: 0; background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; mask-image: radial-gradient(circle at center, black 10%, transparent 90%); -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%); }
        .particula { position: fixed; bottom: -10px; background-color: var(--verde); border-radius: 50%; box-shadow: 0 0 10px var(--verde); opacity: 0; animation: subir linear infinite; z-index: 5; }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        @keyframes subir { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 10; padding-bottom: 40px; }
        .topo { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .btn-voltar { width: 40px; height: 40px; background: var(--vidro); border: 1px solid var(--borda); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--texto-mutado); font-size: 18px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-voltar:hover { color: var(--verde); border-color: var(--verde); }
        .titulo { font-family: 'Oswald', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        
        #lista-plantoes { display: flex; flex-direction: column; gap: 12px; width: 100%; }

        .card-plantao { background: var(--vidro); backdrop-filter: blur(20px); border-radius: 12px; padding: 20px; border: 1px solid var(--borda); transition: 0.3s; position: relative; overflow: hidden; -webkit-mask-image: -webkit-radial-gradient(white, black); transform: translateZ(0); width: 100%; display: block; }
        .card-plantao.aberto { border-color: var(--verde); box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
        .card-plantao.lotado { opacity: 0.5; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; position: relative; z-index: 2; }
        .card-nome { font-family: 'Oswald', sans-serif; font-size: 18px; color: #fff; display: flex; align-items: center; }
        .card-horario { font-size: 12px; color: var(--texto-mutado); }
        .vagas-barra { width: 100%; height: 6px; background: #27272a; border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; z-index: 2; }
        .vagas-preenchida { height: 100%; background: var(--verde); transition: 0.3s; }
        .vagas-texto { font-size: 11px; color: var(--texto-mutado); display: flex; justify-content: space-between; margin-bottom: 15px; position: relative; z-index: 2; }
        .btn-acao-plantao { width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; z-index: 2; }
        .btn-entrar { background: var(--verde); color: #000; }
        .btn-entrar:hover { background: #4ade80; }
        .btn-bloqueado { background: #27272a; color: #52525b; cursor: not-allowed; }
        .btn-em-andamento { background: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid #eab308; }
        .card-plantao.com-imagem { background-size: cover; background-position: center; background-repeat: no-repeat; }
        .card-plantao.com-imagem::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, rgba(10, 15, 13, 0.95) 0%, rgba(10, 15, 13, 0.7) 100%); z-index: 1; }

        #tela-cronometro { display: none; flex-direction: column; align-items: center; justify-content: center; background: var(--vidro); padding: 30px 20px; border-radius: 16px; border: 1px solid var(--verde); box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); text-align: center; }
        .cronometro-titulo { font-family: 'Oswald'; color: var(--verde); font-size: 20px; text-transform: uppercase; margin-bottom: 5px; }
        .cronometro-nome { font-size: 14px; color: #fff; margin-bottom: 20px; }
        .cronometro-display { font-family: 'Oswald'; font-size: 48px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .status-pausa-texto { font-family: 'Oswald'; font-size: 16px; color: var(--amarelo); text-transform: uppercase; margin-bottom: 20px; display: none; }
        
        /* NOVO: BARRA DE XP */
        .xp-container { width: 100%; margin-bottom: 20px; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .xp-texto { font-size: 11px; color: var(--texto-mutado); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .xp-texto span { color: var(--verde); font-weight: bold; }
        .xp-barra-bg { width: 100%; height: 8px; background: #27272a; border-radius: 10px; overflow: hidden; }
        .xp-barra-fill { height: 100%; background: var(--verde); width: 0%; transition: width 1s linear; box-shadow: 0 0 10px var(--verde); }

        .botoes-cronometro { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 20px; }
        .btn-pausa { background: rgba(234, 179, 8, 0.1); color: var(--amarelo); border: 1px solid var(--amarelo); padding: 15px; border-radius: 8px; font-family: 'Oswald'; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; width: 100%; }
        .btn-voltar-servico { background: rgba(34, 197, 94, 0.1); color: var(--verde); border: 1px solid var(--verde); padding: 15px; border-radius: 8px; font-family: 'Oswald'; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; width: 100%; display: none; }
        .btn-encerrar { width: 100%; padding: 15px; background: rgba(239, 68, 68, 0.1); color: var(--vermelho); border: 1px solid var(--vermelho); border-radius: 8px; font-family: 'Oswald'; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }

        /* MODAL DE CONFIRMAÇÃO CUSTOMIZADO */
        .modal-confirmar { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-confirmar.ativo { display: flex; }
        .modal-content-confirmar { background: var(--fundo); border: 1px solid var(--verde); border-radius: 16px; padding: 25px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 0 30px rgba(34, 197, 94, 0.2); }
        .modal-content-confirmar p { font-size: 15px; color: #fff; margin-bottom: 25px; line-height: 1.5; }
        .botoes-confirmar { display: flex; gap: 10px; }
        .btn-sim { flex: 1; background: var(--verde); color: #000; border: none; padding: 12px; border-radius: 8px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-nao { flex: 1; background: transparent; color: var(--vermelho); border: 1px solid var(--vermelho); padding: 12px; border-radius: 8px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; font-size: 16px; }

        .alerta-custom { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 13, 0.95); border: 1px solid var(--verde); border-radius: 12px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2); z-index: 9999; min-width: 280px; transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .alerta-custom.ativo { top: 20px; }
        .alerta-custom i { font-size: 24px; color: var(--verde); }
        .alerta-custom p { font-size: 13px; color: #fff; font-weight: 500; }
        .alerta-custom.erro { border-color: #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2); }
        .alerta-custom.erro i { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="topo">
            <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left"></i></a>
            <h1 class="titulo">Plantões</h1>
        </div>
        
        <p id="subtitulo-plantoes" style="font-size: 13px; color: var(--texto-mutado); margin-bottom: 10px;">Selecione um plantão disponível abaixo:</p>

    <script>
    let membroLogado = null;
    let intervaloCronometro = null;
    let pontoAtual = null;
    let acaoPendente = null; 

    function getMinutosBrasilia() {
        const agora = new Date();
        const formatter = new Intl.DateTimeFormat('pt-BR', {
            timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false
        });
        const [h, m] = formatter.format(agora).split(':').map(Number);
        return (h * 60) + m;
    }

    function verificarStatusHorario(horarioInicio, horarioFim) {
        let minutosAgora = getMinutosBrasilia();
        const [hInicio, mInicio] = horarioInicio.split(':').map(Number);
        const [hFim, mFim] = horarioFim.split(':').map(Number);
        let minutosInicio = (hInicio * 60) + mInicio;
        let minutosFim = (hFim * 60) + mFim;

        if (minutosFim <= minutosInicio) {
            minutosFim += 24 * 60;
            if (minutosAgora < minutosInicio) minutosAgora += 24 * 60;
        }
        
        const tolerancia = 15; 
        const janelaAbertura = minutosInicio - tolerancia;
        const janelaFechamento = minutosInicio + tolerancia;

        if (minutosAgora >= janelaAbertura && minutosAgora <= janelaFechamento) return 'aberto'; 
        if (minutosAgora > janelaFechamento && minutosAgora < minutosFim) return 'em_andamento'; 
        if (minutosAgora >= minutosFim) return 'encerrado'; 
        return 'aguardando'; 
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const logado = sessionStorage.getItem('membro_logado');
        if (!logado) return window.location.href = 'login.html';
        membroLogado = JSON.parse(logado);
        carregarPlantoes();
    });

    async function carregarPlantoes() {
        const container = document.getElementById('lista-plantoes');
        const telaCronometro = document.getElementById('tela-cronometro');
        const subtitulo = document.getElementById('subtitulo-plantoes');
        
        try {
            const { data: pontoAberto } = await sb.from('pontos')
                .select('*, plantoes(nome, horario_fim)')
                .eq('passaporte', membroLogado.passaporte)
                .in('status', ['aberto', 'pausado'])
                .maybeSingle();

            if (pontoAberto) {
                pontoAtual = pontoAberto;
                container.style.display = 'none';
                subtitulo.style.display = 'none';
                telaCronometro.style.display = 'flex';
                
                const nomePlantao = pontoAberto.plantoes ? pontoAberto.plantoes.nome : 'Plantão';
                const fimPlantao = pontoAberto.plantoes ? pontoAberto.plantoes.horario_fim : '23:59';
                
                document.getElementById('nome-plantao-ativo').innerText = nomePlantao;
                
                if (pontoAberto.status === 'pausado') {
                    document.getElementById('status-pausa-texto').style.display = 'block';
                    document.getElementById('cronometro-display').style.color = 'var(--amarelo)';
                    document.getElementById('btn-pausar').style.display = 'none';
                    document.getElementById('btn-retomar').style.display = 'block';
                    document.getElementById('cronometro-display').innerText = "PAUSADO";
                } else {
                    document.getElementById('status-pausa-texto').style.display = 'none';
                    document.getElementById('cronometro-display').style.color = '#fff';
                    document.getElementById('btn-pausar').style.display = 'block';
                    document.getElementById('btn-retomar').style.display = 'none';
                    iniciarCronometro(pontoAberto.entrada, fimPlantao);
                }
                return; 
            }

            container.style.display = 'flex';
            subtitulo.style.display = 'block';
            telaCronometro.style.display = 'none';
            
            const { data: plantoes, error } = await sb.from('plantoes').select('*');
            if (error) throw new Error("Tabela plantoes: " + error.message);
            if (!plantoes || plantoes.length === 0) {
                container.innerHTML = '<p style="color: var(--texto-mutado); text-align: center;">Nenhum plantão cadastrado.</p>';
                return;
            }

            const { data: pontosHoje } = await sb.from('pontos').select('plantao_id').in('status', ['aberto', 'pausado']);
            const ordemHorarios = { '02:00': 0, '04:00': 1, '06:00': 2, '08:00': 3, '10:00': 4, '12:00': 5, '14:00': 6, '16:00': 7, '18:00': 8, '20:00': 9, '22:00': 10, '00:00': 11 };
            let ativos = [], futuros = [];

            plantoes.forEach(p => {
                const status = verificarStatusHorario(p.horario_inicio, p.horario_fim);
                p._status = status;
                if (status === 'aberto' || status === 'em_andamento') ativos.push(p);
                else if (status === 'aguardando') futuros.push(p);
            });

            const ordenar = (a, b) => (ordemHorarios[a.horario_inicio] || 99) - (ordemHorarios[b.horario_inicio] || 99);
            ativos.sort(ordenar);
            futuros.sort(ordenar);
            const plantoesOrdenados = [...ativos, ...futuros];

            let html = '';
            plantoesOrdenados.forEach((p, index) => {
                let status = p._status;
                
                if (index === 0 && status !== 'aberto') status = 'aberto';

                const ocupadas = pontosHoje ? pontosHoje.filter(pt => pt.plantao_id === p.id).length : 0;
                const restantes = p.vagas_totais - ocupadas;
                
                let classeCard = '', btnHtml = '', iconeHtml = '', classeImagem = '', estiloFundo = '';

                if (p.tipo === 'rota') {
                    iconeHtml = '<i class="fas fa-car" style="color: var(--verde); margin-right: 8px;"></i>';
                    classeImagem = 'com-imagem';
                    estiloFundo = `background-image: url('https://raw.githubusercontent.com/italia-reduto/oficial/main/1793658013726.jpg');`;
                } else if (p.tipo === 'venda') {
                    iconeHtml = '<i class="fas fa-dollar-sign" style="color: #eab308; margin-right: 8px;"></i>';
                    classeImagem = 'com-imagem';
                    if (p.nome.toLowerCase().includes('lockpick')) {
                        estiloFundo = `background-image: url('https://raw.githubusercontent.com/italia-reduto/oficial/main/1793659093972.jpg');`;
                    } else {
                        estiloFundo = `background-image: url('https://raw.githubusercontent.com/italia-reduto/oficial/main/1793659504717.jpg');`;
                    }
                } else if (p.tipo === 'apoio') {
                    iconeHtml = '<i class="fas fa-shield-alt" style="color: #3b82f6; margin-right: 8px;"></i>';
                    classeImagem = 'com-imagem';
                    estiloFundo = `background-image: url('https://raw.githubusercontent.com/italia-reduto/oficial/main/1793659618901.jpg');`;
                }

                if (restantes <= 0) {
                    classeCard = 'lotado';
                    btnHtml = `<button class="btn-acao-plantao btn-bloqueado" disabled><i class="fas fa-lock"></i> LOTADO</button>`;
                } else if (status === 'aberto') {
                    classeCard = 'aberto';
                    btnHtml = `<button class="btn-acao-plantao btn-entrar" onclick="entrarPlantao('${p.id}', '${p.nome}')"><i class="fas fa-play"></i> ENTRAR AGORA</button>`;
                } else if (status === 'em_andamento') {
                    btnHtml = `<button class="btn-acao-plantao btn-em-andamento" disabled><i class="fas fa-clock"></i> EM ANDAMENTO</button>`;
                } else {
                    btnHtml = `<button class="btn-acao-plantao btn-bloqueado" disabled><i class="fas fa-clock"></i> AGUARDE HORÁRIO</button>`;
                }

                const porcentagem = (ocupadas / p.vagas_totais) * 100;
                html += `
                    <div class="card-plantao ${classeCard} ${classeImagem}" style="${estiloFundo}">
                        <div class="card-header">
                            <span class="card-nome">${iconeHtml} ${p.nome}</span>
                            <span class="card-horario">${p.horario_inicio} - ${p.horario_fim}</span>
                        </div>
                        <div class="vagas-barra"><div class="vagas-preenchida" style="width: ${porcentagem}%"></div></div>
                        <div class="vagas-texto"><span>Preenchidas: ${ocupadas}/${p.vagas_totais}</span><span>${restantes} restantes</span></div>
                        ${btnHtml}
                    </div>`;
            });
            container.innerHTML = html;
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #fca5a5; padding: 15px; border-radius: 8px; font-size: 13px; text-align: center;">${err.message}</div>`;
        }
    }
                // ==========================================
        // 3. CRONÔMETRO, PAUSAS E XP
        // ==========================================
        function iniciarCronometro(horarioEntrada, horarioFim) {
            if (intervaloCronometro) clearInterval(intervaloCronometro);
            const display = document.getElementById('cronometro-display');
            const dataEntrada = new Date(horarioEntrada);
            const barraXP = document.getElementById('xp-barra-preenchida');
            const textoXP = document.getElementById('xp-status-texto');
            const porcXP = document.getElementById('xp-porcentagem');

            intervaloCronometro = setInterval(async () => {
                const agora = new Date();
                const diferenca = agora - dataEntrada;
                if (diferenca < 0) return;

                const horas = Math.floor(diferenca / (1000 * 60 * 60));
                const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
                const segundos = Math.floor((diferenca / 1000) % 60);
                display.innerText = `${String(horas).padStart(2, '0')}:${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;

                // Lógica da Barra de XP (30 minutos = 100%)
                const minutosTotais = diferenca / 1000 / 60;
                let porcentagem = (minutosTotais / 30) * 100;
                if (porcentagem > 100) porcentagem = 100;
                
                barraXP.style.width = porcentagem + '%';
                porcXP.innerText = Math.floor(porcentagem) + '%';
                
                if (porcentagem >= 100) {
                    textoXP.innerText = "XP Garantido! +20 XP";
                    textoXP.style.color = "var(--verde)";
                } else {
                    const faltam = 30 - Math.floor(minutosTotais);
                    textoXP.innerText = `Faltam ${faltam} min para +20 XP`;
                    textoXP.style.color = "var(--texto-mutado)";
                }

                // Verifica fim do plantão
                const formatter = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false });
                const horaAgoraStr = formatter.format(agora);
                
                if (horaAgoraStr >= horarioFim) {
                    clearInterval(intervaloCronometro);
                    customAlert("O horário do plantão acabou. Fechando automaticamente...", "erro");
                    await processarEncerramento(pontoAtual);
                }
            }, 1000);
        }

        // ==========================================
        // 4. AÇÕES (Confirmar, Entrar, Pausar, Encerrar)
        // ==========================================
        function mostrarConfirmacao(mensagem, acao) {
            document.getElementById('texto-confirmar').innerText = mensagem;
            document.getElementById('modal-confirmar').classList.add('ativo');
            acaoPendente = acao;
        }

        function responderConfirmacao(resposta) {
            document.getElementById('modal-confirmar').classList.remove('ativo');
            if (resposta && acaoPendente) {
                acaoPendente();
            }
            acaoPendente = null;
        }

        async function entrarPlantao(id, nome) {
            mostrarConfirmacao(`Deseja entrar no plantão: ${nome}?`, async () => {
                customAlert(`Entrando em ${nome}...`, "sucesso");
                setTimeout(async () => {
                    try {
                        const { error } = await sb.from('pontos').insert([{
                            passaporte: membroLogado.passaporte,
                            nome: membroLogado.nome,
                            entrada: new Date().toISOString(),
                            status: 'aberto',
                            plantao_id: id
                        }]);
                        if (error) throw error;
                        customAlert("Você entrou no plantão!", "sucesso");
                        setTimeout(() => window.location.reload(), 1500);
                    } catch (err) {
                        customAlert("Erro ao entrar: " + err.message, "erro");
                    }
                }, 500);
            });
        }

        async function pausarTurno() {
            mostrarConfirmacao("Deseja pausar o seu turno? O tempo não contará enquanto estiver pausado.", async () => {
                try {
                    const { error } = await sb.from('pontos').update({ status: 'pausado', pausa_inicio: new Date().toISOString() }).eq('id', pontoAtual.id);
                    if (error) throw error;
                    customAlert("Turno pausado.", "sucesso");
                    setTimeout(() => window.location.reload(), 1000);
                } catch (err) { customAlert("Erro ao pausar.", "erro"); }
            });
        }

        async function retomarTurno() {
            mostrarConfirmacao("Deseja retomar o seu turno agora?", async () => {
                try {
                    const agora = new Date();
                    const pausaInicio = new Date(pontoAtual.pausa_inicio);
                    const tempoPausadoMinutos = (agora - pausaInicio) / 1000 / 60;
                    const entradaOriginal = new Date(pontoAtual.entrada);
                    const novaEntrada = new Date(entradaOriginal.getTime() + (tempoPausadoMinutos * 60000));

                    const { error } = await sb.from('pontos').update({ 
                        status: 'aberto', pausa_fim: agora.toISOString(), entrada: novaEntrada.toISOString()
                    }).eq('id', pontoAtual.id);
                    
                    if (error) throw error;
                    customAlert("Turno retomado!", "sucesso");
                    setTimeout(() => window.location.reload(), 1000);
                } catch (err) { customAlert("Erro ao retomar.", "erro"); }
            });
        }

        async function encerrarTurno() {
            mostrarConfirmacao("Tem certeza que deseja encerrar o seu turno agora?", async () => {
                await processarEncerramento(pontoAtual);
            });
        }

        async function processarEncerramento(ponto) {
            if (!ponto) return;
            try {
                const entrada = new Date(ponto.entrada);
                const saida = new Date();
                const diferencaMinutos = (saida - entrada) / 1000 / 60;

                await sb.from('pontos').update({ status: 'fechado', saida: saida.toISOString() }).eq('id', ponto.id);

                if (diferencaMinutos >= 30) {
                    const { data: membro } = await sb.from('membros').select('xp_total').eq('passaporte', membroLogado.passaporte).single();
                    const novoXP = (membro.xp_total || 0) + 20;
                    await sb.from('membros').update({ xp_total: novoXP }).eq('passaporte', membroLogado.passaporte);
                    await sb.from('presencas').insert([{ passaporte: membroLogado.passaporte, status: 'presente', data: saida.toISOString().split('T')[0], marcado_por_nome: 'Sistema' }]);
                    customAlert("Turno encerrado! Você ganhou +20 XP.", "sucesso");
                } else {
                    await sb.from('presencas').insert([{ passaporte: membroLogado.passaporte, status: 'falta', data: saida.toISOString().split('T')[0], marcado_por_nome: 'Sistema' }]);
                    customAlert("Turno encerrado. Menos de 30 min: falta registrada.", "erro");
                }
                setTimeout(() => window.location.reload(), 2000);
            } catch (err) {
                customAlert("Erro ao encerrar o turno.", "erro");
            }
        }

        // ==========================================
        // 5. ALERTA VERDE CUSTOMIZADO
        // ==========================================
        function customAlert(mensagem, tipo = 'sucesso') {
            const alerta = document.getElementById('alerta-site');
            const icone = document.getElementById('alerta-icone');
            const texto = document.getElementById('alerta-texto');
            if (!alerta) return;
            
            texto.innerText = mensagem;
            if (tipo === 'erro') { 
                alerta.classList.add('erro'); icone.className = 'fas fa-times-circle'; 
            } else { 
                alerta.classList.remove('erro'); icone.className = 'fas fa-check-circle'; 
            }
            alerta.classList.add('ativo');
            setTimeout(() => alerta.classList.remove('ativo'), 3000);
        }
    </script>
</body>
</html>
