<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="color-scheme" content="dark">
    <title>Itália 2.0 | Bater Ponto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <scriptk src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    </script>

    <style>
        :root {
            color-scheme: dark;
            --verde: #22c55e;
            --fundo: #0a0f0d;
            --vidro: rgba(15, 23, 20, 0.6);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html { background-color: #0a0f0d; overflow-x: hidden; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

        /* FUNDO ANIMADO */
        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        .grade-fundo { position: fixed; inset: 0; background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; mask-image: radial-gradient(circle at center, black 10%, transparent 90%); -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%); }
        .particula { position: fixed; bottom: -10px; background-color: var(--verde); border-radius: 50%; box-shadow: 0 0 10px var(--verde); opacity: 0; animation: subir linear infinite; z-index: 5; }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        @keyframes subir { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }

        /* TELA DE PONTO */
        .view-ponto { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 500px; position: relative; z-index: 10; }
        .status-ponto-texto { font-family: 'Oswald', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; color: var(--texto-mutado); margin-bottom: 20px; transition: color 0.3s; }
        .status-ponto-texto.ativo { color: var(--verde); text-shadow: 0 0 10px rgba(34,197,94,0.5); }
        
        .scanner-ponto { position: relative; width: 200px; height: 200px; border-radius: 50%; background: rgba(0,0,0,0.4); border: 2px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; justify-content: center; margin-bottom: 30px; transition: 0.3s; }
        .scanner-ponto.ativo { border-color: var(--verde); box-shadow: 0 0 30px rgba(34, 197, 94, 0.3), inset 0 0 20px rgba(34, 197, 94, 0.1); animation: pulsar-scanner 2s infinite; }
        @keyframes pulsar-scanner { 0% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.2), inset 0 0 10px rgba(34, 197, 94, 0.1); } 50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.6), inset 0 0 20px rgba(34, 197, 94, 0.3); } 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.2), inset 0 0 10px rgba(34, 197, 94, 0.1); } }
        .scanner-ponto i { font-size: 80px; color: var(--texto-mutado); transition: 0.3s; }
        .scanner-ponto.ativo i { color: var(--verde); animation: piscar-icone 2s infinite; }
        @keyframes piscar-icone { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .cronometro { position: absolute; bottom: -30px; background: #0a0f0d; padding: 5px 15px; border-radius: 20px; border: 1px solid var(--borda); font-family: 'Oswald', sans-serif; font-size: 20px; color: #fff; display: none; }
        .cronometro.ativo { display: block; }

        .botoes-ponto { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 30px;}
        .btn-ponto { width: 100%; padding: 18px; border-radius: 12px; border: none; font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-ponto.iniciar { background: var(--verde); color: #000; box-shadow: 0 5px 15px rgba(34,197,94,0.3); }
        .btn-ponto.iniciar:hover { background: #4ade80; transform: translateY(-2px); }
        .btn-ponto.encerrar { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .btn-ponto.encerrar:hover { background: #ef4444; color: #fff; }
        .btn-ponto.bloqueado { background: #27272a; color: #52525b; cursor: not-allowed; transform: none !important; box-shadow: none; }

        /* ALERTA CUSTOMIZADO */
        .alerta-custom { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 13, 0.95); border: 1px solid var(--verde); border-radius: 12px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2); z-index: 9999; min-width: 280px; transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .alerta-custom.ativo { top: 20px; }
        .alerta-custom i { font-size: 24px; color: var(--verde); }
        .alerta-custom p { font-size: 13px; color: #fff; font-weight: 500; }
        .alerta-custom.erro { border-color: #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2); }
        .alerta-custom.erro i { color: #ef4444; }

        /* BOTÃO VOLTAR */
        .btn-voltar { position: absolute; top: 20px; left: 20px; width: 45px; height: 45px; background: var(--vidro); backdrop-filter: blur(20px); border: 1px solid var(--borda); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--texto-mutado); font-size: 20px; cursor: pointer; z-index: 100; transition: 0.3s; text-decoration: none;}
        .btn-voltar:hover { color: var(--verde); border-color: var(--verde); }

        @media (max-width: 600px) {
            .scanner-ponto { width: 160px; height: 160px; }
            .scanner-ponto i { font-size: 60px; }
            .alerta-custom { min-width: 90%; }
        }
    </style>
</head>
<body>
    <!-- FUNDO ANIMADO -->
    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>
    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>

    <!-- BOTÃO VOLTAR -->
    <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left"></i></a>

    <!-- TELA DE PONTO -->
    <div class="view-ponto" id="tela-ponto">
        <div class="status-ponto-texto" id="status-ponto-texto">Fora de Serviço</div>
        
        <div class="scanner-ponto" id="scanner-ponto">
            <i class="fas fa-fingerprint"></i>
            <div class="cronometro" id="cronometro-ponto">00:00:00</div>
        </div>

        <div class="botoes-ponto" id="botoes-ponto">
            <button class="btn-ponto iniciar" id="btn-bater-ponto" onclick="baterPonto()">
                <i class="fas fa-play"></i> Bater Ponto
            </button>
            <button class="btn-ponto encerrar" id="btn-encerrar-ponto" style="display: none;" onclick="encerrarPonto()">
                <i class="fas fa-stop"></i> Encerrar Ponto
            </button>
        </div>
    </div>

    <!-- SISTEMA DE ALERTA VERDE -->
    <div class="alerta-custom" id="alerta-site">
        <i class="fas fa-check-circle" id="alerta-icone"></i>
        <p id="alerta-texto">Mensagem</p>
    </div>

    <!-- O Script virá na próxima parte -->
</body>
</html>
