<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="color-scheme" content="dark">
    <title>Itália 2.0 | Plantões</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e;
            --fundo: #0a0f0d;
            --vidro: rgba(15, 23, 20, 0.6);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html { background-color: #0a0f0d; overflow-x: hidden; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        .grade-fundo { position: fixed; inset: 0; background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; mask-image: radial-gradient(circle at center, black 10%, transparent 90%); -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%); }
        .particula { position: fixed; bottom: -10px; background-color: var(--verde); border-radius: 50%; box-shadow: 0 0 10px var(--verde); opacity: 0; animation: subir linear infinite; z-index: 5; }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        @keyframes subir { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 10; padding-bottom: 40px; }
        .topo { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .btn-voltar { width: 40px; height: 40px; background: var(--vidro); border: 1px solid var(--borda); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--texto-mutado); font-size: 18px; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .btn-voltar:hover { color: var(--verde); border-color: var(--verde); }
        .titulo { font-family: 'Oswald', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; color: #fff; }
        
        .card-plantao { background: var(--vidro); backdrop-filter: blur(20px); border-radius: 12px; padding: 20px; margin-bottom: 12px; border: 1px solid var(--borda); transition: 0.3s; }
        .card-plantao.aberto { border-color: var(--verde); box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
        .card-plantao.lotado { opacity: 0.5; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-nome { font-family: 'Oswald', sans-serif; font-size: 18px; color: #fff; display: flex; align-items: center; }
        .card-horario { font-size: 12px; color: var(--texto-mutado); }
        
        .vagas-barra { width: 100%; height: 6px; background: #27272a; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .vagas-preenchida { height: 100%; background: var(--verde); transition: 0.3s; }
        .vagas-texto { font-size: 11px; color: var(--texto-mutado); display: flex; justify-content: space-between; margin-bottom: 15px; }
        
        .btn-acao-plantao { width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-entrar { background: var(--verde); color: #000; }
        .btn-entrar:hover { background: #4ade80; }
        .btn-bloqueado { background: #27272a; color: #52525b; cursor: not-allowed; }
        .btn-em-andamento { background: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid #eab308; }
        
        .alerta-custom { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 15, 13, 0.95); border: 1px solid var(--verde); border-radius: 12px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2); z-index: 9999; min-width: 280px; transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .alerta-custom.ativo { top: 20px; }
        .alerta-custom i { font-size: 24px; color: var(--verde); }
        .alerta-custom p { font-size: 13px; color: #fff; font-weight: 500; }
        .alerta-custom.erro { border-color: #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2); }
        .alerta-custom.erro i { color: #ef4444; }
    </style>
</head>
<body>
    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>
    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>

    <div class="container">
        <div class="topo">
            <a href="dashboard.html" class="btn-voltar"><i class="fas fa-arrow-left"></i></a>
            <h1 class="titulo">Plantões</h1>
        </div>
        
        <p style="font-size: 13px; color: var(--texto-mutado); margin-bottom: 10px;">Selecione um plantão disponível abaixo:</p>

        <div id="lista-plantoes">
            <p style="color: var(--texto-mutado); text-align: center; padding: 20px;">Carregando horários de Brasília...</p>
        </div>
    </div>

    <div class="alerta-custom" id="alerta-site">
        <i class="fas fa-check-circle" id="alerta-icone"></i>
        <p id="alerta-texto">Mensagem</p>
    </div>
        <script>
        let membroLogado = null;

        // ==========================================
        // 1. A MÁGICA DO HORÁRIO DE BRASÍLIA (CORRIGIDA)
        // ==========================================
        
        // Pega a hora exata de Brasília (UTC-3)
        function getHoraBrasilia() {
            const agora = new Date();
            const utcMs = agora.getTime();
            const brasiliaMs = utcMs - (3 * 60 * 60 * 1000);
            return new Date(brasiliaMs);
        }

        // Calcula os minutos totais do dia no horário de Brasília (ex: 17:51 = 1071 min)
        function getMinutosAgora() {
            const agora = getHoraBrasilia();
            return (agora.getUTCHours() * 60) + agora.getUTCMinutes();
        }

        // Verifica se o plantão tá Aberto, Em Andamento, Encerrado ou Aguardando
        function verificarStatusHorario(horarioInicio, horarioFim) {
            const minutosAgora = getMinutosAgora();
            
            const [hInicio, mInicio] = horarioInicio.split(':').map(Number);
            const [hFim, mFim] = horarioFim.split(':').map(Number);
            
            let minutosInicio = (hInicio * 60) + mInicio;
            let minutosFim = (hFim * 60) + mFim;

            // Trata plantão que vira a madrugada (ex: 22:00 às 00:00)
            if (minutosFim < minutosInicio) {
                minutosFim += 24 * 60;
                // Se agora for antes do fim (ex: 01:00 da manhã), ajusta os minutos atuais
                if (minutosAgora < minutosInicio) {
                    minutosAgora += 24 * 60;
                }
            }
            
            const tolerancia = 15; // 15 minutos de tolerância
            const janelaAbertura = minutosInicio - tolerancia;
            const janelaFechamento = minutosInicio + tolerancia;

            if (minutosAgora >= janelaAbertura && minutosAgora <= janelaFechamento) {
                return 'aberto'; // Pode entrar
            } else if (minutosAgora > janelaFechamento && minutosAgora < minutosFim) {
                return 'em_andamento'; // Já começou, não pode mais entrar
            } else if (minutosAgora >= minutosFim) {
                return 'encerrado'; // Já acabou
            } else {
                return 'aguardando'; // Ainda não chegou a hora
            }
        }

        // ==========================================
        // 2. CARREGAR OS PLANTÕES NA TELA
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';
            membroLogado = JSON.parse(logado);
            
            carregarPlantoes();
        });

        async function carregarPlantoes() {
            const container = document.getElementById('lista-plantoes');
            
            // 1. Puxa os dados da tabela 'plantoes'
            const { data: plantoes, error } = await sb.from('plantoes').select('*');
            
            if (error || !plantoes || plantoes.length === 0) {
                container.innerHTML = '<p style="color: var(--texto-mutado); text-align: center;">Nenhum plantão cadastrado.</p>';
                return;
            }

            // 2. Define a ordem dos horários
            const ordemHorarios = { '14:00': 1, '16:00': 2, '18:00': 3, '20:00': 4, '22:00': 5, '00:00': 6 };

            // 3. Separa os plantões em 3 grupos
            let ativos = [];
            let futuros = [];
            let encerrados = [];

            plantoes.forEach(p => {
                const status = verificarStatusHorario(p.horario_inicio, p.horario_fim);
                p._status = status;
                
                if (status === 'aberto' || status === 'em_andamento') {
                    ativos.push(p);
                } else if (status === 'aguardando') {
                    futuros.push(p);
                } else {
                    encerrados.push(p);
                }
            });

            // 4. Ordena cada grupo pelo horário
            const ordenar = (a, b) => (ordemHorarios[a.horario_inicio] || 99) - (ordemHorarios[b.horario_inicio] || 99);
            ativos.sort(ordenar);
            futuros.sort(ordenar);
            encerrados.sort(ordenar);

            // 5. Junta tudo na ordem: Ativos (topo), Futuros (meio), Encerrados (final)
            const plantoesOrdenados = [...ativos, ...futuros, ...encerrados];

            // 6. Puxa os pontos abertos para calcular as vagas
            const { data: pontosHoje } = await sb.from('pontos').select('plantao_id').eq('status', 'aberto');

            let html = '';
            plantoesOrdenados.forEach(p => {
                const status = p._status;
                const ocupadas = pontosHoje ? pontosHoje.filter(pt => pt.plantao_id === p.id).length : 0;
                const restantes = p.vagas_totais - ocupadas;
                
                let classeCard = '';
                let btnHtml = '';
                let iconeHtml = '';

                // Lógica de Ícones
                if (p.tipo === 'rota') {
                    iconeHtml = '<i class="fas fa-car" style="color: var(--verde); margin-right: 8px;"></i>';
                } else if (p.tipo === 'venda') {
                    iconeHtml = '<i class="fas fa-dollar-sign" style="color: #eab308; margin-right: 8px;"></i>';
                } else if (p.tipo === 'apoio') {
                    iconeHtml = '<i class="fas fa-shield-alt" style="color: #3b82f6; margin-right: 8px;"></i>';
                }

                // Lógica de Status do Card e Botão
                if (status === 'encerrado') {
                    classeCard = 'lotado';
                    btnHtml = `<button class="btn-acao-plantao btn-bloqueado" disabled><i class="fas fa-times"></i> ENCERRADO</button>`;
                } else if (restantes <= 0) {
                    classeCard = 'lotado';
                    btnHtml = `<button class="btn-acao-plantao btn-bloqueado" disabled><i class="fas fa-lock"></i> LOTADO</button>`;
                } else if (status === 'aberto') {
                    classeCard = 'aberto';
                    btnHtml = `<button class="btn-acao-plantao btn-entrar" onclick="entrarPlantao('${p.id}', '${p.nome}')"><i class="fas fa-play"></i> ENTRAR AGORA</button>`;
                } else if (status === 'em_andamento') {
                    btnHtml = `<button class="btn-acao-plantao btn-em-andamento" disabled><i class="fas fa-clock"></i> EM ANDAMENTO</button>`;
                } else {
                    btnHtml = `<button class="btn-acao-plantao btn-bloqueado" disabled><i class="fas fa-clock"></i> AGUARDE HORÁRIO</button>`;
                }

                const porcentagem = (ocupadas / p.vagas_totais) * 100;

                html += `
                    <div class="card-plantao ${classeCard}">
                        <div class="card-header">
                            <span class="card-nome">${iconeHtml} ${p.nome}</span>
                            <span class="card-horario">${p.horario_inicio} - ${p.horario_fim}</span>
                        </div>
                        <div class="vagas-barra">
                            <div class="vagas-preenchida" style="width: ${porcentagem}%"></div>
                        </div>
                        <div class="vagas-texto">
                            <span>Preenchidas: ${ocupadas}/${p.vagas_totais}</span>
                            <span>${restantes} restantes</span>
                        </div>
                        ${btnHtml}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 3. AÇÃO DE ENTRAR NO PLANTÃO
        // ==========================================
        async function entrarPlantao(id, nome) {
            if (!confirm(`Deseja entrar no plantão: ${nome}?`)) return;
            
            const btn = event.target.closest('.btn-acao-plantao');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
            btn.disabled = true;

            const { error } = await sb.from('pontos').insert([{
                passaporte: membroLogado.passaporte,
                nome: membroLogado.nome,
                entrada: getHoraBrasilia().toISOString(),
                status: 'aberto',
                plantao_id: id
            }]);

            if (!error) {
                customAlert("Você entrou no plantão!", "sucesso");
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } else {
                console.error(error);
                customAlert("Erro ao entrar. O plantão pode ter lotado.", "erro");
                btn.innerHTML = 'ENTRAR AGORA';
                btn.disabled = false;
            }
        }

        // ==========================================
        // 4. SISTEMA DE ALERTA
        // ==========================================
        function customAlert(mensagem, tipo = 'sucesso') {
            const alerta = document.getElementById('alerta-site');
            const icone = document.getElementById('alerta-icone');
            const texto = document.getElementById('alerta-texto');
            
            if (!alerta) return;
            texto.innerText = mensagem;
            
            if (tipo === 'erro') { 
                alerta.classList.add('erro'); 
                icone.className = 'fas fa-times-circle'; 
            } else { 
                alerta.classList.remove('erro'); 
                icone.className = 'fas fa-check-circle'; 
            }
            alerta.classList.add('ativo');
            setTimeout(() => alerta.classList.remove('ativo'), 3000);
        }
    </script>
</body>
</html>
