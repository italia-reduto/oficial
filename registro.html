<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a07">
    <title>Whitelist | Portal Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- IMPORTANTE: A biblioteca do Supabase precisa estar aqui para o envio funcionar -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-principal: #0a0f0d; 
            --texto-secundario: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            background-color: var(--fundo-principal);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0; /* Respiro para telas pequenas */
        }

        .fundo-degrade {
            position: fixed; inset: 0;
            background: 
                radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 0.5) 0%, transparent 100%);
            z-index: 0;
        }

        .grade-fundo {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        .painel-hud {
            position: relative; z-index: 10; width: 90%; max-width: 500px;
            padding: 30px 25px; background: rgba(10, 15, 13, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 197, 94, 0.05);
        }

        .painel-hud::before, .painel-hud::after {
            content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--verde-neon);
        }
        .painel-hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .painel-hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .topo-form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn-voltar {
            color: var(--texto-secundario);
            text-decoration: none;
            font-size: 20px;
            transition: 0.3s;
        }
        .btn-voltar:hover { color: var(--verde-neon); }

        .titulo {
            font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .campo-grupo { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px;}
        
        .campo-grupo label {
            font-size: 12px;
            font-weight: 600;
            color: #86efac;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .campo-grupo input, .campo-grupo textarea {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .campo-grupo input:focus, .campo-grupo textarea:focus {
            border-color: var(--verde-neon);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }

        .campo-grupo textarea { resize: none; height: 100px; }

        .btn-enviar {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: var(--verde-neon);
            border: none;
            border-radius: 6px;
            color: #000;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-enviar:hover { background: #4ade80; transform: translateY(-2px); }
        .btn-enviar:disabled { background: #166534; color: #86efac; cursor: not-allowed; transform: none; }

        .rodape-form {
            text-align: center; font-size: 11px; color: #71717a; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>

    <div class="painel-hud">
        <div class="topo-form">
            <a href="portal-italia.html" class="btn-voltar"><i class="fas fa-arrow-left"></i></a>
            <h1 class="titulo">Ficha de Whitelist</h1>
        </div>

        <!-- FORMULÁRIO -->
        <div class="campo-grupo">
            <label>Nome do Personagem</label>
            <input type="text" id="campo-nome" placeholder="Ex: Falcão">
        </div>

        <div class="campo-grupo">
            <label>Passaporte</label>
            <input type="number" id="campo-passaporte" placeholder="Ex: 17274">
        </div>

        <div class="campo-grupo">
            <label>Idade (Real e no RP)</label>
            <input type="text" id="campo-idade" placeholder="Ex: 20 anos (RP) / 18 anos (Real)">
        </div>

        <div class="campo-grupo">
            <label>Experiência com RP</label>
            <input type="text" id="campo-exp" placeholder="Ex: Já joguei em outras cidades...">
        </div>

        <div class="campo-grupo">
            <label>História do Personagem</label>
            <textarea id="campo-historia" placeholder="Conte a história do seu personagem..."></textarea>
        </div>

        <button class="btn-enviar" id="btn-enviar" onclick="enviarFicha()">Enviar Ficha</button>
        
        <div class="rodape-form">
            A Liderança irá analisar seu perfil e entrar em contato.
        </div>
    </div>

    <script>
        async function enviarFicha() {
            // Pega os valores dos campos
            const nome = document.getElementById('campo-nome').value;
            const passaporte = document.getElementById('campo-passaporte').value;
            const idade = document.getElementById('campo-idade').value;
            const exp = document.getElementById('campo-exp').value;
            const historia = document.getElementById('campo-historia').value;
            const btn = document.getElementById('btn-enviar');

            // Validação básica
            if (!nome || !passaporte || !idade || !historia) {
                alert("Por favor, preencha todos os campos obrigatórios.");
                return;
            }

            btn.innerText = "Enviando...";
            btn.disabled = true;

            // Envia para a tabela que criamos no Supabase
            const { data, error } = await sb.from('registros_whitelist').insert([
                { 
                    nome: nome, 
                    passaporte: passaporte, 
                    idade: idade, 
                    experiencia: exp, 
                    historia: historia 
                }
            ]);

            if (error) {
                alert("Erro ao enviar: " + error.message);
                btn.innerText = "Enviar Ficha";
                btn.disabled = false;
            } else {
                // Sucesso
                btn.innerText = "Ficha Enviada!";
                btn.style.background = "#166534";
                btn.style.color = "#86efac";
                alert("Ficha enviada com sucesso! Aguarde a aprovação da Liderança.");
            }
        }
    </script>
</body>
</html>
