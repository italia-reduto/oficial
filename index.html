<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITÁLIA · ACESSO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #050508; /* Fundo preto */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Formas azuis claras (tom céu) */
        .forma-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 50%, #7DD3FC 100%);
            border-bottom-right-radius: 50% 80%;
            z-index: 0;
            opacity: 0.85;
        }

        .forma-inferior {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 50%, #7DD3FC 100%);
            border-top-left-radius: 60% 100%;
            z-index: 0;
            opacity: 0.85;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 420px;
            padding: 60px 30px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 50px;
        }

        .titulo h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        .titulo p {
            color: #7DD3FC;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .input-grupo {
            margin-bottom: 22px;
            position: relative;
        }

        .input-icone {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 100%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .input-campo {
            width: 100%;
            padding: 16px 60px 16px 65px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 999px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            font-size: 15px;
            color: #F1F5F9;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-campo::placeholder {
            color: #94A3B8;
        }

        .input-campo:focus {
            border-color: #38BDF8;
        }

        /* Botão do olho da senha */
        .botao-senha {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94A3B8;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .botao-senha:hover {
            color: #7DD3FC;
        }

        .opcoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 10px;
            font-size: 14px;
        }

        .lembrar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #CBD5E1;
            cursor: pointer;
        }

        .esqueceu {
            color: #7DD3FC;
            text-decoration: none;
        }

        .botao-entrar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
            border: none;
            border-radius: 999px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.25);
            transition: transform 0.2s;
        }

        .botao-entrar:hover {
            transform: translateY(-2px);
        }

        /* Link voltar EM BRANCO */
        .voltar {
            text-align: center;
            margin-top: 40px;
        }

        .voltar a {
            color: #FFFFFF; /* Branco como pediu */
            text-decoration: none;
            font-size: 14px;
        }

        .voltar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="forma-superior"></div>
    <div class="forma-inferior"></div>

    <div class="login-card">
        <div class="titulo">
            <h1>ITÁLIA</h1>
            <p>SISTEMA DE ACESSO</p>
        </div>

        <form>
            <!-- Campo só PASSAPORTE (numérico) -->
            <div class="input-grupo">
                <div class="input-icone"><i class="fas fa-id-card"></i></div>
                <input type="number" class="input-campo" placeholder="Passaporte" required>
            </div>

            <!-- Senha com olhinho -->
            <div class="input-grupo">
                <div class="input-icone"><i class="fas fa-lock"></i></div>
                <input type="password" id="campoSenha" class="input-campo" placeholder="Senha" required>
                <button type="button" class="botao-senha" onclick="alternarSenha()">
                    <i id="iconeOlho" class="fas fa-eye"></i>
                </button>
            </div>

            <div class="opcoes">
                <label class="lembrar">
                    <input type="checkbox"> Lembrar-me
                </label>
                <a href="#" class="esqueceu">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="botao-entrar">ENTRAR</button>
        </form>

        <div class="voltar">
            <a href="inicio.html">← Voltar para tela inicial</a>
        </div>
    </div>

    <script>
        // Função do olhinho da senha
        function alternarSenha() {
            const campo = document.getElementById('campoSenha');
            const icone = document.getElementById('iconeOlho');
            
            if (campo.type === 'password') {
                campo.type = 'text';
                icone.classList.remove('fa-eye');
                icone.classList.add('fa-eye-slash');
            } else {
                campo.type = 'password';
                icone.classList.remove('fa-eye-slash');
                icone.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
