<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>ORGANIZAÇÃO ITÁLIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background-color: #050508;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
        }
        .fundo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            filter: blur(8px);
        }
        .forma-superior {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 50%, #7DD3FC 100%);
            border-bottom-right-radius: 60% 90%;
            opacity: 0.8;
        }
        .forma-inferior {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 50%, #7DD3FC 100%);
            border-top-left-radius: 70% 100%;
            opacity: 0.8;
        }
        .conteudo {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 450px;
            padding: 40px 20px;
            animation: surgir 0.8s ease-out;
        }
        @keyframes surgir {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { margin-bottom: 50px; }
        .icone {
            font-size: 70px;
            color: #7DD3FC;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(56,189,248,0.3));
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: #FFFFFF;
        }
        .subtitulo {
            font-size: 15px;
            color: #7DD3FC;
            letter-spacing: 2px;
        }
        .descricao {
            margin: 30px 0 50px;
            font-size: 15px;
            line-height: 1.6;
            color: #CBD5E1;
        }
        .botao-acesso {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
            border: none;
            border-radius: 999px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(56,189,248,0.25);
            transition: transform 0.2s;
        }
        .botao-acesso:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(56,189,248,0.4); }
        .rodape { margin-top: 60px; font-size: 13px; color: #64748B; }
    </style>
</head>
<body>
    <div class="fundo">
        <div class="forma-superior"></div>
        <div class="forma-inferior"></div>
    </div>

    <div class="conteudo">
        <div class="logo">
            <i class="fas fa-shield-alt icone"></i>
            <h1>ORGANIZAÇÃO ITÁLIA</h1>
            <p class="subtitulo">SISTEMA DE GERENCIAMENTO</p>
        </div>

        <p class="descricao">
            Bem-vindo! Acesse sua conta para utilizar os serviços, registrar ponto e consultar sua equipe.
        </p>

        <!-- ✅ LINK DIRETO E AUTOMÁTICO PARA LOGIN.HTML -->
        <a href="login.html" class="botao-acesso">
            <i class="fas fa-sign-in-alt" style="margin-right: 10px;"></i>
            ÁREA DE ACESSO
        </a>

        <div class="rodape">
            © 2026 Organização Itália · Todos os direitos reservados
        </div>
    </div>
</body>
</html>
