<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Itália | Central de Registros</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 500px;
}

.logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 25px;
    border-radius: 24px;
    background: #12385f;
    border: 1px solid #287dcc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
}

h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #8ea4bd;
    font-size: 16px;
    margin-bottom: 30px;
}

.card {
    background: #0d1b2d;
    border: 1px solid #213852;
    border-top: 3px solid #2787d9;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

h2 {
    font-size: 25px;
    margin-bottom: 10px;
}

.description {
    color: #8ea4bd;
    line-height: 1.5;
    margin-bottom: 25px;
}

.button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 16px;
    background: #267dcc;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.button:hover {
    background: #3192e8;
}

.footer {
    text-align: center;
    color: #536b84;
    font-size: 13px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🇮🇹</div>

    <h1>ITÁLIA</h1>

    <div class="subtitle">
        Central de Registros
    </div>

    <div class="card">

        <h2>Bem-vindo</h2>

        <p class="description">
            Sistema oficial para registro e controle das atividades
            administrativas da Itália.
            <br><br>
            Utilize o sistema para realizar seus registros de forma
            organizada e segura.
        </p>

        <a href="login.html" class="button" style="display:block; text-align:center; text-decoration:none;">
    Entrar no sistema
        </a>
        

    </div>

    <div class="footer">
        🇮🇹 Itália • Central Administrativa
    </div>

</div>
