<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0c10"
    >

    <title>
        ORGANIZAÇÃO ITÁLIA · REGISTROS
    </title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        :root {

            --bg: #08090d;
            --bg2: #0d0f14;
            --card: #12151b;
            --card2: #171a21;

            --border: rgba(255,255,255,0.07);

            --red: #e11d48;
            --red2: #fb365d;

            --green: #22c55e;
            --blue: #3b82f6;
            --yellow: #f59e0b;
            --purple: #8b5cf6;

            --text: #f5f5f5;
            --muted: #8b929f;
            --dark-muted: #5d6470;

        }


        html {
            min-height: 100%;
            background: var(--bg);
        }


        body {

            min-height: 100vh;

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:

                radial-gradient(
                    circle at 90% 0%,
                    rgba(225,29,72,0.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 0% 50%,
                    rgba(139,92,246,0.06),
                    transparent 30%
                ),

                var(--bg);

            padding-bottom: 35px;

        }


        button,
        input {
            font: inherit;
        }


        button {
            cursor: pointer;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================================
           TOPO
        ===================================================== */

        .topo {

            position: sticky;

            top: 0;

            z-index: 100;

            background:
                rgba(8,9,13,0.82);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border-bottom:
                1px solid var(--border);

        }


        .topo-inner {

            width:
                min(1050px, calc(100% - 28px));

            min-height: 70px;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .marca {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .marca-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    var(--red),
                    #9f1239
                );

            box-shadow:
                0 8px 25px
                rgba(225,29,72,0.22);

        }


        .marca-icon i {
            font-size: 17px;
        }


        .marca h1 {

            font-size: 14px;

            font-weight: 900;

            letter-spacing: .4px;

        }


        .marca p {

            margin-top: 2px;

            color: var(--dark-muted);

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: .8px;

        }


        .acoes-topo {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .topo-btn {

            width: 40px;

            height: 40px;

            border: 1px solid var(--border);

            border-radius: 11px;

            background: var(--card);

            color: var(--muted);

            display: flex;

            align-items: center;

            justify-content: center;

            transition: .2s;

        }


        .topo-btn:hover {

            color: white;

            border-color:
                rgba(225,29,72,.55);

            transform:
                translateY(-1px);

        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {

            width:
                min(1050px, calc(100% - 28px));

            margin: auto;

            padding-top: 28px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;

        }


        .hero-tag {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                7px 11px;

            border-radius: 999px;

            background:
                rgba(225,29,72,.09);

            border:
                1px solid
                rgba(225,29,72,.20);

            color: #fb7185;

            font-size: 10px;

            font-weight: 900;

            text-transform: uppercase;

            margin-bottom: 11px;

        }


        .hero h2 {

            font-size:
                clamp(28px, 6vw, 42px);

            line-height: 1.05;

            font-weight: 900;

            letter-spacing: -.8px;

        }


        .hero h2 span {
            color: var(--red2);
        }


        .hero p {

            max-width: 570px;

            margin-top: 9px;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                10px 13px;

            border-radius: 12px;

            background:
                rgba(34,197,94,.07);

            border:
                1px solid
                rgba(34,197,94,.16);

            color: #86efac;

            font-size: 11px;

            font-weight: 800;

            white-space: nowrap;

        }


        .status-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 12px
                rgba(34,197,94,.8);

        }


        /* =====================================================
           RESUMO
        ===================================================== */

        .resumo {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin-bottom: 26px;

        }


        .resumo-card {

            position: relative;

            padding: 17px;

            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.018)
                );

            border:
                1px solid var(--border);

            overflow: hidden;

        }


        .resumo-card::after {

            content: "";

            position: absolute;

            width: 80px;

            height: 80px;

            right: -30px;

            bottom: -35px;

            border-radius: 50%;

            background:
                rgba(225,29,72,.08);

        }


        .resumo-icon {

            width: 34px;

            height: 34px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 13px;

        }


        .icon-red {

            color: #fb7185;

            background:
                rgba(225,29,72,.11);

        }


        .icon-green {

            color: #4ade80;

            background:
                rgba(34,197,94,.10);

        }


        .icon-blue {

            color: #60a5fa;

            background:
                rgba(59,130,246,.10);

        }


        .icon-purple {

            color: #a78bfa;

            background:
                rgba(139,92,246,.10);

        }


        .resumo-label {

            color: var(--muted);

            font-size: 11px;

        }


        .resumo-value {

            margin-top: 3px;

            font-size: 23px;

            font-weight: 900;

        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        .secao-topo {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 13px;

        }


        .secao-titulo {

            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 15px;

            font-weight: 900;

        }


        .secao-titulo i {

            color: var(--red2);

        }


        .ver-todos {

            color: var(--muted);

            font-size: 11px;

            font-weight: 700;

        }


        .ver-todos:hover {
            color: white;
        }


        /* =====================================================
           CARDS PRINCIPAIS
        ===================================================== */

        .registros-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 14px;

            margin-bottom: 28px;

        }


        .registro-card {

            position: relative;

            min-height: 210px;

            padding: 20px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    var(--card2),
                    var(--card)
                );

            border:
                1px solid var(--border);

            overflow: hidden;

            transition:
                transform .25s,
                border-color .25s,
                box-shadow .25s;

        }


        .registro-card:hover {

            transform:
                translateY(-4px);

            border-color:
                rgba(255,255,255,.13);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.25);

        }


        .registro-card::before {

            content: "";

            position: absolute;

            width: 150px;

            height: 150px;

            border-radius: 50%;

            right: -70px;

            top: -70px;

            opacity: .08;

        }


        .card-metas::before {
            background: var(--red);
        }


        .card-vendas::before {
            background: var(--green);
        }


        .card-depositos::before {
            background: var(--blue);
        }


        .registro-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 22px;

        }


        .registro-icon {

            width: 45px;

            height: 45px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

        }


        .registro-arrow {

            width: 32px;

            height: 32px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background:
                rgba(255,255,255,.04);

            color: var(--muted);

        }


        .registro-card h3 {

            font-size: 19px;

            font-weight: 900;

        }


        .registro-card p {

            margin-top: 7px;

            color: var(--muted);

            font-size: 12px;

            line-height: 1.5;

        }


        .registro-bottom {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin-top: 23px;

        }


        .registro-info {

            color: var(--dark-muted);

            font-size: 10px;

        }


        .abrir {

            padding:
                9px 12px;

            border-radius: 9px;

            font-size: 10px;

            font-weight: 900;

            border: 0;

            color: white;

        }


        .abrir-red {
            background: var(--red);
        }


        .abrir-green {
            background: #16a34a;
        }


        .abrir-blue {
            background: #2563eb;
        }


        /* =====================================================
           FERRAMENTAS
        ===================================================== */

        .ferramentas {

            display: grid;

            grid-template-columns:
                1.5fr 1fr;

            gap: 14px;

            margin-bottom: 25px;

        }


        .painel {

            padding: 18px;

            border-radius: 18px;

            background:
                rgba(18,21,27,.82);

            border:
                1px solid var(--border);

        }


        .painel-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 15px;

        }


        .painel-header h3 {

            font-size: 13px;

            font-weight: 900;

        }


        .painel-header i {

            color: var(--dark-muted);

        }


        .pesquisa {

            display: flex;

            align-items: center;

            gap: 10px;

            height: 45px;

            padding:
                0 13px;

            border-radius: 11px;

            background:
                #0d1015;

            border:
                1px solid var(--border);

        }


        .pesquisa i {

            color: var(--dark-muted);

            font-size: 13px;

        }


        .pesquisa input {

            width: 100%;

            border: 0;

            outline: 0;

            background: transparent;

            color: white;

            font-size: 12px;

        }


        .pesquisa input::placeholder {
            color: #555c67;
        }


        .atalhos {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 9px;

        }


        .atalho {

            min-height: 58px;

            padding: 11px;

            border-radius: 12px;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid var(--border);

            display: flex;

            align-items: center;

            gap: 10px;

            transition: .2s;

        }


        .atalho:hover {

            background:
                rgba(255,255,255,.05);

            transform:
                translateY(-2px);

        }


        .atalho i {

            width: 32px;

            height: 32px;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(225,29,72,.10);

            color: #fb7185;

            font-size: 12px;

        }


        .atalho span {

            font-size: 11px;

            font-weight: 800;

        }


        /* =====================================================
           ATIVIDADE
        ===================================================== */

        .atividade {

            padding: 18px;

            border-radius: 18px;

            background:
                rgba(18,21,27,.82);

            border:
                1px solid var(--border);

        }


        .atividade-item {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 13px 0;

            border-bottom:
                1px solid rgba(255,255,255,.045);

        }


        .atividade-item:last-child {
            border-bottom: 0;
        }


        .atividade-icon {

            width: 36px;

            height: 36px;

            flex: 0 0 auto;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background:
                rgba(255,255,255,.04);

            color: var(--muted);

        }


        .atividade-info {
            flex: 1;
        }


        .atividade-info strong {

            display: block;

            font-size: 11px;

            font-weight: 800;

        }


        .atividade-info span {

            display: block;

            margin-top: 3px;

            color: var(--dark-muted);

            font-size: 10px;

        }


        .atividade-status {

            padding:
                5px 8px;

            border-radius: 7px;

            font-size: 9px;

            font-weight: 900;

        }


        .pendente {

            color: #fbbf24;

            background:
                rgba(245,158,11,.09);

        }


        .aprovado {

            color: #4ade80;

            background:
                rgba(34,197,94,.09);

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            padding-top: 20px;

            text-align: center;

            color: #4d535e;

            font-size: 10px;

            line-height: 1.7;

        }


        .footer strong {
            color: #676e79;
        }


        /* =====================================================
           RESPONSIVO
        ===================================================== */

        @media (max-width: 800px) {

            .resumo {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .registros-grid {

                grid-template-columns:
                    1fr;

            }


            .registro-card {

                min-height: 185px;

            }


            .ferramentas {

                grid-template-columns:
                    1fr;

            }

        }


        @media (max-width: 520px) {

            .container {

                width:
                    min(100% - 20px, 1050px);

                padding-top: 20px;

            }


            .topo-inner {

                width:
                    calc(100% - 20px);

            }


            .marca h1 {

                font-size: 12px;

            }


            .marca p {
                font-size: 9px;
            }


            .hero {

                display: block;

            }


            .status {

                display: inline-flex;

                margin-top: 15px;

            }


            .resumo {

                gap: 9px;

            }


            .resumo-card {

                padding: 14px;

            }


            .resumo-value {

                font-size: 20px;

            }


            .atalhos {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>

    <div class="topo-inner">
