<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organização Itália · Acesso</title>
    <meta name="theme-color" content="#080a0f">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://oesqxkszqdcdquoxdvms.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DXzmPUIRXCSdW-tuUMevZA_Zs0C7Usl";
    </script>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        min-height: 100%;
        background: #080a0f;
        color: #f1f1f3;
        font-family: Arial, Helvetica, sans-serif;
    }
    body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
        background: radial-gradient(circle at top, rgba(196, 30, 58, 0.10), transparent 45%), #080a0f;
    }
    .container { width: 100%; max-width: 430px; }
    .header { text-align: center; margin-bottom: 32px; }
    .logo {
        width: 90px; height: 90px;
        margin: 0 auto 22px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 24px;
        background: #151821; border: 1px solid #2a2f3a;
        box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }
    .logo i { font-size: 30px; color: #eee; }
    .header h1 { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
    .header p { margin-top: 9px; color: #8d95a5; font-size: 16px; }
    .status { margin-top: 21px; color: #646c7b; font-size: 11px; letter-spacing: 1.7px; text-transform: uppercase; }
    .login-card {
        width: 100%; padding: 30px 28px;
        background: #12151d; border: 1px solid #252a35; border-top: 3px solid #c41e3a;
        border-radius: 24px;
        box-shadow: 0 25px 70px rgba(0,0,0,.35);
    }
    .login-title { margin-bottom: 27px; font-size: 25px; font-weight: 800; }
    .field { margin-bottom: 22px; }
    .field label { display: block; margin-bottom: 9px; color: #aeb6c6; font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .input-box { position: relative; }
    .input-box > i {
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
        color: #8993a5; font-size: 17px; pointer-events: none;
    }
    .input-box input {
        width: 100%; height: 60px; padding: 0 52px;
        background: #0d1724; border: 1px solid #29303c; border-radius: 18px;
        outline: none; color: #f1f1f3; font-size: 16px;
    }
    .input-box input::placeholder { color: #647086; }
    .eye-button {
        position: absolute; right: 17px; top: 50%; transform: translateY(-50%);
        border: none; background: transparent; color: #8993a5; font-size: 19px; cursor: pointer;
    }
    .recovery { display: flex; align-items: center; gap: 10px; margin: 2px 0 24px; color: #9ca7b9; font-size: 14px; }
    .recovery input { width: 18px; height: 18px; accent-color: #c41e3a; }
    .login-button {
        width: 100%; height: 60px;
        border: none; border-radius: 18px; background: #c41e3a;
        color: white; font-size: 17px; font-weight: 800;
        cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .login-button:hover { background: #d32342; }
    .mensagem { min-height: 20px; margin-top: 16px; text-align: center; font-size: 14px; font-weight: 700; }
    .mensagem.erro { color: #ff657f; }
    .mensagem.sucesso { color: #55d98a; }
    .forgot { display: block; margin-top: 26px; text-align: center; color: #cfd3db; text-decoration: none; font-size: 15px; font-weight: 700; }
    .footer { margin-top: 32px; text-align: center; color: #515968; font-size: 11px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <!-- Ícone alterado: coroa → escudo (mais profissional/segurança) -->
        <div class="logo"><i class="fas fa-shield-halved"></i></div>
        <h1>Organização Itália</h1>
        <p>Sistema de Gestão Interna</p>
        <div class="status">🔒 Acesso restrito · Uso monitorado</div>
    </div>

    <div class="login-card">
        <div class="login-title">Entrar no sistema</div>

        <div class="field">
            <label for="passaporte">Número de Passaporte</label>
            <div class="input-box">
                <i class="fas fa-id-card"></i>
                <input type="text" id="passaporte" placeholder="Digite seu passaporte" inputmode="numeric" autocomplete="username">
            </div>
        </div>

        <div class="field">
            <label for="senha">Senha de Acesso</label>
            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
                <button type="button" class="eye-button" id="btnOlho"><i class="fas fa-eye"></i></button>
            </div>
        </div>

        <label class="recovery">
            <input type="checkbox" id="recuperacao">
            <span>Autorizar recuperação neste aparelho</span>
        </label>

        <button type="button" class="login-button" id="btnEntrar">
            <span id="textoBotao">Entrar no sistema</span>
            <i class="fas fa-arrow-right"></i>
        </button>

        <div id="mensagem" class="mensagem"></div>
        <a href="#" class="forgot" id="esqueciSenha">Esqueci minha senha</a>
    </div>

    <div class="footer">Organização Itália · Sistema Interno</div>
</div>

<script>
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const passaporteEl = document.getElementById('passaporte');
    const senhaEl = document.getElementById('senha');
    const btnOlho = document.getElementById('btnOlho');
    const btnEntrar = document.getElementById('btnEntrar');
    const mensagemEl = document.getElementById('mensagem');

    btnOlho.addEventListener('click', () => {
        senhaEl.type = senhaEl.type === 'password' ? 'text' : 'password';
        btnOlho.innerHTML = senhaEl.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    function msg(texto, tipo) {
        mensagemEl.textContent = texto;
        mensagemEl.className = 'mensagem ' + tipo;
    }

    btnEntrar.addEventListener('click', async () => {
        const pass = passaporteEl.value.trim();
        const senha = senhaEl.value;

        if (!pass || !senha) return msg('Preencha os dois campos!', 'erro');
        
        btnEntrar.disabled = true;
        msg('Verificando...', '');

        try {
            const { data, error } = await supabase
                .from('membros')
                .select('*')
                .eq('passaporte', pass)
                .eq('senha_credencial', senha)
                .maybeSingle();

            if (error) throw error;

            if (!data) {
                msg('❌ Passaporte ou senha incorretos', 'erro');
                btnEntrar.disabled = false;
                return;
            }

            sessionStorage.setItem('usuario', JSON.stringify(data));
            msg('✅ Acesso autorizado!', 'sucesso');
            
            setTimeout(() => {
                window.location.href = 'painel.html';
            }, 600);

        } catch (err) {
            msg('⚠️ Erro: ' + err.message, 'erro');
            console.error(err);
            btnEntrar.disabled = false;
        }
    });

    document.getElementById('esqueciSenha').addEventListener('click', e => {
        e.preventDefault();
        alert('Procure a administração para redefinir sua credencial.');
    });
</script>

</body>
</html>
