<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>ITÁLIA · ACESSO</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            min-height: 100vh;
            background-color: #050508;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forma-superior {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 40%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 50%, #7DD3FC 100%);
            border-bottom-right-radius: 50% 80%;
            opacity: 0.85;
            filter: blur(8px);
        }

        .forma-inferior {
            position: absolute;
            bottom: 0; right: 0;
            width: 100%; height: 35%;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 50%, #7DD3FC 100%);
            border-top-left-radius: 60% 100%;
            opacity: 0.85;
            filter: blur(8px);
        }

        .luzes-fundo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background-image: 
                radial-gradient(3px 3px at 10% 15%, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 25% 40%, rgba(125,211,252,0.8), transparent),
                radial-gradient(2px 2px at 40% 20%, rgba(255,255,255,0.85), transparent),
                radial-gradient(3px 3px at 55% 60%, rgba(56,189,248,0.8), transparent),
                radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,0.75), transparent),
                radial-gradient(3px 3px at 85% 50%, rgba(125,211,252,0.8), transparent),
                radial-gradient(2px 2px at 15% 65%, rgba(255,255,255,0.8), transparent),
                radial-gradient(3px 3px at 30% 85%, rgba(56,189,248,0.7), transparent),
                radial-gradient(2px 2px at 50% 75%, rgba(255,255,255,0.85), transparent),
                radial-gradient(3px 3px at 65% 10%, rgba(125,211,252,0.75), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.8), transparent),
                radial-gradient(3px 3px at 90% 35%, rgba(56,189,248,0.7), transparent),
                radial-gradient(2px 2px at 5% 50%, rgba(255,255,255,0.7), transparent),
                radial-gradient(3px 3px at 20% 90%, rgba(125,211,252,0.8), transparent),
                radial-gradient(2px 2px at 75% 90%, rgba(255,255,255,0.8), transparent);
            background-size: 100% 100%;
            animation: movimentoSuave 6s ease-in-out infinite;
            filter: blur(0);
        }

        @keyframes movimentoSuave {
            0% { opacity: 0.4; transform: translateY(0px); }
            50% { opacity: 1; transform: translateY(-10px); }
            100% { opacity: 0.4; transform: translateY(0px); }
        }

        .login-card {
            position: relative;
            z-index: 4;
            width: 90%;
            max-width: 420px;
            padding: 60px 30px;
            animation: surgirSuave 0.8s ease-out;
        }

        @keyframes surgirSuave {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .titulo {
            text-align: center;
            margin-bottom: 35px;
        }

        .titulo h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        .titulo p {
            color: #7DD3FC;
            font-size: 15px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .notificacao {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            animation: notifEntrada 0.45s ease-out;
        }

        @keyframes notifEntrada {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .notificacao i {
            font-size: 20px;
            flex-shrink: 0;
        }

        .sucesso {
            background: linear-gradient(135deg, #166534, #15803d);
            color: #bbf7d0;
        }

        .erro {
            background: linear-gradient(135deg, #991b1b, #b91c1c);
            color: #fecaca;
        }

        .input-grupo {
            margin-bottom: 18px;
            position: relative;
        }

        .input-icone {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .input-campo {
            width: 100%;
            padding: 16px 55px 16px 68px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 999px;
            font-size: 16px;
            color: #000000;
            outline: none;
        }

        .input-campo::placeholder {
            color: #94A3B8;
        }

        .botao-senha {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #94A3B8;
            font-size: 18px;
            cursor: pointer;
        }

        .opcoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding: 0 5px;
            font-size: 15px;
        }

        .lembrar {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #CBD5E1;
            cursor: pointer;
        }

        .esqueceu {
            color: #7DD3FC;
            text-decoration: none;
        }

        .botao-entrar {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
            border: none;
            border-radius: 999px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0.9;
        }

        .botao-entrar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .voltar {
            text-align: center;
            margin-top: 40px;
        }

        .voltar a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 15px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="forma-superior"></div>
    <div class="forma-inferior"></div>
    <div class="luzes-fundo"></div>

    <div class="login-card">
        <div class="titulo">
            <h1>ITÁLIA</h1>
            <p>SISTEMA DE ACESSO</p>
        </div>

        <div id="notificacao" class="notificacao"></div>

        <form id="formLogin">
            <div class="input-grupo">
                <div class="input-icone"><i class="fas fa-id-card"></i></div>
                <input type="text" id="passaporte" class="input-campo" placeholder="Passaporte" required>
            </div>

            <div class="input-grupo">
                <div class="input-icone"><i class="fas fa-lock"></i></div>
                <input type="password" id="senha" class="input-campo" placeholder="Senha" required>
                <button type="button" class="botao-senha" onclick="alternarSenha()">
                    <i id="iconeOlho" class="fas fa-eye"></i>
                </button>
            </div>

            <div class="opcoes">
                <label class="lembrar">
                    <input type="checkbox" id="lembrarMe"> Lembrar-me
                </label>
                <a href="#" class="esqueceu">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="botao-entrar" id="botaoEntrar">ENTRAR</button>
        </form>

        <div class="voltar">
            <a href="index.html">← Voltar para tela inicial</a>
        </div>
    </div>
        <script>
        function alternarSenha() {
            const campo = document.getElementById('senha');
            const icone = document.getElementById('iconeOlho');
            campo.type = campo.type === 'password' ? 'text' : 'password';
            icone.classList.toggle('fa-eye');
            icone.classList.toggle('fa-eye-slash');
        }

        const form = document.getElementById('formLogin');
        const notificacao = document.getElementById('notificacao');
        const passaporteInput = document.getElementById('passaporte');
        const lembrarMeCheckbox = document.getElementById('lembrarMe');
        const botaoEntrar = document.getElementById('botaoEntrar');

        window.addEventListener('load', () => {
            const salvo = localStorage.getItem('lembrarPassaporte');
            if (salvo) {
                passaporteInput.value = salvo;
                lembrarMeCheckbox.checked = true;
            }
        });

        function mostrarNotificacao(texto, tipo) {
            const icone = tipo === 'sucesso' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            notificacao.innerHTML = `<i class="fas ${icone}"></i><span>${texto}</span>`;
            notificacao.className = `notificacao ${tipo}`;
            notificacao.style.display = 'flex';
            clearTimeout(window.tempoNotificacao);
            window.tempoNotificacao = setTimeout(() => {
                notificacao.style.display = 'none';
            }, 3500);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const passaporte = passaporteInput.value.trim();
            const senha = document.getElementById('senha').value;

            if (!passaporte || !senha) {
                mostrarNotificacao('Preencha todos os campos', 'erro');
                return;
            }

            localStorage.setItem('lembrarPassaporte', lembrarMeCheckbox.checked ? passaporte : '');
            if (!lembrarMeCheckbox.checked) localStorage.removeItem('lembrarPassaporte');

            botaoEntrar.disabled = true;
            botaoEntrar.textContent = 'ENTRANDO...';
            notificacao.style.display = 'none';

            try {
                const { data, error } = await sb
                    .from('membros')
                    .select('id, passaporte, nome, cargo, ativo, equipe_id')
                    .eq('passaporte', passaporte)
                    .eq('senha_credencial', senha)
                    .single();

                if (error) {
                    if (error.code === 'PGRST116') {
                        throw new Error('Passaporte ou senha incorretos');
                    }
                    throw error;
                }

                if (!data.ativo) {
                    throw new Error('Conta desativada');
                }

                // ✅ SALVA DOS DOIS JEITOS — O PAINEL VAI ENCONTRAR!
                localStorage.setItem('passaporte', data.passaporte); // ← linha mágica!
                localStorage.setItem('usuario', JSON.stringify({
                    id: data.id,
                    passaporte: data.passaporte,
                    nome: data.nome,
                    cargo: data.cargo,
                    equipe_id: data.equipe_id
                }));

                mostrarNotificacao(`Bem-vindo, ${data.nome}! Acesso concedido`, 'sucesso');
                setTimeout(() => window.location.href = 'painel.html', 900);

            } catch (erro) {
                mostrarNotificacao(erro.message, 'erro');
            } finally {
                botaoEntrar.disabled = false;
                botaoEntrar.textContent = 'ENTRAR';
            }
        });
    </script>
</body>
</html>
