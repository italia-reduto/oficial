<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORGANIZAÇÃO ITÁLIA • ACESSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#0a0a0d', // Fundo quase preto absoluto
                        cartao: '#14141a',
                        destaque: '#c41e3a',
                        texto: '#e4e4e7',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background-color: #0a0a0d !important; 
            min-height: 100vh; 
            height: 100%;
        }
        body { 
            background-image: radial-gradient(circle at top, rgba(196,30,58,0.06), transparent 50%); 
        }
    </style>
</head>
<body class="bg-fundo text-texto font-sans flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <div class="text-5xl mb-4">🇮🇹</div>
            <h1 class="text-xl font-bold tracking-widest uppercase">Organização Itália</h1>
            <p class="text-slate-500 text-sm mt-2">Sistema de Gestão Interna</p>
            <div class="mt-6 text-xs text-slate-600 uppercase tracking-wider">🔒 Acesso Restrito • Uso Monitorado</div>
        </div>

        <div class="bg-cartao/80 rounded-2xl p-8 border border-slate-800/50 shadow-2xl">
            <div class="mb-6">
                <label class="block text-sm text-slate-300 mb-2">Número de Passaporte</label>
                <input type="text" id="passaporte" placeholder="Informe seu código"
                    class="w-full bg-transparent border-2 border-slate-300/80 rounded-xl px-4 py-3.5 focus:outline-none focus:border-destaque transition-all">
            </div>

            <div class="mb-8">
                <label class="block text-sm text-slate-300 mb-2">Senha de Acesso</label>
                <div class="relative">
                    <input type="password" id="senha" placeholder="••••••••"
                        class="w-full bg-transparent border-2 border-slate-300/80 rounded-xl px-4 py-3.5 pr-12 focus:outline-none focus:border-destaque transition-all">
                    <button type="button" id="btnOlho" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button id="btnAcessar" class="w-full bg-destaque hover:bg-destaque/90 text-white font-semibold py-4 rounded-xl transition-all flex items-center justify-center gap-2">
                <span>Entrar no Sistema</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <div class="text-center mt-6">
                <a href="#" id="linkEsqueci" class="text-slate-400 hover:text-destaque text-sm transition-colors">
                    <i class="fas fa-lock mr-1"></i> Esqueci minha senha
                </a>
            </div>
        </div>

        <div class="text-center text-slate-700 text-xs mt-10">USO EXCLUSIVO • PROIBIDA DIVULGAÇÃO EXTERNA</div>
    </div>

    <script>
        const inputSenha = document.getElementById('senha');
        const btnOlho = document.getElementById('btnOlho');

        btnOlho.addEventListener('click', () => {
            const tipo = inputSenha.type === 'password' ? 'text' : 'password';
            inputSenha.type = tipo;
            btnOlho.innerHTML = tipo === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });

        document.getElementById('btnAcessar').addEventListener('click', () => {
            const p = document.getElementById('passaporte').value.trim();
            const s = inputSenha.value;
            if (!p || !s) return alert('Preencha todos os campos para continuar.');
            localStorage.setItem('it_passaporte', p);
            window.location.href = 'inicio.html';
        });

        document.getElementById('linkEsqueci').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Para recuperar acesso, procure a Administração da Organização.');
        });
    </script>
</body>
</html>
