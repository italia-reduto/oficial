<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f0d">
    <meta name="color-scheme" content="dark">
    <title>Itália | Portal do Efetivo</title>
    
    <!-- Configurações do PWA (Atalho Celular) -->
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portal Itália">
    <link rel="apple-touch-icon" href="./1794110287992~2.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e;
            --fundo: #050806;
            --vidro: rgba(13, 20, 16, 0.7);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

        /* FUNDO E EFEITOS */
        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        .grade-fundo { position: fixed; inset: 0; background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; mask-image: radial-gradient(circle at center, black 10%, transparent 90%); -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%); }
        
        .container-login { width: 100%; max-width: 420px; background: var(--vidro); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--borda); border-radius: 16px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); position: relative; z-index: 10; text-align: left; animation: surgir 0.8s ease-out; }
        @keyframes surgir { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* CANTOS DO HUD */
        .container-login::before, .container-login::after { content: ''; position: absolute; width: 30px; height: 30px; border: 2px solid var(--verde); }
        .container-login::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 16px 0 0 0; }
        .container-login::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 16px 0; }

        /* TAG TERMINAL SEGURO */
        .tag-status { display: inline-flex; align-items: center; gap: 8px; background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--verde); padding: 6px 12px; font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #86efac; margin-bottom: 20px; }
        .tag-status span { width: 6px; height: 6px; background: var(--verde); border-radius: 50%; box-shadow: 0 0 10px var(--verde); animation: piscar 1.5s infinite; }
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        /* HEADER */
        .header-login { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .btn-voltar { width: 35px; height: 35px; background: transparent; border: 1px solid var(--borda); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--texto-mutado); text-decoration: none; transition: 0.3s; }
        .btn-voltar:hover { color: var(--verde); border-color: var(--verde); }
        .titulo { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
        
        .subtitulo { font-size: 13px; color: var(--texto-mutado); margin-bottom: 30px; line-height: 1.5; }

        /* INPUTS E BOTÃO */
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--texto-mutado); }
        .input-wrapper input { width: 100%; padding: 15px 15px 15px 45px; background: rgba(0,0,0,0.4); border: 1px solid var(--borda); border-radius: 8px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .input-wrapper input:focus { border-color: var(--verde); }
        
        .btn-entrar { width: 100%; padding: 16px; background: var(--verde); color: #000; border: none; border-radius: 8px; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-entrar:hover { background: #16a34a; }
        .btn-entrar:disabled { opacity: 0.7; cursor: not-allowed; }

        .link-whitelist { text-align: center; font-size: 13px; color: var(--texto-mutado); margin-top: 25px; border-top: 1px solid var(--borda); padding-top: 25px;}
        .link-whitelist a { color: var(--verde); text-decoration: none; font-weight: 600; }
        .link-whitelist a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- FUNDO -->
    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>

    <div class="container-login">
        <!-- TAG TERMINAL SEGURO -->
        <div class="tag-status"><span></span> Terminal Seguro</div>

        <!-- HEADER -->
        <div class="header-login">     
            <h1 class="titulo">Acessar Sistema</h1>
        </div>
        
        <p class="subtitulo">Autentique-se com seu passaporte para entrar na central de comando.</p>

        <!-- FORMULÁRIO -->
        <div class="input-group" style="margin-bottom: 15px;">
            <label style="display: block; font-size: 11px; font-weight: 600; color: var(--verde); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Passaporte</label>
            <div class="input-wrapper">
                <i class="fas fa-id-card"></i>
                <input type="text" id="input-passaporte" placeholder="Ex: 17274" autocomplete="off">
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 25px;">
            <label style="display: block; font-size: 11px; font-weight: 600; color: var(--verde); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Senha</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="input-senha" placeholder="Sua senha de acesso">
            </div>
        </div>

        <!-- BOTÃO ENTRAR -->
        <button id="btn-entrar" class="btn-entrar" onclick="fazerLogin()">
            Entrar no Sistema <i class="fas fa-chevron-right" style="font-size: 12px;"></i>
        </button>

        <!-- LINK WHITELIST -->
        <div class="link-whitelist">
            Ainda não tem acesso? <a href="registro.html">Faça sua Whitelist</a>
        </div>
    </div>

    <script>
        // Permite apertar "Enter" para pular de campo ou fazer login
        document.getElementById('input-passaporte').addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('input-senha').focus(); });
        document.getElementById('input-senha').addEventListener('keypress', function(e) { if (e.key === 'Enter') fazerLogin(); });

        async function fazerLogin() {
            const passaporte = document.getElementById('input-passaporte').value.trim();
            const senha = document.getElementById('input-senha').value.trim();
            const btn = document.getElementById('btn-entrar');

            if (!passaporte || !senha) {
                alert("Por favor, preencha o passaporte e a senha.");
                return;
            }

            // Feedback visual no botão
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando...';
            btn.disabled = true;

            try {
                // Busca o membro no banco
                const { data: membro, error } = await sb.from('membros')
                    .select('*')
                    .eq('passaporte', passaporte)
                    .single();

                if (error || !membro) throw new Error("Passaporte não encontrado.");

                // Verifica a senha
                if (membro.senha && membro.senha !== senha) {
                    throw new Error("Senha incorreta.");
                }

                // --- SUCESSO NO LOGIN ---
                // Salva os dados na sessão do navegador
                sessionStorage.setItem('membro_logado', JSON.stringify(membro));

                // ==========================================
                // REDIRECIONAMENTO BLINDADO
                // ==========================================
                const CARGOS_LIDERANCA = ['Líder da organização', '01 da organização', 'Coordenador', 'Gerente geral', 'Gerente'];
                
                // Transforma o cargo em minúsculo para não dar erro de digitação
                const cargoDoCara = String(membro.cargo || '').trim().toLowerCase();
                const isAdmin = CARGOS_LIDERANCA.map(c => c.toLowerCase()).includes(cargoDoCara);

                if (isAdmin) {
                    window.location.href = 'admin.html'; // Vai pro Radar
                } else {
                    window.location.href = 'dashboard.html'; // Vai pro Painel de Jogador
                }

            } catch (err) {
                alert(err.message || "Erro ao fazer login. Verifique os dados.");
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
