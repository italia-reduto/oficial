<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Organização Itália · Acesso</title>

<meta name="theme-color" content="#080a0f">
<meta name="color-scheme" content="dark">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
        background: #080a0f;
        color: #f1f1f3;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;

        background:
            radial-gradient(
                circle at top,
                rgba(196, 30, 58, 0.10),
                transparent 45%
            ),
            #080a0f;
    }

    .container {
        width: 100%;
        max-width: 430px;
    }

    /* CABEÇALHO */

    .header {
        text-align: center;
        margin-bottom: 32px;
    }

    .logo {
        width: 90px;
        height: 90px;

        margin: 0 auto 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 24px;

        background: #151821;
        border: 1px solid #2a2f3a;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, .35);
    }

    .logo i {
        font-size: 30px;
        color: #eeeeef;
    }

    .header h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .header p {
        margin-top: 9px;
        color: #8d95a5;
        font-size: 16px;
    }

    .status {
        margin-top: 21px;
        color: #646c7b;
        font-size: 11px;
        letter-spacing: 1.7px;
        text-transform: uppercase;
    }

    /* CARTÃO */

    .login-card {
        width: 100%;

        padding: 30px 28px;

        background: #12151d;

        border: 1px solid #252a35;
        border-top: 3px solid #c41e3a;

        border-radius: 24px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, .35);
    }

    .login-title {
        margin-bottom: 27px;

        font-size: 25px;
        font-weight: 800;
    }

    /* CAMPOS */

    .field {
        margin-bottom: 22px;
    }

    .field label {
        display: block;

        margin-bottom: 9px;

        color: #aeb6c6;

        font-size: 15px;
        font-weight: 700;
        letter-spacing: .5px;
    }

    .input-box {
        position: relative;
    }

    .input-box > i {
        position: absolute;

        left: 18px;
        top: 50%;

        transform: translateY(-50%);

        color: #8993a5;

        font-size: 17px;

        pointer-events: none;
    }

    .input-box input {
        width: 100%;
        height: 60px;

        padding: 0 52px;

        background: #0d1724;

        border: 1px solid #29303c;
        border-radius: 18px;

        outline: none;

        color: #f1f1f3;

        font-size: 16px;

        transition: .2s;
    }

    .input-box input::placeholder {
        color: #647086;
    }

    .input-box input:focus {
        border-color: #c41e3a;

        box-shadow:
            0 0 0 3px rgba(196, 30, 58, .12);
    }

    /* OLHO */

    .eye-button {
        position: absolute;

        right: 17px;
        top: 50%;

        transform: translateY(-50%);

        border: none;

        background: transparent;

        color: #8993a5;

        font-size: 19px;

        cursor: pointer;
    }

    /* RECUPERAÇÃO */

    .recovery {
        display: flex;

        align-items: center;

        gap: 10px;

        margin: 2px 0 24px;

        color: #9ca7b9;

        font-size: 14px;
    }

    .recovery input {
        width: 18px;
        height: 18px;

        accent-color: #c41e3a;
    }

    /* BOTÃO */

    .login-button {
        width: 100%;
        height: 60px;

        border: none;
        border-radius: 18px;

        background: #c41e3a;

        color: white;

        font-size: 17px;
        font-weight: 800;

        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 12px;

        transition: .2s;
    }

    .login-button:hover {
        background: #d32342;
    }

    .login-button:active {
        transform: scale(.99);
    }

    .login-button:disabled {
        opacity: .75;
        cursor: wait;
    }

    /* MENSAGEM */

    .mensagem {
        min-height: 20px;

        margin-top: 16px;

        text-align: center;

        font-size: 14px;
        font-weight: 700;
    }

    .mensagem.erro {
        color: #ff657f;
    }

    .mensagem.sucesso {
        color: #55d98a;
    }

    /* ESQUECI SENHA */

    .forgot {
        display: block;

        margin-top: 26px;

        text-align: center;

        color: #cfd3db;

        text-decoration: none;

        font-size: 15px;
        font-weight: 700;
    }

    .forgot:hover {
        color: #e83b59;
    }

    /* RODAPÉ */

    .footer {
        margin-top: 32px;

        text-align: center;

        color: #515968;

        font-size: 11px;

        letter-spacing: 1px;

        text-transform: uppercase;
    }

    /* CELULAR PEQUENO */

    @media (max-height: 700px) {

        body {
            align-items: flex-start;
            padding-top: 18px;
        }

        .header {
            margin-bottom: 20px;
        }

        .logo {
            width: 68px;
            height: 68px;

            margin-bottom: 14px;
        }

        .logo i {
            font-size: 24px;
        }

        .header h1 {
            font-size: 24px;
        }

        .login-card {
            padding: 25px 22px;
        }
    }
</style>

</head><body><div class="container">

    <!-- CABEÇALHO -->

    <div class="header">

        <div class="logo">
            <i class="fas fa-crown"></i>
        </div>

        <h1>
            Organização Itália
        </h1>

        <p>
            Sistema de Gestão Interna
        </p>

        <div class="status">
            🔒 Acesso restrito · Uso monitorado
        </div>

    </div>


    <!-- LOGIN -->

    <div class="login-card">

        <div class="login-title">
            Entrar no sistema
        </div>


        <!-- PASSAPORTE -->

        <div class="field">

            <label for="passaporte">
                Número de Passaporte
            </label>

            <div class="input-box">

                <i class="fas fa-id-card"></i>

                <input
                    type="text"
                    id="passaporte"
                    placeholder="Digite seu passaporte"
                    inputmode="numeric"
                    autocomplete="username"
                >

            </div>

        </div>


        <!-- SENHA -->

        <div class="field">

            <label for="senha">
                Senha de Acesso
            </label>

            <div class="input-box">

                <i class="fas fa-lock"></i>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="eye-button"
                    id="btnOlho"
                    aria-label="Mostrar senha"
                >
                    <i class="fas fa-eye"></i>
                </button>

            </div>

        </div>


        <!-- RECUPERAÇÃO -->

        <label class="recovery">

            <input
                type="checkbox"
                id="recuperacao"
            >

            <span>
                Autorizar recuperação neste aparelho
            </span>

        </label>


        <!-- BOTÃO -->

        <button
            type="button"
            class="login-button"
            id="btnEntrar"
        >

            <span id="textoBotao">
                Entrar no sistema
            </span>

            <i
                class="fas fa-arrow-right"
                id="iconeBotao"
            ></i>

        </button>


        <!-- MENSAGEM -->

        <div
            id="mensagem"
            class="mensagem"
            aria-live="polite"
        ></div>


        <!-- ESQUECI SENHA -->

        <a
            href="#"
            class="forgot"
            id="esqueciSenha"
        >
            Esqueci minha senha
        </a>

    </div>


    <!-- RODAPÉ -->

    <div class="footer">
        Organização Itália · Sistema interno
    </div>

</div>


<script>

    /* =====================================================
       CONFIGURAÇÃO SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "COLE_AQUI_A_URL_DO_SEU_PROJETO";

    const SUPABASE_PUBLISHABLE_KEY =
        "COLE_AQUI_SUA_PUBLISHABLE_KEY";


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const passaporte =
        document.getElementById("passaporte");

    const senha =
        document.getElementById("senha");

    const btnOlho =
        document.getElementById("btnOlho");

    const btnEntrar =
        document.getElementById("btnEntrar");

    const textoBotao =
        document.getElementById("textoBotao");

    const iconeBotao =
        document.getElementById("iconeBotao");

    const esqueciSenha =
        document.getElementById("esqueciSenha");

    const mensagem =
        document.getElementById("mensagem");


    /* =====================================================
       VERIFICAR SUPABASE
    ===================================================== */

    if (
        typeof supabase === "undefined" ||
        typeof supabase.createClient !== "function"
    ) {

        console.error(
            "Supabase JS não foi carregado."
        );

        mensagem.textContent =
            "Erro ao carregar o sistema. Recarregue a página.";

        mensagem.className =
            "mensagem erro";

    }


    /* =====================================================
       CRIAR CLIENTE
    ===================================================== */

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =====================================================
       MOSTRAR / ESCONDER SENHA
    ===================================================== */

    btnOlho.addEventListener(
        "click",
        function () {

            if (senha.type === "password") {

                senha.type = "text";

                btnOlho.innerHTML =
                    '<i class="fas fa-eye-slash"></i>';

                btnOlho.setAttribute(
                    "aria-label",
                    "Esconder senha"
                );

            } else {

                senha.type = "password";

                btnOlho.innerHTML =
                    '<i class="fas fa-eye"></i>';

                btnOlho.setAttribute(
                    "aria-label",
                    "Mostrar senha"
                );

            }

        }
    );


    /* =====================================================
       MENSAGEM
    ===================================================== */

    function mostrarMensagem(
        texto,
        tipo = "erro"
    ) {

        mensagem.textContent = texto;

        mensagem.className =
            "mensagem " + tipo;

    }


    /* =====================================================
       ESTADO DO BOTÃO
    ===================================================== */

    function carregando(
        estado
    ) {

        btnEntrar.disabled = estado;

        if (estado) {

            textoBotao.textContent =
                "Verificando...";

            iconeBotao.className =
                "fas fa-spinner fa-spin";

        } else {

            textoBotao.textContent =
                "Entrar no sistema";

            iconeBotao.className =
                "fas fa-arrow-right";

        }

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    async function entrarNoSistema() {

        if (btnEntrar.disabled) {
            return;
        }

        const passaporteValor =
            passaporte.value.trim();

        const senhaValor =
            senha.value;

        mostrarMensagem("");

        if (!passaporteValor) {

            mostrarMensagem(
                "Digite seu passaporte."
            );

            passaporte.focus();

            return;
        }

        if (!senhaValor) {

            mostrarMensagem(
                "Digite sua senha."
            );

            senha.focus();

            return;
        }


        carregando(true);


        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("membros")
                .select(
                    "passaporte,nome,cargo,ativo"
                )
                .eq(
                    "passaporte",
                    passaporteValor
                )
                .eq(
                    "senha_credencial",
                    senhaValor
                )
                .eq(
                    "ativo",
                    true
                )
                .maybeSingle();


            if (error) {

                console.error(
                    "Erro Supabase:",
                    error
                );

                mostrarMensagem(
                    "Não foi possível verificar o acesso."
                );

                carregando(false);

                return;
            }


            if (!data) {

                mostrarMensagem(
                    "Passaporte ou senha incorretos."
                );

                carregando(false);

                return;
            }


            /* ==========================================
               LOGIN APROVADO
            ========================================== */

            sessionStorage.setItem(
                "italia_usuario",
                JSON.stringify(data)
            );


            mostrarMensagem(
                "Acesso autorizado. Entrando...",
                "sucesso"
            );


            setTimeout(
                function () {

                    window.location.href =
                        "./painel.html";

                },
                500
            );

        } catch (erro) {

            console.error(
                "Erro inesperado:",
                erro
            );

            mostrarMensagem(
                "Erro inesperado. Tente novamente."
            );

            carregando(false);

        }

    }


    /* =====================================================
       CLIQUE NO BOTÃO
    ===================================================== */

    btnEntrar.addEventListener(
        "click",
        entrarNoSistema
    );


    /* =====================================================
       ENTER NOS CAMPOS
    ===================================================== */

    passaporte.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                entrarNoSistema();

            }

        }
    );


    senha.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                entrarNoSistema();

            }

        }
    );


    /* =====================================================
       ESQUECI MINHA SENHA
    ===================================================== */

    esqueciSenha.addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            alert(
                "Entre em contato com a administração da Organização Itália para recuperar seu acesso."
            );

        }
    );

</script>

</body></html>
