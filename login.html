<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ORGANIZAÇÃO ITÁLIA · ACESSO</title><meta name="theme-color" content="#0a0a0d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                fundo: '#0a0a0d',
                cartao: '#14141a',
                destaque: '#c41e3a',
                texto: '#e4e4e7'
            },
            fontFamily: {
                sans: ['Inter', 'sans-serif']
            }
        }
    }
}
</script><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    background: #0a0a0d;
    min-height: 100vh;
    height: 100%;
}

body {
    background-image:
        radial-gradient(
            circle at top,
            rgba(196, 30, 58, 0.06),
            transparent 50%
        );
}

input {
    color: #e4e4e7;
}

input::placeholder {
    color: #9ca3af;
}

#btnAcessar:disabled {
    opacity: 0.8;
    cursor: wait;
}
</style></head><body class="bg-fundo text-texto font-sans flex items-center justify-center min-h-screen p-4"><div class="w-full max-w-md"><!-- CABEÇALHO -->
<div class="text-center mb-10">

    <div class="text-5xl mb-4">
        <i class="fas fa-crown"></i>
    </div>

    <h1 class="text-2xl font-bold uppercase tracking-widest">
        Organização Itália
    </h1>

    <p class="text-slate-400 mt-3">
        Sistema de Gestão Interna
    </p>

    <div class="mt-8 text-sm text-slate-500 uppercase tracking-wider">
        🔒 Acesso Restrito · Uso Monitorado
    </div>

</div>


<!-- CARTÃO DE LOGIN -->
<div class="bg-cartao/80 rounded-2xl p-8 border border-slate-800/50 shadow-2xl">

    <!-- PASSAPORTE -->
    <div class="mb-6">

        <label class="block text-sm text-slate-300 mb-2">
            Número de Passaporte
        </label>

        <div class="relative">

            <i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

            <input
                type="text"
                id="passaporte"
                placeholder="Ex: 17274"
                autocomplete="username"
                inputmode="numeric"
                class="w-full bg-transparent border-2 border-slate-600 rounded-xl pl-12 pr-4 py-4 focus:outline-none focus:border-destaque"
            >

        </div>

    </div>


    <!-- SENHA -->
    <div class="mb-8">

        <label class="block text-sm text-slate-300 mb-2">
            Senha de Acesso
        </label>

        <div class="relative">

            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                autocomplete="current-password"
                class="w-full bg-transparent border-2 border-slate-600 rounded-xl pl-12 pr-12 py-4 focus:outline-none focus:border-destaque"
            >

            <button
                type="button"
                id="btnOlho"
                aria-label="Mostrar senha"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
            >
                <i class="fas fa-eye"></i>
            </button>

        </div>

    </div>


    <!-- BOTÃO ENTRAR -->
    <button
        type="button"
        id="btnAcessar"
        class="w-full bg-destaque hover:bg-destaque/90 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center gap-2"
    >
        <span id="textoBotao">
            Entrar no Sistema
        </span>

        <i id="iconeBotao" class="fas fa-arrow-right"></i>
    </button>


    <!-- ESQUECI SENHA -->
    <div class="text-center mt-6">

        <a
            href="#"
            id="btnEsqueci"
            class="text-slate-500 hover:text-slate-300 text-sm transition-colors"
        >
            <i class="fas fa-lock mr-2"></i>
            Esqueci minha senha
        </a>

    </div>

</div>


<!-- RODAPÉ -->
<div class="text-center text-slate-600 text-xs mt-12">
    USO EXCLUSIVO · PROIBIDA DIVULGAÇÃO EXTERNA
</div>

</div><script>

const inputSenha = document.getElementById('senha');
const inputPassaporte = document.getElementById('passaporte');

const btnOlho = document.getElementById('btnOlho');
const btnAcessar = document.getElementById('btnAcessar');

const textoBotao = document.getElementById('textoBotao');
const iconeBotao = document.getElementById('iconeBotao');


// ===============================
// MOSTRAR / ESCONDER SENHA
// ===============================

btnOlho.addEventListener('click', function () {

    if (inputSenha.type === 'password') {

        inputSenha.type = 'text';

        btnOlho.innerHTML =
            '<i class="fas fa-eye-slash"></i>';

        btnOlho.setAttribute(
            'aria-label',
            'Esconder senha'
        );

    } else {

        inputSenha.type = 'password';

        btnOlho.innerHTML =
            '<i class="fas fa-eye"></i>';

        btnOlho.setAttribute(
            'aria-label',
            'Mostrar senha'
        );
    }

});


// ===============================
// ENTRAR NO SISTEMA
// ===============================

function entrarNoSistema() {

    if (btnAcessar.disabled) {
        return;
    }

    btnAcessar.disabled = true;

    textoBotao.textContent = 'Entrando...';

    iconeBotao.className =
        'fas fa-spinner fa-spin';


    setTimeout(function () {

        /*
         * O painel está no mesmo diretório
         * deste arquivo.
         */

        window.location.href = './painel.html';

    }, 300);

}


// ===============================
// CLIQUE NO BOTÃO
// ===============================

btnAcessar.addEventListener(
    'click',
    entrarNoSistema
);


// ===============================
// ENTER NO PASSAPORTE
// ===============================

inputPassaporte.addEventListener(
    'keydown',
    function(event) {

        if (event.key === 'Enter') {

            event.preventDefault();

            entrarNoSistema();

        }

    }
);


// ===============================
// ENTER NA SENHA
// ===============================

inputSenha.addEventListener(
    'keydown',
    function(event) {

        if (event.key === 'Enter') {

            event.preventDefault();

            entrarNoSistema();

        }

    }
);


// ===============================
// ESQUECI MINHA SENHA
// ===============================

document
    .getElementById('btnEsqueci')
    .addEventListener('click', function(event) {

        event.preventDefault();

        alert(
            'Entre em contato com a administração da Organização Itália para recuperar seu acesso.'
        );

    });

</script></body>
</html>
