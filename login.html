<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f0d">
    <meta name="color-scheme" content="dark">
    <title>Itália 2.0 | Acesso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e;
            --fundo: #0a0f0d;
            --vidro: rgba(15, 23, 20, 0.6);
            --borda: rgba(34, 197, 94, 0.2);
            --texto: #f3f4f6;
            --texto-mutado: #9ca3af;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        html { background-color: #0a0f0d; overflow-x: hidden; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%), radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.2) 0%, transparent 50%); z-index: -2; }
        .grade-fundo { position: fixed; inset: 0; background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; mask-image: radial-gradient(circle at center, black 10%, transparent 90%); -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 90%); }
        .particula { position: fixed; bottom: -10px; background-color: var(--verde); border-radius: 50%; box-shadow: 0 0 10px var(--verde); opacity: 0; animation: subir linear infinite; z-index: 5; }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; } .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; } .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; } .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; } .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        @keyframes subir { 0% { transform: translateY(0) scale(1); opacity: 0; } 20% { opacity: 0.6; } 80% { opacity: 0.6; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }

        .container-login { width: 100%; max-width: 400px; background: var(--vidro); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--borda); border-radius: 16px; padding: 40px 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); position: relative; z-index: 10; text-align: center; animation: surgir 0.8s ease-out; }
        @keyframes surgir { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .container-login::before, .container-login::after { content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--verde); }
        .container-login::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-radius: 16px 0 0 0; }
        .container-login::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-radius: 0 0 16px 0; }

        .logo-icone { font-size: 50px; color: var(--verde); margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(34, 197, 94, 0.4)); }
        .titulo { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 2px; margin-bottom: 5px; color: #fff; text-transform: uppercase; }
        .subtitulo { font-size: 13px; color: var(--texto-mutado); margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--texto-mutado); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--texto-mutado); font-size: 16px; }
        .input-wrapper input { width: 100%; padding: 15px 15px 15px 45px; background: rgba(0,0,0,0.4); border: 1px solid var(--borda); border-radius: 8px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; outline: none; transition: 0.3s; }
        .input-wrapper input:focus { border-color: var(--verde); box-shadow: 0 0 10px rgba(34, 197, 94, 0.1); }

        .btn-entrar { width: 100%; padding: 16px; background: var(--verde); color: #000; border: none; border-radius: 8px; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-entrar:hover { background: #16a34a; }
        .btn-entrar:disabled { background: #166534; cursor: not-allowed; opacity: 0.7; }

        .msg-erro { display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--vermelho); color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; text-align: center; }
        
        .rodape { margin-top: 30px; font-size: 10px; color: #52525b; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>
    <!-- FUNDO -->
    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>
    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>

    <div class="container-login">
        <i class="fas fa-shield-alt logo-icone"></i>
        <h1 class="titulo">Acessar Sistema</h1>
        <p class="subtitulo">Autentique-se com seu passaporte.</p>

        <div class="msg-erro" id="msg-erro">
            <i class="fas fa-exclamation-circle"></i> Passaporte ou senha incorretos.
        </div>

        <div class="input-group">
            <label>Passaporte</label>
            <div class="input-wrapper">
                <i class="fas fa-id-card"></i>
                <input type="text" id="input-passaporte" placeholder="Ex: 17274" autocomplete="off">
            </div>
        </div>

        <div class="input-group">
            <label>Senha de Acesso</label>
            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" id="input-senha" placeholder="Sua senha de acesso">
            </div>
        </div>

        <button class="btn-entrar" id="btn-entrar" onclick="fazerLogin()">
            <i class="fas fa-sign-in-alt"></i> Entrar no Sistema
        </button>

        <div class="rodape">
            © 2026 Organização Itália
        </div>
    </div>
        <script>
        // Função para permitir apertar "Enter" nos campos de texto
        document.getElementById('input-passaporte').addEventListener('keypress', function(e) { if (e.key === 'Enter') document.getElementById('input-senha').focus(); });
        document.getElementById('input-senha').addEventListener('keypress', function(e) { if (e.key === 'Enter') fazerLogin(); });

        async function fazerLogin() {
            const passaporte = document.getElementById('input-passaporte').value.trim();
            const senha = document.getElementById('input-senha').value.trim();
            const btn = document.getElementById('btn-entrar');
            const msgErro = document.getElementById('msg-erro');

            // Esconde erro antigo e valida campos
            msgErro.style.display = 'none';
            if (!passaporte || !senha) {
                msgErro.innerText = "Preencha o passaporte e a senha.";
                msgErro.style.display = 'block';
                return;
            }

            // Muda o botão para "Entrando..." e bloqueia para não clicar 2x
            const textoOriginal = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Autenticando...';
            btn.disabled = true;

            try {
                // Busca o membro no banco pelo passaporte
                const { data: membro, error } = await sb.from('membros')
                    .select('*')
                    .eq('passaporte', passaporte)
                    .single();

                if (error || !membro) throw new Error("Passaporte não encontrado.");

                // Verifica a senha (aqui assumimos que a coluna se chama 'senha' na tabela membros)
                // Se no seu banco for outro nome, mude aqui embaixo:
                if (membro.senha && membro.senha !== senha) {
                    throw new Error("Senha incorreta.");
                }

                // --- SUCESSO NO LOGIN ---
                // Salva os dados do jogador na sessão do navegador
                sessionStorage.setItem('membro_logado', JSON.stringify(membro));

                // ==========================================
                // A MÁGICA DO REDIRECIONAMENTO BLINDADO
                // ==========================================
                const CARGOS_LIDERANCA = ['Líder da organização', '01 da organização', 'Coordenador', 'Gerente geral', 'Gerente'];
                
                // Transforma o cargo dele em minúsculo e tira espaços extras
                const cargoDoCara = String(membro.cargo || '').trim().toLowerCase();
                
                // Verifica se o cargo dele está na lista (também transformada em minúscula)
                const isAdmin = CARGOS_LIDERANCA.map(c => c.toLowerCase()).includes(cargoDoCara);

                if (isAdmin) {
                    // Se for da liderança, vai direto pro Radar (Admin)
                    window.location.href = 'admin.html';
                } else {
                    // Se for membro comum, vai pro Dashboard normal
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                // Se der erro, mostra a mensagem vermelha
                msgErro.innerText = err.message || "Erro ao fazer login. Tente novamente.";
                msgErro.style.display = 'block';
                
                // Restaura o botão
                btn.innerHTML = textoOriginal;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
