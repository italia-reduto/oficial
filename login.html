<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a07">
    <title>Acessar Sistema | Portal Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-principal: #0a0f0d;
            --texto-secundario: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background-color: var(--fundo-principal);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
        }

        .fundo-degrade {
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 0.5) 0%, transparent 100%);
            z-index: 0;
        }

        .grade-fundo {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        .particulas { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .particula {
            position: absolute; bottom: -10px; background-color: var(--verde-neon);
            border-radius: 50%; box-shadow: 0 0 10px var(--verde-neon);
            opacity: 0; animation: subir linear infinite;
        }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        .p6 { width: 2px; height: 2px; left: 20%; animation-duration: 10s; animation-delay: 4s; }
        .p7 { width: 4px; height: 4px; left: 80%; animation-duration: 7.5s; animation-delay: 0.5s; }

        @keyframes subir {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; } 80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .painel-hud {
            position: relative; z-index: 10; width: 90%; max-width: 420px;
            padding: 40px 30px; background: rgba(10, 15, 13, 0.75);
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 197, 94, 0.05);
            opacity: 0; transform: translateY(20px); animation: aparecer 0.8s forwards;
        }

        .painel-hud::before, .painel-hud::after {
            content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--verde-neon);
        }
        .painel-hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .painel-hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .topo-form {
            display: flex; align-items: center; gap: 12px; margin-bottom: 25px;
        }

        .btn-voltar {
            color: var(--texto-secundario); text-decoration: none;
            font-size: 18px; transition: 0.3s;
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
        }
        .btn-voltar:hover { color: var(--verde-neon); border-color: var(--verde-neon); }

        .titulo {
            font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 12px; color: var(--texto-secundario);
            margin-bottom: 25px; letter-spacing: 0.5px;
        }

        .tag-status {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--verde-neon);
            padding: 5px 12px; font-family: 'Oswald', sans-serif; font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase; color: #86efac; margin-bottom: 20px;
        }
        .tag-status span {
            width: 6px; height: 6px; background: var(--verde-neon);
            border-radius: 50%; box-shadow: 0 0 10px var(--verde-neon);
            animation: piscar 1.5s infinite;
        }

        .campo-grupo { margin-bottom: 18px; display: flex; flex-direction: column; gap: 8px; }

        .campo-grupo label {
            font-size: 12px; font-weight: 600; color: #86efac;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #52525b; font-size: 14px; transition: 0.3s; pointer-events: none;
        }

        .campo-grupo input {
            width: 100%;
            padding: 14px 14px 14px 42px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .campo-grupo input:focus {
            border-color: var(--verde-neon);
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }

        .campo-grupo input:focus + i,
        .input-wrap:focus-within i { color: var(--verde-neon); }

        .btn-entrar {
            width: 100%; padding: 16px; margin-top: 10px;
            background: var(--verde-neon); border: none; border-radius: 6px;
            color: #000; font-family: 'Oswald', sans-serif; font-size: 16px;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-entrar:hover { background: #4ade80; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(34,197,94,0.3); }
        .btn-entrar:disabled { background: #166534; color: #86efac; cursor: not-allowed; transform: none; box-shadow: none; }

        .mensagem-erro {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
            padding: 12px 14px;
            font-size: 13px;
            margin-bottom: 18px;
            border-radius: 4px;
        }
        .mensagem-erro.ativa { display: block; }

        .rodape-form {
            text-align: center; font-size: 12px; color: #71717a; margin-top: 25px;
        }
        .rodape-form a { color: var(--verde-neon); text-decoration: none; font-weight: 600; }
        .rodape-form a:hover { text-decoration: underline; }

        .divisoria {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, var(--verde-neon) 0%, transparent 100%);
            margin: 25px 0 20px; opacity: 0.3;
        }

        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>

    <div class="particulas">
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
        <div class="particula p5"></div>
        <div class="particula p6"></div>
        <div class="particula p7"></div>
    </div>

    <div class="painel-hud">
        <div class="tag-status">
            <span></span> Terminal Seguro
        </div>

        <div class="topo-form">
            <a href="portal-italia.html" class="btn-voltar"><i class="fas fa-arrow-left"></i></a>
            <h1 class="titulo">Acessar Sistema</h1>
        </div>

        <p class="subtitulo">Autentique-se com seu passaporte para entrar na central de comando.</p>

        <div class="mensagem-erro" id="msg-erro"></div>

        <div class="campo-grupo">
            <label>Passaporte</label>
            <div class="input-wrap">
                <input type="number" id="campo-passaporte" placeholder="Ex: 17274">
                <i class="fas fa-id-card"></i>
            </div>
        </div>

        <div class="campo-grupo">
            <label>Senha</label>
            <div class="input-wrap">
                <input type="password" id="campo-senha" placeholder="Sua senha de acesso" onkeydown="if(event.key==='Enter') fazerLogin()">
                <i class="fas fa-lock"></i>
            </div>
        </div>

        <button class="btn-entrar" id="btn-entrar" onclick="fazerLogin()">
            <span>Entrar no Sistema</span>
            <i class="fas fa-chevron-right"></i>
        </button>

        <div class="divisoria"></div>

        <div class="rodape-form">
            Ainda não tem acesso? <a href="registro.html">Faça sua Whitelist</a>
        </div>
    </div>

    <script>
        const CARGOS_LIDERANCA = ['Líder da organização', '01 da organização', 'Coordenador', 'Gerente geral', 'Gerente'];

        function mostrarErro(msg) {
            const el = document.getElementById('msg-erro');
            el.innerText = msg;
            el.classList.add('ativa');
            setTimeout(() => el.classList.remove('ativa'), 5000);
        }

        async function fazerLogin() {
    const passaporte = document.getElementById('campo-passaporte').value.trim();
    const senha = document.getElementById('campo-senha').value;
    const btn = document.getElementById('btn-entrar');
    const erroEl = document.getElementById('msg-erro');

    if (!passaporte || !senha) {
        erroEl.innerText = 'Preencha o passaporte e a senha.';
        erroEl.classList.add('ativa');
        return;
    }

    btn.disabled = true;
    btn.querySelector('span').innerText = 'Autenticando...';
    erroEl.classList.remove('ativa');

    try {
        // Busca direta e otimizada (só as colunas necessárias)
        const { data, error } = await sb.from('membros')
            .select('nome, cargo, senha_credencial, passaporte, foto_url')
            .eq('passaporte', String(passaporte).trim())
            .single();

        if (error || !data) {
            erroEl.innerText = 'Passaporte não encontrado no sistema.';
            erroEl.classList.add('ativa');
            btn.disabled = false;
            btn.querySelector('span').innerText = 'Entrar no Sistema';
            return;
        }

        // Verifica a senha
        if (String(data.senha_credencial).trim() !== String(senha).trim()) {
            erroEl.innerText = 'Senha incorreta. Tente novamente.';
            erroEl.classList.add('ativa');
            btn.disabled = false;
            btn.querySelector('span').innerText = 'Entrar no Sistema';
            return;
        }

        // Salva a sessão com a foto
        sessionStorage.setItem('membro_logado', JSON.stringify({
            nome: data.nome,
            passaporte: data.passaporte,
            cargo: data.cargo,
            foto_url: data.foto_url
        }));

        // Muda visual do botão e redireciona instantaneamente
        btn.querySelector('span').innerText = 'Acesso Liberado!';
        btn.style.background = '#166534';
        btn.style.color = '#86efac';
        
        // Verifica se é liderança para mandar pro Admin
if (CARGOS_LIDERANCA.includes(data.cargo)) {
    window.location.href = 'admin.html';
} else {
    window.location.href = 'dashboard.html';
}

    } catch (err) {
        erroEl.innerText = 'Erro de conexão. Verifique sua internet.';
        erroEl.classList.add('ativa');
        btn.disabled = false;
        btn.querySelector('span').innerText = 'Entrar no Sistema';
    }
        }
    </script>
</body>
</html>
