<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITÁLIA | Acesso ao Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        escuro: '#0f172a',
                        cartao: '#1e293b',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-escuro text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="bg-primary/20 w-16 h-16 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-shield-halved text-primary text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold">ITÁLIA</h1>
            <p class="text-slate-400">Central de Registros</p>
        </div>

        <div class="bg-cartao p-6 rounded-xl border border-slate-700/50 shadow-xl">
            <h2 class="text-xl font-semibold mb-6">Identificação</h2>

            <div class="mb-5">
                <label class="block text-slate-300 text-sm mb-2">Número do Passaporte</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <i class="fas fa-id-card"></i>
                    </span>
                    <input type="text" placeholder="Ex: 17274"
                        class="w-full bg-escuro border border-slate-600 rounded-lg py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <div class="mb-6">
                <label class="block text-slate-300 text-sm mb-2">Detalhe / Observação</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <i class="fas fa-file-lines"></i>
                    </span>
                    <input type="text" placeholder="Ex: Nome no jogo"
                        class="w-full bg-escuro border border-slate-600 rounded-lg py-3 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <button class="w-full bg-primary hover:bg-primary/90 font-medium py-3 rounded-lg transition">
                <i class="fas fa-arrow-right-to-bracket mr-2"></i> Acessar
            </button>
        </div>

        <p class="text-center text-slate-500 text-xs mt-6">
            🇮🇹 SISTEMA EXCLUSIVO | ORGANIZAÇÃO ITÁLIA
        </p>
    </div>
</body>
</html>
