<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal | Organização Itália</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        escuro: '#0f172a',
                        card: '#1e293b',
                        destaque: '#2563eb',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background-color: #0f172a;
  min-height: 100vh;
}
        
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            }
        }
    </style>
</head>
<body class="bg-escuro text-white min-h-screen font-sans">
    <div class="container mx-auto px-5 py-10 max-w-lg">
        
        <!-- Cabeçalho com Sair no topo -->
        <div class="flex justify-between items-start mb-10">
            <div>
                <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-white">Bem-vindo, Falcão</h1>
                <p class="text-slate-400 text-lg mt-1">Organização Itália</p>
            </div>
            <a href="login.html" class="text-slate-400 hover:text-white transition-colors text-sm mt-1">
                <i class="fa fa-sign-out mr-1"></i> Sair
            </a>
        </div>

        <!-- Cartão de Identidade -->
        <div class="bg-card rounded-xl p-6 mb-10 card-shadow">
            <div class="flex items-center gap-4">
                <div class="bg-destaque/20 p-3 rounded-lg">
                    <i class="fa fa-shield text-destaque text-xl"></i>
                </div>
                <div>
                    <p class="text-xl font-semibold">Passaporte: <span id="passaporte">17274</span></p>
                    <p class="text-slate-300 mt-1">Cargo: Recruta</p>
                </div>
            </div>
        </div>

        <!-- Grade de Navegação -->
        <div class="grid grid-cols-2 gap-5 mb-12">
            <a href="#" class="bg-card hover:bg-card/80 transition-all rounded-xl p-6 card-shadow flex flex-col">
                <i class="fa fa-user text-destaque text-2xl mb-5"></i>
                <span class="text-xl font-medium mt-auto">Meus Dados</span>
                <i class="fa fa-chevron-right text-slate-500 self-end mt-2"></i>
            </a>
            
            <a href="registros.html" class="bg-card hover:bg-card/80 transition-all rounded-xl p-6 card-shadow flex flex-col">
                <i class="fa fa-clipboard text-destaque text-2xl mb-5"></i>
                <span class="text-xl font-medium mt-auto">Registros</span>
                <i class="fa fa-chevron-right text-slate-500 self-end mt-2"></i>
            </a>
            
            <a href="#" class="bg-card hover:bg-card/80 transition-all rounded-xl p-6 card-shadow flex flex-col">
                <i class="fa fa-bullhorn text-destaque text-2xl mb-5"></i>
                <span class="text-xl font-medium mt-auto">Avisos</span>
                <i class="fa fa-chevron-right text-slate-500 self-end mt-2"></i>
            </a>
            
            <a href="#" class="bg-card hover:bg-card/80 transition-all rounded-xl p-6 card-shadow flex flex-col">
                <i class="fa fa-balance-scale text-destaque text-2xl mb-5"></i>
                <span class="text-xl font-medium mt-auto">Hierarquia</span>
                <i class="fa fa-chevron-right text-slate-500 self-end mt-2"></i>
            </a>
        </div>

        <!-- Botão Principal -->
        <a href="registros.html" class="block w-full bg-destaque hover:bg-destaque/90 transition-colors text-white text-center py-5 rounded-xl font-semibold text-lg card-shadow mb-16">
            <i class="fa fa-arrow-right mr-2"></i> Acessar Registros
        </a>

        <!-- Rodapé -->
        <footer class="text-center text-slate-500 text-sm mt-auto">
            <div class="mb-2">🇮🇹</div>
            <p>SISTEMA EXCLUSIVO • ORGANIZAÇÃO ITÁLIA</p>
        </footer>
        
    </div>
    
    <!-- Script para pegar dados do login (futuro) -->
    <script>
        // Aqui vamos ligar os dados do login depois
        document.addEventListener('DOMContentLoaded', () => {
            const passaporte = localStorage.getItem('passaporte');
            const detalhe = localStorage.getItem('detalhe');
            
            if (passaporte) {
                document.getElementById('passaporte').textContent = passaporte;
                document.querySelector('h1').textContent = `Bem-vindo, ${detalhe || 'Membro'}`;
            }
        });
    </script>
</body>
              </html>
