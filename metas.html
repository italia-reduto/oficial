<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro de Metas | Organização Itália</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg, #080808, #151515 55%, #050505);
      color: #fff;
      padding-bottom: 40px;
    }

    /* HEADER */
    header {
      width: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bandeira {
      font-size: 30px;
    }

    .marca h1 {
      font-size: 17px;
      letter-spacing: 1px;
    }

    .marca span {
      display: block;
      color: #aaa;
      font-size: 11px;
      margin-top: 3px;
    }

    .voltar {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .voltar:hover {
      background: rgba(255,255,255,0.12);
    }

    /* CONTAINER */
    .container {
      width: 100%;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .titulo {
      margin-bottom: 25px;
    }

    .titulo h2 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .titulo p {
      color: #999;
      font-size: 14px;
    }

    /* AVISO */
    .aviso {
      border: 1px solid rgba(255, 193, 7, 0.25);
      background: rgba(255, 193, 7, 0.06);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 25px;
      color: #ddd;
      font-size: 13px;
      line-height: 1.5;
    }

    .aviso strong {
      color: #ffc107;
    }

    /* CARD */
    .card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .campo {
      margin-bottom: 20px;
    }

    .campo label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ddd;
      font-weight: bold;
    }

    .input {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      color: #fff;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    .input:focus {
      border-color: #168f3d;
      box-shadow: 0 0 0 3px rgba(22,143,61,0.12);
    }

    .input::placeholder {
      color: #666;
    }

    /* DATA */
    input[type="date"] {
      color-scheme: dark;
    }

    /* UPLOAD */
    .upload-area {
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      background: rgba(0,0,0,0.18);
      transition: 0.25s;
    }

    .upload-area:hover {
      border-color: #168f3d;
      background: rgba(22,143,61,0.05);
    }

    .upload-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .upload-area h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .upload-area p {
      color: #777;
      font-size: 12px;
    }

    #fotoComprovante {
      display: none;
    }

    /* PREVIEW */
    .preview {
      display: none;
      margin-top: 15px;
    }

    .preview img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    /* BOTÃO */
    .btn-enviar {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #168f3d, #0c6d2c);
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 5px;
      transition: 0.2s;
    }

    .btn-enviar:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 30px;
      text-align: center;
    }

    .modal-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .modal-box h2 {
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #999;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .btn-fechar {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #168f3d;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 25px;
      }

      .titulo h2 {
        font-size: 23px;
      }

      .card {
        padding: 20px;
      }

      header {
        padding: 15px;
      }

      .marca h1 {
        font-size: 14px;
      }

      .voltar {
        padding: 8px 11px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="marca">
      <div class="bandeira">🇮🇹</div>

      <div>
        <h1>ORGANIZAÇÃO ITÁLIA</h1>
        <span>Sistema de Registro</span>
      </div>
    </div>

    <button class="voltar" id="btnVoltar">
      ← Voltar
    </button>
  </header>


  <!-- CONTEÚDO -->
  <main class="container">

    <div class="titulo">
      <h2>REGISTRO DE METAS</h2>
      <p>Preencha as informações abaixo para registrar sua meta.</p>
    </div>


    <div class="aviso">
      ⚠️ <strong>Atenção:</strong>
      Preencha todos os campos corretamente e envie uma foto que comprove
      a realização da meta.
    </div>


    <div class="card">

      <form id="formMetas">

        <!-- PASSAPORTE -->
        <div class="campo">
          <label for="passaporte">
            🪪 Nº PASSAPORTE
          </label>

          <input
            type="text"
            id="passaporte"
            class="input"
            placeholder="Ex: 17274"
            inputmode="numeric"
            required
          >
        </div>


        <!-- DATA -->
        <div class="campo">
          <label for="dataMeta">
            📅 DATA DA META
          </label>

          <input
            type="date"
            id="dataMeta"
            class="input"
            required
          >
        </div>


        <!-- DESCRIÇÃO -->
        <div class="campo">
          <label for="descricao">
            📝 DESCRIÇÃO DA META
          </label>

          <input
            type="text"
            id="descricao"
            class="input"
            placeholder="Descreva o que foi realizado..."
            required
          >
        </div>


        <!-- FOTO -->
        <div class="campo">

          <label>
            📸 COMPROVAÇÃO
          </label>

          <label
            for="fotoComprovante"
            class="upload-area"
            id="areaUpload"
          >

            <div class="upload-icon" id="uploadIcon">
              📷
            </div>

            <h3 id="textoUpload">
              CLIQUE PARA ENVIAR A FOTO
            </h3>

            <p id="subtextoUpload">
              Envie uma imagem como comprovação da meta.
            </p>

            <input
              type="file"
              id="fotoComprovante"
              accept="image/*"
              required
            >

          </label>

          <div class="preview" id="preview">
            <img id="previewImagem" alt="Pré-visualização">
          </div>

        </div>


        <!-- ENVIAR -->
        <button
          type="submit"
          class="btn-enviar"
        >
          ENVIAR REGISTRO
        </button>

      </form>

    </div>

  </main>


  <!-- MODAL -->
  <div class="modal" id="modalSucesso">

    <div class="modal-box">

      <div class="modal-icon">
        ✅
      </div>

      <h2>Registro enviado!</h2>

      <p>
        Sua meta foi registrada com sucesso.
      </p>

      <button
        class="btn-fechar"
        id="btnFecharModal"
      >
        FECHAR
      </button>

    </div>

  </div>


  <script>

    const form = document.getElementById("formMetas");

    const areaUpload = document.getElementById("areaUpload");

    const inputFoto = document.getElementById("fotoComprovante");

    const preview = document.getElementById("preview");

    const previewImagem = document.getElementById("previewImagem");

    const uploadIcon = document.getElementById("uploadIcon");

    const textoUpload = document.getElementById("textoUpload");

    const subtextoUpload = document.getElementById("subtextoUpload");

    const modalSucesso = document.getElementById("modalSucesso");

    const btnFecharModal = document.getElementById("btnFecharModal");

    const btnVoltar = document.getElementById("btnVoltar");


    /* VOLTAR */

    btnVoltar.addEventListener("click", function() {

      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }

    });


    /* FOTO */

    inputFoto.addEventListener("change", function() {

      const arquivo = this.files[0];

      if (!arquivo) {
        return;
      }

      areaUpload.style.borderColor = "#168f3d";

      areaUpload.style.background =
        "rgba(22,143,61,0.08)";

      uploadIcon.textContent = "✅";

      textoUpload.textContent =
        "FOTO ENVIADA ✓";

      subtextoUpload.textContent =
        arquivo.name;


      const leitor = new FileReader();

      leitor.onload = function(e) {

        previewImagem.src = e.target.result;

        preview.style.display = "block";

      };

      leitor.readAsDataURL(arquivo);

    });


    /* ENVIO */

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      if (!form.checkValidity()) {

        form.reportValidity();

        return;

      }

      modalSucesso.style.display = "flex";

    });


    /* FECHAR MODAL */

    btnFecharModal.addEventListener("click", function() {

      modalSucesso.style.display = "none";

      form.reset();

      preview.style.display = "none";

      areaUpload.style.borderColor =
        "rgba(255,255,255,0.2)";

      areaUpload.style.background =
        "rgba(0,0,0,0.18)";

      uploadIcon.textContent = "📷";

      textoUpload.textContent =
        "CLIQUE PARA ENVIAR A FOTO";

      subtextoUpload.textContent =
        "Envie uma imagem como comprovação da meta.";

    });

  </script>

</body>
</html>
