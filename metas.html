<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#0f0f14">
<meta name="color-scheme" content="dark">
<meta name="msapplication-TileColor" content="#0f0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="METAS">

<title>METAS — ORGANIZAÇÃO ITÁLIA</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        min-height: 100%;
        background: #0f0f14 !important;
        background: linear-gradient(180deg, #0f0f14 0%, #15151d 100%) !important;
    }

    body {
        min-height: 100dvh;
        background: transparent !important;
        color: #e4e4eb;
        font-family: 'Inter', sans-serif;

        display: flex;
        flex-direction: column;

        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-bottom: max(10px, env(safe-area-inset-bottom));

        margin: 0 auto;
        max-width: 100%;
    }

    .container {
        width: 100%;
        max-width: 420px;
        min-height: calc(100dvh - 20px);
        margin: 0 auto;

        display: flex;
        flex-direction: column;
    }

    .cabecalho {
        text-align: center;
        margin-bottom: 14px;
    }

    .titulo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;

        color: #ffffff;
        font-size: 22px;
        font-weight: 900;

        margin-bottom: 10px;
        letter-spacing: 0.3px;
    }

    .icone-titulo {
        color: #c8102e;
        font-size: 24px;
        animation: pulsarBrilho 2s ease-in-out infinite;
    }

    @keyframes pulsarBrilho {
        0% {
            transform: scale(1);
            filter: drop-shadow(0 0 2px rgba(200, 16, 46, 0.5));
        }

        50% {
            transform: scale(1.1);
            filter: drop-shadow(0 0 8px rgba(200, 16, 46, 0.9));
        }

        100% {
            transform: scale(1);
            filter: drop-shadow(0 0 2px rgba(200, 16, 46, 0.5));
        }
    }

    .aviso-principal {
        background-color: rgba(200, 16, 46, 0.12);
        border: 1px solid rgba(200, 16, 46, 0.25);
        border-radius: 12px;

        padding: 10px 12px;

        color: #ffb3b3;
        font-size: 12px;
        line-height: 1.45;

        animation: pulsarAviso 2.5s ease-in-out infinite;
    }

    @keyframes pulsarAviso {
        0% {
            transform: scale(1);
            box-shadow: 0 0 4px rgba(200, 16, 46, 0.3);
        }

        50% {
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(200, 16, 46, 0.6);
        }

        100% {
            transform: scale(1);
            box-shadow: 0 0 4px rgba(200, 16, 46, 0.3);
        }
    }

    form {
        flex: 1;

        display: flex;
        flex-direction: column;
        justify-content: space-between;

        gap: 10px;
    }

    .grupo-campo {
        position: relative;
        width: 100%;
    }

    .icone {
        position: absolute;
        left: 16px;
        top: 50%;

        transform: translateY(-50%);

        color: #9ca3af;
        font-size: 16px;

        z-index: 1;
    }

    .selo-certo {
        position: absolute;
        right: 16px;
        top: 50%;

        transform: translateY(-50%) scale(0);

        color: #2ecc71;
        font-size: 17px;
        font-weight: bold;

        opacity: 0;

        transition: all 0.3s ease;

        pointer-events: none;
        z-index: 2;
    }

    .campo {
        width: 100%;
        height: 58px;

        background-color: rgba(23, 23, 31, 0.9);

        border: 2px solid #b8b8c8;
        border-radius: 16px;

        padding: 14px 48px;

        color: #fff;
        font-size: 15px;

        transition: all 0.3s ease;
    }

    .campo:valid:not(:placeholder-shown) {
        border-color: #2ecc71;
        background-color: rgba(46, 204, 113, 0.1);
    }

    .campo:valid:not(:placeholder-shown) ~ .selo-certo {
        transform: translateY(-50%) scale(1);
        opacity: 1;
    }

    .campo::placeholder {
        color: #9ca3af;
    }

    .campo:focus {
        outline: none;
        border-color: #c8102e;
        box-shadow: 0 0 0 2px rgba(200, 16, 46, 0.15);
    }

    input[type="date"] {
        color: #9ca3af;
    }

    input[type="date"]:valid {
        color: #fff;
    }

    .caixa-print {
        width: 100%;
    }

    .upload-campo {
        height: 58px;

        display: flex;
        align-items: center;

        padding: 14px 48px;

        cursor: pointer;
    }

    .upload-texto {
        color: #9ca3af;
        font-size: 14px;
        margin: 0;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    input[type="file"] {
        display: none;
    }

    .botao {
        width: 100%;
        height: 58px;

        background-color: #c8102e;
        color: white;

        border: none;
        border-radius: 16px;

        padding: 14px;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        margin: 0;

        transition: all 0.3s ease;
    }

    .botao.pronto {
        animation: brilhoBotao 1.5s ease-in-out infinite;
    }

    @keyframes brilhoBotao {
        0% {
            box-shadow: 0 0 5px rgba(200, 16, 46, 0.5);
            transform: scale(1);
        }

        50% {
            box-shadow: 0 0 20px rgba(200, 16, 46, 0.9);
            transform: scale(1.01);
        }

        100% {
            box-shadow: 0 0 5px rgba(200, 16, 46, 0.5);
            transform: scale(1);
        }
    }

    @media (max-height: 700px) {
        body {
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .container {
            min-height: calc(100dvh - 12px);
        }

        .cabecalho {
            margin-bottom: 8px;
        }

        .titulo {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .icone-titulo {
            font-size: 22px;
        }

        .aviso-principal {
            padding: 8px 10px;
            font-size: 11px;
        }

        form {
            gap: 7px;
        }

        .campo,
        .upload-campo,
        .botao {
            height: 54px;
        }
    }
</style>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head><body><div class="container">

    <div class="cabecalho">

        <div class="titulo">
            <i class="fas fa-bullseye icone-titulo"></i>
            <span>REGISTRO DE METAS</span>
        </div>

        <div class="aviso-principal">
            ⚠️ Não acertaremos metas incompletas sem que tenha tido uma justificativa antes
        </div>

    </div>

    <form id="formMetas">

        <div class="grupo-campo">
            <i class="fas fa-user icone"></i>

            <input
                type="text"
                class="campo"
                placeholder="Nome do usuário"
                required
            >

            <i class="fas fa-check selo-certo"></i>
        </div>


        <div class="grupo-campo">
            <i class="fas fa-id-card icone"></i>

            <input
                type="text"
                class="campo"
                placeholder="Número do Passaporte"
                required
            >

            <i class="fas fa-check selo-certo"></i>
        </div>


        <div class="grupo-campo">
            <i class="fas fa-calendar-day icone"></i>

            <input
                type="date"
                class="campo"
                required
            >

            <i class="fas fa-check selo-certo"></i>
        </div>


        <div class="grupo-campo">
            <i class="fas fa-key icone"></i>

            <input
                type="number"
                class="campo"
                placeholder="Quantas Lockpicks farmou"
                min="0"
                required
            >

            <i class="fas fa-check selo-certo"></i>
        </div>


        <div class="grupo-campo">
            <i class="fas fa-tools icone"></i>

            <input
                type="number"
                class="campo"
                placeholder="Quantos Flipper farmou"
                min="0"
                required
            >

            <i class="fas fa-check selo-certo"></i>
        </div>


        <div class="grupo-campo caixa-print">

            <i class="fas fa-image icone"></i>

            <label class="campo upload-campo">

                <input
                    type="file"
                    accept="image/*"
                    id="foto-input"
                    required
                >

                <span
                    class="upload-texto"
                    id="foto-label"
                >
                    Clique para anexar print do inventário
                </span>

            </label>

        </div>


        <button
            type="submit"
            class="botao"
            id="botaoEnviar"
        >
            Enviar Registro ➔
        </button>

    </form>

</div>


<script>

    const form = document.getElementById('formMetas');

    const botao = document.getElementById('botaoEnviar');

    const fotoInput = document.getElementById('foto-input');

    const fotoLabel = document.getElementById('foto-label');


    function verificarFormulario() {

        if (
            form.checkValidity() &&
            fotoInput.files.length > 0
        ) {

            botao.classList.add('pronto');

        } else {

            botao.classList.remove('pronto');

        }

    }


    form.addEventListener(
        'input',
        verificarFormulario
    );


    fotoInput.addEventListener(
        'change',
        () => {

            fotoLabel.textContent =
                fotoInput.files[0]?.name ||
                'Clique para anexar print do inventário';

            verificarFormulario();

        }
    );


    form.onsubmit = e => {

        e.preventDefault();

        alert('✅ Registro enviado com sucesso!');

    };

</script>

</body>
</html>
