<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORGANIZAÇÃO ITÁLIA · ACESSO</title>

<meta name="theme-color" content="#0a0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="preto-translúcido">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {
  theme:{
    extend:{
      colors:{
        fundo: '#0a0a0d',
        cartao: '#14141a',
        destaque: '#c41e3a',
        texto: '#e4e4e7',
      },
      fontFamily:{
        sans: ['Inter', 'sans-serif']
      }
    }
  }
}
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  background:#0a0a0d !important;
  min-height:100vh;
  height:100%;
}
body{
  background-image:radial-gradient(circle at top, rgba(196,30,58,0.06), transparent 50%);
}
</style>
</head>
<body class="bg-fundo text-texto font-sans flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-md">

<!-- CABEÇALHO -->
<div class="text-center mb-10">
<div class="text-5xl mb-4"><i class="fas fa-crown"></i></div>
<h1 class="text-xl font-bold tracking-widest">Organização Itália.</h1>
<p class="text-slate-500 text-sm mt-2">Sistema de Gestão Interna</p>
<div class="mt-6 text-xs text-slate-600 uppercase tracking-widest">🔒 Acesso Restrito · Uso Monitorado</div>
</div>

<!-- CARTÃO DE LOGIN -->
<div class="bg-cartao/80 rounded-2xl p-8 border border-slate-800/50 shadow-2xl">

<div class="mb-6">
<label class="block text-sm text-slate-300 mb-2">Número de Passaporte</label>
<div class="relative">
<i class="fas fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
<input type="text" id="passaporte" placeholder="Ex: 17274" class="w-full bg-transparent border-2 border-slate-300/80 rounded-xl pl-12 pr-4 py-3.5 focus:outline-none focus:border-destaque">
</div>
</div>

<div class="mb-8">
<label class="block text-sm text-slate-300 mb-2">Senha de Acesso</label>
<div class="relative">
<i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
<input type="password" id="senha" placeholder="Sua senha" class="w-full bg-transparent border-2 border-slate-300/80 rounded-xl pl-12 pr-12 py-3.5 focus:outline-none focus:border-destaque">
<button type="button" id="btnOlho" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">
<i class="fas fa-eye"></i>
</button>
</div>
</div>

<button id="btnAcessar" class="w-full bg-destaque text-white font-semibold py-4 rounded-xl flex items-center justify-center gap-2">
Entrar no Sistema
<i class="fas fa-arrow-right ml-2"></i>
</button>

<div class="text-center mt-6">
<a href="#" class="text-slate-400 text-sm">
<i class="fas fa-lock mr-1"></i> Esqueci minha senha
</a>
</div>

</div>

<div class="text-center text-slate-700 text-xs mt-10">USO EXCLUSIVO · PROIBIDA DIVULGAÇÃO EXTERNA</div>

</div>

<script>
const inputSenha = document.getElementById('senha');
const btnOlho = document.getElementById('btnOlho');
btnOlho.addEventListener('click', ()=>{
  const tipo = inputSenha.type === 'password' ? 'text' : 'password';
  inputSenha.type = tipo;
  btnOlho.innerHTML = tipo === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
});
</script>

<script>
document.getElementById('btnAcessar').addEventListener('click', ()=>{
  localStorage.setItem('logado','sim');
  window.location.href='painel.html';
});
</script>

</body>
</html>
