<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITÁLIA · PAINEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://oesqxkszqdcdquoxdvms.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DXzmPUIRXCSdW-tuUMevZA_Zs0C7Usl";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            background-color: #0b0b10;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .banner-topo {
            width: 100%;
            height: 140px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 1;
        }
        .banner-topo::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url("https://wallpapers.com/images/featured/fundo-de-fivem-zt0lohk29h4faehq.jpg") center top / cover no-repeat;
            opacity: 0.45;
        }
        .banner-topo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(11,11,16,0) 0%, rgba(11,11,16,0.25) 55%, rgba(11,16,24,1) 100%);
        }
        .conteudo {
            flex-grow: 1;
            position: relative;
            z-index: 3;
            padding: 24px 16px;
            overflow-y: auto;
        }
        .saudacao { margin-bottom: 32px; }
        .saudacao h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .saudacao h2 span { color: #38bdf8; }
        .saudacao .mao {
            color: #fbbf24;
            font-size: 20px;
        }
        .saudacao p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .info-usuario {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .linha-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }
        .linha-info i {
            color: #38bdf8;
            font-size: 18px;
            width: 22px;
            text-align: center;
        }
        .linha-info .rotulo {
            color: #94a3b8;
        }
        .linha-info .valor {
            color: #ffffff;
            font-weight: 700;
        }
        .carregando {
            color: #64748b;
            font-style: normal;
        }
        .barra-menu-inferior {
            width: 100%;
            background: #000000;
            border: none;
            border-top: none;
            padding: 14px 24px;
            flex-shrink: 0;
            position: relative;
            z-index: 30;
            margin-bottom: 40px;
            display: flex;
            justify-content: flex-end;
        }
        .menu-mais {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #3b82f6;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            border: none;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .menu-mais:focus, .menu-mais:active {
            outline: none;
            box-shadow: none;
        }
        .menu-mais i { font-size: 22px; }
        .menu-mais.ativo { color: #93c5fd; }
        .gaveta-lateral {
            position: fixed;
            top: 70px;
            bottom: 130px;
            right: 0;
            width: 260px;
            background: rgba(12,16,24,0.97);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59,130,246,0.35);
            border-radius: 24px 0 0 24px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 20;
            padding: 28px 22px;
            overflow-y: auto;
        }
        .gaveta-lateral.aberto { transform: translateX(0); }

        @media (max-width: 480px) {
            .banner-topo { height: 120px; }
            .barra-menu-inferior { padding: 12px 24px; margin-bottom: 35px; }
            .gaveta-lateral { top: 60px; width: 220px; bottom: 115px; }
        }
    </style>
</head>
<body>
    <div class="banner-topo"></div>
    
    <div class="conteudo">
        <div class="saudacao">
            <h2>Olá, <span id="nomeUsuario" class="carregando">carregando...</span> <i class="fas fa-hand-wave mao"></i></h2>
            <p>Bem-vindo de volta à Organização Itália</p>
            
            <div class="info-usuario">
                <div class="linha-info">
                    <i class="fas fa-id-card"></i>
                    <span class="rotulo">Passaporte:</span>
                    <span id="passaporteUsuario" class="valor carregando">—</span>
                </div>
                <div class="linha-info">
                    <i class="fas fa-shield-alt"></i>
                    <span class="rotulo">Cargo:</span>
                    <span id="cargoUsuario" class="valor carregando">—</span>
                </div>
            </div>
        </div>
    </div>

    <div class="gaveta-lateral" id="menuLateral"></div>

    <div class="barra-menu-inferior">
        <div class="menu-mais" id="botaoMais">
            <i class="fas fa-th"></i>
            <span>Mais</span>
        </div>
    </div>

    <script>
        async function carregarDadosUsuario() {
            const dadosSalvos = localStorage.getItem('usuario');

            if (!dadosSalvos) {
                window.location.href = 'login.html';
                return;
            }

            const usuario = JSON.parse(dadosSalvos);
            
            document.getElementById('nomeUsuario').textContent = usuario.nome || "Membro";
            document.getElementById('passaporteUsuario').textContent = usuario.passaporte || "—";
            document.getElementById('cargoUsuario').textContent = usuario.cargo || "Membro";

            try {
                const { data, error } = await sb
                    .from('membros')
                    .select('nome, passaporte, cargo')
                    .eq('passaporte', usuario.passaporte)
                    .single();

                if (!error && data) {
                    document.getElementById('nomeUsuario').textContent = data.nome;
                    document.getElementById('passaporteUsuario').textContent = data.passaporte;
                    document.getElementById('cargoUsuario').textContent = data.cargo;
                    
                    usuario.nome = data.nome;
                    usuario.cargo = data.cargo;
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                }
            } catch (erro) {
                console.log("Usando dados salvos");
            }
        }

        carregarDadosUsuario();

        const botao = document.getElementById('botaoMais');
        const gaveta = document.getElementById('menuLateral');
        botao.addEventListener('click', () => {
            botao.classList.toggle('ativo');
            gaveta.classList.toggle('aberto');
        });
    </script>
</body>
</html>
