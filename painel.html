<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- ✅ Barra preta -->
    <meta name="theme-color" content="#08090d">
    <meta name="color-scheme" content="dark">
    <title>ITÁLIA · PAINEL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --preto: #08090d;
            --azul: #60a5fa;
            --branco: #ffffff;
            --cinza: #94a3b8;
        }

        html, body {
            min-height: 100vh;
            background: var(--preto);
            color: var(--branco);
            overflow-x: hidden;
            /* ✅ Permite puxar e atualizar */
            overscroll-behavior: contain;
        }

        .fundo-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 280px;
            background: linear-gradient(to bottom, rgba(8,9,13,0) 0%, var(--preto) 100%), 
                        url('https://wallpapers.com/images/featured/fundo-de-fivem-zt0lohk29h4faehq.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            z-index: 0;
        }

        .conteudo {
            position: relative;
            z-index: 1;
            padding: 40px 24px 120px;
        }

        .saudacao {
            margin-top: 140px;
            margin-bottom: 32px;
        }

        .saudacao h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
        }

        .saudacao h1 span {
            color: var(--azul);
        }

        .saudacao p {
            color: var(--cinza);
            font-size: 15px;
            margin-top: 6px;
        }

        .info-card {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
        }

        .info-item i {
            color: var(--azul);
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .info-item span.label {
            color: var(--cinza);
        }

        .info-item span.valor {
            font-weight: 700;
            color: var(--branco);
        }

        /* ✅ Botão de atualizar */
        .btn-atualizar {
            position: fixed;
            top: 12px;
            right: 16px;
            background: rgba(59, 130, 246, 0.25);
            border: none;
            color: var(--azul);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }

        /* Barra inferior — IGUAL ESTAVA */
        .barra-inferior {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(8,9,13,0.95);
            backdrop-filter: blur(12px);
            padding: 14px 24px 30px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 10;
        }

        .botao-mais {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: none;
            color: var(--azul);
            cursor: pointer;
        }

        .botao-mais i {
            font-size: 22px;
        }

        .botao-mais span {
            font-size: 12px;
        }

        /* Gaveta + Blur — IGUAL ESTAVA */
        .fundo-desfoque {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 15;
        }

        .fundo-desfoque.ativo {
            opacity: 1;
            visibility: visible;
        }

        .gaveta {
            position: fixed;
            top: 0;
            right: 0;
            width: 75%;
            max-width: 300px;
            height: 100%;
            background: #0f172a;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 20;
            padding: 60px 24px 24px;
        }

        .gaveta.ativa {
            transform: translateX(0);
        }

        .gaveta-fechar {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="fundo-img"></div>

    <!-- Botão de atualizar -->
    <button class="btn-atualizar" onclick="location.reload()">
        <i class="fas fa-sync-alt"></i>
    </button>

    <div class="conteudo">
        <div class="saudacao">
            <h1>Olá, <span id="nome-usuario">—</span></h1>
            <p>Bem-vindo de volta à Organização Itália</p>
        </div>

        <div class="info-card">
            <div class="info-item">
                <i class="fas fa-id-card"></i>
                <span class="label">Passaporte:</span>
                <span class="valor" id="passaporte">—</span>
            </div>
            <div class="info-item">
                <i class="fas fa-shield-alt"></i>
                <span class="label">Cargo:</span>
                <span class="valor" id="cargo">—</span>
            </div>
        </div>
    </div>

    <div class="barra-inferior">
        <button class="botao-mais" id="botao-mais">
            <i class="fas fa-th-large"></i>
            <span>Mais</span>
        </button>
    </div>

    <div class="fundo-desfoque" id="fundo-desfoque" onclick="fecharGaveta()"></div>
    <div class="gaveta" id="gaveta">
        <button class="gaveta-fechar" onclick="fecharGaveta()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script>
        const dadosUsuario = JSON.parse(localStorage.getItem('usuario') || '{}');

        if (dadosUsuario.nome) {
            document.getElementById('nome-usuario').textContent = dadosUsuario.nome;
            document.getElementById('passaporte').textContent = dadosUsuario.passaporte;
            document.getElementById('cargo').textContent = dadosUsuario.cargo;
        } else {
            window.location.href = 'login.html';
        }

        const botaoMais = document.getElementById('botao-mais');
        const gaveta = document.getElementById('gaveta');
        const fundoDesfoque = document.getElementById('fundo-desfoque');

        function abrirGaveta() {
            gaveta.classList.add('ativa');
            fundoDesfoque.classList.add('ativo');
        }

        function fecharGaveta() {
            gaveta.classList.remove('ativa');
            fundoDesfoque.classList.remove('ativo');
        }

        botaoMais.addEventListener('click', abrirGaveta);
    </script>

</body>
</html>
