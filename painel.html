<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ORGANIZAÇÃO ITÁLIA · PAINEL</title>

    <meta name="theme-color"
        content="#08090d">

    <meta name="color-scheme"
        content="dark">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            min-height: 100vh;
            background: #08090d;
            color: #f5f5f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            padding-bottom: 90px;
        }


        button {
            font-family: inherit;
        }


        /* =====================================================
           VARIÁVEIS
        ===================================================== */

        :root {

            --bg: #08090d;
            --bg2: #0d0f14;

            --card: #12151b;
            --card2: #171a21;

            --border: rgba(255,255,255,0.07);

            --red: #e11d48;
            --red2: #fb365d;

            --green: #22c55e;
            --blue: #3b82f6;
            --yellow: #f59e0b;
            --purple: #8b5cf6;

            --text: #f5f5f5;
            --muted: #8b929f;
            --dark-muted: #5d6470;
        }


        /* =====================================================
           BOTÕES
        ===================================================== */

        .btn {
            border: none;
            cursor: pointer;
            transition: 0.18s ease;
        }


        .btn:active {
            transform: scale(0.96);
        }


        /* =====================================================
           CARREGAMENTO
        ===================================================== */

        #carregando {

            position: fixed;
            inset: 0;

            background: var(--bg);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            gap: 14px;

            z-index: 5000;
        }


        #carregando i {

            font-size: 28px;
            color: var(--red);

        }


        #carregando span {

            color: var(--muted);
            font-size: 14px;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            position: sticky;
            top: 0;

            z-index: 100;

            background:
                rgba(8,9,13,0.88);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-bottom:
                1px solid var(--border);

            padding: 15px 18px;
        }


        .header-content {

            display: flex;
            align-items: center;
            justify-content: space-between;

            max-width: 900px;
            margin: auto;
        }


        .perfil {

            display: flex;
            align-items: center;
            gap: 12px;
        }


        .perfil-icon {

            width: 44px;
            height: 44px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(225,29,72,0.13);

            border:
                1px solid rgba(225,29,72,0.22);

            color: var(--red2);

            font-size: 18px;
        }


        .perfil-info h1 {

            font-size: 15px;
            font-weight: 700;

            max-width: 210px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .perfil-info p {

            margin-top: 2px;

            font-size: 12px;
            color: var(--muted);
        }


        .btn-saida {

            width: 42px;
            height: 42px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(225,29,72,0.10);

            border:
                1px solid rgba(225,29,72,0.20);

            color: var(--red2);

            font-size: 16px;
        }


        .btn-saida:hover {

            background:
                rgba(225,29,72,0.17);

        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        main {

            width: 100%;
            max-width: 900px;

            margin: auto;

            padding: 24px 16px 30px;
        }


        .secao {

            margin-bottom: 22px;

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;
            overflow: hidden;

            padding: 23px;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #151820 0%,
                    #101217 100%
                );

            border:
                1px solid var(--border);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.18);
        }


        .hero::before {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -80px;
            top: -90px;

            background:
                rgba(225,29,72,0.12);

            filter: blur(30px);

            border-radius: 50%;
        }


        .hero-label {

            position: relative;

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 7px 10px;

            border-radius: 999px;

            background:
                rgba(225,29,72,0.10);

            border:
                1px solid rgba(225,29,72,0.20);

            color: var(--red2);

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


        .hero-label i {

            font-size: 8px;

        }


        .hero h2 {

            position: relative;

            margin-top: 15px;

            font-size: 27px;

            line-height: 1.15;

            font-weight: 800;
        }


        .hero h2 span {

            color: var(--red2);

        }


        .hero p {

            position: relative;

            margin-top: 10px;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.55;

            max-width: 600px;
        }


        .hero-status {

            position: relative;

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 18px;

            color: #b9c0ca;

            font-size: 12px;
        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 12px rgba(34,197,94,0.65);
        }


        /* =====================================================
           TÍTULO DE SEÇÃO
        ===================================================== */

        .titulo-secao {

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }


        .titulo-secao h3 {

            font-size: 15px;
            font-weight: 700;
        }


        .titulo-secao span {

            font-size: 11px;
            color: var(--dark-muted);
        }


        /* =====================================================
           RESUMO
        ===================================================== */

        .resumo-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }


        .resumo-card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 16px;

            transition:
                transform 0.18s ease,
                border-color 0.18s ease;
        }


        .resumo-card:active {

            transform: scale(0.98);

        }


        .resumo-top {

            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .resumo-icon {

            width: 38px;
            height: 38px;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
        }


        .icon-red {

            background:
                rgba(225,29,72,0.12);

            color: var(--red2);

        }


        .icon-blue {

            background:
                rgba(59,130,246,0.12);

            color: #60a5fa;

        }


        .icon-green {

            background:
                rgba(34,197,94,0.12);

            color: #4ade80;

        }


        .icon-yellow {

            background:
                rgba(245,158,11,0.12);

            color: #fbbf24;

        }


        .resumo-numero {

            margin-top: 15px;

            font-size: 23px;
            font-weight: 800;
        }


        .resumo-label {

            margin-top: 3px;

            color: var(--muted);

            font-size: 11px;
        }


        /* =====================================================
           PERFIL
        ===================================================== */

        .perfil-card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 20px;

            overflow: hidden;
        }


        .perfil-card-top {

            padding: 18px;

            display: flex;
            align-items: center;
            gap: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(225,29,72,0.08),
                    transparent
                );
        }


        .avatar-grande {

            width: 55px;
            height: 55px;

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(225,29,72,0.13);

            border:
                1px solid rgba(225,29,72,0.22);

            color: var(--red2);

            font-size: 21px;
        }


        .perfil-card-top h4 {

            font-size: 16px;
            font-weight: 750;
        }


        .perfil-card-top p {

            margin-top: 3px;

            color: var(--muted);

            font-size: 12px;
        }


        .cargo-badge {

            display: inline-flex;

            margin-top: 7px;

            padding: 5px 9px;

            border-radius: 7px;

            background:
                rgba(255,255,255,0.05);

            color: #d6d9df;

            font-size: 10px;
            font-weight: 600;
        }


        .dados-perfil {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            border-top:
                1px solid var(--border);
        }


        .dado {

            padding: 14px 17px;

            border-right:
                1px solid var(--border);
        }


        .dado:nth-child(2n) {

            border-right: none;

        }


        .dado-label {

            color: var(--dark-muted);

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.4px;
        }


        .dado-valor {

            margin-top: 5px;

            color: #dfe2e7;

            font-size: 13px;
            font-weight: 600;
        }


        /* =====================================================
           ACESSOS
        ===================================================== */

        .acessos-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }


        .acesso {

            position: relative;

            padding: 17px;

            border-radius: 17px;

            background: var(--card);

            border:
                1px solid var(--border);

            text-align: left;

            color: var(--text);

            transition:
                transform 0.18s ease,
                background 0.18s ease,
                border-color 0.18s ease;
        }


        .acesso:active {

            transform: scale(0.97);

        }


        .acesso:hover {

            background: var(--card2);

        }


        .acesso-icon {

            width: 39px;
            height: 39px;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,0.045);

            color: #d5d8de;

            margin-bottom: 13px;
        }


        .acesso h4 {

            font-size: 13px;
            font-weight: 700;
        }


        .acesso p {

            margin-top: 4px;

            color: var(--muted);

            font-size: 11px;

            line-height: 1.4;
        }


        .acesso-arrow {

            position: absolute;

            right: 15px;
            top: 17px;

            color: var(--dark-muted);

            font-size: 11px;
        }


        /* =====================================================
           STATUS DO SISTEMA
        ===================================================== */

        .sistema-card {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 18px;
        }


        .sistema-item {

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 13px 0;

            border-bottom:
                1px solid var(--border);
        }


        .sistema-item:first-child {

            padding-top: 0;

        }


        .sistema-item:last-child {

            padding-bottom: 0;

            border-bottom: none;

        }


        .sistema-esquerda {

            display: flex;
            align-items: center;

            gap: 11px;
        }


        .sistema-icone {

            width: 34px;
            height: 34px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(255,255,255,0.04);

            color: var(--muted);

            font-size: 13px;
        }


        .sistema-nome {

            font-size: 12px;
            font-weight: 600;
        }


        .sistema-descricao {

            margin-top: 2px;

            color: var(--dark-muted);

            font-size: 10px;
        }


        .online {

            display: flex;
            align-items: center;
            gap: 6px;

            color: #4ade80;

            font-size: 10px;
            font-weight: 600;
        }


        .online i {

            font-size: 7px;

        }


        /* =====================================================
           AVISOS
        ===================================================== */

        .avisos {

            background: var(--card);

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 18px;
        }


        .aviso {

            display: flex;

            gap: 12px;

            padding: 13px 0;

            border-bottom:
                1px solid var(--border);
        }


        .aviso:first-child {

            padding-top: 0;

        }


        .aviso:last-child {

            padding-bottom: 0;

            border-bottom: none;

        }


        .aviso-icone {

            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(225,29,72,0.10);

            color: var(--red2);

            font-size: 12px;
        }


        .aviso h4 {

            font-size: 12px;
            font-weight: 650;
        }


        .aviso p {

            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;

            line-height: 1.45;
        }


        /* =====================================================
           RODAPÉ
        ===================================================== */

        .rodape {

            text-align: center;

            color: var(--dark-muted);

            font-size: 10px;

            padding: 3px 0 10px;
        }


        .rodape strong {

            color: #747b86;

        }


        /* =====================================================
           MENU INFERIOR
        ===================================================== */

        .menu-container {

            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            z-index: 300;

            display: flex;
            align-items: center;
            justify-content: space-around;

            padding:
                10px 7px
                calc(10px + env(safe-area-inset-bottom));

            background:
                rgba(14,16,21,0.94);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border-top:
                1px solid var(--border);
        }


        .menu-item {

            min-width: 58px;

            border: none;

            background: transparent;

            color: var(--dark-muted);

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 5px;

            cursor: pointer;

            transition: 0.18s ease;
        }


        .menu-item i {

            font-size: 17px;

        }


        .menu-item span {

            font-size: 9px;

            font-weight: 600;

        }


        .menu-item.active {

            color: var(--red2);

        }


        .menu-item:active {

            transform: scale(0.92);

        }


        /* =====================================================
           MODAL DE SAÍDA
        ===================================================== */

        .modal-fundo {

            position: fixed;
            inset: 0;

            z-index: 1000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 18px;

            background:
                rgba(0,0,0,0.76);

            backdrop-filter:
                blur(8px);
        }


        .modal-conteudo {

            width: 100%;
            max-width: 350px;

            background:
                #14171d;

            border:
                1px solid var(--border);

            border-radius: 22px;

            padding: 24px;

            text-align: center;
