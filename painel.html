<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>ITÁLIA · PAINEL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://oesqxkszqdcdquoxdvms.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DXzmPUIRXCSdW-tuUMevZA_Zs0C7Usl";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            color: #f1f5f9;
            background-color: #0b0b10;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        .fundo-blur {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 15;
        }
        .fundo-blur.ativo {
            opacity: 1;
            visibility: visible;
        }
        .banner-topo {
            width: 100%;
            height: 140px;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            z-index: 1;
        }
        .banner-topo::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url("https://wallpapers.com/images/featured/fundo-de-fivem-zt0lohk29h4faehq.jpg") center top / cover no-repeat;
            opacity: 0.4;
        }
        .banner-topo::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(11,11,16,0) 0%, rgba(11,11,16,0.3) 50%, rgba(11,16,24,1) 100%);
        }
        .conteudo {
            flex-grow: 1;
            position: relative;
            z-index: 3;
            padding: 24px 16px;
            overflow-y: auto;
        }
        .saudacao { margin-bottom: 28px; }
        .saudacao h2 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .saudacao h2 span { 
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
        }
        .saudacao p {
            font-size: 14px;
            color: #94a3b8;
        }
        .info-usuario {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .linha-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            padding: 4px 0;
        }
        .linha-info i {
            color: #60a5fa;
            font-size: 20px;
            width: 24px;
            text-align: center;
        }
        .linha-info .rotulo { color: #94a3b8; font-weight: 500; }
        .linha-info .valor {
            color: #ffffff;
            font-weight: 700;
        }
        .carregando { color: #64748b; font-style: normal; }

        .grid-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .card {
            background: linear-gradient(135deg, rgba(30, 64, 100, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 20px;
            padding: 18px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:active {
            transform: scale(0.97);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.15);
        }
        .card-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .card-icone {
            font-size: 18px;
            color: #60a5fa;
        }
        .card-numero {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 4px;
        }
        .card-titulo {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .barra-menu-inferior {
            width: 100%;
            background: #000000;
            border: none;
            border-top: 1px solid rgba(96, 165, 250, 0.12);
            padding: 14px 32px;
            flex-shrink: 0;
            position: relative;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-painel, .menu-mais {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #60a5fa;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            border: none;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: all 0.25s ease;
            position: relative;
        }
        .menu-painel i, .menu-mais i { font-size: 22px; }
        .menu-painel.ativo, .menu-mais.ativo { 
            color: #bfdbfe;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
        }
        .notif-bolinha {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 10px;
            height: 10px;
            background: #f97316;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(249, 115, 22, 0.6);
            display: none;
        }
        .notif-bolinha.visivel { display: block; }

        .gaveta-lateral {
            position: fixed;
            top: 60px;
            bottom: 120px;
            right: 0;
            width: 300px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(96, 165, 250, 0.18);
            border-right: none;
            border-radius: 24px 0 0 24px;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 20;
            padding: 28px 20px;
            overflow-y: auto;
        }
        .gaveta-lateral.aberto { transform: translateX(0); }

        .titulo-gaveta {
            font-size: 12px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(96, 165, 250, 0.12);
        }

        .grupo-itens {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .item-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 14px;
            color: #cbd5e1;
            font-size: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(30, 64, 100, 0.25);
            border: 1px solid rgba(96, 165, 250, 0.12);
        }
        .item-menu:hover, .item-menu:active {
            background: rgba(96, 165, 250, 0.12);
            border-color: rgba(96, 165, 250, 0.25);
            color: #e0e7ff;
        }
        .item-menu.sair {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            margin-top: 8px;
        }
        .item-menu.sair:hover, .item-menu.sair:active {
            background: rgba(239, 68, 68, 0.18);
            border-color: rgba(239, 68, 68, 0.35);
            color: #fecaca;
        }
        .item-menu-esq {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .item-menu i:first-child {
            color: #60a5fa;
            font-size: 19px;
            width: 24px;
            text-align: center;
        }
        .item-menu.sair i:first-child { color: #f87171; }
        .seta {
            color: #475569;
            font-size: 11px;
            transition: transform 0.2s ease;
        }
        .item-menu:active .seta { transform: translateX(3px); }
        .bolinha-notif {
            width: 8px;
            height: 8px;
            background: #f97316;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(249, 115, 22, 0.5);
            display: none;
        }
        .bolinha-notif.tem-novidade { display: block; }

        @media (max-width: 480px) {
            .banner-topo { height: 120px; }
            .barra-menu-inferior { padding: 12px 24px; }
            .gaveta-lateral { width: 280px; }
        }
    </style>
</head>
<body>
    <div class="fundo-blur" id="fundoBlur"></div>
    
    <div class="banner-topo"></div>
    
    <div class="conteudo" id="areaPainel">
        <div class="saudacao">
            <h2>Olá, <span id="nomeUsuario" class="carregando">carregando...</span></h2>
            <p>Bem-vindo de volta à Organização Itália</p>
        </div>

        <div class="info-usuario">
            <div class="linha-info">
                <i class="fas fa-id-card"></i>
                <span class="rotulo">Passaporte:</span>
                <span id="passaporteUsuario" class="valor carregando">—</span>
            </div>
            <div class="linha-info">
                <i class="fas fa-shield-alt"></i>
                <span class="rotulo">Cargo:</span>
                <span id="cargoUsuario" class="valor carregando">—</span>
            </div>
        </div>

        <div class="grid-cards">
            <div class="card" id="cardTickets">
                <div class="card-cabecalho">
                    <i class="fas fa-envelope-open-text card-icone"></i>
                </div>
                <div class="card-numero" id="numTickets">0</div>
                <div class="card-titulo">Tickets Abertos</div>
            </div>
        </div>
    </div>

    <div class="gaveta-lateral" id="menuLateral">
        <h3 class="titulo-gaveta">Navegação</h3>
        
        <div class="grupo-itens">
            <div class="item-menu" id="itemAvisos">
                <div class="item-menu-esq">
                    <i class="fas fa-bullhorn"></i>
                    <span>Avisos</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="bolinha-notif" id="notifAvisos"></div>
                    <i class="fas fa-chevron-right seta"></i>
                </div>
            </div>

            <div class="item-menu">
                <div class="item-menu-esq">
                    <i class="fas fa-calendar-check"></i>
                    <span>Convocações</span>
                </div>
                <i class="fas fa-chevron-right seta"></i>
            </div>

            <div class="item-menu">
                <div class="item-menu-esq">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Ausências</span>
                </div>
                <i class="fas fa-chevron-right seta"></i>
            </div>

            <div class="item-menu">
                <div class="item-menu-esq">
                    <i class="fas fa-chart-line"></i>
                    <span>Promoções</span>
                </div>
                <i class="fas fa-chevron-right seta"></i>
            </div>

            <div class="item-menu">
                <div class="item-menu-esq">
                    <i class="fas fa-address-card"></i>
                    <span>Ficha</span>
                </div>
                <i class="fas fa-chevron-right seta"></i>
            </div>

            <div class="item-menu">
                <div class="item-menu-esq">
                    <i class="fas fa-bell"></i>
                    <span>Notificações</span>
                </div>
                <i class="fas fa-chevron-right seta"></i>
            </div>

            <div class="item-menu">
                <div class="item-menu-esq">
                    <i class="fas fa-key"></i>
                    <span>Minha Segurança</span>
                </div>
                <i class="fas fa-chevron-right seta"></i>
            </div>
        </div>

        <div class="item-menu sair" id="itemSair">
            <div class="item-menu-esq">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair da conta</span>
            </div>
        </div>
    </div>

    <div class="barra-menu-inferior">
        <div class="menu-painel ativo" id="botaoPainel">
            <i class="fas fa-home"></i>
            <span>Painel</span>
        </div>

        <div class="menu-mais" id="botaoMais">
            <i class="fas fa-th"></i>
            <span>Mais</span>
            <div class="notif-bolinha" id="notifMais"></div>
        </div>
    </div>

    <script>
        let toqueInicio = 0;
        document.addEventListener('touchstart', e => {
            toqueInicio = e.touches[0].clientY;
        });
        document.addEventListener('touchend', e => {
            const toqueFim = e.changedTouches[0].clientY;
            if (toqueFim - toqueInicio > 100 && window.scrollY <= 0) {
                window.location.reload();
            }
        });

        async function carregarDadosUsuario() {
            const dadosSalvos = localStorage.getItem('usuario');
            if (!dadosSalvos) {
                window.location.href = 'login.html';
                return;
            }
            const usuario = JSON.parse(dadosSalvos);
            
            document.getElementById('nomeUsuario').textContent = usuario.nome || "Membro";
            document.getElementById('passaporteUsuario').textContent = usuario.passaporte || "—";
            document.getElementById('cargoUsuario').textContent = usuario.cargo || "Membro";

            try {
                const { data, error } = await sb
                    .from('membros')
                    .select('nome, passaporte, cargo')
                    .eq('passaporte', usuario.passaporte)
                    .single();

                if (!error && data) {
                    document.getElementById('nomeUsuario').textContent = data.nome;
                    document.getElementById('passaporteUsuario').textContent = data.passaporte;
                    document.getElementById('cargoUsuario').textContent = data.cargo;
                    usuario.nome = data.nome;
                    usuario.cargo = data.cargo;
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                }
            } catch (erro) {
                console.log("Usando dados salvos");
            }

            document.getElementById('numTickets').textContent = "0";
        }

        carregarDadosUsuario();

        const botaoMais = document.getElementById('botaoMais');
        const botaoPainel = document.getElementById('botaoPainel');
        const gaveta = document.getElementById('menuLateral');
        const fundoBlur = document.getElementById('fundoBlur');
        const itemSair = document.getElementById('itemSair');

        botaoMais.addEventListener('click', () => {
            botaoMais.classList.toggle('ativo');
            botaoPainel.classList.remove('ativo');
            gaveta.classList.toggle('aberto');
            fundoBlur.classList.toggle('ativo');
        });

        botaoPainel.addEventListener('click', () => {
            botaoPainel.classList.add('ativo');
            botaoMais.classList.remove('ativo');
            gaveta.classList.remove('aberto');
            fundoBlur.classList.remove('ativo');
        });

        fundoBlur.addEventListener('click', () => {
            botaoMais.classList.remove('ativo');
            botaoPainel.classList.add('ativo');
            gaveta.classList.remove('aberto');
            fundoBlur.classList.remove('ativo');
        });

        itemSair.addEventListener('click', () => {
            localStorage.removeItem('usuario');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
