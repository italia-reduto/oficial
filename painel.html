<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>ITÁLIA · PAINEL</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://oesqxkszqdcdquoxdvms.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_DXzmPUIRXJ5YcmQ9CnqYhA_tQcFzXKf";
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let usuarioNome = "";
        let usuarioPassaporte = "";
        let usuarioCargo = "";
        
        async function verificarSessao() {
            const sessao = localStorage.getItem("sessao_italia");
            if (!sessao) {
                window.location.href = "login.html";
                return;
            }
            const dados = JSON.parse(sessao);
            usuarioNome = dados.nome || "Membro";
            usuarioPassaporte = dados.passaporte || "—";
            usuarioCargo = dados.cargo || "Membro";
            preencherDados();
        }
        
        function preencherDados() {
            document.getElementById("nome-usuario").textContent = usuarioNome;
            document.getElementById("passaporte-usuario").textContent = usuarioPassaporte;
            document.getElementById("cargo-usuario").textContent = usuarioCargo;
        }
        
        function sair() {
            localStorage.removeItem("sessao_italia");
            window.location.href = "login.html";
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        
        :root {
            --preto: #000000;
            --fundo: #08090d;
            --azul-claro: #a4d0ff;
            --azul-meio: #4a90e2;
            --azul-escuro: #1e3a5f;
            --branco: #ffffff;
            --cinza: #9ca3af;
            --card: rgba(20, 25, 35, 0.85);
            --borda: rgba(74, 144, 226, 0.2);
        }
        
        html, body {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #0f172a 50%, #1e293b 100%);
            color: var(--branco);
            overflow-x: hidden;
        }
        
        .fundo-blur {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9;
        }
        
        .fundo-blur.ativo {
            opacity: 1;
            visibility: visible;
        }
        
        main {
            padding: 2rem 1.5rem 6rem;
            max-width: 640px;
            margin: 0 auto;
            min-height: 100vh;
        }
        
        .cabecalho {
            margin-bottom: 2.5rem;
        }
        
        .saudacao {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        
        .sub-saudacao {
            color: var(--cinza);
            font-size: 0.95rem;
        }
        
        .dados-pessoais {
            background: var(--card);
            border: 1px solid var(--borda);
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        
        .icone-perfil {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--azul-meio), var(--azul-escuro));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        
        .info-linha {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin: 0.25rem 0;
            font-size: 0.9rem;
        }
        
        .info-linha strong {
            font-weight: 700;
            color: var(--azul-claro);
        }
        
        .grid-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--borda);
            border-radius: 1rem;
            padding: 1.25rem;
            backdrop-filter: blur(10px);
        }
        
        .card-titulo {
            font-size: 0.85rem;
            color: var(--cinza);
            margin-bottom: 0.5rem;
        }
        
        .card-valor {
            font-size: 1.8rem;
            font-weight: 700;
        }
        
        .barra-navegacao {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 200;
        }
        
        .botao-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            background: transparent;
            border: none;
            color: var(--cinza);
            cursor: pointer;
        }
        
        .botao-nav.ativo {
            color: var(--azul-claro);
        }
        
        .botao-nav i {
            font-size: 1.25rem;
        }
        
        .botao-nav span {
            font-size: 0.7rem;
        }
        
        .botao-mais {
            background: linear-gradient(135deg, var(--azul-meio), var(--azul-escuro));
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
        }
        
        .gaveta {
            position: fixed;
            top: 0;
            right: 0;
            width: 80%;
            max-width: 340px;
            height: calc(100vh - 70px);
            background: rgba(8, 9, 13, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--borda);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 100;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }
        
        .gaveta.aberta {
            transform: translateX(0);
        }
        
        .gaveta-cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .gaveta-titulo {
            font-size: 1.2rem;
            font-weight: 700;
        }
        
        .botao-fechar {
            background: transparent;
            border: none;
            color: var(--cinza);
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .grupo-itens {
            background: rgba(30, 58, 95, 0.2);
            border-radius: 0.8rem;
            border: 1px solid var(--borda);
            padding: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .item-gaveta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1rem;
            color: var(--branco);
            text-decoration: none;
            border-radius: 0.6rem;
        }
        
        .item-esquerda {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }
        
        .item-esquerda i {
            color: var(--azul-meio);
            font-size: 1.1rem;
        }
        
        .item-seta {
            color: var(--cinza);
        }
        
        .item-sair {
            color: #ff7b7b;
        }
        
        .item-sair i {
            color: #ff7b7b;
        }
    </style>
</head>
<body onload="verificarSessao()">

    <div class="fundo-blur" id="fundoBlur" onclick="fecharGaveta()"></div>

    <main>
        <div class="cabecalho">
            <h1 class="saudacao">Olá, <span id="nome-usuario">Membro</span></h1>
            <p class="sub-saudacao">Seja bem-vindo à Organização Itália</p>
        </div>

        <div class="dados-pessoais">
            <div class="icone-perfil">
                <i class="fas fa-user"></i>
            </div>
            <div>
                <div class="info-linha">
                    <i class="fas fa-id-card" style="color: var(--azul-meio);"></i>
                    <span>Passaporte:</span>
                    <strong id="passaporte-usuario">—</strong>
                </div>
                <div class="info-linha">
                    <i class="fas fa-shield-alt" style="color: var(--azul-meio);"></i>
                    <span>Cargo:</span>
                    <strong id="cargo-usuario">—</strong>
                </div>
            </div>
        </div>

        <div class="grid-cards">
            <div class="card">
                <p class="card-titulo">Tickets Abertos</p>
                <p class="card-valor">0</p>
            </div>
            <div class="card">
                <p class="card-titulo">Ausências Pendentes</p>
                <p class="card-valor">0</p>
            </div>
        </div>
    </main>

    <div class="gaveta" id="gaveta">
        <div class="gaveta-cabecalho">
            <h2 class="gaveta-titulo">Mais Opções</h2>
            <button class="botao-fechar" onclick="fecharGaveta()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="grupo-itens">
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-bell"></i>
                    <span>Avisos</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-calendar-check"></i>
                    <span>Convocação</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-calendar-times"></i>
                    <span>Ausências</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-chart-line"></i>
                    <span>Promoções</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-id-card"></i>
                    <span>Ficha</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-bell"></i>
                    <span>Notificações</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
            <a href="#" class="item-gaveta">
                <div class="item-esquerda">
                    <i class="fas fa-lock"></i>
                    <span>Minha Segurança</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </a>
        </div>

        <div class="grupo-itens">
            <button class="item-gaveta item-sair" onclick="sair()">
                <div class="item-esquerda">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair da conta</span>
                </div>
                <i class="fas fa-chevron-right item-seta"></i>
            </button>
        </div>
    </div>

    <nav class="barra-navegacao">
        <button class="botao-nav ativo">
            <i class="fas fa-home"></i>
            <span>Painel</span>
        </button>
        <button class="botao-mais" onclick="abrirGaveta()">
            <i class="fas fa-plus"></i>
        </button>
        <button class="botao-nav" onclick="sair()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Sair</span>
        </button>
    </nav>

    <script>
        const gaveta = document.getElementById('gaveta');
        const fundoBlur = document.getElementById('fundoBlur');

        function abrirGaveta() {
            gaveta.classList.add('aberta');
            fundoBlur.classList.add('ativo');
            document.body.style.overflow = 'hidden';
        }

        function fecharGaveta() {
            gaveta.classList.remove('aberta');
            fundoBlur.classList.remove('ativo');
            document.body.style.overflow = '';
        }
    </script>
</body>
                    </html>
