        html, body {

        .banner-topo {

        .conteudo {

        .linha-info {

        }

        .bloco-tempo {

        .hora { font-size: 15px; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
        .data { font-size: 14px; color: #94a3b8; }
        
        .grade-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
        }
        
        .card {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(96, 165, 250, 0.12);
            border-radius: 14px;
            padding: 20px;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;

        .card-titulo {

            margin-bottom: 8px;

        .card-titulo i { font-size: 14px; color: #60a5fa; }
        .card-valor { font-size: 22px; font-weight: 700; color: #fff; }
        
        .card-aviso {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(96, 165, 250, 0.12);
            border-radius: 14px;

            grid-column: 1 / -1;
        }
        
        .barra-menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            background: #000;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: 1px solid rgba(96, 165, 250, 0.15);
            z-index: 100;
        }
        
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 11px;
            cursor: pointer;
        }
        
        .menu-item.ativo { color: #60a5fa; }
        .menu-item i { font-size: 20px; margin-bottom: 2px; }
        
        .sombra-fundo {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 97;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
        }
        
        .sombra-fundo.visivel { opacity: 1; visibility: visible; }
        
        .gaveta {
            position: fixed;
            bottom: 70px;
            right: 0;
            width: 260px;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            border-left: 1px solid rgba(96, 165, 250, 0.15);
            border-top-left-radius: 16px;
            z-index: 98;
            transform: translateY(100%);
            transition: transform 0.35s ease;
            padding: 20px 18px;
            max-height: calc(80vh - 70px);
            overflow-y: auto;
        }
        
        .gaveta.aberta { transform: translateY(0); }
        
        .gaveta-titulo {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        
        .gaveta-lista { display: flex; flex-direction: column; gap: 8px; }
        
        .gaveta-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: rgba(30, 64, 175, 0.08);
            border: 1px solid rgba(96, 165, 250, 0.12);
            border-radius: 10px;
            color: #e2e8f0;
            text-decoration: none;
        }
        
        .gaveta-item:hover {
            background: rgba(96, 165, 250, 0.15);
            transform: translateX(-4px);
        }
        
        .gaveta-item-esq { display: flex; align-items: center; gap: 10px; }
        .gaveta-item-esq i { color: #60a5fa; font-size: 16px; }
        .gaveta-item-dir { color: #64748b; font-size: 14px; }
        
        .botao-fechar {
            position: absolute;
            top: 12px;
            right: 14px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
        }
        
        .fundo-modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
            padding: 24px;
        }
        
        .fundo-modal.aberto { opacity: 1; visibility: visible; }
        
        .caixa-modal {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.92));
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 24px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
        }
        
        .icone-modal {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(248, 113, 113, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .icone-modal i { font-size: 26px; color: #f87171; }
        .titulo-modal { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 10px; }
        .texto-modal { font-size: 15px; color: #94a3b8; text-align: center; margin-bottom: 24px; }
        
        .botoes-modal { display: flex; gap: 12px; }
        
        .botao-cancelar {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(96, 165, 250, 0.18);
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .botao-confirmar {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="banner-topo"></div>
    
    <div class="cabecalho-superior">

            <i class="fas fa-sign-out-alt"></i> Sair
        </button>
    </div>

    <div class="conteudo" id="conteudoPrincipal">

        <div class="linha-info">

        <div class="sombra-fundo" id="sombraFundo" onclick="fecharGaveta()"></div>

    <div class="fundo-modal" id="modalSair">
        <div class="caixa-modal">
            <div class="icone-modal"><i class="fas fa-right-from-bracket"></i></div>
            <h3 class="titulo-modal">Deseja sair?</h3>
            <p class="texto-modal">Você voltará para a tela de acesso.</p>
            <div class="botoes-modal">
                <button class="botao-cancelar" onclick="fecharModal()">Cancelar</button>
                <button class="botao-confirmar" onclick="confirmarSaida()">Sair</button>
            </div>
        </div>
    </div>

    <script>
        // ========== RELÓGIO ==========
        function atualizarRelogio() {
            const agora = new Date();
            const brasilia = new Date(agora.toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
            const dia = String(brasilia.getDate()).padStart(2, '0');
            const mes = String(brasilia.getMonth() + 1).padStart(2, '0');
            const ano = brasilia.getFullYear();
            const h = String(brasilia.getHours()).padStart(2, '0');
            const m = String(brasilia.getMinutes()).padStart(2, '0');
            const s = String(brasilia.getSeconds()).padStart(2, '0');
            document.getElementById('horaAtual').textContent = `${h}:${m}:${s}`;
            document.getElementById('dataAtual').textContent = `${dia}/${mes}/${ano}`;
        }
        atualizarRelogio();
        setInterval(atualizarRelogio, 1000);

        // ========== GAVETA ==========
        const gaveta = document.getElementById('gaveta');
        const sombraFundo = document.getElementById('sombraFundo');
        const conteudoPrincipal = document.getElementById('conteudoPrincipal');
        const modal = document.getElementById('modalSair');

        function alternarGaveta(e) {
            e?.preventDefault();
            gaveta.classList.toggle('aberta');
            sombraFundo.classList.toggle('visivel');
            conteudoPrincipal.classList.toggle('desfocado');
        }

        function fecharGaveta() {
            gaveta.classList.remove('aberta');
            sombraFundo.classList.remove('visivel');
            conteudoPrincipal.classList.remove('desfocado');
        }

        // ========== MODAL SAIR ==========
        function abrirModal() { modal.classList.add('aberto'); }
        function fecharModal() { modal.classList.remove('aberto'); }
        function confirmarSaida() {
            localStorage.removeItem('passaporte');
            localStorage.removeItem('usuario');
            window.location.href = 'login.html';
        }

        // ========== BUSCAR DADOS — SEM FILTRO DE ATIVO ✅ ==========
        async function carregarDadosUsuario() {
            const passaporteSalvo = localStorage.getItem('passaporte');
            
            if (!passaporteSalvo) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // ✅ TIREI O .eq('ativo', true) — busca direto pelo passaporte!
                const { data, error } = await sb
                    .from('membros')
                    .select('nome, passaporte, cargo')
                    .eq('passaporte', passaporteSalvo)
                    .single();

                if (error) throw error;

                if (data) {
                    document.getElementById('nomeUsuario').textContent = data.nome || 'Membro';
                    document.getElementById('passaporteUsuario').textContent = data.passaporte || '-';
                    document.getElementById('cargoUsuario').textContent = data.cargo || '—';
                }
            } catch (erro) {
                console.log('Erro ao buscar:', erro);
                // Se der erro, mostra o que já tem salvo
                const salvo = localStorage.getItem('usuario');
                if (salvo) {
                    const usuario = JSON.parse(salvo);
                    document.getElementById('nomeUsuario').textContent = usuario.nome || 'Membro';
                    document.getElementById('cargoUsuario').textContent = usuario.cargo || '—';
                }
            }
        }

        carregarDadosUsuario();
    </script>
</body>
