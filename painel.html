    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box;

        .fundo-pagina {

        }

            position: fixed; inset: 0;

        .conteudo { position: relative; z-index: 1; padding: 24px; max-width: 600px; margin: 0 auto; }
        
        .cabecalho { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; }
        .titulo-secao h1 { font-size: 28px; font-weight: 800; }
        .titulo-secao h1 span { color: #60a5fa; }
        .titulo-secao .dados-usuario { font-size: 14px; color: #94a3b8; margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
        .titulo-secao .dados-usuario i { color: #60a5fa; margin-right: 4px; }
        
        .topo-acoes { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .botao-sair {
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; padding: 8px 12px; border-radius: 10px; font-size: 12px;

        }
        .botao-sair:hover { background: rgba(239, 68, 68, 0.25); }

        /* Botão Admin Discreto no Topo (Visível apenas para o Coordenador) */
        .botao-admin-topo {
            background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35);
            color: #f59e0b; padding: 8px 12px; border-radius: 10px; font-size: 12px;
            font-weight: 600; cursor: pointer; display: none; align-items: center; gap: 6px;
            transition: background 0.2s;
        }
        .botao-admin-topo:hover { background: rgba(245, 158, 11, 0.25); }

        .info-tempo-topo {
            font-size: 13px; color: #94a3b8; margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
        }
        .info-tempo-topo span { display: inline-flex; align-items: center; gap: 5px; }
        .info-tempo-topo i { color: #60a5fa; }

        .grade-cards {

        .card {
            background: rgba(15, 23, 42, 0.55);

        }

        .lista-membros { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .item-membro {

        .botoes-atalho { display: flex; gap: 10px; margin-top: 14px; }
        .botao-atalho {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(96, 165, 250, 0.2);
            background: rgba(59, 130, 246, 0.1); color: #60a5fa; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; transition: background 0.2s;
        }
        .botao-atalho:hover { background: rgba(59, 130, 246, 0.2); }

        /* Estilo do Modal Admin Limpo */

            display: flex; align-items: center; justify-content: center; z-index: 999;
            opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 16px;

        .fundo-modal.aberto { opacity: 1; visibility: visible; }

            padding: 24px; max-width: 500px; width: 100%; max-height: 85vh;
            display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-admin-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .modal-admin-titulo { font-size: 18px; font-weight: 700; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .botao-fechar-modal { background: transparent; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
        .botao-fechar-modal:hover { color: #fff; }

        .tabela-admin-container { overflow-y: auto; max-height: 55vh; border-radius: 12px; border: 1px solid rgba(96, 165, 250, 0.15); }
        .tabela-admin { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        .tabela-admin th { background: rgba(15, 23, 42, 0.9); color: #94a3b8; font-weight: 600; padding: 10px 12px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(96, 165, 250, 0.15); }
        .tabela-admin td { padding: 12px; border-bottom: 1px solid rgba(96, 165, 250, 0.08); vertical-align: middle; background: rgba(15, 23, 42, 0.4); }
        .tabela-admin tr:last-child td { border-bottom: none; }
        
        .status-ponto-admin { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; }
        .status-ponto-admin.ativo { color: #22c55e; }
        .status-ponto-admin.pausado { color: #f59e0b; }

        .botoes-acao-admin { display: flex; gap: 6px; }
        .btn-acao-admin {
            border: none; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
            cursor: pointer; color: #fff; transition: opacity 0.2s; display: inline-flex; align-items: center; gap: 4px;
        }
        .btn-acao-admin.pausar { background: #f59e0b; }
        .btn-acao-admin.retomar { background: #10b981; }
        .btn-acao-admin.encerrar { background: #ef4444; }
        .btn-acao-admin:hover { opacity: 0.85; }

        .aviso-vazio-admin { text-align: center; color: #94a3b8; padding: 30px; font-size: 14px; }

        .barra-menu {
            position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
            background: #000; display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid rgba(96,165,250,0.15); z-index: 100;
        }
        .menu-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;

        }
        .menu-item.ativo { color: #60a5fa; }
        .menu-item i { font-size: 20px; margin-bottom: 2px; }
    </style>
</head>

              <script>
        const passaporteUsuario = localStorage.getItem('passaporte');
        const dadosUsuarioLocal = JSON.parse(localStorage.getItem('usuario') || '{}');

        if (!passaporteUsuario) {
            window.location.href = 'login.html';
        }

        // Relógio e Data em tempo real no topo
        function atualizarRelogio() {
            const agora = new Date();
            document.getElementById('relogioTopo').textContent = agora.toLocaleTimeString('pt-BR');
            document.getElementById('dataTopo').textContent = agora.toLocaleDateString('pt-BR');
        }
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();

        document.getElementById('btnSair').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'login.html';
        });

        // Preencher dados do usuário e verificar se é Coordenador no Banco
        async function inicializarPainel() {
            if (dadosUsuarioLocal.nome) {
                document.querySelector('#saudacaoPainel span').textContent = dadosUsuarioLocal.nome;
                document.getElementById('txtPassaporte').textContent = dadosUsuarioLocal.passaporte;
                document.getElementById('txtCargo').textContent = dadosUsuarioLocal.cargo || 'Membro';
            }

            // Verificação de segurança adicional consultando o Supabase para o botão Admin
            try {
                const { data: membroDb, error } = await sb
                    .from('membros')
                    .select('cargo')
                    .eq('passaporte', passaporteUsuario)
                    .single();

                if (!error && membroDb && membroDb.cargo && membroDb.cargo.toLowerCase().includes('coordenador')) {
                    // Exibir botão admin apenas para o Coordenador
                    document.getElementById('btnAbrirModalAdmin').style.display = 'inline-flex';
                }
            } catch (e) {
                console.error('Erro ao verificar cargo:', e);
            }

            carregarCardMembrosAtivos();
            setInterval(carregarCardMembrosAtivos, 10000);
        }

        // Abertura e fechamento do Modal Admin
        const modalAdmin = document.getElementById('modalAdmin');
        document.getElementById('btnAbrirModalAdmin').addEventListener('click', () => {
            modalAdmin.classList.add('aberto');
            carregarPontosAdmin();
        });
        document.getElementById('btnFecharModalAdmin').addEventListener('click', () => {
            modalAdmin.classList.remove('aberto');
        });
        modalAdmin.addEventListener('click', (e) => {
            if (e.target === modalAdmin) modalAdmin.classList.remove('aberto');
        });

        // Carregar dados da tabela dentro do Modal Admin
        async function carregarPontosAdmin() {
            const { data: pontosAbertos, error } = await sb
                .from('pontos')
                .select('*')
                .is('saida', null)
                .order('entrada', { ascending: false });

            const tbody = document.getElementById('listaAdminPontos');
            if (error || !pontosAbertos || pontosAbertos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="aviso-vazio-admin">Nenhum player em jornada ativa no momento.</td></tr>`;
                return;
            }

            const { data: equipes } = await sb.from('equipes').select('id, nome, funcao');
            const mapaEquipes = {};
            (equipes || []).forEach(e => { mapaEquipes[e.id] = e.nome || e.funcao || 'Equipe'; });

            tbody.innerHTML = pontosAbertos.map(p => {
                const emPausa = p.pausa_inicio && !p.pausa_fim;
                const statusTexto = emPausa ? 'Pausado' : 'Em jornada';
                const statusClasse = emPausa ? 'pausado' : 'ativo';
                const iconeStatus = emPausa ? 'fa-coffee' : 'fa-circle-play';
                const nomeEquipe = p.equipe_id ? (mapaEquipes[p.equipe_id] || 'Atribuída') : 'Sem equipe';

                const minutos = Math.floor((Date.now() - new Date(p.entrada).getTime()) / 60000);
                const tempoStr = minutos < 60 ? `${minutos}m` : `${Math.floor(minutos/60)}h ${minutos%60}m`;

                return `
                    <tr>
                        <td><strong>${p.nome || 'Player'}</strong><br><span style="color: #94a3b8; font-size: 11px;">Pass: ${p.passaporte}</span></td>
                        <td>${nomeEquipe}</td>
                        <td>
                            <span class="status-ponto-admin ${statusClasse}"><i class="fas ${iconeStatus}"></i> ${statusTexto}</span>
                            <br><span style="color: #94a3b8; font-size: 11px;">Há ${tempoStr}</span>
                        </td>
                        <td style="text-align: right;">
                            <div class="botoes-acao-admin" style="justify-content: flex-end;">
                                ${emPausa ? 
                                    `<button class="btn-acao-admin retomar" title="Retomar" onclick="executarAcaoAdmin('${p.passaporte}', 'retomar')"><i class="fas fa-play"></i></button>` :
                                    `<button class="btn-acao-admin pausar" title="Pausar" onclick="executarAcaoAdmin('${p.passaporte}', 'pausar')"><i class="fas fa-pause"></i></button>`
                                }
                                <button class="btn-acao-admin encerrar" title="Encerrar" onclick="confirmarEncerrarAdmin('${p.passaporte}', '${p.nome || 'Player'}')"><i class="fas fa-stop"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function confirmarEncerrarAdmin(passaporte, nome) {
            if (confirm(`Deseja realmente encerrar a jornada do player ${nome} (Passaporte: ${passaporte})?`)) {
                await executarAcaoAdmin(passaporte, 'encerrar');
            }
        }

        // Executar ação de admin via função RPC segura no Supabase
        async function executarAcaoAdmin(playerPassaporte, acao) {
            const senhaAdmin = prompt('Digite sua senha de Coordenador para autorizar esta ação:');
            if (!senhaAdmin) return;

            try {
                const { data, error } = await sb.rpc('admin_gerenciar_ponto', {
                    p_admin_passaporte: passaporteUsuario,
                    p_admin_senha: senhaAdmin,
                    p_player_passaporte: playerPassaporte,
                    p_acao: acao
                });

                if (error) throw error;

                if (data && data.sucesso) {
                    carregarPontosAdmin();
                    carregarCardMembrosAtivos();
                } else {
                    alert(data?.erro || 'Erro ao executar ação.');
                }
            } catch (err) {
                alert('Erro de comunicação com o servidor: ' + err.message);
            }
        }

        // Card normal de Membros Ativos do painel
        async function carregarCardMembrosAtivos() {
            const { data: ativos, error } = await sb
                .from('pontos')
                .select('*')
                .is('saida', null)
                .order('entrada', { ascending: false });

            const cardTotal = document.getElementById('cardTotalAtivos');
            const listaMembros = document.getElementById('listaMembrosAtivos');
            const cardMeuStatus = document.getElementById('cardMeuStatus');
            const cardMinhaEquipe = document.getElementById('cardMinhaEquipe');

            if (error || !ativos || ativos.length === 0) {
                cardTotal.textContent = '0 online';
                listaMembros.innerHTML = `<p style="color: #94a3b8; font-size: 13px; text-align: center; padding: 10px;">Nenhum membro em jornada no momento.</p>`;
                cardMeuStatus.textContent = 'Fora de Serviço';
                cardMinhaEquipe.textContent = 'Nenhuma';
                return;
            }

            cardTotal.textContent = `${ativos.length} online`;

            const meuPonto = ativos.find(p => String(p.passaporte) === String(passaporteUsuario));
            if (meuPonto) {
                const emPausa = meuPonto.pausa_inicio && !meuPonto.pausa_fim;
                cardMeuStatus.textContent = emPausa ? 'Em Pausa' : 'Em Jornada';
                cardMeuStatus.style.color = emPausa ? '#f59e0b' : '#22c55e';
            } else {
                cardMeuStatus.textContent = 'Fora de Serviço';
                cardMeuStatus.style.color = '#fff';
            }

            if (meuPonto && meuPonto.equipe_id) {
                const { data: eqData } = await sb.from('equipes').select('nome, funcao').eq('id', meuPonto.equipe_id).single();
                cardMinhaEquipe.textContent = eqData ? (eqData.nome || eqData.funcao) : 'Atribuída';
            } else {
                cardMinhaEquipe.textContent = 'Nenhuma';
            }

            listaMembros.innerHTML = ativos.slice(0, 5).map(p => {
                const emPausa = p.pausa_inicio && !p.pausa_fim;
                const statusTag = emPausa ? `<span class="tag-status pausado">Pausado</span>` : `<span class="tag-status on">ON</span>`;
                return `
                    <div class="item-membro">
                        <div class="info-membro">
                            <p>${p.nome || 'Membro'}</p>
                            <span>Passaporte: ${p.passaporte}</span>
                        </div>
                        ${statusTag}
                    </div>
                `;
            }).join('');
        }

        document.getElementById('btnVerEquipeModal').onclick = () => window.location.href = 'equipe.html';
        document.getElementById('btnVerTempoModal').onclick = () => window.location.href = 'bate-ponto.html';

        inicializarPainel();
    </script>
</body>
