<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a07">
    <title>Painel de Liderança | Portal Itália</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde-neon: #22c55e;
            --fundo-principal: #0a0f0d; 
            --texto-secundario: #a1a1aa;
            --input-bg: rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            background-color: var(--fundo-principal);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px 0;
        }

        .fundo-degrade {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(2, 6, 23, 0.5) 0%, transparent 100%);
            z-index: 0;
        }

        .grade-fundo {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(34, 197, 94, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(34, 197, 94, 0.04) 1px, transparent 1px);
            background-size: 40px 40px; z-index: 0;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        .particulas { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .particula {
            position: absolute; bottom: -10px; background-color: var(--verde-neon);
            border-radius: 50%; box-shadow: 0 0 10px var(--verde-neon);
            opacity: 0; animation: subir linear infinite;
        }
        .p1 { width: 3px; height: 3px; left: 10%; animation-duration: 6s; animation-delay: 0s; }
        .p2 { width: 4px; height: 4px; left: 30%; animation-duration: 8s; animation-delay: 2s; }
        .p3 { width: 2px; height: 2px; left: 50%; animation-duration: 5s; animation-delay: 1s; }
        .p4 { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
        .p5 { width: 3px; height: 3px; left: 90%; animation-duration: 7s; animation-delay: 1.5s; }
        .p6 { width: 2px; height: 2px; left: 20%; animation-duration: 10s; animation-delay: 4s; }
        .p7 { width: 4px; height: 4px; left: 80%; animation-duration: 7.5s; animation-delay: 0.5s; }
        @keyframes subir {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 0.6; } 80% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .painel-hud {
            position: relative; z-index: 10; width: 95%; max-width: 650px;
            padding: 35px 25px; background: rgba(10, 15, 13, 0.8);
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(34, 197, 94, 0.05);
            opacity: 0; transform: translateY(20px); animation: aparecer 0.8s forwards;
            max-height: 95vh; overflow-y: auto;
        }
        .painel-hud::-webkit-scrollbar { width: 6px; }
        .painel-hud::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.3); border-radius: 10px; }

        .painel-hud::before, .painel-hud::after {
            content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--verde-neon); z-index: 20;
        }
        .painel-hud::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .painel-hud::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .tela-login-wrap { display: block; max-width: 400px; margin: 0 auto; }
        
        .tag-status {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(34, 197, 94, 0.1); border-left: 3px solid var(--verde-neon);
            padding: 6px 12px; font-family: 'Oswald', sans-serif; font-size: 11px;
            letter-spacing: 2px; text-transform: uppercase; color: #86efac; margin-bottom: 25px;
        }
        .tag-status span {
            width: 6px; height: 6px; background: var(--verde-neon);
            border-radius: 50%; box-shadow: 0 0 10px var(--verde-neon);
            animation: piscar 1.5s infinite;
        }

        .titulo {
            font-family: 'Oswald', sans-serif; font-size: 38px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .subtitulo { font-size: 13px; color: var(--texto-secundario); margin-bottom: 25px; line-height: 1.5;}
        .campo-grupo { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; text-align: left;}
        .campo-grupo label { font-size: 12px; font-weight: 600; color: #86efac; text-transform: uppercase; letter-spacing: 1px; }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #52525b; font-size: 14px; transition: 0.3s; pointer-events: none;
        }
        .campo-grupo input {
            width: 100%; padding: 14px 14px 14px 42px;
            background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; color: white; font-family: 'Inter', sans-serif;
            font-size: 14px; outline: none; transition: 0.3s;
        }
        .campo-grupo input:focus { border-color: var(--verde-neon); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        .campo-grupo input:focus + i, .input-wrap:focus-within i { color: var(--verde-neon); }

        .btn-principal {
            position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 16px 20px; background: var(--verde-neon);
            border: none; border-radius: 6px; color: #000; text-decoration: none;
            font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; cursor: pointer; margin-top: 10px;
        }
        .btn-principal:hover { background: #4ade80; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(34,197,94,0.3); }

        .tela-admin-wrap { display: none; width: 100%; }
        .topo-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(34, 197, 94, 0.3); padding-bottom: 15px; }
        .btn-sair { 
            background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); 
            padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;
            transition: 0.3s; display: flex; align-items: center; gap: 6px; text-transform: uppercase; font-family: 'Oswald', sans-serif;
        }
        .btn-sair:hover { background: #ef4444; color: #fff; }
        .card-ficha {
            background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px; padding: 20px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; transition: 0.3s;
        }
        .card-ficha:hover { border-color: rgba(34, 197, 94, 0.4); background: rgba(30, 41, 59, 0.6); }
        .ficha-dados { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
        .ficha-dados strong { color: #fff; font-weight: 600; }
        .ficha-dados .historia { 
            margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); 
            border-radius: 6px; border-left: 2px solid #52525b; font-style: italic; font-size: 12px; 
        }
        .ficha-acoes { display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
        .input-senha { 
            flex: 1; min-width: 150px; padding: 12px 14px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(0,0,0,0.5); color: var(--verde-neon); outline: none; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .input-senha:focus { border-color: var(--verde-neon); }
        .btn-aprovar { background: var(--verde-neon); color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 700; font-family: 'Oswald', sans-serif; cursor: pointer; transition: 0.3s; }
        .btn-aprovar:hover { background: #4ade80; }
        .btn-recusar { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 12px 24px; border-radius: 6px; font-weight: 700; font-family: 'Oswald', sans-serif; cursor: pointer; transition: 0.3s; }
        .btn-recusar:hover { background: rgba(239, 68, 68, 0.1); }
        @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        @keyframes aparecer { to { opacity: 1; transform: translateY(0); } }
    </style>
      </head>
      <body>

    <div class="fundo-degrade"></div>
    <div class="grade-fundo"></div>

    <div class="particulas">
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
        <div class="particula p5"></div>
        <div class="particula p6"></div>
        <div class="particula p7"></div>
    </div>

    <div class="painel-hud">
        
        <!-- TELA DE LOGIN -->
        <div class="tela-login-wrap" id="tela-login">
            <div class="tag-status"><span></span> Acesso Restrito</div>
            <h1 class="titulo">Painel de<br>Liderança</h1>
            <p class="subtitulo">Autentique-se com seu passaporte para gerenciar a whitelist.</p>

            <div class="campo-grupo">
                <label>Passaporte</label>
                <div class="input-wrap">
                    <input type="number" id="login-pass" placeholder="Ex: 17274">
                    <i class="fas fa-id-card"></i>
                </div>
            </div>

            <div class="campo-grupo">
                <label>Senha</label>
                <div class="input-wrap">
                    <input type="password" id="login-senha" placeholder="Sua senha de liderança" onkeydown="if(event.key==='Enter') fazerLoginAdmin()">
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button class="btn-principal" onclick="fazerLoginAdmin()">
                Entrar no Painel <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <!-- TELA DO ADMIN -->
        <div class="tela-admin-wrap" id="tela-admin">
            <div class="tag-status"><span></span> Central de Controle</div>
            <div class="topo-admin">
                <h2 class="titulo" style="font-size: 28px;">Fichas Pendentes</h2>
                <button class="btn-sair" onclick="sairAdmin()"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
            <div id="lista-fichas"></div>
        </div>

    </div>

    <script>
        async function fazerLoginAdmin() {
            const pass = document.getElementById('login-pass').value.trim();
            const senha = document.getElementById('login-senha').value;

            if (!pass || !senha) { alert("Preencha o passaporte e a senha!"); return; }

            const { data, error } = await sb.from('membros')
                .select('cargo, senha_credencial, nome')
                .eq('passaporte', pass)
                .single();

            if (error || !data) {
                alert("Passaporte não encontrado!");
                return;
            }

            const cargosPermitidos = ['Líder da organização', '01 da organização', 'Coordenador', 'Gerente geral', 'Gerente'];
            if (!cargosPermitidos.includes(data.cargo)) {
                alert("Você não tem permissão para acessar esta área.");
                return;
            }

            if (String(data.senha_credencial).trim() !== String(senha).trim()) {
                alert("Senha incorreta!");
                return;
            }

            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('tela-admin').style.display = 'block';
            carregarFichas();
        }

        function sairAdmin() {
            sessionStorage.removeItem('membro_logado');
            document.getElementById('tela-admin').style.display = 'none';
            document.getElementById('tela-login').style.display = 'block';
            document.getElementById('login-pass').value = '';
            document.getElementById('login-senha').value = '';
        }

        async function carregarFichas() {
            const container = document.getElementById('lista-fichas');
            container.innerHTML = '<p style="color:#64748b; text-align:center;">Buscando fichas...</p>';

            const { data, error } = await sb.from('registros_whitelist')
                .select('*')
                .eq('status', 'pendente')
                .order('criado_em', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color:red;">Erro: ${error.message}</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p style="color:#64748b; text-align:center; padding: 20px;">Nenhuma ficha pendente no momento.</p>';
                return;
            }

            container.innerHTML = data.map(ficha => `
                <div class="card-ficha">
                    <div class="ficha-dados">
                        <p><strong>Nome:</strong> ${ficha.nome}</p>
                        <p><strong>Passaporte:</strong> ${ficha.passaporte}</p>
                        <p><strong>Idade:</strong> ${ficha.idade}</p>
                        <p><strong>Experiência:</strong> ${ficha.experiencia}</p>
                        <div class="historia"><strong>História:</strong><br> ${ficha.historia}</div>
                    </div>
                    <div class="ficha-acoes">
                        <input type="text" class="input-senha" id="senha-${ficha.id}" placeholder="Definir senha do jogador">
                        <button class="btn-aprovar" onclick="aprovarFicha(${ficha.id}, '${ficha.nome}', '${ficha.passaporte}')">Aprovar</button>
                        <button class="btn-recusar" onclick="recusarFicha(${ficha.id})">Recusar</button>
                    </div>
                </div>
            `).join('');
        }

        async function aprovarFicha(id, nome, passaporte) {
            const senhaCriada = document.getElementById(`senha-${id}`).value;

            if (!senhaCriada) {
                alert("Você precisa digitar uma senha para aprovar este jogador!");
                return;
            }

            if (!confirm(`Aprovar ${nome}? A conta será criada com a senha: ${senhaCriada}`)) return;

            const { data: checkExist } = await sb.from('membros').select('id').eq('passaporte', passaporte);
            
            if (checkExist && checkExist.length > 0) {
                await sb.from('registros_whitelist').update({ status: 'aprovado', senha_criada: senhaCriada }).eq('id', id);
                alert(`O passaporte ${passaporte} já estava cadastrado. A ficha foi movida para aprovada.`);
                carregarFichas();
                return;
            }

            const { error: erroCriar } = await sb.from('membros').insert([{
                nome: nome,
                passaporte: passaporte,
                cargo: 'Novato', 
                senha_credencial: senhaCriada,
                xp_total: 0,
                advertencias: 0
            }]);

            if (erroCriar) {
                alert("Erro ao criar conta: " + erroCriar.message);
                return;
            }

            await sb.from('registros_whitelist').update({ status: 'aprovado', senha_criada: senhaCriada }).eq('id', id);
            
            alert(`${nome} aprovado com sucesso!`);
            carregarFichas(); 
        }

        async function recusarFicha(id) {
            if (!confirm("Tem certeza que deseja recusar esta ficha?")) return;
            await sb.from('registros_whitelist').update({ status: 'recusado' }).eq('id', id);
            carregarFichas();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (logado) {
                const membro = JSON.parse(logado);
                const cargosPermitidos = ['Líder da organização', '01 da organização', 'Coordenador', 'Gerente geral', 'Gerente'];
                
                if (cargosPermitidos.includes(membro.cargo)) {
                    document.getElementById('tela-login').style.display = 'none';
                    document.getElementById('tela-admin').style.display = 'block';
                    carregarFichas();
                }
            }
        });
    </script>
</body>
</html>
