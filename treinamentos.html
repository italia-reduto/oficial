<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0f0d">
    <title>Itália 2.0 | Treinamentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://vclwmikzmnuqfdxobtik.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_oJgT_8VwELW3AdZPpIYCsA_xk9PyoDF";
        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        :root {
            --verde: #22c55e; --fundo: #0a0f0d; --painel: #0d1410; --borda: #1a2b22;
            --texto: #f3f4f6; --texto-mutado: #9ca3af; --vermelho: #ef4444; --azul: #3b82f6; --amarelo: #eab308;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--fundo); color: var(--texto); min-height: 100vh; padding: 20px; padding-bottom: 100px; display: flex; flex-direction: column; align-items: center; }
        
        .fundo-degrade { position: fixed; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.1) 0%, transparent 40%); z-index: -2; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 10; }

        .topo { display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--borda); padding-bottom: 15px; margin-bottom: 5px; }
        .btn-voltar { width: 40px; height: 40px; background: var(--painel); border: 1px solid var(--borda); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--texto-mutado); text-decoration: none; transition: 0.3s; }
        .btn-voltar:hover { color: var(--verde); border-color: var(--verde); }
        .titulo-pagina { font-family: 'Oswald', sans-serif; font-size: 24px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        /* CARDS DE TREINAMENTO */
        .card-treino { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; position: relative; }
        .card-topo { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .tag-tipo { background: rgba(34, 197, 94, 0.1); color: var(--verde); border: 1px solid rgba(34, 197, 94, 0.3); padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        
        .treino-titulo { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 5px; }
        .treino-desc { font-size: 13px; color: var(--texto-mutado); margin-bottom: 15px; line-height: 1.4; white-space: pre-wrap;}
        
        .treino-info { display: flex; gap: 20px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; flex-wrap: wrap;}
        .info-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #fff; font-weight: 500; }
        .info-item i { color: var(--verde); font-size: 16px; }

        /* BOTÕES DE AÇÃO */
        .btn-acao { width: 100%; padding: 12px; border-radius: 8px; border: none; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-confirmar { background: var(--verde); color: #000; }
        .btn-confirmar:hover { background: #16a34a; }
        .btn-desabilitado { background: #27272a; color: #52525b; cursor: not-allowed; }
        .btn-presente { background: rgba(34, 197, 94, 0.15); color: var(--verde); border: 1px solid var(--verde); cursor: default; }

        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 40px 20px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; color: var(--texto-mutado); }
        .empty-state i { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }

        /* MENU INFERIOR */
        .menu-inferior { position: fixed; bottom: 20px; left: 5%; right: 5%; margin: 0 auto; max-width: 400px; background: rgba(10, 15, 13, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--borda); border-radius: 25px; display: flex; justify-content: space-around; align-items: center; padding: 10px 20px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .item-menu { display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; color: var(--texto-mutado); font-size: 10px; font-weight: 500; transition: 0.3s; padding: 5px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .item-menu i { font-size: 18px; }
        .item-menu.ativo { color: var(--verde); background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body>
    <div class="fundo-degrade"></div>

    <div class="container">
        <!-- TOPO -->
        <div class="topo">
            <a href="mais.html" class="btn-voltar"><i class="fas fa-arrow-left"></i></a>
            <h1 class="titulo-pagina">Treinamentos</h1>
        </div>

        <!-- LISTA DE TREINAMENTOS -->
        <div id="lista-treinamentos" style="display: flex; flex-direction: column; gap: 15px;">
            <p style="text-align: center; color: var(--texto-mutado); font-size: 13px; margin-top: 20px;">
                <i class="fas fa-spinner fa-spin"></i> Buscando treinamentos...
            </p>
        </div>
    </div>

    <!-- MENU INFERIOR -->
    <nav class="menu-inferior">
        <a href="dashboard.html" class="item-menu"><i class="fas fa-home"></i><span>Início</span></a>
        <a href="bateponto.html" class="item-menu"><i class="fas fa-clock"></i><span>Ponto</span></a>
        <a href="atendimento.html" class="item-menu"><i class="fas fa-headset"></i><span>Suporte</span></a>
        <a href="mais.html" class="item-menu"><i class="fas fa-bars"></i><span>Mais</span></a>
    </nav>
        <script>
        let membroLogado = null;

        function formatarData(dataStr) {
            const d = new Date(dataStr);
            return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        // ==========================================
        // 1. INICIALIZAÇÃO
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            const logado = sessionStorage.getItem('membro_logado');
            if (!logado) return window.location.href = 'login.html';

            membroLogado = JSON.parse(logado);
            carregarDados();
        });

        // ==========================================
        // 2. BUSCAR DADOS (COM PROTEÇÃO CONTRA TELA INFINITA)
        // ==========================================
        async function carregarDados() {
            const container = document.getElementById('lista-treinamentos');
            container.innerHTML = '<p style="text-align: center; color: var(--texto-mutado);"><i class="fas fa-spinner fa-spin"></i> Buscando treinamentos...</p>';
            
            try {
                // Busca os treinamentos agendados e as presenças do jogador ao mesmo tempo
                const [resTreinos, resPresencas] = await Promise.all([
                    sb.from('treinamentos').select('*').eq('status', 'agendado').order('data_hora', { ascending: true }),
                    sb.from('presencas_treinamento').select('*').eq('passaporte', membroLogado.passaporte)
                ]);

                // Verifica se deu erro no banco
                if (resTreinos.error) throw new Error("Tabela Treinos: " + resTreinos.error.message);
                if (resPresencas.error) throw new Error("Tabela Presenças: " + resPresencas.error.message);

                const treinos = resTreinos.data || [];
                const presencas = resPresencas.data || [];

                if (treinos.length === 0) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-graduation-cap"></i><br>Nenhum treinamento agendado no momento.</div>';
                    return;
                }

                renderizar(treinos, presencas);

            } catch (err) {
                console.error(err);
                // Mostra o erro na tela para não ficar carregando para sempre
                container.innerHTML = `
                    <div class="empty-state" style="border-color: var(--vermelho); color: var(--vermelho); padding: 20px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 30px;"></i><br>
                        <strong>Erro ao carregar:</strong><br>
                        <span style="font-size: 12px;">${err.message}</span>
                    </div>
                `;
            }
        }

        // ==========================================
        // 3. MONTAR OS CARDS NA TELA
        // ==========================================
        function renderizar(treinos, presencas) {
            const container = document.getElementById('lista-treinamentos');
            let html = '';

            treinos.forEach(t => {
                // Verifica se o jogador já tem uma presença registrada neste treino
                const minhaPresenca = presencas.find(p => String(p.treinamento_id) === String(t.id));
                const isPresente = minhaPresenca ? true : false;

                // Define qual botão vai aparecer
                let btnHtml = '';
                if (isPresente) {
                    btnHtml = `<button class="btn-acao btn-presente" disabled><i class="fas fa-check-double"></i> PRESENÇA CONFIRMADA</button>`;
                } else {
                    btnHtml = `<button class="btn-acao btn-confirmar" onclick="confirmarPresenca('${t.id}')"><i class="fas fa-user-check"></i> CONFIRMAR PRESENÇA</button>`;
                }

                html += `
                    <div class="card-treino">
                        <div class="card-topo">
                            <span class="tag-tipo"><i class="fas fa-graduation-cap"></i> TREINAMENTO</span>
                        </div>
                        
                        <h2 class="treino-titulo">${t.titulo}</h2>
                        <p class="treino-desc">${t.descricao}</p>

                        <div class="treino-info">
                            <div class="info-item"><i class="fas fa-user-tie"></i> Instrutor: ${t.instrutor}</div>
                            <div class="info-item"><i class="far fa-calendar-alt"></i> ${formatarData(t.data_hora)}</div>
                        </div>

                        ${btnHtml}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 4. CONFIRMAR PRESENÇA (O CLIQUE ÚNICO)
        // ==========================================
        async function confirmarPresenca(treinoId) {
            if (!confirm("Confirmar sua presença neste treinamento?")) return;

            try {
                // Salva o status já como 'presente' para a gerência não precisar cobrar 2 vezes
                const { error } = await sb.from('presencas_treinamento').insert([{
                    treinamento_id: treinoId,
                    passaporte: membroLogado.passaporte,
                    nome: membroLogado.nome,
                    status: 'presente' 
                }]);

                if (error) throw error;
                
                alert("Presença confirmada com sucesso! Não falte.");
                carregarDados(); // Recarrega a tela para o botão ficar verde

            } catch (err) {
                console.error(err);
                alert("Erro ao confirmar presença: " + err.message);
            }
        }
    </script>
</body>
</html>
